<meta name="robots" content="noindex, nofollow, noarchive">
<title>グレーねこの おうち</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<style>
/* Layout: one-screen toy room — status strip on top, the room as the stage, five chunky action buttons at the thumb. */
:root{
  --wall:#CDE4EE; --wall-dot:#B9D6E3;
  --floor:#E9BC8E; --floor-line:#D9A774;
  --ink:#3A3552; --ink-soft:#6B6585;
  --accent:#FF6F91; --accent-deep:#E2507A;
  --panel:#FFFFFF; --panel-edge:#E7E1F2;
  --sun:#FFC93C; --mint:#5CC9A7; --sky:#62B6F0; --lilac:#A98BEA;
  --danger:#FF5A5A;
  --cat:#A3ABB6; --cat-dark:#7F8894; --cat-light:#DCE0E6; --cat-pink:#FFB3C4;
  --display:"Mochiy Pop One","Hiragino Maru Gothic ProN","Zen Maru Gothic",system-ui,sans-serif;
  --body:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic",system-ui,sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body,.bubble,.card h1,.card p,.gtitle,.hint{word-break:keep-all;overflow-wrap:anywhere}
body{margin:0;background:var(--wall);color:var(--ink);font-family:var(--body);font-weight:700;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overflow:hidden;touch-action:manipulation}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.app{height:100%;display:flex;flex-direction:column;max-width:720px;margin:0 auto;
  padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));padding-block:8px;box-sizing:border-box;gap:8px}

/* ---------- top strip ---------- */
.top{display:flex;align-items:center;gap:10px}
.nameplate{display:flex;align-items:center;gap:8px;background:var(--panel);border-radius:999px;padding:6px 14px 6px 6px;box-shadow:0 3px 0 var(--panel-edge);min-width:0}
.lv{font-family:var(--display);background:var(--sun);color:var(--ink);border-radius:999px;padding:4px 10px;font-size:14px;white-space:nowrap}
.catname{font-family:var(--display);font-size:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.xp{flex:1;display:flex;align-items:center;gap:6px;min-width:0}
.xp .heart{font-size:22px;animation:beat 1.4s infinite}
.xpbar{flex:1;height:14px;background:var(--panel);border-radius:99px;overflow:hidden;box-shadow:inset 0 2px 0 var(--panel-edge)}
.xpbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),#FF9DB5);border-radius:99px;transition:width .5s}
.iconbtn{width:44px;height:44px;border-radius:50%;background:var(--panel);font-size:22px;box-shadow:0 3px 0 var(--panel-edge);flex:none}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.18)}30%{transform:scale(1)}}

.gauges{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.g{background:var(--panel);border-radius:14px;padding:5px 8px 7px;box-shadow:0 3px 0 var(--panel-edge);display:flex;flex-direction:column;gap:3px;min-width:0}
.g .lab{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--ink-soft);white-space:nowrap}
.g .lab b{font-size:18px}
.g .bar{height:10px;border-radius:99px;background:#EEEAF5;overflow:hidden}
.g .bar i{display:block;height:100%;width:50%;border-radius:99px;transition:width .6s,background .6s}
.g.low{animation:wob .8s infinite}
.g.low .lab{color:var(--danger)}
@keyframes wob{0%,100%{transform:rotate(0)}25%{transform:rotate(-2deg)}75%{transform:rotate(2deg)}}

/* ---------- the room ---------- */
.stage{position:relative;flex:1;min-height:260px;border-radius:24px;overflow:hidden;
  background:radial-gradient(circle at 10px 10px,var(--wall-dot) 3px,transparent 3.5px) 0 0/28px 28px,var(--wall);
  box-shadow:inset 0 0 0 4px #fff}
.floor{position:absolute;left:0;right:0;bottom:0;height:34%;
  background:repeating-linear-gradient(90deg,var(--floor) 0 58px,var(--floor-line) 58px 61px);border-top:6px solid #C98F5C}
.rug{position:absolute;left:50%;bottom:4%;width:56%;height:16%;transform:translateX(-50%);border-radius:50%;
  background:repeating-radial-gradient(ellipse at center,#FFD3DE 0 10px,#FFC0D0 10px 20px);opacity:.95}
.window{position:absolute;left:7%;top:7%;width:30%;max-width:170px;aspect-ratio:1/0.85;border:8px solid #fff;border-radius:16px;overflow:hidden;
  background:linear-gradient(#8FD3FF,#D7F1FF);box-shadow:0 4px 0 rgba(0,0,0,.06)}
.window::before,.window::after{content:"";position:absolute;background:#fff}
.window::before{left:50%;top:0;bottom:0;width:6px;transform:translateX(-50%)}
.window::after{top:50%;left:0;right:0;height:6px;transform:translateY(-50%)}
.window .orb{position:absolute;right:14%;top:14%;width:26%;aspect-ratio:1;border-radius:50%;background:var(--sun);box-shadow:0 0 0 6px rgba(255,201,60,.3)}
.window .cloud{position:absolute;left:8%;top:52%;width:40%;height:18%;background:#fff;border-radius:99px;animation:drift 14s linear infinite}
.window .stars{position:absolute;inset:0;opacity:0;background:
  radial-gradient(circle at 20% 30%,#fff 1.5px,transparent 2px),radial-gradient(circle at 70% 70%,#fff 1.5px,transparent 2px),
  radial-gradient(circle at 35% 75%,#fff 1px,transparent 1.5px),radial-gradient(circle at 80% 25%,#fff 1px,transparent 1.5px)}
.stage.dusk .window{background:linear-gradient(#FF9E7A,#FFD59A)}
.stage.night .window{background:linear-gradient(#1E2557,#3B3F86)}
.stage.night .window .orb{background:#FFF3B0;box-shadow:inset -10px -4px 0 #E8D77A,0 0 14px rgba(255,243,176,.6)}
.stage.night .window .stars{opacity:1}
.stage.night .window .cloud{opacity:.25}
@keyframes drift{from{transform:translateX(-60%)}to{transform:translateX(260%)}}
.frame{position:absolute;right:9%;top:9%;width:15%;max-width:84px;aspect-ratio:1;background:#fff;border-radius:12px;display:grid;place-items:center;font-size:clamp(20px,5vw,36px);transform:rotate(4deg);box-shadow:0 4px 0 rgba(0,0,0,.06)}

.bowl{position:absolute;left:15%;bottom:7%;width:min(17%,96px);transform:translateX(-50%)}
.bowl .food{position:absolute;left:50%;bottom:52%;transform:translateX(-50%);font-size:clamp(22px,6vw,36px);transition:transform .4s,opacity .4s}
.bowl .food.gone{transform:translateX(-50%) scale(0);opacity:0}
.toilet{position:absolute;right:4%;bottom:6%;width:min(22%,120px)}
.toilet .tag{position:absolute;left:50%;top:-6px;transform:translate(-50%,-100%);font-size:11px;background:#fff;border-radius:8px;padding:1px 6px;color:var(--ink-soft);white-space:nowrap}

/* the cat */
.cat{position:absolute;left:50%;bottom:6%;width:var(--catw,min(60vw,300px,40vh));transform:translateX(-50%) scale(var(--scale,1));transform-origin:50% 100%;
  transition:left 1.1s ease-in-out,transform .6s cubic-bezier(.3,1.6,.5,1);touch-action:none;cursor:grab;z-index:5}
.cat svg{display:block;width:100%;height:auto;overflow:visible}
.cat .body-wrap{transform-origin:50% 100%;animation:breathe 3.2s ease-in-out infinite}
.cat.walking .body-wrap{animation:hop .32s ease-in-out infinite}
.cat.squish .body-wrap{animation:squish .45s ease}
.cat.shake .body-wrap{animation:nope .5s ease 2}
@keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.015,.985)}}
@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-6%)}}
@keyframes squish{0%{transform:scale(1,1)}35%{transform:scale(1.08,.9)}70%{transform:scale(.96,1.05)}100%{transform:scale(1,1)}}
@keyframes nope{0%,100%{transform:rotate(0)}25%{transform:rotate(-5deg)}75%{transform:rotate(5deg)}}
#tail{transform-origin:168px 222px;animation:tail 2.4s ease-in-out infinite}
@keyframes tail{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(10deg)}}
#earL,#earR{transform-box:fill-box;transform-origin:50% 100%}
.cat.twitch #earR{animation:twitch .3s ease 2}
@keyframes twitch{50%{transform:rotate(12deg)}}
.eyes-open{transform-box:fill-box;transform-origin:center;transition:transform .08s}
.cat.blink .eyes-open{transform:scaleY(.08)}
.f{display:none}
.cat[data-eyes="open"] .f-eo,.cat[data-eyes="sad"] .f-eo,.cat[data-eyes="sad"] .f-sad,
.cat[data-eyes="happy"] .f-eh,.cat[data-eyes="closed"] .f-ec,.cat[data-eyes="yuck"] .f-ey{display:inline}
.cat[data-mouth="w"] .f-mw,.cat[data-mouth="open"] .f-mo,.cat[data-mouth="bleh"] .f-mb{display:inline}
.cat .chomp{animation:chomp .3s steps(2) infinite}
@keyframes chomp{50%{transform:scaleY(.4)}}
.sparkle-star{animation:twinkle 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes twinkle{0%,100%{transform:scale(.7);opacity:.8}50%{transform:scale(1.2);opacity:1}}
.acc{display:none}
.dirt{opacity:0;transition:opacity .8s}

.bubble{position:absolute;left:50%;top:5%;transform:translateX(-50%) scale(.6);opacity:0;z-index:8;max-width:78%;
  background:#fff;border-radius:22px;padding:10px 16px;font-size:clamp(16px,4.4vw,22px);text-align:center;line-height:1.35;
  box-shadow:0 4px 0 rgba(58,53,82,.12);transition:transform .25s cubic-bezier(.3,1.6,.5,1),opacity .2s;pointer-events:none;text-wrap:balance}
.bubble::after{content:"";position:absolute;left:50%;bottom:-12px;transform:translateX(-50%);border:12px solid transparent;border-top-color:#fff;border-bottom:0}
.bubble.show{transform:translateX(-50%) scale(1);opacity:1}

.poop{position:absolute;width:clamp(42px,11vw,60px);transform:translateX(-50%);z-index:4;animation:plop .5s cubic-bezier(.3,1.8,.5,1)}
.poop svg{width:100%;display:block}
.poop .stink{position:absolute;left:50%;top:-30%;width:70%;transform:translateX(-50%);animation:stink 1.6s ease-in-out infinite}
.poop.bye{animation:scoop .6s ease forwards}
@keyframes plop{from{transform:translateX(-50%) scale(0)}to{transform:translateX(-50%) scale(1)}}
@keyframes stink{0%{opacity:0;transform:translate(-50%,6px)}40%{opacity:.9}100%{opacity:0;transform:translate(-50%,-14px)}}
@keyframes scoop{to{transform:translate(-50%,-160%) rotate(220deg) scale(.2);opacity:0}}

.fx{position:absolute;pointer-events:none;z-index:9;font-size:26px;animation:floatup 1.2s ease-out forwards}
.fx.txt{font-family:var(--display);font-size:20px;color:var(--accent-deep);-webkit-text-stroke:4px #fff;paint-order:stroke fill}
@keyframes floatup{0%{transform:translate(-50%,0) scale(.5);opacity:0}20%{opacity:1;transform:translate(-50%,-14px) scale(1.1)}100%{transform:translate(calc(-50% + var(--dx,0px)),-90px) scale(1);opacity:0}}
.zzz{position:absolute;font-family:var(--display);color:#fff;font-size:28px;z-index:9;pointer-events:none;animation:zz 2.4s ease-in infinite;-webkit-text-stroke:3px var(--lilac);paint-order:stroke fill}
@keyframes zz{0%{transform:translate(0,0) scale(.6);opacity:0}30%{opacity:1}100%{transform:translate(40px,-80px) scale(1.3);opacity:0}}

.dark{position:absolute;inset:0;background:rgba(20,22,60,.62);opacity:0;transition:opacity 1s;pointer-events:none;z-index:6}
.stage.sleeping .dark{opacity:1}
.stage.sleeping .cat{z-index:7}

/* bath */
.tub{position:absolute;left:50%;bottom:2%;width:min(74%,380px);transform:translateX(-50%) translateY(120%);transition:transform .6s cubic-bezier(.3,1.4,.5,1);z-index:6;pointer-events:none}
.stage.bathing .tub{transform:translateX(-50%) translateY(0)}
.bubbleball{position:absolute;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0 25%,rgba(220,240,255,.85) 26% 70%,rgba(180,220,255,.7));z-index:8;pointer-events:none;animation:bub 1.6s ease-out forwards}
@keyframes bub{0%{transform:scale(.2)}20%{transform:scale(1)}100%{transform:translateY(-40px) scale(1.1);opacity:0}}
.drop{position:absolute;top:-20px;width:6px;height:16px;border-radius:6px;background:var(--sky);z-index:8;animation:rain .8s linear forwards;pointer-events:none}
@keyframes rain{to{transform:translateY(420px);opacity:.2}}
.bathui{position:absolute;left:50%;top:4%;transform:translateX(-50%);z-index:9;display:flex;flex-direction:column;align-items:center;gap:6px;width:min(80%,320px)}
.bathui .hint{background:#fff;border-radius:16px;padding:6px 12px;font-size:16px;text-align:center}
.meter{width:100%;height:16px;background:#fff;border-radius:99px;overflow:hidden;box-shadow:inset 0 2px 0 var(--panel-edge)}
.meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--sky),#9EE0FF);transition:width .2s}
.quit{position:absolute;right:max(10px,env(safe-area-inset-right,0px));bottom:10px;z-index:10;background:#fff;border-radius:999px;padding:10px 16px;font-size:16px;box-shadow:0 3px 0 var(--panel-edge)}

/* actions */
.actions{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;padding-bottom:max(2px,env(safe-area-inset-bottom,0px))}
.act{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px 7px;border-radius:20px;background:var(--panel);
  box-shadow:0 5px 0 var(--edge,var(--panel-edge));transition:transform .08s,box-shadow .08s;position:relative;min-width:0}
.act:active{transform:translateY(4px);box-shadow:0 1px 0 var(--edge,var(--panel-edge))}
.act .em{font-size:clamp(26px,7.5vw,38px);line-height:1.1}
.act .t{font-size:clamp(12px,3.4vw,15px);white-space:nowrap}
.act[data-k="food"]{background:#FFE7C2;--edge:#F3C27A}
.act[data-k="play"]{background:#FFD6E2;--edge:#F59AB4}
.act[data-k="bath"]{background:#D3ECFF;--edge:#8EC7F2}
.act[data-k="sleep"]{background:#E5DBFF;--edge:#B7A2F0}
.act[data-k="dress"]{background:#D4F5E9;--edge:#86D9BC}
.act:disabled{opacity:.45}
.badge{position:absolute;top:-4px;right:2px;background:var(--accent);color:#fff;font-size:11px;border-radius:99px;padding:2px 6px;animation:beat 1s infinite}

/* sheets & overlays */
.scrim{position:fixed;inset:0;background:rgba(40,36,70,.45);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:720px;background:#fff;border-radius:28px 28px 0 0;box-sizing:border-box;
  padding:16px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));animation:up .3s cubic-bezier(.3,1.3,.5,1)}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.sheet h2{font-family:var(--display);font-weight:400;font-size:22px;margin:0 0 12px;text-align:center}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.opt{display:flex;flex-direction:column;align-items:center;gap:4px;background:#F6F3FC;border-radius:18px;padding:12px 4px;box-shadow:0 4px 0 var(--panel-edge);position:relative}
.opt:active{transform:translateY(3px);box-shadow:0 1px 0 var(--panel-edge)}
.opt .em{font-size:40px;line-height:1.1}
.opt .t{font-size:15px}
.opt .s{font-size:11px;color:var(--ink-soft)}
.opt.on{background:#FFE3EB;box-shadow:0 4px 0 #F59AB4;outline:3px solid var(--accent)}
.opt.locked{opacity:.5}
.opt.locked .em{filter:grayscale(1)}
.close{display:block;margin:14px auto 0;background:#EEEAF5;border-radius:999px;padding:10px 26px;font-size:16px}

.overlay{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px;box-sizing:border-box}
.card{background:#fff;border-radius:28px;padding:22px 18px;width:100%;max-width:420px;text-align:center;box-shadow:0 8px 0 rgba(58,53,82,.15);box-sizing:border-box}
.card h1,.card h2{font-family:var(--display);font-weight:400;margin:0 0 8px;text-wrap:balance}
.card h1{font-size:26px}
.card p{margin:0 0 14px;color:var(--ink-soft);font-size:16px}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:12px}
.chip{background:#F6F3FC;border-radius:999px;padding:10px 18px;font-size:20px;box-shadow:0 3px 0 var(--panel-edge);font-family:var(--display)}
.chip.on{background:var(--accent);color:#fff;box-shadow:0 3px 0 var(--accent-deep)}
.namein{width:100%;box-sizing:border-box;font:inherit;font-size:20px;text-align:center;padding:10px;border-radius:14px;border:3px solid var(--panel-edge);margin-bottom:14px;color:var(--ink)}
.big{background:var(--accent);color:#fff;font-family:var(--display);font-size:22px;padding:14px 34px;border-radius:999px;box-shadow:0 5px 0 var(--accent-deep)}
.big:active{transform:translateY(4px);box-shadow:0 1px 0 var(--accent-deep)}
.intro-cat{width:150px;margin:0 auto 4px}

/* mouse game */
.game{position:fixed;inset:0;z-index:35;background:linear-gradient(#BFE9C9,#8FD6A6);display:flex;flex-direction:column;align-items:center;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px;box-sizing:border-box;gap:10px}
.ghead{display:flex;align-items:center;gap:10px;width:100%;max-width:460px}
.gcount{font-family:var(--display);font-size:30px;background:#fff;border-radius:18px;padding:4px 14px;min-width:84px;text-align:center;font-variant-numeric:tabular-nums}
.gtime{flex:1;height:18px;background:#fff;border-radius:99px;overflow:hidden}
.gtime i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--sun),#FFE48A);transition:width 1s linear}
.gtitle{font-family:var(--display);font-size:20px;text-align:center}
.holes{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(10px,3vw,20px);width:100%;max-width:460px;margin:auto 0}
.hole{position:relative;aspect-ratio:1;border-radius:50%;overflow:hidden;background:radial-gradient(ellipse at 50% 72%,#5B3B2A 0 38%,#7A5238 39% 46%,transparent 47%)}
.hole .m{position:absolute;left:50%;bottom:20%;transform:translate(-50%,110%);font-size:clamp(44px,14vw,72px);line-height:1;transition:transform .16s ease-out;pointer-events:none}
.hole.up .m{transform:translate(-50%,0)}
.hole.hit .m{transform:translate(-50%,10%) scale(1.2,.6)}
.hole .pow{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-size:26px;color:#fff;-webkit-text-stroke:5px var(--accent);paint-order:stroke fill;opacity:0}
.hole.hit .pow{animation:pow .5s ease}
@keyframes pow{0%{opacity:1;transform:scale(.5)}60%{opacity:1;transform:scale(1.2)}100%{opacity:0;transform:scale(1.3)}}
.result .mice{font-size:26px;line-height:1.3;margin:6px 0 10px;word-break:break-all}
.result .stars{font-size:40px;letter-spacing:4px;margin-bottom:6px}

.confetti{position:fixed;top:-20px;width:10px;height:14px;z-index:50;pointer-events:none;animation:fall 2.4s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
</style>

<div class="app" id="app">
  <div class="top">
    <button class="nameplate" id="nameBtn" aria-label="なまえを かえる">
      <span class="lv" id="lvText">レベル 1</span>
      <span class="catname" id="nameText">うめ</span>
    </button>
    <div class="xp" title="なかよし ハート"><span class="heart">💗</span><div class="xpbar"><i id="xpFill"></i></div></div>
    <button class="iconbtn" id="soundBtn" aria-label="おと">🔊</button>
  </div>

  <div class="gauges">
    <div class="g" id="g-hunger"><div class="lab"><b>🍚</b>おなか</div><div class="bar"><i></i></div></div>
    <div class="g" id="g-mood"><div class="lab"><b>😊</b>ごきげん</div><div class="bar"><i></i></div></div>
    <div class="g" id="g-clean"><div class="lab"><b>🫧</b>きれい</div><div class="bar"><i></i></div></div>
    <div class="g" id="g-energy"><div class="lab"><b>⚡</b>げんき</div><div class="bar"><i></i></div></div>
  </div>

  <div class="stage" id="stage">
    <div class="window"><div class="stars"></div><div class="orb"></div><div class="cloud"></div></div>
    <div class="frame">🐾</div>
    <div class="floor"></div>
    <div class="rug"></div>

    <div class="bowl" id="bowl">
      <span class="food gone" id="food">🐟</span>
      <svg viewBox="0 0 100 50"><path d="M6 14 H94 Q90 46 50 46 Q10 46 6 14 Z" fill="#FF8FAB"/><rect x="2" y="8" width="96" height="10" rx="5" fill="#FF6F91"/><text x="50" y="38" text-anchor="middle" font-size="14" fill="#fff" font-family="sans-serif">🐾</text></svg>
    </div>

<script>
(()=>{
'use strict';
const $=s=>document.querySelector(s);
const stage=$('#stage'), cat=$('#cat'), bubble=$('#bubble'), layer=$('#layer');
const clamp=(v,a=0,b=100)=>Math.max(a,Math.min(b,v));
const rnd=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const wait=ms=>new Promise(r=>setTimeout(r,ms));

/* ---------------- data ---------------- */
const FOODS=[
  {id:'fish',em:'🐟',name:'おさかな',h:35,m:8,like:true,line:'おさかな だいすき にゃ〜!'},
  {id:'kibble',em:'🥣',name:'カリカリ',h:30,m:4,line:'カリカリ おいしい にゃ!'},
  {id:'milk',em:'🥛',name:'ミルク',h:15,m:8,line:'ミルク ごくごく にゃ〜'},
  {id:'shrimp',em:'🍤',name:'えびフライ',h:20,m:14,like:true,line:'えびフライ ごちそう にゃ!'},
  {id:'chicken',em:'🍗',name:'ささみ',h:30,m:10,line:'ささみ むしゃむしゃ にゃ'},
  {id:'pepper',em:'🫑',name:'ピーマン',yuck:true,line:'ピーマン にがて にゃ〜! べーっ'},
];
const WEAR=[
  {id:'ribbon',em:'🎀',name:'リボン',slot:'head',lv:1},
  {id:'bell',em:'🔔',name:'すず',slot:'neck',lv:2},
  {id:'flower',em:'🌸',name:'おはな',slot:'head',lv:3},
  {id:'glasses',em:'👓',name:'めがね',slot:'face',lv:4},
  {id:'hat',em:'🥳',name:'ぼうし',slot:'head',lv:5},
  {id:'crown',em:'👑',name:'おうかん',slot:'head',lv:7},
];
const NAMES=['うめ','もち','グレ','ルナ','ココ','ソラ'];
const CHAT=['だいすき にゃ','なでなで して〜','いっしょに いると たのしい にゃ','きょうも げんき にゃ!','ごろごろ…','おしゃれ したいにゃ','また あそぼうね'];

/* ---------------- state ---------------- */
const KEY='grey-cat-v1';
const fresh=()=>({name:'',hunger:70,mood:70,clean:80,energy:80,xp:0,level:1,poops:[],meals:0,poopAt:0,sleeping:false,
  wear:{head:'ribbon',neck:null,face:null},seenLv:1,sound:true,last:Date.now()});
let S=fresh();
try{const raw=localStorage.getItem(KEY); if(raw) S=Object.assign(fresh(),JSON.parse(raw));}catch(e){}
function save(){S.last=Date.now();try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}

// time passed while away: gentle, never let things get too sad
(function away(){
  const min=Math.min((Date.now()-(S.last||Date.now()))/60000, 60*24);
  if(min<1) return;
  S.hunger=Math.max(Math.min(S.hunger,25),S.hunger-min*0.8);
  S.mood=Math.max(Math.min(S.mood,30),S.mood-min*0.5);
  S.clean=Math.max(Math.min(S.clean,30),S.clean-min*0.25);
  S.energy=clamp(S.energy+min*1.5);
  if(S.sleeping && S.energy>=100) S.sleeping=false;
  if(S.poopAt && Date.now()>S.poopAt && S.poops.length<4){S.poops.push({id:Date.now(),x:rnd(64,90),y:rnd(3,12)});S.poopAt=0;}
})();

let busy=false, mode='room'; // room | bath | game
let face={eyes:'open',mouth:'w'}, faceTimer=null;

/* ---------------- sound ---------------- */
let ac=null;
function audio(){ if(!S.sound) return null; try{ if(!ac) ac=new (window.AudioContext||window.webkitAudioContext)(); if(ac.state==='suspended') ac.resume(); }catch(e){ac=null} return ac; }
function tone(f1,f2,dur,type='sine',vol=.18,delay=0){
  const c=audio(); if(!c) return; const t=c.currentTime+delay;
  const o=c.createOscillator(), g=c.createGain(); o.type=type;
  o.frequency.setValueAtTime(f1,t); o.frequency.exponentialRampToValueAtTime(f2,t+dur);
  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+.02); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g).connect(c.destination); o.start(t); o.stop(t+dur+.05);
}
function meow(p=1){
  const c=audio(); if(!c) return; const t=c.currentTime;
  const o=c.createOscillator(), o2=c.createOscillator(), f=c.createBiquadFilter(), g=c.createGain();
  o.type='sawtooth'; o2.type='triangle'; f.type='bandpass'; f.Q.value=2.5;
  [o,o2].forEach((x,i)=>{const m=i?1:2; x.frequency.setValueAtTime(420*p*m/2*2,t); x.frequency.linearRampToValueAtTime(820*p,t+.14); x.frequency.linearRampToValueAtTime(520*p,t+.5);});
  f.frequency.setValueAtTime(900,t); f.frequency.linearRampToValueAtTime(2200,t+.15); f.frequency.linearRampToValueAtTime(800,t+.5);
  g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(.22,t+.05); g.gain.setValueAtTime(.2,t+.32); g.gain.exponentialRampToValueAtTime(.0001,t+.55);
  o.connect(f); o2.connect(f); f.connect(g).connect(c.destination); o.start(t); o2.start(t); o.stop(t+.6); o2.stop(t+.6);
}
function noise(dur=.25,freq=1200,vol=.15){
  const c=audio(); if(!c) return; const t=c.currentTime;
  const b=c.createBuffer(1,c.sampleRate*dur,c.sampleRate), d=b.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*(1-i/d.length);
  const s=c.createBufferSource(), f=c.createBiquadFilter(), g=c.createGain(); s.buffer=b; f.type='bandpass'; f.frequency.value=freq; g.gain.value=vol;
  s.connect(f).connect(g).connect(c.destination); s.start(t);
}
const sfx={
  pop:()=>tone(500,1100,.12,'sine',.2),
  plip:()=>tone(900,1500,.08,'triangle',.14),
  happy:()=>{[660,880,1100].forEach((f,i)=>tone(f,f*1.01,.18,'triangle',.14,i*.09));},
  fanfare:()=>{[523,659,784,1047,784,1047].forEach((f,i)=>tone(f,f,.22,'square',.07,i*.13));},
  munch:()=>noise(.09,700,.25),
  scoop:()=>{noise(.3,2400,.12);tone(300,900,.25,'sine',.1);},
  boing:()=>tone(200,520,.3,'sine',.2),
  sad:()=>tone(500,300,.4,'triangle',.12),
};
let jaVoice=null;
function loadVoice(){try{const v=speechSynthesis.getVoices(); jaVoice=v.find(x=>/ja/i.test(x.lang))||null;}catch(e){}}
try{loadVoice(); speechSynthesis.onvoiceschanged=loadVoice;}catch(e){}
function speak(text){
  if(!S.sound) return;
  try{ speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(text.replace(/[〜!…]/g,' ')); u.lang='ja-JP'; if(jaVoice) u.voice=jaVoice; u.pitch=1.7; u.rate=1.05; speechSynthesis.speak(u);}catch(e){}
}

/* ---------------- render ---------------- */
function needFor(){ return 10+S.level*6; }
function gaugeColor(v){ return v<30?'var(--danger)':v<60?'var(--sun)':'var(--mint)'; }
function render(){
  for(const k of ['hunger','mood','clean','energy']){
    const el=$('#g-'+k), v=S[k]; const i=el.querySelector('i'); i.style.width=v+'%'; i.style.background=gaugeColor(v); el.classList.toggle('low',v<30);
  }
  $('#xpFill').style.width=(S.xp/needFor()*100)+'%';
  $('#lvText').textContent='レベル '+S.level;
  $('#nameText').textContent=S.name||'ねこちゃん';
  $('#soundBtn').textContent=S.sound?'🔊':'🔇';
  $('#sleepLabel').textContent=S.sleeping?'おきる':'ねんね';
  cat.style.setProperty('--scale',(0.86+Math.min(S.level,8)*0.025).toFixed(3));
  document.querySelectorAll('.acc').forEach(a=>{ a.style.display=Object.values(S.wear).includes(a.dataset.acc)?'inline':'none'; });
  $('#dirt').style.opacity=S.clean<40?String((40-S.clean)/30):'0';
  $('#newBadge').hidden=!(S.level>S.seenLv && WEAR.some(w=>w.lv>S.seenLv && w.lv<=S.level));
  stage.classList.toggle('sleeping',S.sleeping);
  document.querySelectorAll('.act').forEach(b=>{ b.disabled = S.sleeping && b.dataset.k!=='sleep'; });
  if(!faceTimer) setFace(baseFace());
}
function baseFace(){
  if(S.sleeping) return {eyes:'closed',mouth:'w'};
  if(Math.min(S.hunger,S.mood,S.clean,S.energy)<25) return {eyes:'sad',mouth:'w'};
  return {eyes:'open',mouth:'w'};
}
function setFace(f,ms){
  face=f; cat.dataset.eyes=f.eyes; cat.dataset.mouth=f.mouth;
  clearTimeout(faceTimer); faceTimer=null;
  if(ms){ faceTimer=setTimeout(()=>{faceTimer=null; setFace(baseFace());},ms); }
}

/* ---------------- poops ---------------- */
const POOP_SVG='<svg viewBox="0 0 60 52"><ellipse cx="30" cy="44" rx="27" ry="8" fill="#8A5A3B"/><ellipse cx="30" cy="34" rx="21" ry="9" fill="#A06A45"/><ellipse cx="30" cy="24" rx="14" ry="8" fill="#B47A50"/><path d="M30 6 Q40 14 36 20 Q30 22 26 18 Q24 12 30 6Z" fill="#B47A50"/><circle cx="24" cy="34" r="3" fill="#3A2A20"/><circle cx="36" cy="34" r="3" fill="#3A2A20"/><circle cx="25" cy="33" r="1" fill="#fff"/><circle cx="37" cy="33" r="1" fill="#fff"/><path d="M26 40 q4 3 8 0" stroke="#3A2A20" stroke-width="2" fill="none" stroke-linecap="round"/></svg>';
const STINK='<svg class="stink" viewBox="0 0 40 30"><path d="M8 28 q-6 -6 0 -12 q6 -6 0 -12 M20 28 q-6 -6 0 -12 q6 -6 0 -12 M32 28 q-6 -6 0 -12 q6 -6 0 -12" stroke="#8BC34A" stroke-width="3" fill="none" stroke-linecap="round"/></svg>';
function drawPoops(){
  stage.querySelectorAll('.poop:not(.bye)').forEach(p=>p.remove());
  S.poops.forEach(p=>{
    const b=document.createElement('button'); b.className='poop'; b.style.left=p.x+'%'; b.style.bottom=p.y+'%'; b.innerHTML=STINK+POOP_SVG; b.setAttribute('aria-label','うんちを かたづける');
    b.addEventListener('click',e=>{e.stopPropagation(); cleanPoop(p.id,b);});
    stage.appendChild(b);
  });
}
function cleanPoop(id,el){
  if(S.sleeping) return;
  sfx.scoop(); el.classList.add('bye'); const r=el.getBoundingClientRect(); fxAt('✨',r.left+r.width/2,r.top,3);
  setTimeout(()=>el.remove(),600);
  S.poops=S.poops.filter(p=>p.id!==id); S.clean=clamp(S.clean+12); S.mood=clamp(S.mood+5); gain(3);
  if(!S.poops.length){ say(pick(['きれいに なった! ありがとう にゃ','すっきり にゃ〜!','おそうじ じょうず にゃ!']),true); setFace({eyes:'happy',mouth:'w'},1500); }
  else say('あと '+S.poops.length+'こ!',false);
  render(); save();
}
async function doPoop(){
  busy=true; S.poopAt=0;
  await walkTo(72);
  setFace({eyes:'yuck',mouth:'w'}); cat.classList.add('squish'); fxOnCat('ふんっ!',true); await wait(900); cat.classList.remove('squish');
  S.poops.push({id:Date.now(),x:rnd(62,92),y:rnd(2,12)}); drawPoops(); sfx.boing();
  setFace({eyes:'happy',mouth:'w'},1600); say('うんち でた にゃ! かたづけて〜',true);
  S.clean=clamp(S.clean-5); save(); render();
  await wait(1200); await walkTo(50); busy=false;
}

/* ---------------- fx ---------------- */
function fxAt(txt,x,y,n=1,isText=false){
  for(let i=0;i<n;i++){
    const d=document.createElement('div'); d.className='fx'+(isText?' txt':''); d.textContent=txt;
    d.style.position='fixed'; d.style.left=(x+rnd(-20,20))+'px'; d.style.top=(y+rnd(-10,10))+'px'; d.style.setProperty('--dx',rnd(-40,40)+'px'); d.style.animationDelay=(i*0.12)+'s';
    document.body.appendChild(d); setTimeout(()=>d.remove(),1500+i*120);
  }
}
function catBox(){ return cat.getBoundingClientRect(); }
function fxOnCat(txt,isText=false,n=1){ const r=catBox(); fxAt(txt,r.left+r.width*0.5,r.top+r.height*0.15,n,isText); }
let bubbleTimer=null, lastSpoken='';
function say(text,talk=false){
  bubble.textContent=text; bubble.classList.add('show'); clearTimeout(bubbleTimer);
  bubbleTimer=setTimeout(()=>bubble.classList.remove('show'),Math.max(2200,text.length*170));
  if(talk){ speak(text); lastSpoken=text; }
}
function confetti(){
  const cols=['#FF6F91','#FFC93C','#62B6F0','#5CC9A7','#A98BEA'];
  for(let i=0;i<60;i++){ const c=document.createElement('div'); c.className='confetti'; c.style.left=rnd(0,100)+'vw'; c.style.background=pick(cols); c.style.animationDelay=rnd(0,.8)+'s'; c.style.animationDuration=rnd(1.8,3)+'s'; c.style.borderRadius=Math.random()<.5?'50%':'2px'; document.body.appendChild(c); setTimeout(()=>c.remove(),4000); }
}

/* ---------------- xp ---------------- */
function gain(n){
  S.xp+=n; const r=catBox(); fxAt('💗',r.left+r.width/2,r.top+r.height*.3,Math.min(n,4));
  while(S.xp>=needFor()){ S.xp-=needFor(); S.level++; levelUp(); }
  render(); save();
}
function levelUp(){
  setTimeout(()=>{
    sfx.fanfare(); confetti(); cat.classList.add('squish'); setTimeout(()=>cat.classList.remove('squish'),500);
    const item=WEAR.find(w=>w.lv===S.level);
    say(item?`レベル ${S.level}! ${item.name} が つけられるよ!`:`レベル ${S.level}! おおきく なったにゃ!`,true);
    setFace({eyes:'happy',mouth:'w'},2500);
  },400);
}

/* ---------------- movement ---------------- */
function walkTo(x){
  return new Promise(res=>{
    const cur=parseFloat(cat.style.left)||50; if(Math.abs(cur-x)<1){res();return;}
    cat.classList.add('walking'); cat.style.left=x+'%';
    setTimeout(()=>{cat.classList.remove('walking');res();},1150);
  });
}

/* ---------------- petting ---------------- */
let petCool=0, xpCool=0, down=false, lastPt=null, scrub=0;
cat.addEventListener('pointerdown',e=>{
  audio(); down=true; lastPt={x:e.clientX,y:e.clientY};
  try{cat.setPointerCapture(e.pointerId);}catch(_){}
  if(mode==='bath'){ return; }
  if(busy) return;
  if(S.sleeping){ say('むにゃむにゃ…',false); fxOnCat('💤'); return; }
  pet(e.clientX,e.clientY);
});
cat.addEventListener('pointermove',e=>{
  if(mode==='bath'){ bathScrub(e); return; }
  if(!down||busy||S.sleeping) return;
  const d=Math.hypot(e.clientX-lastPt.x,e.clientY-lastPt.y);
  if(d>40){ lastPt={x:e.clientX,y:e.clientY}; pet(e.clientX,e.clientY,true); }
});
const up=()=>{down=false;};
cat.addEventListener('pointerup',up); cat.addEventListener('pointercancel',up);
function pet(x,y,stroke){
  const now=Date.now(); if(now<petCool) return; petCool=now+(stroke?350:700);
  setFace({eyes:'happy',mouth:'w'},1300); cat.classList.remove('squish'); void cat.offsetWidth; cat.classList.add('squish');
  fxAt('💕',x,y-20,1);
  if(Math.random()<.4) fxAt('ごろごろ',x,y-40,1,true);
  if(Math.random()<.35) meow(rnd(1.05,1.3)); else sfx.plip();
  S.mood=clamp(S.mood+3);
  if(now>xpCool){ xpCool=now+1800; gain(1); } else { render(); }
  if(Math.random()<.2) say(pick(['きもちいい にゃ〜','もっと なでて〜','ごろごろ…','だいすき にゃ']),false);
}

/* eyes follow your finger */
document.addEventListener('pointermove',e=>{
  if(cat.dataset.eyes!=='open'&&cat.dataset.eyes!=='sad') return;
  const r=catBox(); const cx=r.left+r.width/2, cy=r.top+r.height*.42;
  const dx=e.clientX-cx, dy=e.clientY-cy, m=Math.hypot(dx,dy)||1, k=Math.min(1,m/200)*5;
  const t=`translate(${(dx/m*k).toFixed(1)}px,${(dy/m*k).toFixed(1)}px)`;
  $('#irisL').style.transform=t; $('#irisR').style.transform=t;
});

/* blink & twitch */
(function idle(){
  setTimeout(()=>{ if(cat.dataset.eyes==='open'||cat.dataset.eyes==='sad'){cat.classList.add('blink'); setTimeout(()=>cat.classList.remove('blink'),140);} if(Math.random()<.3){cat.classList.add('twitch');setTimeout(()=>cat.classList.remove('twitch'),700);} idle(); }, rnd(2500,5000));
})();

/* ---------------- food ---------------- */
function openFood(){
  sheet('なにを たべさせる?', FOODS.map(f=>({em:f.em,t:f.name,on:false,act:()=>feed(f)})));
}
async function feed(f){
  if(busy||S.sleeping) return;
  if(!f.yuck && S.hunger>=95){ setFace({eyes:'happy',mouth:'w'},1500); say('もう おなか いっぱい にゃ〜',true); return; }
  busy=true;
  const food=$('#food'); food.textContent=f.em; food.classList.remove('gone'); sfx.pop();
  await walkTo(26);
  if(f.yuck){
    await wait(400); setFace({eyes:'yuck',mouth:'bleh'},2200); cat.classList.add('shake'); meow(.8); say(f.line,true);
    await wait(1100); cat.classList.remove('shake'); food.classList.add('gone'); await wait(900); await walkTo(50); busy=false; return;
  }
  setFace({eyes:'closed',mouth:'open'});
  for(let i=0;i<6;i++){ sfx.munch(); if(i%2===0) fxOnCat('もぐもぐ',true); await wait(380); }
  food.classList.add('gone');
  S.hunger=clamp(S.hunger+f.h); S.mood=clamp(S.mood+f.m);
  setFace({eyes:'happy',mouth:'w'},2000); meow(1.15); say(f.line,true);
  gain(f.like?3:2);
  S.meals++; if(S.meals>=2 && !S.poopAt){ S.meals=0; S.poopAt=Date.now()+rnd(7000,14000); }
  save(); await wait(900); await walkTo(50); busy=false;
}

/* ---------------- sleep ---------------- */
let zTimer=null;
function toggleSleep(){
  if(busy) return;
  if(S.sleeping){ wake('おはよう にゃ!'); return; }
  if(S.energy>85){ say('まだ ねむくない にゃ! あそぼ〜',true); return; }
  S.sleeping=true; say('おやすみ なさい にゃ…',true); startZ(); render(); save();
}
function wake(line){ S.sleeping=false; stopZ(); setFace({eyes:'happy',mouth:'w'},1500); say(line,true); meow(1.1); gain(2); render(); save(); }
function startZ(){ stopZ(); zTimer=setInterval(()=>{ const r=stage.getBoundingClientRect(), c=catBox(); const z=document.createElement('div'); z.className='zzz'; z.textContent=pick(['Z','z','Z']); z.style.left=(c.left-r.left+c.width*.62)+'px'; z.style.top=(c.top-r.top+c.height*.1)+'px'; stage.appendChild(z); setTimeout(()=>z.remove(),2400); },800); }
function stopZ(){ clearInterval(zTimer); zTimer=null; }

/* ---------------- bath ---------------- */
let bathUI=null;
function startBath(){
  if(busy||S.sleeping) return;
  if(S.poops.length){ say('さきに うんちを かたづけて にゃ!',true); return; }
  mode='bath'; busy=true; scrub=0; stage.classList.add('bathing'); sfx.pop();
  bathUI=document.createElement('div'); bathUI.innerHTML=`<div class="bathui"><div class="hint">ねこちゃんを ごしごし こすってね!</div><div class="meter"><i></i></div></div><button class="quit">おわり</button>`;
  stage.appendChild(bathUI); bathUI.querySelector('.quit').onclick=endBath;
  setFace({eyes:'open',mouth:'w'}); say('おふろ だ にゃ!',true);
}
function bathScrub(e){
  if(!down && e.pointerType!=='mouse') return;
  if(e.pointerType==='mouse' && !down) return;
  const d=Math.hypot(e.clientX-lastPt.x,e.clientY-lastPt.y); lastPt={x:e.clientX,y:e.clientY};
  if(scrub>=100) return;
  scrub=Math.min(100,scrub+d/9);
  bathUI.querySelector('.meter i').style.width=scrub+'%';
  if(Math.random()<.5){ const r=stage.getBoundingClientRect(); const b=document.createElement('div'); b.className='bubbleball'; const s=rnd(16,38); b.style.width=b.style.height=s+'px'; b.style.left=(e.clientX-r.left-s/2)+'px'; b.style.top=(e.clientY-r.top-s/2)+'px'; stage.appendChild(b); setTimeout(()=>b.remove(),1600); if(Math.random()<.3) sfx.plip(); }
  setFace({eyes:'happy',mouth:'w'},600);
  if(scrub>=100) rinse();
}
async function rinse(){
  say('シャワー で ながすよ〜',false);
  const r=stage.getBoundingClientRect();
  for(let i=0;i<40;i++){ const d=document.createElement('div'); d.className='drop'; d.style.left=rnd(r.width*.25,r.width*.75)+'px'; d.style.animationDelay=rnd(0,.9)+'s'; stage.appendChild(d); setTimeout(()=>d.remove(),2000); }
  noise(1.2,3000,.08);
  await wait(1300);
  S.clean=100; S.mood=clamp(S.mood+6); fxOnCat('✨',false,5); sfx.happy(); say('ピカピカ に なったにゃ!',true); setFace({eyes:'happy',mouth:'w'},2000); gain(4);
  await wait(1600); endBath();
}
function endBath(){ if(mode!=='bath') return; mode='room'; busy=false; stage.classList.remove('bathing'); bathUI&&bathUI.remove(); bathUI=null; render(); save(); }

/* ---------------- dress ---------------- */
function openDress(){
  S.seenLv=S.level; render(); save();
  const make=()=>WEAR.map(w=>{
    const locked=w.lv>S.level, on=S.wear[w.slot]===w.id;
    return {em:locked?'🔒':w.em,t:w.name,s:locked?`レベル ${w.lv} で`:(on?'つけてる':''),on,locked,act:()=>{
      if(locked){ say(`レベル ${w.lv} に なったら つけられるよ`,true); return 'keep'; }
      S.wear[w.slot]= on?null:w.id; sfx.pop(); render(); save();
      if(!on){ setFace({eyes:'happy',mouth:'w'},1200); say(pick(['にあう かな?','かわいい にゃ?','おしゃれ にゃ〜']),false); }
      return 'refresh';
    }};
  });
  sheet('おしゃれ しよう!', make(), make);
}

/* ---------------- sheet ---------------- */
function sheet(title,items,remake){
  const scrim=document.createElement('div'); scrim.className='scrim';
  const draw=list=>{
    scrim.innerHTML=`<div class="sheet" role="dialog" aria-label="${title}"><h2>${title}</h2><div class="opts"></div><button class="close">とじる</button></div>`;
    const box=scrim.querySelector('.opts');
    list.forEach(it=>{
      const b=document.createElement('button'); b.className='opt'+(it.on?' on':'')+(it.locked?' locked':'');
      b.innerHTML=`<span class="em">${it.em}</span><span class="t">${it.t}</span>${it.s?`<span class="s">${it.s}</span>`:''}`;
      b.onclick=()=>{ const r=it.act(); if(r==='refresh'&&remake) draw(remake()); else if(r!=='keep') scrim.remove(); };
      box.appendChild(b);
    });
    scrim.querySelector('.close').onclick=()=>scrim.remove();
  };
  draw(items);
  scrim.addEventListener('click',e=>{ if(e.target===scrim) scrim.remove(); });
  layer.appendChild(scrim);
}

/* ---------------- mouse game ---------------- */
function startGame(){
  if(busy||S.sleeping) return;
  if(S.energy<15){ setFace({eyes:'sad',mouth:'w'},1500); say('つかれて あそべない にゃ… ねんね したい',true); return; }
  if(S.hunger<10){ setFace({eyes:'sad',mouth:'w'},1500); say('おなか ぺこぺこで あそべない にゃ…',true); return; }
  mode='game'; busy=true;
  const g=document.createElement('div'); g.className='game';
  g.innerHTML=`<div class="ghead"><div class="gcount" id="gc">0</div><div class="gtime"><i id="gt"></i></div></div>
    <div class="gtitle">ねずみを タッチして つかまえよう! ⭐は 3てん</div><div class="holes">${'<div class="hole"><span class="m"></span><span class="pow">ポン!</span></div>'.repeat(9)}</div>`;
  layer.appendChild(g);
  const holes=[...g.querySelectorAll('.hole')]; let count=0, live=true, mice=0;
  const LEN=25; let left=LEN; const gt=g.querySelector('#gt'), gc=g.querySelector('#gc');
  holes.forEach(h=>h.addEventListener('pointerdown',()=>{
    if(!h.classList.contains('up')||h.classList.contains('hit')) return;
    const pts=h.dataset.star?3:1; count+=pts; mice++; gc.textContent=count; h.classList.add('hit'); h.querySelector('.pow').textContent=pts>1?'+3!':'ポン!';
    pts>1?sfx.happy():sfx.pop(); clearTimeout(h._t); setTimeout(()=>{h.classList.remove('up','hit');},450);
  }));
  const pop=()=>{
    if(!live) return;
    const free=holes.filter(h=>!h.classList.contains('up')); if(free.length){
      const h=pick(free); const star=Math.random()<.15; h.dataset.star=star?'1':''; h.querySelector('.m').textContent=star?'⭐':'🐭';
      h.classList.add('up'); const stay=Math.max(800,1500-(LEN-left)*25); h._t=setTimeout(()=>h.classList.remove('up'),stay);
    }
    setTimeout(pop,rnd(550,900));
  };
  setTimeout(pop,600);
  const timer=setInterval(()=>{ left--; gt.style.width=(left/LEN*100)+'%'; if(left<=0){ clearInterval(timer); live=false; finish(); } },1000);
  function finish(){
    const stars=count>=14?3:count>=7?2:1;
    sfx.fanfare(); if(stars===3) confetti();
    const res=document.createElement('div'); res.className='overlay';
    res.innerHTML=`<div class="card result"><div class="stars">${'⭐'.repeat(stars)}${'☆'.repeat(3-stars)}</div><h2>${count}てん とったよ!</h2>
      <div class="mice" aria-label="${mice}ひき">${'🐭'.repeat(Math.min(mice,30))}</div><p>${mice}ひき つかまえた! いっしょに かぞえてみよう</p><button class="big">おうちに かえる</button></div>`;
    layer.appendChild(res);
    res.querySelector('.big').onclick=()=>{
      res.remove(); g.remove(); mode='room'; busy=false;
      S.mood=clamp(S.mood+20+stars*5); S.energy=clamp(S.energy-12); S.hunger=clamp(S.hunger-8);
      setFace({eyes:'happy',mouth:'w'},2000); meow(1.2); say(stars===3?'すごい すごい! たのしかった にゃ!':'たのしかった にゃ! また あそぼ',true); gain(Math.max(2,Math.ceil(count/2)));
    };
  }
}

/* ---------------- name ---------------- */
function askName(first){
  const o=document.createElement('div'); o.className='overlay'; o.style.background='rgba(40,36,70,.45)';
  let chosen=S.name||'うめ';
  o.innerHTML=`<div class="card"><div class="intro-cat">${$('#catsvg').outerHTML.replace(/id="[^"]+"/g,'')}</div>
    <h1>${first?'グレーの ねこちゃんが きたよ!':'なまえを かえる'}</h1><p>なまえを えらんでね</p>
    <div class="chips">${NAMES.map(n=>`<button class="chip${n===chosen?' on':''}">${n}</button>`).join('')}</div>
    <input class="namein" id="namein" maxlength="8" placeholder="じぶんで つける" value="${NAMES.includes(chosen)?'':chosen}" aria-label="なまえ">
    <button class="big">${first?'よろしくね!':'けってい'}</button></div>`;
  const card=o.querySelector('.card'); const ic=o.querySelector('.intro-cat svg'); ic.querySelectorAll('.acc').forEach(a=>a.style.display='none');
  ic.querySelector('.f-eo').style.display='inline'; ic.querySelector('.f-mw').style.display='inline';
  o.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{ chosen=c.textContent; o.querySelectorAll('.chip').forEach(x=>x.classList.toggle('on',x===c)); o.querySelector('#namein').value=''; sfx.plip&&audio()&&sfx.plip(); });
  o.querySelector('.big').onclick=()=>{
    const typed=o.querySelector('#namein').value.trim(); S.name=typed||chosen; save(); render(); o.remove(); audio();
    meow(1.15); setFace({eyes:'happy',mouth:'w'},1800); say(`${S.name} だよ! よろしく にゃ!`,true);
  };
  layer.appendChild(o);
}

/* ---------------- buttons ---------------- */
$('#actions').addEventListener('click',e=>{
  const b=e.target.closest('.act'); if(!b||b.disabled) return; audio();
  ({food:openFood,play:startGame,bath:startBath,sleep:toggleSleep,dress:openDress})[b.dataset.k]();
});
$('#soundBtn').onclick=()=>{ S.sound=!S.sound; if(!S.sound){try{speechSynthesis.cancel()}catch(e){}} else {audio(); sfx.plip();} render(); save(); };
$('#nameBtn').onclick=()=>{ if(mode==='room') askName(false); };

/* ---------------- clock ---------------- */
function sky(){ const h=new Date().getHours(); stage.classList.toggle('night',h>=19||h<6); stage.classList.toggle('dusk',h>=17&&h<19); }
let chatIn=12, lastNeed='';
setInterval(()=>{
  if(mode==='game') return;
  if(S.sleeping){
    S.energy=clamp(S.energy+3); S.hunger=clamp(S.hunger-0.02);
    if(S.energy>=100) wake('よく ねた! おはよう にゃ!');
  }else{
    S.hunger=clamp(S.hunger-0.055); S.mood=clamp(S.mood-0.035-(S.hunger<20?0.04:0)-S.poops.length*0.02);
    S.clean=clamp(S.clean-0.015-S.poops.length*0.03); S.energy=clamp(S.energy-0.025);
    if(S.poopAt && Date.now()>S.poopAt && !busy && mode==='room' && S.poops.length<4) doPoop();
  }
  // needs chatter
  if(--chatIn<=0 && !busy && !S.sleeping && mode==='room'){
    chatIn=Math.round(rnd(14,22));
    const needs=[];
    if(S.poops.length) needs.push(['poop','うんち かたづけて ほしい にゃ〜']);
    if(S.hunger<35) needs.push(['hunger','おなか ぺこぺこ にゃ… ごはん ちょうだい']);
    if(S.energy<30) needs.push(['energy','ねむたい にゃ… ふぁ〜']);
    if(S.clean<35) needs.push(['clean','からだが かゆい にゃ… おふろ はいりたい']);
    if(S.mood<35) needs.push(['mood','さみしい にゃ… あそんで〜']);
    if(needs.length){ const n=needs[0]; say(n[1],n[0]!==lastNeed); lastNeed=n[0]; if(n[0]!=='poop') meow(.95); }
    else { lastNeed=''; if(Math.random()<.6){ say(pick(CHAT),false); setFace({eyes:'happy',mouth:'w'},1200);} }
  }
  if(Date.now()%5000<1000) save();
  render();
},1000);
setInterval(sky,60000); sky();
document.addEventListener('visibilitychange',()=>{ if(document.hidden) save(); });

/* ---------------- boot ---------------- */
cat.style.left='50%';
drawPoops(); render();
if(S.sleeping) startZ();
if(!S.name) askName(true);
else setTimeout(()=>say(`おかえり! ${S.name} まってたにゃ`,false),500);
})();
</script>
