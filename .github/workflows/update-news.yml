name: Update Kyrgyz news

# Fetches news, lifeline (outage) info and MOFA safety info for Kyrgyzstan
# (news.json) and Kazakhstan (news-kz.json) and publishes them on the
# `news-data` branch (a single force-pushed commit, so main's
# history stays clean).
#
# Runs every 2 hours (Yuta's choice, 2026-11-09). One run takes a few
# minutes, so this stays well inside the free plan even if the repo is
# private again (about 12 runs a day).
on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-news
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Refresh once
        env:
          TOKEN: ${{ github.token }}
        run: |
          publish() {
            rm -rf "$RUNNER_TEMP/out" && mkdir "$RUNNER_TEMP/out" && cd "$RUNNER_TEMP/out"
            git init -q
            git checkout -q --orphan news-data
            cp "$RUNNER_TEMP"/news*.json .
            git add news*.json
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qm "Update news"
            git push -qf "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" news-data
            cd "$GITHUB_WORKSPACE"
          }
          ok=0
          # one file per country; keep the last good file if a country fails this round
          for c in kg kz; do
            f="news.json"; a="news-archive.json"
            [ "$c" = kg ] || { f="news-$c.json"; a="news-archive-$c.json"; }
            rm -f "$RUNNER_TEMP/new-archive.json"
            if python3 scripts/fetch_news.py "$c" "$RUNNER_TEMP/new-archive.json" > "$RUNNER_TEMP/new.json"; then
              mv "$RUNNER_TEMP/new.json" "$RUNNER_TEMP/$f"; ok=1
            else
              echo "fetch $c failed"
              curl -fsS "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/news-data/$f" -o "$RUNNER_TEMP/$f" || rm -f "$RUNNER_TEMP/$f"
            fi
            # the week of stored items behind the weekly digest
            if [ -s "$RUNNER_TEMP/new-archive.json" ]; then
              mv "$RUNNER_TEMP/new-archive.json" "$RUNNER_TEMP/$a"
            else
              curl -fsS "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/news-data/$a" -o "$RUNNER_TEMP/$a" || rm -f "$RUNNER_TEMP/$a"
            fi
          done
          [ "$ok" = 1 ] && { publish || echo "publish failed"; }
