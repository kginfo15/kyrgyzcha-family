name: Mosquito sources probe

# One-off: downloads the Tokyo mosquito surveillance PDFs, a few JMA weather
# pages and the N03 base map to the `mosquito-data` branch (probe/), so the
# readers can be written against the real files. Removed once the real job exists.
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/mosquito/probe.py
      - .github/workflows/mosquito-probe.yml

permissions:
  contents: write

concurrency:
  group: mosquito-data
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Download
        run: mkdir -p "$RUNNER_TEMP/m" && python3 scripts/mosquito/probe.py "$RUNNER_TEMP/m"
      - name: Publish
        env:
          TOKEN: ${{ github.token }}
        run: |
          cd "$RUNNER_TEMP/m"
          git init -q
          git checkout -q --orphan mosquito-data
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qm "Mosquito sources probe"
          git push -qf "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" mosquito-data
