name: Probe event sites

# Temporary test of scripts/fetch_events.py from this branch (removed before merge).
on:
  push:
    branches: [claude/project-thread-osk90d]
    paths:
      - .github/workflows/probe-events.yml
      - scripts/fetch_events.py

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 scripts/fetch_events.py > events.json
          python3 - <<'PY'
          import json, collections
          d = json.load(open("events.json"))
          ev = d["events"]
          print("events", len(ev), "articles", len(d["articles"]))
          print(collections.Counter(e["cat"] for e in ev), collections.Counter(e["city"] for e in ev), collections.Counter(e["type"] for e in ev))
          for e in ev[:40]:
              print(e["dates"][:3], e["cat"], e["city"], "|", e["title"], "|", e["title_ja"], "|", e["venue"], "|", e["venue_ja"], e["price_min"], e["price_max"])
          print(sorted(collections.Counter(e["venue"] for e in ev).items(), key=lambda x: -x[1])[:40])
          for a in d["articles"][:20]:
              print(a["date"][:10], a["src"], a["title"], "|", a["title_ja"])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: events
          path: events.json
