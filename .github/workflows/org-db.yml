name: Ministry structures

# Collects each Kyrgyz ministry's / agency's management scheme ("схема управления")
# from the legal database (cbd.minjust.gov.kg) and publishes it on the `org-db`
# branch (one force-pushed commit). Runs once a month so the site can tell when
# a ministry got a new regulation after its structure was last read.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 1 * *"
  push:
    paths:
      - scripts/org_db.py
      - .github/workflows/org-db.yml

permissions:
  contents: write

concurrency:
  group: org-db
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Collect
        run: python3 scripts/org_db.py "$RUNNER_TEMP/org"
      - name: Publish
        env:
          TOKEN: ${{ github.token }}
        run: |
          cd "$RUNNER_TEMP/org"
          git init -q
          git checkout -q --orphan org-db
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qm "Ministry structures"
          git push -qf "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" org-db
