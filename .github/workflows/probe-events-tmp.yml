name: probe events (temporary)
on:
  push:
    branches: [claude/project-thread-36prwd]
    paths: [.github/workflows/probe-events-tmp.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - run: |
          UA="kyrgyzcha-family-events/1.0 (personal non-commercial event list; +https://github.com/kginfo15/kyrgyzcha-family)"
          f(){ echo "=== $1"; curl -sL -m 30 -A "$UA" -o /tmp/p -w "code=%{http_code} size=%{size_download} final=%{url_effective}\n" "$1"; }
          f https://ticket.kg/; grep -o 'href="/events/[^"]*"' /tmp/p | sort | uniq -c
          grep -oi '[^<>"]\{0,60\}цирк[^<>"]\{0,60\}' /tmp/p | head
          for q in "search?q=%D1%86%D0%B8%D1%80%D0%BA" "events/circus" "events/all"; do f "https://ticket.kg/$q"; grep -o 'href="/event/[^"]*"' /tmp/p | head -5; done
          f https://sxodim.com/robots.txt; head -c 1500 /tmp/p; echo
          for u in https://sxodim.com/bishkek/events/cirk https://sxodim.com/bishkek/events/koncerty https://sxodim.com/bishkek/afisha; do
            f "$u"; grep -c 'ld+json' /tmp/p; grep -o '__NUXT__\|__NEXT_DATA__\|window\.__[A-Z_]*' /tmp/p | sort -u
            grep -o 'href="https://sxodim.com/bishkek/event/[^"]*"' /tmp/p | sort -u | head -8
            grep -o 'href="/bishkek/[^"]*"' /tmp/p | sort -u | head -30
            grep -o '/api/[^"'"'"' ]*' /tmp/p | sort -u | head -10
          done
          f https://kassir.kg/robots.txt; head -c 800 /tmp/p; echo
          f https://kaktus.media/?rss; grep -oi '<title>[^<]*\(цирк\|концерт\|шоу\|выступ\)[^<]*' /tmp/p | head
