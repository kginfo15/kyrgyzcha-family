name: probe events (temporary)
on:
  push:
    branches: [claude/project-thread-36prwd]
    paths: [.github/workflows/probe-events-tmp.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - shell: bash
        run: |
          set +e
          UA="kyrgyzcha-family-events/1.0 (personal non-commercial event list; +https://github.com/kginfo15/kyrgyzcha-family)"
          curl -sL -m 30 -A "$UA" -o /tmp/cirk https://sxodim.com/bishkek/events/cirk
          curl -sL -m 30 -A "$UA" -o /tmp/terms https://sxodim.com/polzovatelskoe-soglashenie
          python3 - <<'PY'
          import re,urllib.request
          UA={"User-Agent":"kyrgyzcha-family-events/1.0 (personal non-commercial event list; +https://github.com/kginfo15/kyrgyzcha-family)"}
          p=open('/tmp/cirk',encoding='utf-8',errors='replace').read()
          i=p.find('page-posts'); print('POSTS', re.sub(r'\s+',' ',p[i-300:i+2500]))
          for m in re.findall(r'data-[\w-]+="[^"]{0,200}"',p):
              if any(k in m for k in ('url','api','endpoint','route','src','category','city')): print('DATA',m)
          scripts=sorted(set(re.findall(r'src="([^"]+\.js[^"]*)"',p))); print('SCRIPTS',scripts)
          for s in scripts:
              u=s if s.startswith('http') else 'https://sxodim.com'+s
              if 'sxodim' not in u: continue
              try: js=urllib.request.urlopen(urllib.request.Request(u,headers=UA),timeout=30).read().decode('utf-8','replace')
              except Exception as e: print('ERR',u,e); continue
              print('JS',u,len(js))
              found=set(re.findall(r'["\'`](/(?:api|ajax|bishkek|[a-z]+/api)[^"\'`\s]{0,80})["\'`]',js))
              print('  paths',sorted(found)[:60])
              for m in list(re.finditer(r'page-posts|posts',js))[:6]: print('  CTX',js[max(0,m.start()-200):m.start()+300].replace('\n',' '))
          t=open('/tmp/terms',encoding='utf-8',errors='replace').read()
          t=re.sub(r'<[^>]+>',' ',t); t=re.sub(r'\s+',' ',t)
          for m in re.finditer(r'робот|парс|автоматическ|скрап|копирова|воспроизвед|некоммерч',t,re.I): print('TERMS',t[max(0,m.start()-250):m.start()+250])
          PY
          echo "=== places circus"
          curl -sL -m 30 -A "$UA" https://sxodim.com/bishkek/places | grep -o 'href="https://sxodim.com/bishkek/places/[^"]*"' | sort -u | head -40
