name: probe events (temporary)
on:
  push:
    branches: [claude/project-thread-36prwd]
    paths: [.github/workflows/probe-events-tmp.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - shell: bash
        run: |
          set +e
          UA="kyrgyzcha-family-events/1.0 (personal non-commercial event list; +https://github.com/kginfo15/kyrgyzcha-family)"
          f(){ echo "=== $1"; curl -sL -m 30 -A "$UA" -o /tmp/p -w "code=%{http_code} size=%{size_download}\n" "$1"; }
          f https://sxodim.com/bishkek/events/cirk
          python3 - <<'PY'
          import re,html
          p=open('/tmp/p',encoding='utf-8',errors='replace').read()
          for m in re.findall(r'<script type="application/ld\+json"[^>]*>(.*?)</script>',p,re.S): print('LD',m[:3000])
          hrefs=sorted(set(re.findall(r'href="([^"]*sxodim[^"]*|/bishkek/[^"]*)"',p)))
          print('HREFS',len(hrefs)); print('\n'.join(hrefs[:120]))
          for m in re.finditer(r'window\.__\w*',p): print('WIN',p[m.start():m.start()+300].replace('\n',' '))
          for m in list(re.finditer(r'[Цц]ирк',p))[:15]: print('CTX',re.sub(r'\s+',' ',p[max(0,m.start()-200):m.start()+200]))
          PY
          for u in https://sxodim.com/bishkek/afisha https://sxodim.com/bishkek/events/koncert https://sxodim.com/bishkek/events/concerts; do f "$u"; grep -o 'href="[^"]*bishkek/events/[^"]*"' /tmp/p | sort -u | head -40; done
          f https://kassir.kg/robots.txt; head -c 800 /tmp/p; echo
          f "https://kaktus.media/?rss"; grep -oi '<title>[^<]*' /tmp/p | grep -i 'цирк\|концерт\|шоу\|выступ\|live' | head
