name: Probe feeds (temporary)

# Temporary check: which Uzbek / Tajik news feeds answer GitHub's runners.
on:
  push:
    branches: [claude/project-thread-5ct4y3]
    paths:
      - .github/workflows/probe-feeds.yml
      - scripts/probe_feeds.py

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/probe_feeds.py
      - name: Keep the sample files on a temporary branch (for the page check)
        env:
          TOKEN: ${{ github.token }}
        run: |
          mkdir /tmp/out && cd /tmp/out && git init -q && git checkout -q --orphan probe-news-uz-tj
          cp /tmp/news-uz.json /tmp/news-tj.json /tmp/arch-uz.json /tmp/arch-tj.json . || true
          git add -A && git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qm sample
          git push -qf "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" probe-news-uz-tj
