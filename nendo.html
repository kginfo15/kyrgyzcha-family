<title>こねこね ねんどラボ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+Rounded+1c:wght@500;800&display=swap">
<style>
/* Layout: one-screen clay studio. Night-indigo workshop frame, a green cutting mat as the stage,
   chunky tool rail (left in landscape, under the mat in portrait), clay jars + parts tray at the thumb. */
:root{
  --night:#14172E; --panel:#1F2446; --panel2:#2B3163; --edge:#3C4488; --press:#0C0E1F;
  --text:#F5F2FF; --soft:#A9AEDB;
  --sun:#FFD23F; --hot:#FF4F8B; --cyan:#33E1D2; --lime:#9BE34A; --violet:#9C7BFF; --tang:#FF8A2A;
  --mat:#1D5F59; --mat-line:#2C7C73; --mat-strong:#3E978B;
  --display:"Dela Gothic One","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --body:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Sans",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--night);color:var(--text);font-family:var(--body);font-weight:800;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overflow:hidden;overscroll-behavior:none;
  -webkit-touch-callout:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible{outline:3px solid var(--sun);outline-offset:3px}
[hidden]{display:none!important}

.app{height:100%;display:grid;gap:8px;box-sizing:border-box;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px 10px;
  grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto auto;
  grid-template-areas:"top" "stage" "tools" "tray"}
@media (min-aspect-ratio:1/1) and (min-width:700px){
  .app{grid-template-columns:auto minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;
    grid-template-areas:"top top" "tools stage" "tools tray"}
  .tools{flex-direction:column;overflow-y:auto;overflow-x:hidden}
}

/* header */
.top{grid-area:top;display:flex;align-items:center;gap:10px;min-width:0}
.logo{font-family:var(--display);font-weight:400;font-size:clamp(20px,4.4vw,30px);margin:0;letter-spacing:.02em;flex:1;min-width:0;white-space:nowrap;
  display:flex;align-items:baseline;gap:.08em}
.logo small{font-family:var(--body);font-size:.5em;color:var(--soft);margin-right:.3em}
.logo i{font-style:normal;display:inline-block;text-shadow:0 .09em 0 rgba(0,0,0,.35),0 .18em .3em rgba(0,0,0,.35);transform:rotate(var(--r,0deg))}
.hbtn{display:flex;align-items:center;gap:6px;height:44px;padding:0 14px;border-radius:14px;background:var(--panel2);box-shadow:0 4px 0 var(--press);font-size:14px;white-space:nowrap}
.hbtn svg{width:22px;height:22px;flex:none}
.hbtn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--press)}
.hbtn .badge{background:var(--sun);color:var(--night);border-radius:999px;font-size:11px;padding:1px 7px}
@media (max-width:560px){.hbtn .lbl{display:none}.hbtn{padding:0 11px}}

/* tool rail */
.tools{grid-area:tools;display:flex;gap:8px;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;padding:2px 2px 6px}
.tools::-webkit-scrollbar{display:none}
.tool{flex:none;width:66px;min-height:62px;border-radius:18px;background:var(--panel2);box-shadow:0 5px 0 var(--press);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;color:var(--soft);transition:transform .1s}
.tool svg{width:28px;height:28px;fill:none;stroke:currentColor;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round;color:var(--tc)}
.tool[aria-pressed="true"]{background:var(--tc);color:var(--night);transform:translateY(-2px);box-shadow:0 7px 0 var(--press),0 0 0 3px var(--text) inset}
.tool[aria-pressed="true"] svg{color:var(--night)}
.tool:active{transform:translateY(3px);box-shadow:0 2px 0 var(--press)}

/* stage */
.stage{grid-area:stage;position:relative;min-height:0;border-radius:22px;overflow:hidden;background:var(--mat);
  box-shadow:0 0 0 5px var(--panel2),0 10px 0 5px var(--press)}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
.float{position:absolute;display:flex;gap:8px;z-index:2}
.f-tr{top:10px;right:10px}.f-bl{bottom:10px;left:10px}.f-br{bottom:10px;right:10px}.f-tl{top:10px;left:10px;right:130px;flex-wrap:wrap}
.sbtn{width:52px;height:52px;border-radius:16px;background:rgba(20,23,46,.78);box-shadow:0 4px 0 rgba(0,0,0,.35);display:grid;place-items:center;backdrop-filter:blur(4px)}
.sbtn svg{width:26px;height:26px;fill:none;stroke:var(--text);stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}
.sbtn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.35)}
.sbtn:disabled{opacity:.35}
.sbtn.dance svg{stroke:var(--sun)}
.trash{width:62px;height:62px}
.trash.hot{background:var(--hot);transform:scale(1.15)}
.sub{display:flex;gap:6px;background:rgba(20,23,46,.78);padding:6px;border-radius:18px;backdrop-filter:blur(4px)}
.opt{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;background:var(--panel2)}
.opt svg{width:28px;height:28px}
.opt[aria-pressed="true"]{background:var(--sun);box-shadow:0 0 0 3px var(--text) inset}
.hint{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);max-width:calc(100% - 170px);text-align:center;font-size:13px;line-height:1.35;
  background:rgba(12,14,31,.62);padding:6px 14px;border-radius:999px;pointer-events:none;z-index:1;text-wrap:balance}
@media (max-width:520px){.hint{font-size:12px;max-width:calc(100% - 150px);border-radius:16px}}

/* tray */
.tray{grid-area:tray;background:var(--panel);border-radius:20px;padding:8px 10px 10px;display:flex;flex-direction:column;gap:6px;min-width:0;box-shadow:0 5px 0 var(--press)}
.tabs{display:flex;gap:6px;align-items:center}
.tab{height:36px;padding:0 16px;border-radius:999px;background:var(--panel2);font-size:14px;color:var(--soft)}
.tab[aria-selected="true"]{background:var(--text);color:var(--night)}
.sizes{margin-left:auto;display:flex;gap:6px;align-items:center}
.size{width:36px;height:36px;border-radius:50%;background:var(--panel2);display:grid;place-items:center}
.size i{display:block;border-radius:50%;background:var(--soft)}
.size[aria-pressed="true"]{background:var(--sun)}.size[aria-pressed="true"] i{background:var(--night)}
.shelf{display:flex;gap:8px;overflow-x:auto;overflow-y:hidden;touch-action:pan-x;scrollbar-width:thin;scrollbar-color:var(--edge) transparent;padding:2px 2px 4px;min-height:84px;align-items:flex-end}
.jar,.part{flex:none;width:64px;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:11px;color:var(--soft);border-radius:14px;padding:2px 0}
.jar svg{width:58px;height:58px;display:block}
.part canvas{width:58px;height:58px;display:block;background:var(--panel2);border-radius:16px}
.jar:active svg,.part:active canvas{transform:scale(.9)}
.divider{flex:none;align-self:stretch;width:2px;background:var(--edge);margin:6px 4px;border-radius:2px}
.shelf-note{flex:none;font-size:11px;color:var(--soft);width:58px;text-align:center;align-self:center;line-height:1.3}
.ghost{position:fixed;left:0;top:0;width:64px;height:64px;pointer-events:none;z-index:60;margin:-32px 0 0 -32px;filter:drop-shadow(0 8px 6px rgba(0,0,0,.4))}
.ghost svg,.ghost canvas{width:64px;height:64px}

/* overlays */
.modal{position:fixed;inset:0;background:rgba(8,9,20,.7);display:grid;place-items:center;z-index:50;backdrop-filter:blur(3px);
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.card{background:var(--panel);border-radius:26px;padding:18px;max-width:640px;width:100%;max-height:100%;overflow:auto;box-sizing:border-box;box-shadow:0 0 0 4px var(--panel2),0 12px 0 4px var(--press);display:flex;flex-direction:column;gap:12px}
.card h2{font-family:var(--display);font-weight:400;font-size:22px;margin:0;display:flex;align-items:center;gap:10px;justify-content:space-between}
.card p{margin:0;color:var(--soft);font-size:14px}
.x{width:44px;height:44px;border-radius:50%;background:var(--panel2);font-size:20px;flex:none}
.zgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
.zitem{background:var(--panel2);border-radius:18px;padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;font-size:13px}
.zsw{width:58px;height:58px;border-radius:50%;box-shadow:inset -6px -8px 0 rgba(0,0,0,.18),inset 6px 6px 8px rgba(255,255,255,.35)}
.zsw.lock{background:var(--panel);box-shadow:none;border:3px dashed var(--edge);display:grid;place-items:center;font-family:var(--display);color:var(--soft);font-size:22px;box-sizing:border-box}
.recipe{display:flex;align-items:center;gap:3px;font-size:12px;color:var(--soft)}
.recipe i{width:15px;height:15px;border-radius:50%;display:inline-block;box-shadow:inset -2px -2px 0 rgba(0,0,0,.2)}
.meter{height:12px;background:var(--panel2);border-radius:99px;overflow:hidden}
.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--hot),var(--sun),var(--lime),var(--cyan));border-radius:99px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.photo{position:relative;border-radius:16px;overflow:hidden;background:var(--panel2);aspect-ratio:4/3;max-width:100%}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.photo .del{position:absolute;top:6px;right:6px;height:34px;min-width:34px;border-radius:999px;background:rgba(12,14,31,.75);font-size:13px;padding:0 10px}
.photo .del.ask{background:var(--hot)}
.big img{width:100%;border-radius:16px;display:block}
.empty{color:var(--soft);text-align:center;padding:26px 8px;font-size:14px}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.btn{height:52px;padding:0 22px;border-radius:16px;background:var(--panel2);font-size:16px;box-shadow:0 5px 0 var(--press)}
.btn.main{background:var(--sun);color:var(--night)}
.btn.warn{background:var(--hot);color:#fff}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--press)}

.found{text-align:center;align-items:center;max-width:340px;animation:pop .5s cubic-bezier(.3,1.6,.5,1)}
.found .eyebrow{font-size:13px;color:var(--sun);letter-spacing:.08em}
.found .big-sw{width:120px;height:120px;border-radius:50%;box-shadow:inset -12px -16px 0 rgba(0,0,0,.18),inset 10px 10px 16px rgba(255,255,255,.4),0 10px 0 var(--press)}
.found b{font-family:var(--display);font-weight:400;font-size:30px}
.toast{position:absolute;top:72px;left:50%;transform:translateX(-50%);z-index:3;background:var(--text);color:var(--night);padding:8px 16px;border-radius:999px;font-size:15px;display:flex;align-items:center;gap:8px;white-space:nowrap;animation:pop .4s cubic-bezier(.3,1.6,.5,1)}
.toast i{width:22px;height:22px;border-radius:50%;display:inline-block}
.flash{position:fixed;inset:0;background:#fff;z-index:70;pointer-events:none;animation:flash .45s ease-out forwards}
@keyframes pop{from{transform:translateX(var(--tx,0)) scale(.3)}to{transform:translateX(var(--tx,0)) scale(1)}}
.toast{--tx:-50%}
@keyframes flash{from{opacity:.9}to{opacity:0}}
@media (prefers-reduced-motion:reduce){.found,.toast{animation:none}}
</style>

<div class="app" id="app">
  <header class="top">
    <h1 class="logo" aria-label="こねこね ねんどラボ"><small>こねこね</small><i style="color:#FF4F8B;--r:-4deg">ね</i><i style="color:#FFD23F;--r:3deg">ん</i><i style="color:#33E1D2;--r:-2deg">ど</i><i style="color:#9BE34A;--r:4deg">ラ</i><i style="color:#9C7BFF;--r:-3deg">ボ</i></h1>
    <button class="hbtn" id="zukanBtn" aria-label="いろ ずかん"><svg viewBox="0 0 24 24" fill="none" stroke="#FFD23F" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 19V5"/><circle cx="11.5" cy="10" r="3"/></svg><span class="lbl">いろずかん</span><span class="badge" id="zukanCount">0</span></button>
    <button class="hbtn" id="albumBtn" aria-label="アルバム"><svg viewBox="0 0 24 24" fill="none" stroke="#33E1D2" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="2"/><path d="m21 16-5-5-9 9"/></svg><span class="lbl">アルバム</span></button>
    <button class="hbtn" id="muteBtn" aria-label="おと オン・オフ"><svg viewBox="0 0 24 24" fill="none" stroke="#F5F2FF" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z"/><path id="muteWave" d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/><path id="muteX" d="m16 9 6 6m0-6-6 6" hidden/></svg></button>
  </header>

  <nav class="tools" id="tools" aria-label="どうぐ"></nav>

  <main class="stage" id="stage">
    <canvas id="cv" aria-label="ねんどの さぎょうマット"></canvas>
    <div class="float f-tl" id="subWrap" hidden><div class="sub" id="sub"></div></div>
    <div class="float f-tr">
      <button class="sbtn dance" id="danceBtn" aria-label="おどらせる"><svg viewBox="0 0 24 24"><path d="M9 18V5l11-2v13"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="17.5" cy="16" r="2.5"/></svg></button>
      <button class="sbtn" id="shotBtn" aria-label="しゃしんを とる"><svg viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.6"/></svg></button>
    </div>
    <div class="float f-bl"><button class="sbtn" id="undoBtn" aria-label="ひとつ もどす" disabled><svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg></button></div>
    <div class="float f-br"><button class="sbtn trash" id="trashBtn" aria-label="ごみばこ"><svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/><path d="M10 11v6M14 11v6"/></svg></button></div>
    <div class="hint" id="hint"></div>
  </main>

  <section class="tray" aria-label="ねんどと パーツ">
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" id="tabClay" aria-selected="true">ねんど</button>
      <button class="tab" role="tab" id="tabParts" aria-selected="false">パーツ</button>
      <div class="sizes" id="sizes" hidden></div>
    </div>
    <div class="shelf" id="shelf"></div>
  </section>
</div>

<div class="modal" id="zukan" hidden><div class="card">
  <h2>いろ ずかん <button class="x" data-close aria-label="とじる">✕</button></h2>
  <p id="zukanLead"></p>
  <div class="meter"><i id="zukanMeter"></i></div>
  <div class="zgrid" id="zgrid"></div>
</div></div>
<div class="modal" id="album" hidden><div class="card">
  <h2>アルバム <button class="x" data-close aria-label="とじる">✕</button></h2>
  <div class="pgrid" id="pgrid"></div>
</div></div>
<div class="modal" id="viewer" hidden><div class="card big">
  <h2>しゃしん <button class="x" data-close aria-label="とじる">✕</button></h2>
  <img id="viewImg" alt="つくった さくひんの しゃしん">
</div></div>
<div class="modal" id="confirm" hidden><div class="card" style="max-width:340px;text-align:center;align-items:center">
  <h2 style="justify-content:center">ぜんぶ かたづける？</h2>
  <p>マットの うえの ねんどと パーツが きえるよ</p>
  <div class="row"><button class="btn" data-close>やめる</button><button class="btn warn" id="clearYes">かたづける</button></div>
</div></div>
<div class="modal" id="foundModal" hidden><div class="card found">
  <span class="eyebrow">あたらしい いろ はっけん！</span>
  <div class="big-sw" id="foundSw"></div>
  <b id="foundName"></b>
  <div class="recipe" id="foundRecipe"></div>
  <button class="btn main" data-close>やったー！</button>
</div></div>

<script>
(()=>{
'use strict';
const $=s=>document.querySelector(s);
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t, rnd=(a,b)=>a+Math.random()*(b-a);
const TAU=Math.PI*2;

/* ================= color model =================
   Each texture cell keeps log(linear RGB + EPS). Averaging logs is a geometric mean,
   which behaves like paint: blue + yellow -> green, red + blue -> purple. */
const EPS=0.005, LMIN=Math.log(EPS), LMAX=Math.log(1+EPS);
const s2l=c=>c<=0.04045?c/12.92:Math.pow((c+0.055)/1.055,2.4);
const l2s=c=>c<=0.0031308?c*12.92:1.055*Math.pow(c,1/2.4)-0.055;
function hexRGB(h){h=h.replace('#','');return[0,2,4].map(i=>parseInt(h.substr(i,2),16)/255)}
const toL=rgb=>rgb.map(c=>Math.log(s2l(c)+EPS));
const fromL=L=>L.map(v=>clamp(l2s(Math.max(0,Math.exp(v)-EPS)),0,1));
const LUT=new Uint8ClampedArray(2048);
for(let i=0;i<2048;i++){const L=LMIN+(LMAX-LMIN)*i/2047;LUT[i]=Math.round(clamp(l2s(Math.max(0,Math.exp(L)-EPS)),0,1)*255)}
const lutI=L=>{const k=((L-LMIN)/(LMAX-LMIN)*2047)|0;return k<0?0:k>2047?2047:k};
function okBoost(r,g,b){ // lifts dull mixed colors; already-vivid colors stay as they are
  const lr=s2l(r),lg=s2l(g),lb=s2l(b);
  const l=Math.cbrt(.4122214708*lr+.5363325363*lg+.0514459929*lb),m=Math.cbrt(.2119034982*lr+.6806995451*lg+.1073969566*lb),q=Math.cbrt(.0883024619*lr+.2817188376*lg+.6299787005*lb);
  let L=.2104542553*l+.793617785*m-.0040720468*q,A=1.9779984951*l-2.428592205*m+.4505937099*q,B=.0259040371*l+.7827717662*m-.808675766*q;
  const C=Math.hypot(A,B);if(C<1e-4)return[r,g,b];const f=Math.max(0,1-C/.22),k=1+1.7*f;A*=k;B*=k;L=L+.08*(1-L)*f;
  const l2=Math.pow(L+.3963377774*A+.2158037573*B,3),m2=Math.pow(L-.1055613458*A-.0638541728*B,3),q2=Math.pow(L-.0894841775*A-1.291485548*B,3);
  return[4.0767416621*l2-3.3077115913*m2+.2309699292*q2,-1.2684380046*l2+2.6097574011*m2-.3413193965*q2,-.0041960771*l2-.7034186147*m2+1.707614701*q2].map(v=>clamp(l2s(clamp(v,0,1)),0,1))}
const boost=rgb=>okBoost(rgb[0],rgb[1],rgb[2]);
const css=rgb=>`rgb(${rgb.map(c=>Math.round(c*255)).join(',')})`;
function mixL(list){const o=[0,0,0];let w=0;list.forEach(([L,k])=>{for(let c=0;c<3;c++)o[c]+=L[c]*k;w+=k});return o.map(v=>v/w)}
function lab(rgb){let [r,g,b]=rgb.map(s2l);let x=(r*.4124+g*.3576+b*.1805)/.95047,y=r*.2126+g*.7152+b*.0722,z=(r*.0193+g*.1192+b*.9505)/1.08883;
  const f=t=>t>.008856?Math.cbrt(t):7.787*t+16/116;x=f(x);y=f(y);z=f(z);return[116*y-16,500*(x-y),200*(y-z)]}
const dE=(a,b)=>Math.hypot(a[0]-b[0],a[1]-b[1],a[2]-b[2]);

const PAL=[
 ['red','あか','#E5232E'],['orange','オレンジ','#FF7B1C'],['yellow','きいろ','#FFD21F'],['lime','きみどり','#8EDB3A'],
 ['green','みどり','#1FA855'],['teal','ターコイズ','#16C3BD'],['sky','みずいろ','#5EC8F5'],['blue','あお','#1F5FE0'],
 ['navy','こん','#24307C'],['purple','むらさき','#7B3FC4'],['magenta','マゼンタ','#E0309A'],['pink','ピンク','#FF8CC0'],

function mixState(b){const m=getMask(b),t=b.tex,mean=[0,0,0];let n=0;
  for(let q=0;q<G*G;q+=2)if(m[q]){const o=q*CH;mean[0]+=t[o];mean[1]+=t[o+1];mean[2]+=t[o+2];n++}
  if(!n)return null;mean[0]/=n;mean[1]/=n;mean[2]/=n;const mr=fromL(mean),ml=lab(mr);let sd=0,c=0;

  if(k==='dots')return`<svg viewBox="0 0 24 24"><g fill="#F5F2FF"><circle cx="5" cy="15" r="2"/><circle cx="10" cy="11" r="2"/><circle cx="15" cy="11" r="2"/><circle cx="20" cy="8" r="2"/></g></svg>`;
  const s=SHAPE_PTS[k];let d='';for(let i=0;i<s.length/2;i++)d+=(i?'L':'M')+(s[2*i]*9+12).toFixed(1)+' '+(s[2*i+1]*9+12).toFixed(1);return`<svg viewBox="0 0 24 24"><path d="${d}Z" ${st}/></svg>`}
function setTool(id){S.tool=id;document.querySelectorAll('.tool').forEach(b=>b.setAttribute('aria-pressed',b.id==='tool-'+id));
  $('#hint').textContent=HINTS[id];const sw=$('#subWrap'),sub=$('#sub');const opts=SUBS[id];
  if(opts){sw.hidden=false;const key=id==='cutter'?'cut':'eng';sub.innerHTML='';opts.forEach(([k,lab])=>{const b=document.createElement('button');b.className='opt';b.setAttribute('aria-label',lab);
    b.setAttribute('aria-pressed',S[key]===k);b.innerHTML=id==='cutter'?shapeSvg(k,'#FFD23F'):engSvg(k);b.onclick=()=>{SFX.tap();S[key]=k;sub.querySelectorAll('.opt').forEach(o=>o.setAttribute('aria-pressed',o===b));saveSoon()};sub.appendChild(b)})}
  else sw.hidden=true;saveSoon()}
let hintTimer=0;function nudgeHint(){const h=$('#hint');h.animate&&!RM&&h.animate([{transform:'translateX(-50%) scale(1)'},{transform:'translateX(-50%) scale(1.08)'},{transform:'translateX(-50%) scale(1)'}],{duration:300})}
const onceSeen=new Set();function setHintOnce(k){if(onceSeen.has(k))return;onceSeen.add(k);if(k==='merge'){const h=$('#hint');const old=h.textContent;h.textContent='くっついた ねんどを 「こねる」で こねると いろが まざるよ！';clearTimeout(hintTimer);hintTimer=setTimeout(()=>h.textContent=HINTS[S.tool]||old,5000)}}

/* ================= UI: tray ================= */
let trayTab='clay';const shelf=$('#shelf');
function jarSvg(fill,gl,stripes){const id='g'+Math.random().toString(36).slice(2,7);
  let defs='',dome=`fill="${fill}"`;
  if(stripes){defs=`<linearGradient id="${id}" x1="0" x2="1" y1="0" y2=".3">${stripes.map((c,i)=>`<stop offset="${i/stripes.length}" stop-color="${PI_[c].hex}"/><stop offset="${(i+1)/stripes.length}" stop-color="${PI_[c].hex}"/>`).join('')}</linearGradient>`;dome=`fill="url(#${id})"`}
  const sp=gl?`<g fill="#fff">${[[22,26],[34,22],[42,30],[28,34],[38,36],[18,33]].map(([x,y],i)=>`<circle cx="${x}" cy="${y}" r="${i%2?1.1:1.6}" opacity="${.6+gl*.4}"/>`).join('')}</g>`:'';
  return`<svg viewBox="0 0 64 64" aria-hidden="true"><defs>${defs}</defs><ellipse cx="32" cy="56" rx="22" ry="4" fill="rgba(0,0,0,.3)"/>
  <path d="M10 34h44l-4 19a4 4 0 0 1-4 3H18a4 4 0 0 1-4-3z" fill="#3C4488"/><path d="M10 34h44l-1 5H11z" fill="#4F58A8"/>
  <path d="M12 35c0-11 9-19 20-19s20 8 20 19z" ${dome}/><path d="M12 35c0-11 9-19 20-19s20 8 20 19z" fill="url(#jarShade)"/>${sp}
  <ellipse cx="24" cy="23" rx="6" ry="3.4" fill="#fff" opacity=".45" transform="rotate(-25 24 23)"/></svg>`}
const shadeDefs=document.createElementNS('http://www.w3.org/2000/svg','svg');shadeDefs.setAttribute('width','0');shadeDefs.setAttribute('height','0');shadeDefs.style.position='absolute';
shadeDefs.innerHTML='<defs><linearGradient id="jarShade" x1="0" y1="0" x2=".6" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".18"/><stop offset=".6" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".3"/></linearGradient></defs>';document.body.appendChild(shadeDefs);
function renderShelf(){
  shelf.innerHTML='';$('#tabClay').setAttribute('aria-selected',trayTab==='clay');$('#tabParts').setAttribute('aria-selected',trayTab==='parts');$('#sizes').hidden=trayTab!=='parts';
  if(trayTab==='clay'){
    PAL.forEach(p=>{const b=document.createElement('button');b.className='jar';b.setAttribute('aria-label',p.name+'の ねんど');b.innerHTML=jarSvg(p.hex,p.gl,p.stripes)+`<span>${p.name}</span>`;bindTray(b,{clay:p});shelf.appendChild(b)});
    const mine=RECIPES.filter(r=>S.found.includes(r.name));
    const dv=document.createElement('div');dv.className='divider';shelf.appendChild(dv);
    if(!mine.length){const n=document.createElement('div');n.className='shelf-note';n.textContent='まぜた いろが ここに ふえるよ';shelf.appendChild(n)}
    mine.forEach(r=>{const b=document.createElement('button');b.className='jar';b.setAttribute('aria-label',r.name+'の ねんど');b.innerHTML=jarSvg(css(r.rgb),0)+`<span>${r.name}</span>`;bindTray(b,{clay:{recipe:r}});shelf.appendChild(b)});
  }else{
    PARTS.forEach(([type,name])=>{const b=document.createElement('button');b.className='part';b.setAttribute('aria-label',name);const c=document.createElement('canvas');c.width=c.height=116;
      const x=c.getContext('2d');x.scale(2,2);x.translate(29,30);const pt=newPart(type,/Eyes|cheeks|glasses|wings|antenna|catEars|mustache/.test(type)?10:12);pt.pp=[.2,.3];if(type==='stick')pt.s=9;drawPart(x,pt);
      b.appendChild(c);const sp=document.createElement('span');sp.textContent=name;b.appendChild(sp);bindTray(b,{part:type});shelf.appendChild(b)})}
}
$('#tabClay').onclick=()=>{SFX.tap();trayTab='clay';renderShelf()};$('#tabParts').onclick=()=>{SFX.tap();trayTab='parts';renderShelf()};
const sizesEl=$('#sizes');[0,1,2].forEach(i=>{const b=document.createElement('button');b.className='size';b.setAttribute('aria-label',['ちいさい','ふつう','おおきい'][i]);b.innerHTML=`<i style="width:${8+i*6}px;height:${8+i*6}px"></i>`;
  b.onclick=()=>{SFX.tap();S.size=i;sizesEl.querySelectorAll('.size').forEach((o,k)=>o.setAttribute('aria-pressed',k===i));saveSoon()};sizesEl.appendChild(b)});
function syncSizes(){sizesEl.querySelectorAll('.size').forEach((o,k)=>o.setAttribute('aria-pressed',k===S.size))}

let ghost=null;
function bindTray(el,what){
  let st=null;
  el.addEventListener('pointerdown',e=>{ac();st={x:e.clientX,y:e.clientY,id:e.pointerId,drag:false}});
  el.addEventListener('pointermove',e=>{if(!st||st.id!==e.pointerId)return;const dx=e.clientX-st.x,dy=e.clientY-st.y;
    if(!st.drag&&Math.abs(dy)>12&&Math.abs(dy)>Math.abs(dx)){st.drag=true;el.setPointerCapture(e.pointerId);ghost=document.createElement('div');ghost.className='ghost';
      ghost.appendChild((el.querySelector('svg')||el.querySelector('canvas')).cloneNode(true));if(what.part){const c=ghost.querySelector('canvas');c.getContext('2d').drawImage(el.querySelector('canvas'),0,0)}document.body.appendChild(ghost)}
    if(st.drag&&ghost)ghost.style.transform=`translate(${e.clientX}px,${e.clientY}px)`});
  const end=e=>{if(!st||st.id!==e.pointerId)return;const s=st;st=null;
    if(s.drag){ghost&&ghost.remove();ghost=null;const r=cv.getBoundingClientRect();if(e.type==='pointerup'&&e.clientX>r.left&&e.clientX<r.right&&e.clientY>r.top&&e.clientY<r.bottom)place(what,e.clientX-r.left,e.clientY-r.top,false)}
    else if(e.type==='pointerup'&&Math.hypot(e.clientX-s.x,e.clientY-s.y)<12)place(what,null,null,true)};
  el.addEventListener('pointerup',end);el.addEventListener('pointercancel',end);
  el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();place(what,null,null,true)}})}
function freeSpot(R){let best=[W/2,H/2],bs=-1;for(let k=0;k<24;k++){const x=rnd(R+10,W-R-10),y=rnd(R+60,H-R-60);let m=1e9;blobs.forEach(b=>m=Math.min(m,Math.hypot(b.cx-x,b.cy-y)-radOf(b)));if(m>bs){bs=m;best=[x,y]}}return best}
function place(what,x,y,auto){
  snap();
  if(what.clay){const R=baseR();if(auto){[x,y]=freeSpot(R)}const b=spawnClay(what.clay,x,y,true);if(!auto){b.fall={vy:2,ty:y};b.cy=y-60;for(let i=0;i<N;i++)b.p[2*i+1]=b.cy+b.rest[2*i+1]}SFX.swish();saveSoon();return}
  if(what.part){const s=PSIZE[S.size]*(baseR()/44);const p=newPart(what.part,s);
    if(auto){const tb=blobs[blobs.length-1];if(tb){const pr=radOf(tb);x=tb.cx+rnd(-.35,.35)*pr;y=tb.cy+rnd(-.35,.2)*pr}else{x=W/2+rnd(-40,40);y=H/2+rnd(-30,30)}}
    p.x=x;p.y=y;attachPart(p);p.bounce=18;SFX.pop();saveSoon()}}

/* ================= header + modals ================= */
function openModal(id){$('#'+id).hidden=false}
document.querySelectorAll('.modal').forEach(m=>{m.addEventListener('click',e=>{if(e.target===m||e.target.closest('[data-close]')){m.hidden=true;SFX.tap()}})});
document.addEventListener('keydown',e=>{if(e.key==='Escape')document.querySelectorAll('.modal').forEach(m=>m.hidden=true)});
function updateZukanCount(){$('#zukanCount').textContent=S.found.length}
function recipeHTML(rec){return rec.map(id=>`<i style="background:${PI_[id].hex}" title="${PI_[id].name}"></i>`).join('＋')}
function recipeText(rec){return rec.map(id=>PI_[id].name).join(' ＋ ')}
$('#zukanBtn').onclick=()=>{SFX.tap();const g=$('#zgrid');g.innerHTML='';
  RECIPES.forEach(r=>{const got=S.found.includes(r.name),d=document.createElement('div');d.className='zitem';
    d.innerHTML=got?`<div class="zsw" style="background:${css(r.rgb)}"></div><b>${r.name}</b><span class="recipe">${recipeHTML(r.rec)}</span>`
      :`<div class="zsw lock">？</div><b style="color:var(--soft)">？？？</b><span class="recipe">${recipeHTML(r.rec)}</span>`;
    d.title=recipeText(r.rec);g.appendChild(d)});
  $('#zukanLead').textContent=`${RECIPES.length}しょく のうち ${S.found.length}しょく みつけたよ。したの いろを まぜてみよう！`;
  $('#zukanMeter').style.width=(S.found.length/RECIPES.length*100)+'%';openModal('zukan')};
function showFound(r,rgb){SFX.chime();$('#foundSw').style.background=css(r.rgb);$('#foundName').textContent=r.name;$('#foundRecipe').innerHTML=recipeHTML(r.rec);openModal('foundModal')}
let toastEl=null;function toast(txt,rgb){toastEl&&toastEl.remove();toastEl=document.createElement('div');toastEl.className='toast';toastEl.innerHTML=`<i style="background:${css(rgb)}"></i>${txt}`;stage.appendChild(toastEl);const t=toastEl;setTimeout(()=>t.remove(),2200)}
function setMute(){$('#muteWave').style.display=S.muted?'none':'';$('#muteX').hidden=!S.muted}
$('#muteBtn').onclick=()=>{S.muted=!S.muted;setMute();if(!S.muted)SFX.tap();saveSoon()};
$('#undoBtn').onclick=()=>{undo()};
$('#danceBtn').onclick=()=>{ac();if(!blobs.length){SFX.no();return}danceT=RM?60:200;dance();blobs.forEach(b=>b.parts.forEach(p=>p.bounce=30))};
trashBtn.onclick=()=>{if(!blobs.length&&!freeParts.length){SFX.no();return}SFX.tap();openModal('confirm')};
$('#clearYes').onclick=()=>{snap();blobs.forEach(b=>poof(b.cx,b.cy));blobs=[];freeParts=[];SFX.trash();$('#confirm').hidden=true;saveSoon()};
$('#shotBtn').onclick=()=>{ac();SFX.shutter();const f=document.createElement('div');f.className='flash';document.body.appendChild(f);setTimeout(()=>f.remove(),500);
  const w=Math.min(720,W),h=Math.round(w*H/W),c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(cv,0,0,w,h);
  let url='';try{url=c.toDataURL('image/jpeg',.72)}catch(e){}if(!url)return;
  photos.unshift({url,t:Date.now()});while(photos.length>16)photos.pop();
  let ok=false;while(!ok&&photos.length){try{localStorage.setItem(PKEY,JSON.stringify(photos));ok=true}catch(e){photos.pop()}}
  floatText(W/2,60,'パシャ！','#FFD23F',28)};
$('#albumBtn').onclick=()=>{SFX.tap();renderAlbum();openModal('album')};
function renderAlbum(){const g=$('#pgrid');g.innerHTML='';
  if(!photos.length){g.innerHTML='<div class="empty">まだ しゃしんが ないよ。マットの みぎうえの カメラで とってみよう！</div>';return}
  photos.forEach((p,i)=>{const d=document.createElement('div');d.className='photo';d.innerHTML=`<img src="${p.url}" alt="しゃしん ${i+1}"><button class="del" aria-label="けす">✕</button>`;
    d.querySelector('img').onclick=()=>{SFX.tap();$('#viewImg').src=p.url;openModal('viewer')};
    const del=d.querySelector('.del');del.onclick=e=>{e.stopPropagation();if(!del.classList.contains('ask')){del.classList.add('ask');del.textContent='けす？';setTimeout(()=>{del.classList.remove('ask');del.textContent='✕'},2500);return}
      photos.splice(i,1);try{localStorage.setItem(PKEY,JSON.stringify(photos))}catch(e){}renderAlbum()};g.appendChild(d)})}

/* ================= boot ================= */
const ro=new ResizeObserver(()=>resize());
function start(data){
  resize();ro.observe(stage);
  const sc=(data&&data.scene)||S.scene;let ok=false;
  if(sc&&sc.blobs){try{loadScene(sc);ok=true}catch(e){ok=false}}
  if(!ok)sampleScene();
  S.scene=null;setTool(S.tool||'move');syncSizes();renderShelf();updateZukanCount();setMute();
  requestAnimationFrame(frame);
}
window.claude?.hot?.snapshot?.(()=>({scene:serScene()}));
document.fonts&&document.fonts.ready.then(()=>{drawMat()});
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
window.addEventListener('pagehide',saveMeta);document.addEventListener('visibilitychange',()=>{if(document.hidden)saveMeta()});
})();
</script>
