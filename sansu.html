<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>さんすうの じかん</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Klee+One:wght@600&family=Mochiy+Pop+One&family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<style>
/* Layout: classroom stage fills the screen (board, teacher, five desks); writing, hint and result panels slide over it. */
:root{
  --wall:#FCEFD9; --wall-low:#F3DEBE;
  --floor:#D9A774; --floor-line:#C38F5C;
  --board:#2F5D46; --board-dark:#244A38; --frame:#9B6A3C;
  --chalk:#FBFBF3; --chalk-yellow:#FFE36E; --chalk-red:#FF7B7B; --chalk-blue:#8FD3FF;
  --ink:#3A3552; --ink-soft:#6B6585;
  --accent:#FF6F91; --accent-deep:#E2507A;
  --panel:#FFFFFF; --panel-edge:#E7E1F2;
  --sun:#FFC93C; --mint:#5CC9A7; --sky:#62B6F0;
  --display:"Mochiy Pop One","Hiragino Maru Gothic ProN","Zen Maru Gothic",system-ui,sans-serif;
  --body:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic",system-ui,sans-serif;
  --hand:"Klee One","Zen Maru Gothic",system-ui,sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{margin:0;background:var(--wall-low);color:var(--ink);font-family:var(--body);font-weight:700;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overflow:hidden;touch-action:manipulation;
  word-break:keep-all;overflow-wrap:anywhere}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.app{height:100%;height:100dvh;display:flex;flex-direction:column;max-width:760px;margin:0 auto;box-sizing:border-box;
  padding:max(6px,env(safe-area-inset-top,0px)) max(10px,env(safe-area-inset-right,0px)) max(6px,env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px));gap:6px}

/* ---------- top strip ---------- */
.top{display:flex;align-items:center;gap:8px;flex:none}
.iconbtn{width:42px;height:42px;border-radius:50%;background:var(--panel);font-size:20px;box-shadow:0 3px 0 var(--panel-edge);flex:none;display:grid;place-items:center}
.modechip{font-family:var(--display);font-size:13px;background:var(--sun);border-radius:999px;padding:6px 10px;white-space:nowrap}
.dots{flex:1;display:flex;gap:4px;justify-content:center;min-width:0}
.dots i{width:14px;height:14px;border-radius:50%;background:var(--panel);box-shadow:inset 0 2px 0 var(--panel-edge);flex:none;display:grid;place-items:center;font-style:normal;font-size:10px}
.dots i.now{outline:2px solid var(--accent);outline-offset:1px}
.dots i.first{background:var(--accent)}
.dots i.second{background:var(--sun)}
.dots i.miss{background:#B8B2C8}

/* ---------- stage ---------- */
.stagewrap{flex:1;min-height:0;container-type:size;display:grid;place-items:center}
.stage{position:relative;width:min(100cqw,100cqh*2/3);aspect-ratio:2/3;container-type:inline-size}
.stage svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.bubble{position:absolute;left:24%;top:37.5%;width:54%;min-height:12%;box-sizing:border-box;background:#fff;border-radius:18px;
  padding:2.4cqw 3.2cqw;font-size:4.3cqw;line-height:1.45;box-shadow:0 4px 0 rgba(58,53,82,.15);
  display:flex;align-items:center;justify-content:center;text-align:center;opacity:0;transform:scale(.9);transition:opacity .2s,transform .2s;pointer-events:none}
.bubble.show{opacity:1;transform:none}
.bubble::after{content:"";position:absolute;right:-3.6cqw;top:22%;border:2.2cqw solid transparent;border-left:4.4cqw solid #fff;border-right:0}
.bubble b{color:var(--accent-deep)}

/* svg character bits */
.kid .bob{transform-box:fill-box}
.kid.walking .bob{animation:bob .32s infinite}
.kid.walking .legL{animation:stepL .32s infinite}
.kid.walking .legR{animation:stepR .32s infinite}
.kid .armR{transform-box:fill-box;transform-origin:50% 8%;transition:transform .25s}
.kid.handup .armR{transform:rotate(180deg)}
.kid .face-happy{display:none}
.kid.happy .face-happy{display:inline}
.kid.happy .face-normal{display:none}
.kid.clap .armL,.kid.clap .armR{animation:clap .25s infinite}
.kid .you{animation:float 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-3px)}}
@keyframes stepL{50%{transform:translateY(-4px)}}
@keyframes stepR{0%,100%{transform:translateY(-4px)}50%{transform:none}}
@keyframes clap{50%{transform:rotate(-25deg)}}
@keyframes float{50%{transform:translateY(-3px)}}
.t-armL{transform-box:fill-box;transform-origin:50% 6%;transition:transform .35s}
#teacher.point .t-armL{transform:rotate(128deg)}
#teacher .m-open,#teacher .m-o{display:none}
#teacher.talk .m-smile{display:none}
#teacher.talk .m-open{display:inline}
#teacher.worry .m-smile,#teacher.worry .m-open{display:none}
#teacher.worry .m-o{display:inline}
#teacher.hop .t-inner{animation:hop .5s 2}
@keyframes hop{40%{transform:translateY(-8px)}}
.t-inner{transform-box:fill-box}
.chalkline{font-family:var(--hand);fill:var(--chalk)}
.stepword{font-family:var(--display);font-size:11px;fill:var(--ink-soft)}
.clapword{font-family:var(--display);font-size:12px;fill:var(--accent-deep);animation:rise 1s ease-out forwards}
@keyframes rise{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-22px)}}
.mark{fill:none;stroke-linecap:round;stroke-linejoin:round}

/* ---------- overlays ---------- */
.overlay{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:12px;box-sizing:border-box;
  background:rgba(58,53,82,.45);opacity:0;pointer-events:none;transition:opacity .25s}
.overlay.show{opacity:1;pointer-events:auto}
.card{background:var(--panel);border-radius:24px;width:min(100%,520px);max-height:100%;overflow:auto;box-sizing:border-box;padding:18px 16px;box-shadow:0 6px 0 rgba(0,0,0,.12);text-align:center}
.big{font-family:var(--display);font-size:22px;background:var(--accent);color:#fff;border-radius:999px;padding:12px 28px;box-shadow:0 5px 0 var(--accent-deep);min-height:52px}
.big:active{transform:translateY(3px);box-shadow:0 2px 0 var(--accent-deep)}
.big.sub{background:var(--sky);box-shadow:0 5px 0 #3F8FCB}
.big:disabled{opacity:.5}

/* title */
.title h1{font-family:var(--display);font-size:30px;margin:4px 0 2px;color:var(--board)}
.title .lead{margin:0 0 12px;color:var(--ink-soft);font-size:15px}
.title h2{font-size:15px;margin:14px 0 8px;color:var(--ink-soft)}
.modes{display:grid;gap:8px}
.modebtn{display:flex;align-items:center;gap:10px;border-radius:16px;padding:10px 14px;background:#F6F3FB;box-shadow:0 3px 0 var(--panel-edge);text-align:left}
.modebtn .eg{font-family:var(--hand);font-size:22px;background:var(--board);color:var(--chalk);border-radius:10px;padding:4px 10px;white-space:nowrap;flex:none}
.modebtn .mt{font-size:17px;line-height:1.3}
.modebtn .best{display:block;font-size:12px;color:var(--ink-soft);font-weight:500}
.modebtn[aria-pressed="true"]{background:#FFE6EE;box-shadow:0 0 0 3px var(--accent)}
.kids{display:flex;justify-content:center;gap:6px;flex-wrap:wrap}
.kidbtn{width:58px;border-radius:14px;padding:4px 0 6px;background:#F6F3FB;box-shadow:0 3px 0 var(--panel-edge);font-size:12px}
.kidbtn svg{width:50px;height:50px;display:block;margin:0 auto}
.kidbtn[aria-pressed="true"]{background:#FFE6EE;box-shadow:0 0 0 3px var(--accent)}
.title .big{margin-top:16px}

/* writer */
#writer{background:rgba(36,74,56,.6)}
.wpanel{background:var(--board);border:8px solid var(--frame);border-radius:18px;width:min(100%,520px);max-height:100%;overflow:auto;box-sizing:border-box;padding:12px 12px 14px;color:var(--chalk);text-align:center;box-shadow:0 6px 0 rgba(0,0,0,.25)}
.whead{font-family:var(--display);font-size:16px;margin-bottom:4px}
.wrow{padding:6px 0 10px;border-bottom:2px dashed rgba(255,255,255,.18)}
.wrow:last-of-type{border-bottom:0}
.wrow.done{opacity:.55}
.wq{font-family:var(--hand);font-size:40px;line-height:1.2}
.wline{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:4px}
.boxes{display:flex;gap:6px}
.boxwrap{position:relative;width:min(30vw,128px);aspect-ratio:1}
.boxwrap canvas{position:absolute;inset:0;width:100%;height:100%;border-radius:12px;background:rgba(255,255,255,.06);outline:3px dashed rgba(255,255,255,.4);outline-offset:-3px;touch-action:none}
.boxwrap .place{position:absolute;bottom:2px;left:0;right:0;font-size:11px;opacity:.55;pointer-events:none}
.wclear{background:rgba(255,255,255,.15);color:var(--chalk);border-radius:14px;padding:10px 10px;font-size:15px;min-width:54px;min-height:48px}
.wdoneMark{font-family:var(--hand);font-size:40px;color:var(--chalk-yellow)}
.wnote{font-size:13px;opacity:.75;margin:6px 0 10px}

/* hint */
.hint h2{font-family:var(--display);font-size:20px;margin:0 0 4px;color:var(--accent-deep)}
.hint .misread{font-size:14px;color:var(--ink-soft);margin:0 0 6px}
.hint svg{width:100%;height:auto;display:block;margin:4px 0}
.hint ol{text-align:left;margin:6px 0 12px;padding-left:1.6em;font-size:17px;line-height:1.6}
.hint ol li{opacity:0;transform:translateY(6px);transition:opacity .35s,transform .35s}
.hint ol li.on{opacity:1;transform:none}
.hint .eq{font-family:var(--hand);font-size:30px;margin:2px 0 8px}
.pop{opacity:0;transform-box:fill-box;transform-origin:center;transform:scale(.4);transition:opacity .25s,transform .25s}
.pop.on{opacity:1;transform:none}

/* result */
.result h1{font-family:var(--display);font-size:26px;margin:4px 0;color:var(--accent-deep)}
.result .score{font-family:var(--display);font-size:46px;margin:6px 0}
.result .stars{font-size:28px;letter-spacing:2px;margin:4px 0 10px;color:#F5B400}
.result .msg{font-size:17px;margin:0 0 14px}
.result .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}

@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <button class="iconbtn" id="homeBtn" aria-label="はじめの がめんへ">🏠</button>
    <span class="modechip" id="modeChip">1けた</span>
    <div class="dots" id="dots" aria-label="すすみぐあい"></div>
    <button class="iconbtn" id="voiceBtn" aria-label="せんせいの こえ" aria-pressed="true">🔊</button>
  </div>
  <div class="stagewrap">
    <div class="stage" id="stage">
      <svg viewBox="0 0 400 600" aria-label="きょうしつ" id="scene">
        <defs>
          <pattern id="planks" width="400" height="34" patternUnits="userSpaceOnUse">
            <rect width="400" height="34" fill="#D9A774"/>
            <line x1="0" y1="33" x2="400" y2="33" stroke="#C38F5C" stroke-width="2"/>
            <line x1="120" y1="0" x2="120" y2="33" stroke="#C38F5C" stroke-width="2"/>
            <line x1="300" y1="0" x2="300" y2="33" stroke="#C38F5C" stroke-width="2"/>
          </pattern>
        </defs>
        <!-- wall & floor -->
        <rect width="400" height="340" fill="#FCEFD9"/>
        <rect y="300" width="400" height="40" fill="#F3DEBE"/>
        <rect y="334" width="400" height="8" fill="#B98455"/>
        <rect y="342" width="400" height="258" fill="url(#planks)"/>
        <!-- clock -->
        <g transform="translate(352,52)">
          <circle r="22" fill="#fff" stroke="#9B6A3C" stroke-width="4"/>
          <g stroke="#3A3552" stroke-linecap="round"><line y2="-13" stroke-width="3"/><line x2="9" y2="4" stroke-width="3" id="clockHand"/></g>
          <circle r="2.5" fill="#FF6F91"/>
        </g>
        <!-- poster -->
        <g transform="translate(328,88)">
          <rect width="48" height="34" rx="4" fill="#fff" stroke="#E7E1F2" stroke-width="2"/>
          <text x="24" y="15" font-size="9" text-anchor="middle" font-family="var(--display)" fill="#FF6F91">がんばろう</text>
          <text x="24" y="28" font-size="10" text-anchor="middle" fill="#3A3552">1+1=2</text>
        </g>
        <!-- blackboard -->
        <g id="board">
          <rect x="10" y="26" width="300" height="196" rx="8" fill="#9B6A3C"/>
          <rect x="20" y="36" width="280" height="176" rx="4" fill="#2F5D46"/>
          <rect x="20" y="36" width="280" height="176" rx="4" fill="url(#boardShine)" opacity=".0"/>
          <path d="M30,48 Q90,40 150,52" stroke="rgba(255,255,255,.06)" stroke-width="18" fill="none" stroke-linecap="round"/>
          <rect x="14" y="220" width="292" height="9" rx="3" fill="#7A5230"/>
          <rect x="40" y="215" width="16" height="5" rx="2" fill="#fff"/>
          <rect x="62" y="215" width="12" height="5" rx="2" fill="#FFE36E"/>
          <rect x="80" y="215" width="12" height="5" rx="2" fill="#FF9B9B"/>
          <rect x="250" y="212" width="34" height="9" rx="2" fill="#4A6FA5"/><rect x="250" y="212" width="34" height="4" rx="2" fill="#E9E4D8"/>
          <text x="282" y="56" font-size="11" text-anchor="end" class="chalkline" opacity=".75" id="dateText"></text>
          <g id="boardText"></g>
          <g id="boardMarks"></g>
          <rect id="wiper" x="20" y="36" width="0" height="176" fill="#2F5D46"/>
        </g>
        <!-- desks & kids -->
        <g id="desks"></g>
        <!-- teacher -->
        <g id="teacher" transform="translate(352,342)">
          <g class="t-inner">
            <ellipse cx="0" cy="2" rx="30" ry="5" fill="rgba(0,0,0,.12)"/>
            <rect x="-12" y="-52" width="8" height="50" rx="3" fill="#F0C9A6"/>
            <rect x="4" y="-52" width="8" height="50" rx="3" fill="#F0C9A6"/>
            <path d="M-17,-4 h14 v4 a3,3 0 0 1 -3,3 h-11 a4,4 0 0 1 0,-7z" fill="#B8434F"/>
            <path d="M17,-4 h-14 v4 a3,3 0 0 0 3,3 h11 a4,4 0 0 0 0,-7z" fill="#B8434F"/>
            <path d="M-20,-104 L20,-104 L30,-46 Q0,-40 -30,-46Z" fill="#3E4C7A"/>
            <!-- right arm (down, holding book) -->
            <g>
              <rect x="17" y="-148" width="10" height="44" rx="5" fill="#F4A6B8"/>
              <circle cx="22" cy="-102" r="6" fill="#F7D3B5"/>
              <rect x="14" y="-112" width="22" height="16" rx="2" fill="#62B6F0" transform="rotate(-10 25 -104)"/>
            </g>
            <path d="M-23,-150 Q-28,-104 -22,-100 L22,-100 Q28,-104 23,-150 Q0,-160 -23,-150Z" fill="#F4A6B8"/>
            <path d="M-8,-156 L0,-140 L8,-156Z" fill="#fff"/>
            <line x1="0" y1="-140" x2="0" y2="-102" stroke="#E2879D" stroke-width="2"/>
            <circle cx="-4" cy="-128" r="2" fill="#fff"/><circle cx="-4" cy="-116" r="2" fill="#fff"/>
            <!-- left arm (toward the board, holds the pointer) -->
            <g class="t-armL">
              <rect x="-27" y="-148" width="10" height="44" rx="5" fill="#F4A6B8"/>
              <line x1="-22" y1="-102" x2="-22" y2="-62" stroke="#8B5A2B" stroke-width="2.5" stroke-linecap="round"/>
              <circle cx="-22" cy="-102" r="6" fill="#F7D3B5"/>
            </g>
            <rect x="-5" y="-166" width="10" height="12" fill="#F7D3B5"/>
            <g transform="translate(0,-186)">
              <circle cx="0" cy="-26" r="11" fill="#6B3E26"/>
              <path d="M-27,4 Q-30,-28 0,-28 Q30,-28 27,4 Q26,16 18,20 L-18,20 Q-26,16 -27,4Z" fill="#6B3E26"/>
              <circle r="22" fill="#F7D3B5"/>
              <path d="M-23,-2 Q-24,-24 0,-24 Q24,-24 23,-2 Q14,-14 2,-12 Q-6,-16 -23,-2Z" fill="#6B3E26"/>
              <ellipse cx="-13" cy="9" rx="4.5" ry="3" fill="#FFB3C4" opacity=".8"/>
              <ellipse cx="13" cy="9" rx="4.5" ry="3" fill="#FFB3C4" opacity=".8"/>
              <circle cx="-8.5" cy="1" r="2.2" fill="#3A3552"/><circle cx="8.5" cy="1" r="2.2" fill="#3A3552"/>
              <g fill="rgba(255,255,255,.25)" stroke="#5A3B2E" stroke-width="2"><circle cx="-8.5" cy="1" r="6.5"/><circle cx="8.5" cy="1" r="6.5"/></g>
              <path d="M-2,1 Q0,-1 2,1" stroke="#5A3B2E" stroke-width="2" fill="none"/>
              <path class="m-smile" d="M-5,11 Q0,15 5,11" stroke="#B8434F" stroke-width="2.2" fill="none" stroke-linecap="round"/>
              <path class="m-open" d="M-5,10 Q0,17 5,10Z" fill="#B8434F"/>
              <ellipse class="m-o" cx="0" cy="12" rx="2.6" ry="3" fill="#B8434F"/>
            </g>
          </g>
        </g>
        <g id="walkLayer"></g>
      </svg>
      <div class="bubble" id="bubble" aria-live="polite"></div>
    </div>
  </div>
</div>

<!-- title -->
<div class="overlay show" id="titleOv">
  <div class="card title">
    <h1>さんすうの じかん</h1>
    <p class="lead">せんせいの もんだいを こくばんで とこう!</p>
    <h2>どの もんだいに する?</h2>
    <div class="modes" id="modes"></div>
    <h2>あなたは どの こ?</h2>
    <div class="kids" id="kidPick"></div>
    <button class="big" id="startBtn">じゅぎょう はじめ!</button>
  </div>
</div>

<!-- writer -->
<div class="overlay" id="writer">
  <div class="wpanel" role="dialog" aria-label="こたえを かく">
    <div class="whead">こたえを ゆびで かいてね ✏️</div>
    <div id="wrows"></div>
    <div class="wnote" id="wnote"></div>
    <button class="big" id="wdone">かけた!</button>
  </div>
</div>

<!-- hint -->
<div class="overlay" id="hintOv">
  <div class="card hint" role="dialog" aria-label="せんせいの ヒント">
    <h2 id="hintTitle">せんせいの ヒント</h2>
    <p class="misread" id="hintRead"></p>
    <div id="hintPic"></div>
    <ol id="hintSteps"></ol>
    <button class="big" id="hintBtn">わかった! もういちど かく</button>
  </div>
</div>

<!-- result -->
<div class="overlay" id="resultOv">
  <div class="card result">
    <h1 id="resTitle">じゅぎょう おしまい!</h1>
    <div class="score" id="resScore"></div>
    <div class="stars" id="resStars"></div>
    <p class="msg" id="resMsg"></p>
    <div class="row">
      <button class="big" id="againBtn">もういちど</button>
      <button class="big sub" id="menuBtn">ほかの もんだい</button>
    </div>
  </div>
</div>

<script>

const NET = (() => {
  const raw = Uint8Array.from(atob(NET_JSON.b64), c => c.charCodeAt(0)).buffer;
  const out = {}; let off = 0;
  for (const [name, shape, scale, kind] of NET_JSON.meta) {
    const n = shape.reduce((a, b) => a * b, 1);
    const arr = new Float32Array(n);
    if (kind === "i8") { const v = new Int8Array(raw, off, n); for (let i = 0; i < n; i++) arr[i] = v[i] * scale; off += n; }
    else { const v = new Float32Array(raw.slice(off, off + n * 4)); arr.set(v); off += n * 4; }
    while (off % 4) off++;
    out[name] = arr;
  }
  return out;
})();

  $("#resStars").textContent = "★".repeat(first) + "☆".repeat(10 - first);
  $("#resMsg").textContent = first === 10 ? "ぜんぶ 1かいで せいかい! すごい!" : first >= 7 ? "とっても よく できました!" : first >= 4 ? "よく がんばったね! つぎも ちょうせんしよう" : "ヒントを みて れんしゅうすれば きっと できるよ!";
  $("#resTitle").textContent = first === 10 ? "はなまる ひゃくてん!" : "じゅぎょう おしまい!";
  $("#resultOv").classList.add("show");
  sfx.hana();
}

/* ================= title ================= */
let selMode = store.get("mode", "one"), selKid = store.get("kid", 0);
if (!MODES[selMode]) selMode = "one";
function renderTitle() {
  $("#modes").innerHTML = Object.entries(MODES).map(([k, m]) => {
    const b = store.get("best:" + k, null);
    return `<button class="modebtn" data-mode="${k}" aria-pressed="${k === selMode}"><span class="eg">${m.eg}</span><span class="mt">${m.label}<span class="best">${b == null ? "まだ やってないよ" : `いちばん: ★${b}`}</span></span></button>`;
  }).join("");
  $("#kidPick").innerHTML = KIDS.map((k, i) => `<button class="kidbtn" data-kid="${i}" aria-pressed="${i === selKid}"><svg viewBox="-22 -24 44 44">${kidFace(k)}</svg>${k.name}</button>`).join("");
  $("#modes").querySelectorAll("button").forEach(b => b.onclick = () => { selMode = b.dataset.mode; store.set("mode", selMode); sfx.pop(); renderTitle(); });
  $("#kidPick").querySelectorAll("button").forEach(b => b.onclick = () => { selKid = +b.dataset.kid; store.set("kid", selKid); sfx.pop(); renderTitle(); });
}
function toTitle() {
  runId++; game = null; hush();
  try { speechSynthesis.cancel(); } catch {}
  ["#writer", "#hintOv", "#resultOv"].forEach(s => $(s).classList.remove("show"));
  boardText.innerHTML = ""; boardMarks.innerHTML = ""; $("#dots").innerHTML = "";
  buildClass(selKid); renderTitle();
  $("#titleOv").classList.add("show");
}
$("#startBtn").onclick = () => { ac(); $("#titleOv").classList.remove("show"); runGame(); };
$("#homeBtn").onclick = toTitle;
$("#againBtn").onclick = () => { $("#resultOv").classList.remove("show"); runGame(); };
$("#menuBtn").onclick = toTitle;
function renderVoice() { const b = $("#voiceBtn"); b.textContent = voiceOn ? "🔊" : "🔈"; b.setAttribute("aria-pressed", voiceOn); }
$("#voiceBtn").onclick = () => { voiceOn = !voiceOn; store.set("voice", voiceOn); if (!voiceOn) try { speechSynthesis.cancel(); } catch {} renderVoice(); };
renderVoice();
(function dateAndClock() {
  const d = new Date(), wd = "にちげつかすいもくきんど"[d.getDay()];
  $("#dateText").textContent = `${d.getMonth() + 1}がつ ${d.getDate()}にち`;
  const a = (d.getHours() % 12 + d.getMinutes() / 60) / 12 * Math.PI * 2;
  $("#clockHand").setAttribute("x2", (Math.sin(a) * 9).toFixed(1)); $("#clockHand").setAttribute("y2", (-Math.cos(a) * 9).toFixed(1));
})();
buildClass(selKid); renderTitle();
window.__sansu = { recognize, strokesToInput };
</script>
