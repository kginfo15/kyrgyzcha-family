<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<!--KM:HEAD-START-->
<title>Kyrgyz Monitor</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#0d1520">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230d1520'/%3E%3Cpath d='M5 23l7-10 5 6 4-5 6 9z' fill='%2366d1dd'/%3E%3Ccircle cx='23' cy='9' r='2.5' fill='%23f0b84a'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+JP:wght@400;500;600;700&display=swap">
<style>
/* Layout: a console - a dense status band on top, a sector matrix, then feeds in columns.
   Glacier cyan for cooperation, tunduk gold for government, flag red for Japan. */
:root{
  --bg:#eef1f5; --panel:#ffffff; --panel2:#f6f8fb; --ink:#0d1520; --sub:#4a5668; --faint:#7f8a9b; --line:#dbe1e9;
  --band:#0d1520; --band2:#162231; --band-ink:#e8edf3; --band-sub:#8ea0b6;
  --accent:#0a7f93; --accent-soft:#e1f2f5;
  --gov:#a36500; --gov-soft:#fbf0db; --coop:#0a7f93; --coop-soft:#e1f2f5; --jp:#c8343c; --jp-soft:#fbe6e7;
  --press:#5a6578; --press-soft:#edf0f4;
  --act:#13804f; --pipe:#9a6b00; --closed:#7f8a9b;
  --spark:#0a7f93; --spark-fill:rgba(10,127,147,.14); --bar:#9cc9d2; --hot:#c8343c;
  --d1:#2a78d6; --d2:#eb6834; --d3:#1baf7a; --d4:#6250d6; --d5:#e87ba4; --d6:#008300; --d7:#e34948; --dother:#a7afbb;
  --sans:"IBM Plex Sans","IBM Plex Sans JP","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0a1018; --panel:#111a25; --panel2:#0e1620; --ink:#e6ebf2; --sub:#a1adbe; --faint:#6f7d90; --line:#1f2b3a;
    --band:#070c13; --band2:#0f1822; --band-ink:#e6ebf2; --band-sub:#7d8ea4;
    --accent:#66d1dd; --accent-soft:#11303a;
    --gov:#f0b84a; --gov-soft:#2e2412; --coop:#66d1dd; --coop-soft:#10303a; --jp:#ff6b72; --jp-soft:#3a171b;
    --press:#a9b4c4; --press-soft:#1b2532;
    --act:#5ad39a; --pipe:#f0b84a; --closed:#7f8a9b;
    --spark:#66d1dd; --spark-fill:rgba(102,209,221,.13); --bar:#2c6e7a; --hot:#ff6b72; color-scheme:dark;
    --d1:#3987e5; --d2:#d95926; --d3:#199e70; --d4:#9085e9; --d5:#d55181; --d6:#008300; --d7:#e66767; --dother:#5d6878;
  }
}
:root[data-theme="dark"]{
  --bg:#0a1018; --panel:#111a25; --panel2:#0e1620; --ink:#e6ebf2; --sub:#a1adbe; --faint:#6f7d90; --line:#1f2b3a;
  --band:#070c13; --band2:#0f1822; --band-ink:#e6ebf2; --band-sub:#7d8ea4;
  --accent:#66d1dd; --accent-soft:#11303a;
  --gov:#f0b84a; --gov-soft:#2e2412; --coop:#66d1dd; --coop-soft:#10303a; --jp:#ff6b72; --jp-soft:#3a171b;
  --press:#a9b4c4; --press-soft:#1b2532;
  --act:#5ad39a; --pipe:#f0b84a; --closed:#7f8a9b;
  --spark:#66d1dd; --spark-fill:rgba(102,209,221,.13); --bar:#2c6e7a; --hot:#ff6b72; color-scheme:dark;
    --d1:#3987e5; --d2:#d95926; --d3:#199e70; --d4:#9085e9; --d5:#d55181; --d6:#008300; --d7:#e66767; --dother:#5d6878;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14.5px/1.6 var(--sans);-webkit-text-size-adjust:100%;
  padding-bottom:calc(40px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--band)}
a{color:var(--accent)}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.mono{font-family:var(--mono)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* ---- top band ---- */
header.top{background:var(--band);color:var(--band-ink);position:sticky;top:env(safe-area-inset-top,0px);z-index:20;border-bottom:1px solid var(--band2)}
.bar1{display:flex;align-items:center;gap:14px;padding-block:10px 6px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:9px;cursor:pointer;border:0;background:none;color:inherit;padding:0}
.logo svg{width:26px;height:26px;flex:none}
.logo b{font-family:var(--mono);font-weight:600;letter-spacing:.18em;font-size:13.5px}
.logo span{font-size:11.5px;color:var(--band-sub);letter-spacing:.02em}
.status{margin-left:auto;display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:11.5px;color:var(--band-sub);white-space:nowrap}
.live{width:7px;height:7px;border-radius:50%;background:#5ad39a;box-shadow:0 0 0 3px rgba(90,211,154,.18)}
.live.stale{background:#f0b84a;box-shadow:0 0 0 3px rgba(240,184,74,.18)}
.tbtn{border:1px solid var(--band2);background:var(--band2);color:var(--band-ink);border-radius:6px;padding:3px 9px;font-size:11.5px;cursor:pointer;font-family:var(--mono);letter-spacing:.04em}
.tbtn[aria-pressed="false"]{opacity:.55;text-decoration:line-through}
.bar2{flex:1;min-width:0;display:flex;margin:0;max-width:560px}
@media (max-width:760px){.bar2{order:3;flex-basis:100%;max-width:none}}
.snap{font-size:10px;border:1px solid var(--band2);border-radius:3px;padding:0 4px;margin-right:4px;cursor:help}
.search{flex:1;min-width:0;position:relative}
.search input{width:100%;border:1px solid var(--band2);border-radius:7px;padding:7px 12px 7px 32px;background:var(--band2);color:var(--band-ink);font-size:13.5px}
.search input::placeholder{color:var(--band-sub)}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:14px;height:14px;stroke:var(--band-sub)}
nav.tabs{display:flex;gap:0;overflow-x:auto;scrollbar-width:none;margin-bottom:-1px}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{background:none;border:0;color:var(--band-sub);padding:8px 13px 9px;cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent;font-size:13.5px}
nav.tabs button:hover{color:var(--band-ink)}
nav.tabs button.on{color:var(--band-ink);border-bottom-color:var(--accent);font-weight:600}

main{padding-top:18px}
.sec-h{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:26px 0 10px}
.sec-h h2{margin:0;font-size:15px;font-weight:700;letter-spacing:.01em;text-wrap:balance}
.sec-h .k{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;color:var(--faint);text-transform:uppercase}
.sec-h .sp{flex:1}
.sec-h a,.linkbtn{font-size:12.5px;color:var(--accent);background:none;border:0;cursor:pointer;padding:0;text-decoration:none}
.note{color:var(--sub);font-size:12.5px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px}

/* ---- KPI band ---- */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--line);border-radius:8px;background:var(--panel);overflow:hidden}
.kpi{padding:12px 16px;border-left:1px solid var(--line);min-width:0}
.kpi:first-child{border-left:0}
.kpi .l{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;color:var(--faint);text-transform:uppercase}
.kpi .v{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:26px;font-weight:500;line-height:1.25;margin-top:2px}
.kpi .s{font-size:12px;color:var(--sub)}
.kpi .v small{font-size:13px;color:var(--sub);margin-left:4px}
@media (max-width:720px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.kpi:nth-child(3){border-left:0}.kpi:nth-child(n+3){border-top:1px solid var(--line)}}

/* ---- sector matrix ---- */
.matrix{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:11px 12px 10px;cursor:pointer;text-align:left;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto auto auto auto 1fr;align-content:start;gap:7px;min-width:0;line-height:1.4;transition:border-color .15s,transform .15s}
.tile:hover,.tile:focus-visible{border-color:var(--accent);transform:translateY(-1px)}
.fav{margin-left:auto;border:0;background:none;cursor:pointer;color:var(--faint);font-size:15px;line-height:1;padding:0 2px;flex:none}
.fav:hover{color:var(--gov)} .fav.on{color:var(--gov)}
.tile .top{display:flex;align-items:baseline;gap:7px;min-width:0}
.tile .no{font-family:var(--mono);font-size:10.5px;color:var(--faint);flex:none}
.tile .nm{font-weight:600;font-size:13.5px;line-height:1.35;flex:1;min-width:0}
.tile .hot{font-family:var(--mono);font-size:10.5px;color:var(--hot);font-weight:600;flex:none}
.tile .mid{display:flex;align-items:flex-end;gap:10px}
.tile .big{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:24px;font-weight:500;line-height:1}
.tile .big small{font-size:10.5px;color:var(--faint);margin-left:3px;font-weight:400}
.tile svg.sp{flex:1;height:30px;min-width:0}
.mix{display:flex;height:4px;border-radius:2px;overflow:hidden;background:var(--press-soft)}
.mix i{display:block}
.mix .g{background:var(--gov)} .mix .c{background:var(--coop)} .mix .j{background:var(--jp)}
.tile .tf{display:flex;align-items:flex-end;gap:10px;font-family:var(--mono);font-size:11px;color:var(--sub);flex-wrap:wrap}
.tile .tf b{font-weight:600;color:var(--ink)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--sub);margin-top:8px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:-1px}

/* ---- columns ---- */
.cols{display:grid;gap:18px;grid-template-columns:minmax(0,1fr)}
@media (min-width:940px){.cols{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.cols.c3{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr)}}

/* ---- hot list ---- */
.rank{list-style:none;margin:0;padding:0}
.rank li{display:grid;grid-template-columns:22px minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:9px 12px;border-top:1px solid var(--line);cursor:pointer}
.rank li:first-child{border-top:0}
.rank li:hover{background:var(--panel2)}
.rank .i{font-family:var(--mono);font-size:11px;color:var(--faint)}
.rank .n{font-weight:600;font-size:13.5px}
.rank .c{font-family:var(--mono);font-size:12px;color:var(--sub)}
.rank .d{font-family:var(--mono);font-size:12px;font-weight:600;color:var(--hot);min-width:52px;text-align:right}
.rank .d.down{color:var(--faint);font-weight:400}

/* ---- filters ---- */
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:9px;margin-bottom:8px;background:var(--panel);border:1px solid var(--line);border-radius:8px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--panel2)}
.seg button{border:0;background:none;padding:4px 10px;cursor:pointer;font-size:12.5px;color:var(--sub)}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--ink);color:var(--panel);font-weight:600}
select,.filters input{border:1px solid var(--line);background:var(--panel2);border-radius:6px;padding:4px 8px;font-size:12.5px;max-width:100%;min-width:0}
.filters input{flex:1;min-width:130px}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:4px 10px;font-size:12px;cursor:pointer;color:var(--ink);font-family:var(--mono);letter-spacing:.04em}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.on{border-color:var(--gov);color:var(--gov)}
.count{font-family:var(--mono);font-size:11.5px;color:var(--sub);margin:6px 2px 8px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.count .sp{flex:1}

/* ---- feed ---- */
.list{display:flex;flex-direction:column}
.feed{background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.day{font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:var(--faint);padding:14px 2px 6px}
.feed .day{padding:8px 14px;background:var(--panel2);border-top:1px solid var(--line)}
.feed .day:first-child{border-top:0}
.it{padding:11px 44px 11px 14px;position:relative;border-top:1px solid var(--line);min-width:0}
.feed .it:first-child,.feed .day+.it{border-top:0}
.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:11.5px;color:var(--faint)}
.meta .t{font-family:var(--mono)}
.meta .src{color:var(--sub)}
.tag{display:inline-block;font-family:var(--mono);font-size:10px;letter-spacing:.08em;padding:1px 6px;border-radius:3px;font-weight:600;line-height:1.6;text-transform:uppercase}
.tag.gov{background:var(--gov-soft);color:var(--gov)}
.tag.coop{background:var(--coop-soft);color:var(--coop)}
.tag.jp{background:var(--jp-soft);color:var(--jp)}
.tag.press{background:var(--press-soft);color:var(--press)}
.tag.lang{border:1px solid var(--line);color:var(--faint);font-weight:500}
.don{font-size:11.5px;color:var(--coop);font-weight:600}
.don.jp{color:var(--jp)}
.it h3{font-size:14.5px;margin:3px 0 1px;line-height:1.5;font-weight:600;text-wrap:pretty}
.it h3 a{color:var(--ink);text-decoration:none}
.it h3 a:hover{color:var(--accent)}
.it .orig{font-size:12px;color:var(--faint);margin:0;overflow-wrap:anywhere}
.it .orig a{color:var(--faint)}
.it .also{font-size:11.5px;color:var(--faint);margin:4px 0 0}
.it .also a{color:var(--sub)}
.it .lead{font-size:12.5px;color:var(--sub);margin:4px 0 0}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.chip{font-size:11px;border:1px solid var(--line);border-radius:4px;padding:0 6px;color:var(--sub);background:var(--panel2);cursor:pointer;line-height:1.75}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.chip .n{font-family:var(--mono);color:var(--faint);margin-left:3px}
.star{position:absolute;top:9px;right:10px;border:0;background:none;cursor:pointer;padding:3px;color:var(--faint);line-height:0}
.star svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.6}
.star.on{color:var(--gov)} .star.on svg{fill:currentColor}
.more{display:block;margin:12px auto;padding:7px 18px}
.empty{padding:28px 16px;text-align:center;color:var(--sub)}

/* ---- projects ---- */
.pj{padding:11px 14px;border-top:1px solid var(--line);min-width:0}
.feed .pj:first-child{border-top:0}
.pj .row1{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:11.5px;color:var(--sub)}
.st{font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.08em;padding:0 6px;border-radius:3px;border:1px solid currentColor;line-height:1.7}
.st-active{color:var(--act)} .st-pipeline{color:var(--pipe)} .st-closed,.st-dropped,.st-suspended{color:var(--closed)}
.pj h3{font-size:14px;margin:4px 0 1px;line-height:1.5;font-weight:600}
.pj h3 a{color:var(--ink);text-decoration:none}
.pj h3 a:hover{color:var(--accent)}
.pj .amt{font-family:var(--mono);font-weight:600;color:var(--ink)}
.pj .per{font-family:var(--mono)}
.pj .desc{font-size:12.5px;color:var(--sub);margin:3px 0 0}
.timeline{height:4px;background:var(--press-soft);border-radius:2px;margin-top:7px;position:relative;overflow:hidden}
.timeline i{position:absolute;top:0;bottom:0;background:var(--act);border-radius:2px;opacity:.75}

/* ---- sector / donor head ---- */
.shead{padding:16px;display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
@media (min-width:860px){.shead{grid-template-columns:minmax(0,1fr) auto;align-items:end}}
.shead .k{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;color:var(--faint);text-transform:uppercase}
.shead h2{margin:2px 0 0;font-size:21px;font-weight:700;letter-spacing:.01em}
.minis{display:flex;gap:22px;flex-wrap:wrap}
.mini .v{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:22px;font-weight:500;line-height:1.2}
.mini .l{font-size:11.5px;color:var(--sub)}
.chart{padding:14px 16px}
.chart svg{width:100%;height:120px;display:block}
.chart text{font-family:var(--mono);font-size:10px;fill:var(--faint)}
.subtabs{display:flex;gap:4px;flex-wrap:wrap;margin:16px 0 10px;border-bottom:1px solid var(--line)}
.subtabs button{border:0;background:none;padding:7px 11px 9px;font-size:13px;cursor:pointer;color:var(--sub);border-bottom:2px solid transparent;margin-bottom:-1px}
.subtabs button.on{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.subtabs button span{font-family:var(--mono);font-size:11px;color:var(--faint);margin-left:5px}
.dons{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}

/* ---- donors ---- */
.tablewrap{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:8px;margin-bottom:14px}
.dtab{width:100%;border-collapse:collapse;font-size:13px}
.dtab th,.dtab td{padding:8px 12px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
.dtab tr:last-child td{border-bottom:0}
.dtab th:first-child,.dtab td:first-child{text-align:left}
.dtab th{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;color:var(--faint);font-weight:500;text-transform:uppercase;background:var(--panel2)}
.dtab td{font-family:var(--mono);font-variant-numeric:tabular-nums}
.dtab td:first-child{font-family:var(--sans);font-weight:500}
.dtab tr.click{cursor:pointer}
.dtab tr.click:hover td{background:var(--panel2)}
.dtab .barcell{width:22%;min-width:90px}
.hbar{height:6px;background:var(--press-soft);border-radius:3px;overflow:hidden}
.hbar i{display:block;height:100%;background:var(--coop)}
.dtab tr.jp .hbar i{background:var(--jp)}

/* ---- cooperation charts ---- */
.dn{display:grid;grid-template-columns:minmax(0,180px) minmax(0,1fr);gap:16px;align-items:center;margin-top:10px}
@media (max-width:520px){.dn{grid-template-columns:minmax(0,1fr)}.dn svg{max-width:200px;margin:0 auto}}
.dn svg{width:100%;height:auto;display:block}
.dn svg path{stroke:var(--panel);stroke-width:2;cursor:pointer}
.dn svg path:hover{opacity:.82}
.dn .ct{font-family:var(--mono);fill:var(--ink);font-size:17px;font-weight:500}
.dn .cl{font-family:var(--sans);fill:var(--faint);font-size:9.5px}
.lg{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px;min-width:0}
.lg li{display:grid;grid-template-columns:10px minmax(0,1fr) auto auto;gap:8px;align-items:center;padding:3px 4px;border-radius:4px;font-size:12.5px;cursor:pointer}
.lg li:hover{background:var(--panel2)}
.lg li.nolink{cursor:default}
.lg i{width:10px;height:10px;border-radius:2px;display:block}
.lg .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lg .pc{font-family:var(--mono);font-weight:600;font-variant-numeric:tabular-nums}
.lg .vv{font-family:var(--mono);color:var(--faint);font-size:11.5px;min-width:56px;text-align:right;font-variant-numeric:tabular-nums}
.ctrls{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:8px}
.panel h3.ph{margin:0;font-size:13.5px;font-weight:700}
.panel .phk{font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--faint);text-transform:uppercase}
.ych svg{width:100%;height:150px;display:block;margin-top:8px}
.ych text{font-family:var(--mono);font-size:9.5px;fill:var(--faint)}
.ych rect.b{fill:var(--coop)}
.ych rect.b.now{fill:var(--accent)}
.ych rect.hit{fill:transparent;cursor:default}
.ych rect.hit:hover+rect.b,.ych g:hover rect.b{opacity:.75}
.sharebar{display:flex;height:6px;border-radius:3px;overflow:hidden;background:var(--press-soft);gap:1px}
.sharebar i{display:block;height:100%}
.tile .drs{display:flex;flex-direction:column;gap:3px;min-height:54px}
.tile .dr{display:grid;grid-template-columns:minmax(0,1fr) 46px 34px;gap:6px;align-items:center;font-size:11.5px}
.tile .dn2{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--sub)}
.tile .db{height:5px;background:var(--press-soft);border-radius:3px;overflow:hidden}
.tile .db i{display:block;height:100%;background:var(--coop)}
.tile .dp{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right;color:var(--ink)}
.tile .jline{font-size:11px;color:var(--sub);font-family:var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .jline b{color:var(--d7)}
.tile .cap{font-size:11px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .amt{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:22px;font-weight:500;line-height:1.1}
.tile .amt small{display:block;font-size:11px;color:var(--faint);font-weight:400;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.unk{font-size:10.5px;color:var(--faint);border:1px dashed var(--faint);border-radius:3px;padding:0 5px;line-height:1.6}
.kind{font-size:11px;color:var(--sub);border:1px solid var(--line);border-radius:3px;padding:0 5px;line-height:1.6}
.foot{margin:34px 0 0;font-size:12px;color:var(--faint);line-height:1.8;border-top:1px solid var(--line);padding-top:14px}
mark.hl{background:var(--gov-soft);color:inherit;border-radius:2px;padding:0 1px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:7px 14px;border-radius:6px;font-size:12.5px;z-index:40}
@media (max-width:560px){
  .logo span{display:none}
  .matrix{grid-template-columns:repeat(2,minmax(0,1fr))}
  .tile .big{font-size:20px}
  .status .ut{display:none}
}
@media (prefers-reduced-motion:reduce){.tile{transition:none}.tile:hover{transform:none}}
</style>
<!--KM:HEAD-END-->
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="bar1">
      <button class="logo" id="home" type="button" aria-label="ホーム">
        <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="7" fill="#162231"/><path d="M5 23l7-10 5 6 4-5 6 9z" fill="#66d1dd"/><circle cx="23" cy="9" r="2.5" fill="#f0b84a"/></svg>
        <b>KYRGYZ MONITOR</b>
      </button>
      <form class="bar2" id="sform" role="search">
        <label class="search"><svg viewBox="0 0 24 24" fill="none" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
          <input id="q" type="search" placeholder="キーワード検索（日本語・ロシア語・英語）" autocomplete="off"></label>
      </form>
      <div class="status">
        <i class="live" id="live"></i><span class="ut" id="upd">—</span>
        <button class="tbtn" id="jica" type="button" aria-pressed="true" title="JICA・日本の協力を表示">JP</button>
        <button class="tbtn" id="theme" type="button" title="表示テーマ">◐</button>
      </div>
    </div>
    <nav class="tabs" id="tabs">
      <button data-v="home">概況</button>
      <button data-v="feed">ニュース</button>
      <button data-v="projects">協力案件</button>
      <button data-v="donors">援助機関</button>
      <button data-v="saved">保存</button>
    </nav>
  </div>
</header>
<main class="wrap" id="main"><div class="empty">読み込み中…</div></main>

<script>
"use strict";
const BASE = "https://raw.githubusercontent.com/yuuuta21/kyrgyzcha-family/sector-data/";
const EMBED = window.KM_DATA || null;   // snapshot carried inside the page (claude.ai version)
const TZ = "Asia/Bishkek";
const SECTORS = [
  ["urban","都市・地域開発"],["transport","運輸交通"],["energy","資源・エネルギー"],["private","民間セクター開発"],
  ["agri","農業・農村開発"],["health","保健医療"],["nutrition","栄養改善"],["education","教育"],
  ["social","社会保障・障害と開発"],["sports","スポーツと開発"],["peace","平和構築"],["governance","ガバナンス"],
  ["finance","公共財政・金融システム"],["gender","ジェンダー平等"],["digital","デジタル化"],["climate","気候変動"],
  ["nature","自然環境保全"],["envmgmt","環境管理"],["water","水資源・水供給"],["drr","防災・災害リスク削減"],
];
const SEC = Object.fromEntries(SECTORS.map(([id,ja],i)=>[id,{id,ja,no:String(i+1).padStart(2,"0")}]));
const DGROUP = {japan:"日本",mdb:"国際開発金融機関",un:"国連・国際機関",bilateral:"二国間",fund:"基金",ngo:"財団・NGO"};
const JP_IDS = new Set(["jica","jp"]);
let DONORS = {};
const ST_JA = {active:"実施中",pipeline:"計画中",closed:"終了",dropped:"中止",suspended:"中断"};
const PERIODS = [[7,"7日"],[30,"30日"],[90,"90日"],[365,"1年"],[0,"全期間"]];
const DAY = 864e5;

const esc = s => String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $ = s => document.querySelector(s);
function lsGet(k,d){ try{ const v = JSON.parse(localStorage.getItem(k)); return v==null?d:v; }catch(e){ return d; } }
function lsSet(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
function toast(msg){ const t = document.createElement("div"); t.className="toast"; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),2200); }

/* ---------- theme / JICA switch ---------- */
function applyTheme(t){ if(t) document.documentElement.setAttribute("data-theme",t); else document.documentElement.removeAttribute("data-theme"); }
applyTheme(lsGet("km-theme",null));
$("#theme").onclick = ()=>{ const c = lsGet("km-theme",null), n = c==null?"dark":c==="dark"?"light":null; lsSet("km-theme",n); applyTheme(n); };
let SHOW_JP = lsGet("km-jp", true);
// favourite sectors ("マイ分野"): pinned to the top of the overview and usable as a news filter
let FAV = new Set(lsGet("km-fav", []));
function toggleFav(id){ FAV.has(id) ? FAV.delete(id) : FAV.add(id); lsSet("km-fav", [...FAV]); }
const favStar = id => `<button class="fav ${FAV.has(id)?"on":""}" data-fav="${id}" title="${FAV.has(id)?"マイ分野から外す":"マイ分野に追加"}" aria-label="マイ分野">${FAV.has(id)?"★":"☆"}</button>`;
function syncJP(){ $("#jica").setAttribute("aria-pressed", String(SHOW_JP)); $("#jica").title = SHOW_JP ? "JICA・日本の協力を表示中（押すと隠す）" : "JICA・日本の協力を隠しています（押すと表示）"; }
syncJP();
$("#jica").onclick = ()=>{ SHOW_JP = !SHOW_JP; lsSet("km-jp", SHOW_JP); syncJP(); toast(SHOW_JP?"JICA・日本の協力を表示":"JICA・日本の協力を非表示"); render(); };

/* ---------- state & routing ---------- */
const DEF = {v:"home", s:"", t:"all", p:90, d:"", q:"", ps:"active", psort:"start", sub:"pa", k:"", my:""};
// chart switches (not part of the address): donut scope/metric/range, year chart metric
const CH = Object.assign({scope:"donor", metric:"amt", range:"active", ym:"amt"}, lsGet("km-charts", {}));
if(CH.ym!=="amt" && CH.ym!=="n") CH.ym = "amt";
if(CH.range[0]==="y" && +CH.range.slice(1) > new Date().getFullYear()) CH.range = "active";
const S = {...DEF};
const PAGE = 50;
let shown = PAGE;
function readHash(){
  const h = new URLSearchParams(EMBED ? "" : location.hash.slice(1));
  for(const k of Object.keys(DEF)) S[k] = h.has(k) ? h.get(k) : DEF[k];
  S.p = +S.p || (h.get("p")==="0" ? 0 : DEF.p);
}
function go(patch, push=true){
  Object.assign(S, patch); shown = PAGE;
  if(!EMBED){
    const h = new URLSearchParams();
    for(const k of Object.keys(DEF)) if(String(S[k])!==String(DEF[k])) h.set(k,S[k]);
    const str = h.toString(), url = str ? "#"+str : location.pathname+location.search;
    push ? history.pushState(null,"",url) : history.replaceState(null,"",url);
  }
  render(); if(push) window.scrollTo(0,0);
}
window.addEventListener("popstate", ()=>{ if(EMBED) return; readHash(); shown=PAGE; render(); });

/* ---------- data ---------- */
let INDEX = null, ITEMS = [], PROJECTS = null, loadedYears = new Set(), loadErr = "";
let saved = lsGet("km-saved", {});
async function getJSON(name){
  if(EMBED){
    if(name==="index.json") return EMBED.index;
    if(name==="projects.json") return EMBED.projects;
    const y = (name.match(/items-(\d+)/)||[])[1];
    return {items:(EMBED.items||[]).filter(x=>(x.p||"").startsWith(y))};
  }
  const r = await fetch(BASE+name, {cache:"no-cache"});
  if(!r.ok) throw new Error("HTTP "+r.status);
  return r.json();
}
function prep(x){
  x.ts = Date.parse(x.p) || 0; x.c = x.c||[]; x.d = x.d||[];
  x.jp = x.d.some(d=>JP_IDS.has(d));
  x.k = ((x.t||"")+" "+(x.tj||"")+" "+(x.l||"")+" "+(x.lj||"")+" "+(x.s||"")).toLowerCase();
  return x;
}
async function loadYear(y){
  if(loadedYears.has(y)) return;
  loadedYears.add(y);
  const d = await getJSON("items-"+y+".json");
  const have = new Set(ITEMS.map(x=>x.i));
  // items the AI judged off-topic (ads, crime blotter, passing mentions) are kept in the data but not shown
  for(const x of d.items||[]) if(!have.has(x.i) && !x.hide) ITEMS.push(prep(x));
  ITEMS.sort((a,b)=>b.ts-a.ts);
  linkDups();
}
// the same story from several outlets is shown once, with the other outlets listed under it
let REPEATS = {};
function linkDups(){
  const byId = {}; for(const x of ITEMS) byId[x.i] = x;
  REPEATS = {};
  for(const x of ITEMS){ x.isDup = !!(x.dup && byId[x.dup]); if(x.isDup) (REPEATS[x.dup] = REPEATS[x.dup]||[]).push(x); }
}
let projLoading = null;
function loadProjects(){
  if(PROJECTS) return Promise.resolve(PROJECTS);
  if(!projLoading) projLoading = getJSON("projects.json").then(d=>{
    PROJECTS = (d.projects||[]).map(p=>{ p.c=p.c||[]; p.k=((p.t||"")+" "+(p.tj||"")+" "+(p.x||"")+" "+(p.org||"")+" "+(p.impl||"")).toLowerCase(); return p; });
    PROJECTS.meta = d;
  }).catch(e=>{ PROJECTS = []; PROJECTS.err = String(e.message||e); }).then(()=>{ render(); return PROJECTS; });
  return projLoading;
}
const items = () => ITEMS.filter(x=>!x.isDup && (SHOW_JP || !(x.jp && x.d.every(d=>JP_IDS.has(d)))));
const projects = () => !PROJECTS || PROJECTS.err ? [] : SHOW_JP ? PROJECTS : PROJECTS.filter(p=>!JP_IDS.has(p.donor));
const projReady = () => PROJECTS && !PROJECTS.err;

async function boot(){
  readHash(); $("#q").value = S.q;
  try{
    INDEX = await getJSON("index.json");
    for(const d of INDEX.donors||[]) DONORS[d.id] = d;
    await Promise.all((INDEX.years||[]).slice(0,2).map(loadYear));
    const age = Date.now() - Date.parse(INDEX.updated);
    $("#upd").innerHTML = (EMBED?`<span class="snap" title="${esc(EMBED.note||"")}">SNAPSHOT</span>`:"UPDATED ") + esc(fmtDT(INDEX.updated));
    $("#live").classList.toggle("stale", age > 12*3600e3);
  }catch(e){ loadErr = String(e.message||e); }
  render();
  loadProjects();
}

/* ---------- formatting ---------- */
const dtfDay = new Intl.DateTimeFormat("ja-JP",{timeZone:TZ,year:"numeric",month:"2-digit",day:"2-digit",weekday:"short"});
const dtfT = new Intl.DateTimeFormat("ja-JP",{timeZone:TZ,month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit"});
const dtfHM = new Intl.DateTimeFormat("ja-JP",{timeZone:TZ,hour:"2-digit",minute:"2-digit"});
const fmtDay = ts => dtfDay.format(new Date(ts));
const fmtDT = s => { try{ return dtfT.format(new Date(s)); }catch(e){ return ""; } };
const fmtHM = ts => dtfHM.format(new Date(ts));
const ymd = s => s ? s.slice(0,7).replace("-","/") : "";
function money(v){
  if(v==null||!v) return "";
  if(v>=1e9) return "$"+(v/1e9).toFixed(2)+"B";
  if(v>=1e6) return "$"+(v/1e6).toFixed(v>=1e8?0:1)+"M";
  if(v>=1e3) return "$"+Math.round(v/1e3)+"K";
  return "$"+Math.round(v);
}
function jaLink(url){
  try{
    const u = new URL(url);
    if(!/^https?:$/.test(u.protocol) || /(^|\.)news\.google\.com$/.test(u.hostname) || /\.translate\.goog$/.test(u.hostname) || /\.jp$/.test(u.hostname)) return url;
    const host = u.hostname.replace(/-/g,"--").replace(/\./g,"-") + ".translate.goog";
    const q = new URLSearchParams(u.search);
    q.set("_x_tr_sl","auto"); q.set("_x_tr_tl","ja"); q.set("_x_tr_hl","ja"); q.set("_x_tr_pto","wapp");
    return `https://${host}${u.pathname}?${q}${u.hash}`;
  }catch(e){ return url; }
}
function hl(text){
  const s = esc(text);
  const terms = (S.q||"").trim().split(/\s+/).filter(t=>t.length>1).map(t=>esc(t).replace(/[.*+?^${}()|[\]\\]/g,"\\$&"));
  return terms.length ? s.replace(new RegExp("("+terms.join("|")+")","gi"),'<mark class="hl">$1</mark>') : s;
}
const donorName = id => (DONORS[id]&&DONORS[id].ja) || id;
const STAR = '<svg viewBox="0 0 24 24"><path d="M12 3.5l2.6 5.4 5.9.8-4.3 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8-4.3-4.1 5.9-.8z" stroke-linejoin="round"/></svg>';

/* ---------- filtering ---------- */
function filterItems(o){
  const min = o.p ? Date.now() - o.p*DAY : 0;
  const terms = (o.q||"").toLowerCase().trim().split(/\s+/).filter(Boolean);
  return items().filter(x=>{
    if(x.ts < min) return false;
    if(o.s && !x.c.includes(o.s)) return false;
    if(o.my && FAV.size && !x.c.some(c=>FAV.has(c))) return false;
    if(o.d && !x.d.includes(o.d)) return false;
    if(o.t==="gov" && !x.g) return false;
    if(o.t==="coop" && !x.d.length) return false;
    if(o.t==="press" && (x.g || x.d.length)) return false;
    for(const t of terms) if(!x.k.includes(t)) return false;
    return true;
  });
}
const isOpen = p => p.st==="active"||p.st==="pipeline";
function filterProjects(o){
  const terms = (o.q||"").toLowerCase().trim().split(/\s+/).filter(Boolean);
  const r = projects().filter(p=>{
    if(o.s && !p.c.includes(o.s)) return false;
    if(o.d && p.donor!==o.d) return false;
    if(o.k && sch(p)!==o.k) return false;
    if(o.ps==="open" && !isOpen(p)) return false;
    if(o.ps==="past" && isOpen(p)) return false;
    if(["active","pipeline"].includes(o.ps) && p.st!==o.ps) return false;
    if(o.ps==="closed" && isOpen(p)) return false;
    for(const t of terms) if(!p.k.includes(t)) return false;
    return true;
  });
  const by = {start:(a,b)=>(b.a||"").localeCompare(a.a||""), amount:(a,b)=>(b.amt||0)-(a.amt||0),
              end:(a,b)=>(a.e||"9999").localeCompare(b.e||"9999")}[o.psort||"start"];
  return r.sort(by);
}

/* ---------- pieces ---------- */
function kindTags(x){
  const out = [];
  if(x.g) out.push('<span class="tag gov">GOV</span>');
  if(x.d.length) out.push(x.jp ? '<span class="tag jp">JAPAN</span>' : '<span class="tag coop">COOP</span>');
  if(!x.g && !x.d.length) out.push('<span class="tag press">PRESS</span>');
  return out.join("");
}
function itemHTML(x){
  const title = x.tj || x.t, lead = x.lj || x.l, on = saved[x.i] ? "on" : "";
  const dons = x.d.map(d=>`<span class="don ${JP_IDS.has(d)?"jp":""}">${esc(donorName(d))}</span>`).join(" ");
  const showOrig = x.tj && x.tj!==x.t;
  return `<article class="it">
    <div class="meta"><span class="t">${esc(fmtHM(x.ts))}</span>${kindTags(x)}<span class="src">${esc(x.s||"")}</span>${dons}${x.lang&&x.lang!=="ru"?`<span class="tag lang">${esc(x.lang)}</span>`:""}</div>
    <h3><a href="${esc(jaLink(x.u))}" target="_blank" rel="noopener">${hl(title)}</a></h3>
    <p class="orig">${showOrig?hl(x.t)+" · ":""}<a href="${esc(x.u)}" target="_blank" rel="noopener">原文</a></p>
    ${lead && lead!==title ? `<p class="lead">${hl(lead)}</p>` : ""}
    ${REPEATS[x.i] ? `<p class="also">同じニュース：他 ${REPEATS[x.i].length} 媒体 ${REPEATS[x.i].slice(0,5).map(r=>`<a href="${esc(jaLink(r.u))}" target="_blank" rel="noopener">${esc(r.s||"")}</a>`).join("・")}</p>` : ""}
    ${x.c.length ? `<div class="chips">${x.c.map(c=>SEC[c]?`<button class="chip" data-sec="${c}">${esc(SEC[c].ja)}</button>`:"").join("")}</div>` : ""}
    <button class="star ${on}" data-star="${esc(x.i)}" title="保存" aria-label="保存">${STAR}</button>
  </article>`;
}
function listHTML(list, more=true){
  if(!list.length) return `<div class="feed"><div class="empty">該当する情報はありません</div></div>`;
  let out = "", last = "";
  for(const x of list.slice(0, more?shown:list.length)){
    const d = fmtDay(x.ts);
    if(d!==last){ out += `<div class="day">${esc(d)}</div>`; last = d; }
    out += itemHTML(x);
  }
  out = `<div class="feed">${out}</div>`;
  if(more && list.length > shown) out += `<button class="btn more" data-more>さらに表示 · 残り ${list.length-shown}</button>`;
  return out;
}
function projectHTML(p){
  const now = new Date().toISOString().slice(0,10);
  let tl = "";
  if(p.a && p.e && p.e > p.a){
    const a = Date.parse(p.a), e = Date.parse(p.e), n = Date.parse(now);
    const pct = Math.max(0, Math.min(100, (n-a)/(e-a)*100));
    tl = `<div class="timeline" title="期間の経過 ${Math.round(pct)}%"><i style="left:0;width:${pct}%"></i></div>`;
  }
  const jp = JP_IDS.has(p.donor);
  return `<article class="pj">
    <div class="row1"><span class="st st-${esc(p.st)}">${esc(ST_JA[p.st]||p.st)}</span>
      <span class="don ${jp?"jp":""}">${esc(p.donor&&p.donor!=="ngo"?donorName(p.donor):"")}</span>
      ${p.org && donorName(p.donor)!==p.org ? `<span>${esc(p.org)}</span>` : ""}<span class="kind" ${p.kind?`title="元の区分: ${esc(p.kind)}"`:""}>${esc(sch(p))}</span>${(p.a||p.e)?`<span class="per">${esc(ymd(p.a)||"?")}–${esc(ymd(p.e)||"?")}</span>`:""}${amtHTML(p)}</div>
    <h3><a href="${esc(p.u)}" target="_blank" rel="noopener">${hl(p.tj||p.t)}</a></h3>
    ${p.tj && p.tj!==p.t ? `<p class="orig" style="font-size:12px;color:var(--faint);margin:0">${hl(p.t)}</p>` : ""}
    ${p.impl ? `<p class="desc">実施機関: ${esc(p.impl)}</p>` : ""}
    ${p.x ? `<p class="desc">${hl(p.x)}</p>` : ""}
    ${p.c.length?`<div class="chips">${p.c.map(c=>SEC[c]?`<button class="chip" data-sec="${c}">${esc(SEC[c].ja)}</button>`:"").join("")}</div>`:""}
    ${isOpen(p)?tl:""}
  </article>`;
}
function yen(v){ return v>=1e8 ? "¥"+(v/1e8).toFixed(v>=1e10?0:1)+"億" : v>=1e4 ? "¥"+Math.round(v/1e4).toLocaleString()+"万" : "¥"+Math.round(v); }
// amounts: a project whose public data gives no amount is counted as "金額不明", never as zero
const hasAmt = p => (p.amt||0) > 0;
const unk = list => list.filter(p=>!hasAmt(p)).length;
const unkNote = (n, all) => n ? `金額不明 ${n}件${all!=null?` / ${all}件`:""}` : "";
const amtHTML = p => !hasAmt(p) ? `<span class="unk" title="公開情報に金額の記載がありません">金額不明</span>` : p.amtx ? `<span class="amt" title="金額の項目がなく、案件説明に書かれた額（ユーロはドル換算）">${money(p.amt)}</span><span class="note">（説明文の額）</span>` : p.jpy ? `<span class="amt">${yen(p.jpy)}</span><span class="note">（約${money(p.amt)}）</span>` : p.amt ? `<span class="amt">${money(p.amt)}</span>` : "";
// one set of cooperation forms for every donor (the collector sets p.sch; older records are mapped here)

function weekly(list, n=12){
  const now = Date.now(), w = new Array(n).fill(0);
  for(const x of list){ const i = Math.floor((now-x.ts)/(7*DAY)); if(i>=0&&i<n) w[n-1-i]++; }

function spark(w){
  const W = 120, H = 30, max = Math.max(1,...w), step = W/(w.length-1);
  const pts = w.map((v,i)=>[i*step, H-3-(v/max)*(H-6)]);
  const line = pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join("");
  const last = pts[pts.length-1];
  return `<svg class="sp" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true"><path d="${line}L${W} ${H}L0 ${H}Z" fill="var(--spark-fill)"/><path d="${line}" fill="none" stroke="var(--spark)" stroke-width="1.5" vector-effect="non-scaling-stroke"/><circle cx="${last[0]}" cy="${last[1]}" r="2" fill="var(--spark)"/></svg>`;

function monthChart(list){

  const idx = Object.fromEntries(months.map((m,i)=>[m.k,i]));
  for(const x of list){ const i = idx[(x.p||"").slice(0,7)]; if(i==null) continue; if(x.g) months[i].g++; else months[i].o++; }
  const max = Math.max(1,...months.map(m=>m.g+m.o));
  const W = 600, H = 120, top = 8, base = 100, bw = W/12;
  const bars = months.map((m,i)=>{
    const x = i*bw+6, w = bw-12; let y = base, s = "";

    return `<g><title>${m.m}月: 政府 ${m.g}件・その他の報道 ${m.o}件</title>${s}</g><text x="${x+w/2}" y="${base+14}" text-anchor="middle">${m.m}月</text>`;
  }).join("");

/* ----- cooperation figures ----- */
// a project spanning several sectors counts in each with an equal share of its amount
const shareAmt = p => (p.amt||0) / Math.max(1, p.c.length);
// in one sector a multi-sector project counts with its share; across all sectors with its full amount
const valAmt = (p, sid) => sid ? shareAmt(p) : (p.amt||0);
const sectorProjects = sid => sid ? projects().filter(p=>p.c.includes(sid)) : projects();
const DCOL = ["var(--d1)","var(--d2)","var(--d3)","var(--d4)","var(--d5)","var(--d6)"];
const JICA_COL = "var(--d7)";   // JICA keeps one colour everywhere, whatever its rank
// colours follow the donor, not its rank in the current view: fixed per sector by all-time amount
const colorCache = {};
function donorColors(sid){
  const key = sid+"|"+SHOW_JP+"|"+(PROJECTS?PROJECTS.length:0);
  if(colorCache[key]) return colorCache[key];
  const tot = {};
  for(const p of sectorProjects(sid)) tot[p.donor] = (tot[p.donor]||0) + valAmt(p,sid) + 1;
  const order = Object.entries(tot).filter(([d])=>d!=="ngo" && d!=="jica").sort((a,b)=>b[1]-a[1]).map(([d])=>d);
  const map = {}; order.slice(0,6).forEach((d,i)=>map[d]=DCOL[i]);
  if(SHOW_JP) map.jica = JICA_COL;
  return colorCache[key] = map;
}
/* ----- years: each project counts once, at its full amount, in the year it was approved or started.
   Yearly spending is not published, and summing the projects running in each year counts one project
   in several years, so new commitments per year are the figure that adds up. ----- */
const Y0 = 2000, YNOW = new Date().getFullYear();
const startYear = p => +((p.a||"").slice(0,4)) || 0;
const rangeLabel = r => r==="active" ? "実施中" : r==="all" ? "全期間" : r.slice(1)+"年に開始・承認された";
function inRange(p, r){ return r==="active" ? p.st==="active" : r==="all" ? true : startYear(p) === +r.slice(1); }
function rangeAmt(p, r, sid){ return valAmt(p, sid); }
function shareData(sid){
  const map = donorColors(sid), val = {}, cnt = {};
  let unit = CH.metric==="amt" ? "amt" : "n", note, unknown = [];
  if(CH.scope==="gov"){
    // government has no project data: compare how often each side appears in a year of announcements and news
    const min = Date.now()-365*DAY;
    for(const x of items()) if(x.ts>=min && (!sid || x.c.includes(sid))){
      if(x.g) val.gov = (val.gov||0)+1;
      for(const d of x.d) val[d] = (val[d]||0)+1;
    }
    unit = "n"; note = "直近1年の発表・報道に登場した件数の割合（政府の予算額は公開データがないため、件数で比較しています）";
  }else{
    for(const p of sectorProjects(sid)){
      if(!inRange(p, CH.range)) continue;
      cnt[p.donor] = (cnt[p.donor]||0)+1;
      if(unit==="amt" && !hasAmt(p)){ unknown.push(p); continue; }
      const v = unit==="amt" ? rangeAmt(p, CH.range, sid) : 1;
      if(v) val[p.donor] = (val[p.donor]||0)+v;
    }
    note = `${rangeLabel(CH.range)}案件の${unit==="amt"?"支援額"+(sid?"（複数分野の案件は按分）":""):"件数"}の割合`;
  }
  const total = Object.values(val).reduce((a,b)=>a+b,0);
  const ranked = Object.entries(val).filter(([d])=>d!=="gov").sort((a,b)=>b[1]-a[1]).map(([d])=>d);
  const rows = []; let other = 0;
  for(const [d,v] of Object.entries(val).sort((a,b)=>b[1]-a[1])){
    if(d==="gov") rows.push({id:"gov", name:"キルギス政府", v, col:"var(--gov)"});
    else if(map[d]) rows.push({id:d, name:donorName(d)+(d==="jica"?`（${ranked.indexOf(d)+1}位）`:""), v, col:map[d], n:cnt[d]});
    else other += v;
  }
  if(other) rows.push({id:"", name:"その他", v:other, col:"var(--dother)"});
  // JICA stays visible even when it has nothing in this view
  const jicaEmpty = SHOW_JP && CH.scope!=="gov" && !val.jica;
  return {rows, total, unit, note, unknown, jicaEmpty, jicaN: cnt.jica||0};
}
function donutSVG(rows, total, center, sub){
  const R = 70, r = 46, cx = 90, cy = 90;
  if(!total) return `<svg viewBox="0 0 180 180" role="img" aria-label="データなし"><circle cx="${cx}" cy="${cy}" r="${(R+r)/2}" fill="none" stroke="var(--press-soft)" stroke-width="${R-r}"/><text class="cl" x="${cx}" y="${cy+4}" text-anchor="middle">データなし</text></svg>`;
  let a0 = -Math.PI/2, out = "";
  const pt = (rad, a) => [cx + rad*Math.cos(a), cy + rad*Math.sin(a)];
  for(const row of rows){
    const frac = row.v/total, a1 = a0 + frac*2*Math.PI, big = a1-a0 > Math.PI ? 1 : 0;
    let d;
    if(frac >= .9999) d = `M${cx} ${cy-R}A${R} ${R} 0 1 1 ${cx-.01} ${cy-R}L${cx-.01} ${cy-r}A${r} ${r} 0 1 0 ${cx} ${cy-r}Z`;
    else{ const [x0,y0]=pt(R,a0),[x1,y1]=pt(R,a1),[x2,y2]=pt(r,a1),[x3,y3]=pt(r,a0); d = `M${x0} ${y0}A${R} ${R} 0 ${big} 1 ${x1} ${y1}L${x2} ${y2}A${r} ${r} 0 ${big} 0 ${x3} ${y3}Z`; }
    out += `<path d="${d}" fill="${row.col}" ${row.id&&row.id!=="gov"?`data-donor="${row.id}"`:""}><title>${esc(row.name)} ${Math.round(frac*1000)/10}%</title></path>`;
    a0 = a1;
  }
  return `<svg viewBox="0 0 180 180" role="img" aria-label="援助機関の割合">${out}<text class="ct" x="${cx}" y="${cy+3}" text-anchor="middle">${esc(center)}</text><text class="cl" x="${cx}" y="${cy+18}" text-anchor="middle">${esc(sub)}</text></svg>`;
}
const segCH = (k, opts) => `<span class="seg">${opts.map(([v,l])=>`<button data-ch="${k}" data-val="${v}" class="${CH[k]===v?"on":""}">${esc(l)}</button>`).join("")}</span>`;
function rangeSelect(){

    <p class="note" style="margin:8px 0 0">${esc(note)}${CH.range[0]==="y"?"。年は下の棒グラフの棒を押しても切り替わります":""}</p>${unkLine}</div>`;

function yearHTML(sid){
  const map = donorColors(sid), mode = CH.ym==="n" || CH.ym==="new" ? "n" : "amt";   // new commitments: amount or count
  const series = [...Object.keys(map).filter(d=>d!=="jica"), ...(map.jica?["jica"]:[]), "_other"];
  const years = []; for(let y=Y0; y<=YNOW; y++) years.push({y, v:{}, tot:0, unk:0, n:0});
  let nodate = 0;
  for(const p of sectorProjects(sid)){
    const y = startYear(p); if(!y){ nodate++; continue; } if(y<Y0 || y>YNOW) continue;
    const o = years[y-Y0], key = map[p.donor] ? p.donor : "_other";
    o.n++;

    if(mode==="amt"){ if(!hasAmt(p)){ o.unk++; continue; } v = valAmt(p, sid); }
    o.v[key] = (o.v[key]||0)+v; o.tot += v;

    const tip = `${o.y}年に開始・承認: ${o.n}件${mode==="amt"?`・${fmt(o.tot)}${o.unk?`（金額不明 ${o.unk}件を除く）`:""}`:""}\n` + series.filter(k=>o.v[k]).sort((a,b)=>o.v[b]-o.v[a]).map(k=>`${nm(k)} ${fmt(o.v[k])}`).join("\n");
    g += `<g class="yb" data-year="${o.y}" style="cursor:pointer"><title>${esc(tip)}</title><rect class="hit" x="${i*bw}" y="${top}" width="${bw}" height="${base-top+18}" fill="transparent"/>${rects}${o.y===sel?`<rect x="${x}" y="${base+3}" width="${w}" height="2" fill="var(--ink)"/>`:""}${(o.y%2===0||o.y===YNOW)?`<text x="${x+w/2}" y="${base+16}" text-anchor="middle">${String(o.y).slice(2)}</text>`:""}</g>`;
  });

  const unkAll = years.reduce((a,o)=>a+o.unk,0);
  const title = mode==="amt" ? "年別の新規支援額（開始・承認年）" : "年別の新規案件数（開始・承認年）";
  return `<div class="panel chart ych"><div class="phk">New commitments by year</div><h3 class="ph">${title}</h3>
    <div class="ctrls">${segCH("ym",[["amt","金額"],["n","件数"]])}${mode==="amt"&&unkAll?`<span class="unk">金額不明 ${unkAll}件は金額に含まず</span>`:""}</div>

    <ul class="lg" style="margin-top:6px">${legend}</ul>

}

               : S.v==="sector" ? filterItems({...S, t:S.sub==="press"?"all":S.sub})

    rows = [["日時","媒体","種別","機関","見出し（日本語）","見出し（原文）","要旨（日本語）","分野","URL"]].concat(
      list.map(x=>[fmtDT(x.p), x.s, x.g?"政府":x.d.length?"協力":"報道", x.d.map(donorName).join("／"), x.tj, x.t, x.lj||x.l, x.c.map(c=>SEC[c]?.ja).join("／"), x.u]));
    name = kind==="saved" ? "saved" : "news";
  }
  const text = "﻿"+rows.map(r=>r.map(q).join(",")).join("\r\n");
  const filename = `kyrgyz-${name}${S.s?"-"+S.s:""}-${new Date().toISOString().slice(0,10)}.csv`;
  if(EMBED){
    const dl = window.claude && window.claude.use ? await window.claude.use("downloads") : null;
    if(!dl){ toast("この表示ではCSVを保存できません"); return; }
    try{ await dl.save({filename, data:text}); }catch(e){ if(e && e.code!=="declined") toast("CSVを保存できませんでした"); }
    return;
  }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([text], {type:"text/csv"}));
  a.download = filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
}

/* ---------- events ---------- */
$("#tabs").addEventListener("click", e=>{ const b = e.target.closest("button"); if(b) go({v:b.dataset.v, s:"", d:"", t:"all", sub:"pa", ps:"active", k:""}); });
$("#home").onclick = ()=>{ $("#q").value=""; go({v:"home", s:"", d:"", q:""}); };
$("#sform").addEventListener("submit", e=>{ e.preventDefault(); $("#q").blur(); go({v:"feed", q:$("#q").value.trim(), t:"all", p:0, s:"", d:""}); });
const main = $("#main");
main.addEventListener("click", e=>{
  const t = e.target;
  const fav = t.closest("[data-fav]"); if(fav){ e.stopPropagation(); toggleFav(fav.dataset.fav); render(); return; }
  const goBtn = t.closest("[data-go]"); if(goBtn){ go({v:"feed", t:goBtn.dataset.go, s:"", d:"", my:FAV.size?"1":""}); return; }
  const gf = t.closest("[data-gofeed]"); if(gf){ go({v:"feed", t:gf.dataset.gofeed, p:365}); return; }
  const sec = t.closest("[data-sec]"); if(sec){ go({v:"sector", s:sec.dataset.sec, sub:"pa", d:"", q:"", k:""}); return; }
  const ch = t.closest("[data-ch]"); if(ch){ CH[ch.dataset.ch] = ch.dataset.val; lsSet("km-charts", CH); render(); return; }
  const ybar = t.closest("[data-year]"); if(ybar){ CH.range = "y"+ybar.dataset.year; CH.scope = "donor"; lsSet("km-charts", CH); render(); return; }
  const don = t.closest("[data-donor]"); if(don){ go({v:"donor", d:don.dataset.donor, s:"", q:"", ps:"all", k:""}); return; }
  const st = t.closest("[data-star]");
  if(st){
    const id = st.dataset.star;
    if(saved[id]) delete saved[id];
    else { const x = ITEMS.find(x=>x.i===id); if(x){ const {ts,k,jp,...rest} = x; saved[id] = rest; } }
    lsSet("km-saved", saved); st.classList.toggle("on", !!saved[id]);
    if(S.v==="saved") render();
    return;
  }
  const kd = t.closest("[data-kind]"); if(kd){ go({k:kd.dataset.kind, ps:"all"}, false); return; }
  const set = t.closest("[data-set]"); if(set){ go({[set.dataset.set]: set.dataset.val}, false); return; }
  const sub = t.closest("[data-sub]"); if(sub){ go({sub:sub.dataset.sub}, false); return; }
  if(t.closest("[data-more]")){ shown += PAGE*2; render(); return; }
  const csv = t.closest("[data-csv]"); if(csv){ csvDownload(csv.dataset.csv); return; }
  const yb = t.closest("[data-years]");
  if(yb){ yb.disabled = true; yb.textContent = "読み込み中…"; Promise.all((INDEX.years||[]).filter(y=>!loadedYears.has(y)).map(y=>loadYear(y).catch(()=>{}))).then(render); }
});
main.addEventListener("keydown", e=>{
  const tile = e.target.closest(".tile[data-sec]");
  if(tile && e.target===tile && (e.key==="Enter"||e.key===" ")){ e.preventDefault(); go({v:"sector", s:tile.dataset.sec, sub:"pa", d:"", q:"", k:""}); }
});
main.addEventListener("change", e=>{
  const c = e.target.closest("[data-chsel]"); if(c){ CH[c.dataset.chsel] = c.value; lsSet("km-charts", CH); render(); return; }
  const s = e.target.closest("[data-sel]"); if(s) go({[s.dataset.sel]: s.dataset.sel==="p" ? +s.value : s.value}, false); });
let qTimer = 0;
main.addEventListener("input", e=>{
  const i = e.target.closest("[data-inp]"); if(!i) return;
  clearTimeout(qTimer);
  qTimer = setTimeout(()=>{
    const pos = i.selectionStart;
    go({q:i.value}, false); $("#q").value = S.q;
    const n = document.querySelector('[data-inp="q"]');
    if(n){ n.focus(); try{ n.setSelectionRange(pos,pos); }catch(e){} }
  }, 250);
});
boot();
</script>
