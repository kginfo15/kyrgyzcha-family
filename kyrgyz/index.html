function buildQueue(sc){var l=sc.level||ui.level;
  /* PHASE10: dataStatus='quarantined'（自然さ・格支配等に疑義があり要確認の語）は通常学習キューから除外する */
  var base = (sc.allLevels ? idsAllLevels() : baseLevel(l)).filter(function(id){var w=byId(id);return !w||w.dataStatus!=="quarantined";});
  var ids;
  if(sc.type==="lesson")ids=VOCAB.filter(function(w){return w.pack===sc.pack&&w.lesson===sc.lesson;}).map(function(w){return w.id;});
  else if(sc.type==="pack")ids=VOCAB.filter(function(w){return w.pack===sc.pack;}).map(function(w){return w.id;});
  else if(sc.type==="level")ids=base;
  else if(sc.type==="all")ids=base.slice();
  else if(sc.type==="new")ids=base.filter(function(id){return !hasP(id)||progress[id].status==="new";});
  else if(sc.type==="review")ids=base.filter(isDue);
  else if(sc.type==="forgetting")ids=base.filter(isForgetting);
  else if(sc.type==="weak")ids=base.filter(isWeak);
  else if(sc.type==="weak60")ids=base.filter(isWeak60);
  else if(sc.type==="fav")ids=base.filter(function(id){return progress[id]&&progress[id].favorite;});
  else ids=[];
  if(["level","new"].indexOf(sc.type)>=0){var rem=dailyRemaining();var fresh=ids.filter(function(id){return !hasP(id)||progress[id].status==="new";});var known=ids.filter(function(id){return hasP(id)&&progress[id].status!=="new";});if(fresh.length>rem)fresh=fresh.slice(0,rem);ids=known.concat(fresh);}

  else if(order==="weak")ids=ids.slice().sort(function(x,y){return ((progress[y]&&progress[y].wrongCount)||0)-((progress[x]&&progress[x].wrongCount)||0);});

function journeyStageDone(s){ return (journeyRec()[s.key]||0)>=s.target; }
function journeyNextStage(){
  for(var i=0;i<JOURNEY_STAGES.length;i++){ if(!journeyStageDone(JOURNEY_STAGES[i]))return JOURNEY_STAGES[i]; }
  return null; /* 全部完了 */
}
function journeyPercent(){
  var done=0,total=0;
  JOURNEY_STAGES.forEach(function(s){
    var c=Math.min(journeyRec()[s.key]||0,s.target);
    done+=c; total+=s.target;
  });
  return total?Math.round(done/total*100):0;
}
function journeyAllDone(){ return journeyNextStage()===null; }

/* ==================================================================================
   PHASE20: 経験値・レベル（Duolingo的な継続動機。ただし演出は控えめに）
   ================================================================================== */
function xpTotal(){ return (appHist.totals&&appHist.totals.xp)||0; }
function xpAdd(n){
  if(!appHist.totals)appHist.totals={};
  appHist.totals.xp=(appHist.totals.xp||0)+n;
  var d=dayRec(); d.xp=(d.xp||0)+n;
  saveAll();
}
/* レベル曲線: 必要XPは緩やかに増える（レベルn到達に 50*n*(n-1) XP） */
function levelFromXp(xp){ var lv=1; while(50*(lv+1)*lv<=xp)lv++; return lv; }
function xpForLevel(lv){ return 50*lv*(lv-1); }
function currentLevel(){ return levelFromXp(xpTotal()); }
function levelProgress(){
  var xp=xpTotal(), lv=currentLevel();
  var cur=xpForLevel(lv), next=xpForLevel(lv+1);
  return {level:lv, into:xp-cur, need:next-cur, pct:Math.round((xp-cur)/Math.max(1,next-cur)*100)};
}


/* ==================================================================================
   PHASE21: 学習モード（通常／チャレンジ）と交互出題キュー
   ---------------------------------------------------------------------------------
   ・両モードは同じ progress / cprogress / SRS / 正誤履歴を共有する（別集計は作らない）
   ・違うのは「どの問題をどの順で、どう提示するか」だけ
   ================================================================================== */
function p21Mode(){
  var m=ui.studyMode;
  /* PHASE22: 旧"normal"は"word"へ移行（既存の保存値を壊さない） */
  if(m==="normal")m="word";
  return (m==="word"||m==="compose"||m==="challenge")?m:"word";
}
function p21SetMode(m){ ui.studyMode=(m==="compose"||m==="challenge")?m:"word"; saveUI(); }

/* ===== PHASE22: モードごとに単一種類の問題だけを出す（単語と例文を混ぜない） ===== */
/* 今日の単語: 単語のみ。新規＋復習を無理なく20問 */
function p22BuildWordQueue(){
  var TARGET=20;
  var due=buildQueue({type:"review",allLevels:true}).slice(0,8);
  var need=TARGET-due.length;
  var fresh=buildQueue({type:"new",allLevels:true}).filter(function(id){return due.indexOf(id)<0;}).slice(0,need);
  if(fresh.length<need){
    fresh=fresh.concat(buildQueue({type:"all",allLevels:true})
      .filter(function(id){return due.indexOf(id)<0&&fresh.indexOf(id)<0;}).slice(0,need-fresh.length));
  }
  return fresh.concat(due).slice(0,TARGET).map(function(id){return {kind:"word",id:id};});
}
/* 瞬間作文: 例文のみ。復習期限のものを優先し、足りなければランダムで補う */
function p22BuildComposeQueue(){
  var due=buildCompose({type:"review"}).slice(0,8);
  var rest=buildCompose({type:"random"}).filter(function(id){return due.indexOf(id)<0;}).slice(0,12-Math.min(8,due.length)+4);
  return due.concat(rest).slice(0,14).map(function(id){return {kind:"compose",id:id};});
}
/* チャレンジ: 苦手中心。単語（日→キ・カタカナなし）を主とし、瞬間作文も少し混ぜる */
function p22BuildChallengeQueue(){
  var weak=buildQueue({type:"weak60",allLevels:true}).slice(0,10);
  var due=buildQueue({type:"review",allLevels:true}).filter(function(id){return weak.indexOf(id)<0;}).slice(0,6);
  var words=weak.concat(due);
  if(words.length<12){
    words=words.concat(buildQueue({type:"all",allLevels:true})
      .filter(function(id){return words.indexOf(id)<0;}).slice(0,12-words.length));
  }
  var items=words.map(function(id){return {kind:"word",id:id};});
  buildCompose({type:"weak"}).concat(buildCompose({type:"random"})).slice(0,4)
    .forEach(function(id){ items.push({kind:"compose",id:id}); });
  return items;
}

function p21StartQueue(){
  var m=p21Mode();
  var q=(m==="challenge")?p22BuildChallengeQueue():(m==="compose")?p22BuildComposeQueue():p22BuildWordQueue();
  q=q.filter(function(it){ return it.id; });
  if(!q.length){ toast("対象の問題がありません"); return; }
  ui.mixQueue={items:q,pos:0,mode:m,startedAt:now(),
    stats:{ok:0,maybe:0,no:0,answered:0},total:q.length};
  clearTransientUI();
  ui.bnav="wordbook"; ui.learnOpen=true;
  p21OpenCurrent();
}
function p21OpenCurrent(){
  var mq=ui.mixQueue;
  if(!mq||!mq.items||mq.pos>=mq.items.length){ p21Finish(); return; }
  var it=mq.items[mq.pos];
  /* PHASE27: キュー項目が壊れている（idが無い等）場合はスキップして進む。ここで止まらないようにする */
  if(!it||!it.id){ mq.pos++; saveUI(); p21OpenCurrent(); return; }
  if(it.kind==="word"){
    ui.view="word"; ui.composeSession=null;
    startSessionFromIds([it.id],p21QueueLabel(),"mix",{type:"all",allLevels:true});
  }else{
    ui.view="compose"; ui.session=null;
    ui.composeSession={list:[it.id],pos:0,revealed:false,label:p21QueueLabel(),startedAt:now(),lastActionAt:now()};
    ui.composeSub="study"; saveUI(); render();
  }
}
function p21QueueLabel(){
  var mq=ui.mixQueue; if(!mq)return "学習";
  return {word:"今日の単語",compose:"瞬間作文",challenge:"チャレンジ"}[mq.mode]||"学習";
}
/* PHASE23: モード別の「本日といた問題数」を記録する（日付が変わると自然にリセット） */
function p23ModeCount(mode){ var d=dayRec(); return (d.modeCounts&&d.modeCounts[mode])||0; }
function p23BumpMode(mode){
  var d=dayRec();
  if(!d.modeCounts)d.modeCounts={};
  d.modeCounts[mode]=(d.modeCounts[mode]||0)+1;
  saveAll();
}
function p21Advance(kind){
  var mq=ui.mixQueue; if(!mq)return false;
  p23BumpMode(mq.mode); /* PHASE23 */
  mq.stats.answered++;
  if(kind==="ok")mq.stats.ok++; else if(kind==="maybe")mq.stats.maybe++; else if(kind==="no")mq.stats.no++;
  mq.pos++;
  saveUI();
  if(mq.pos>=mq.items.length){ p21Finish(); return true; }
  if(mq.stats.answered%5===0){ ui.mixCheckpoint=true; saveUI(); render(); return true; }
  p21OpenCurrent(); return true;
}
function p21Finish(){
  var mq=ui.mixQueue;
  if(mq){ ui.mixSummary={stats:mq.stats,total:mq.total,mode:mq.mode,
    seconds:Math.max(30,Math.round((now()-mq.startedAt)/1000))}; }
  ui.mixQueue=null; ui.session=null; ui.composeSession=null; ui.mixCheckpoint=false;
  saveUI(); render();
}

function packStats(p){var t=p.words.length,l=0,m=0,d=0;p.words.forEach(function(id){var pr=progress[id];if(pr&&pr.status!=="new")l++;if(pr&&pr.status==="mastered")m++;if(isDue(id))d++;});return {total:t,learned:l,mastered:m,due:d,pct:Math.round(l/t*100)};}

function wordStateOf(id){
  var p=progress[id];
  if(!p||p.status==="new")return "new";
  if(p.status==="mastered")return "mastered";
  if(isWeak60(id))return "weak";
  return "learning";
}
function searchWords(){
  var s=ui.search,q=(s.q||"").trim().toLowerCase();
  var list=VOCAB.filter(function(w){
    if(s.level!=="all"&&w.level!==s.level)return false;
    if(s.state==="fav"&&!(progress[w.id]&&progress[w.id].favorite))return false;
    else if(s.state!=="all"&&s.state!=="fav"&&wordStateOf(w.id)!==s.state)return false;
    if(q){
      var hay=[w.word,w.accent,w.meaning,w.kana,w.category,w.pos,w.packTitle,w.level].join(" ").toLowerCase();
      if(hay.indexOf(q)<0)return false;
    }
    return true;
  });
  if(s.sort==="acc"){
    list=list.slice().sort(function(a,b){var A=wordAccuracy(a.id),B=wordAccuracy(b.id);A=A==null?1:A;B=B==null?1:B;return A-B;});
  }else if(s.sort==="recent"){
    list=list.slice().sort(function(a,b){var A=(progress[a.id]&&progress[a.id].lastReviewed)||0,B=(progress[b.id]&&progress[b.id].lastReviewed)||0;return B-A;});
  }else if(s.sort==="fav"){
    list=list.slice().sort(function(a,b){var A=(progress[a.id]&&progress[a.id].favorite)?1:0,B=(progress[b.id]&&progress[b.id].favorite)?1:0;return B-A;});
  }
  return list;
}

function levelWordStats(level){
  var ids=baseLevel(level),total=ids.length,learned=0,mastered=0,unlearned=0,due=0,forgetting=0,weak=0;
  ids.forEach(function(id){var p=progress[id];
    if(!p||p.status==="new")unlearned++; else learned++;
    if(p&&p.status==="mastered")mastered++;
    if(isDue(id))due++; if(isForgetting(id))forgetting++; if(isWeak60(id))weak++;
  });
  return {total:total,learned:learned,mastered:mastered,unlearned:unlearned,due:due,forgetting:forgetting,weak:weak};
}
function composeStatsA2(){
  var total=COMPOSE.length,learned=0,mastered=0,due=0,weak=0;

function buildListenQueue(filter){
  if(filter==="weak")return VOCAB.filter(function(w){return isWeak60(w.id);}).map(function(w){return w.id;});
  if(filter==="fav")return VOCAB.filter(function(w){return progress[w.id]&&progress[w.id].favorite;}).map(function(w){return w.id;});
  if(filter==="a1")return baseLevel("A1");
  if(filter==="a2")return baseLevel("A2");
  return idsAllLevels();
}
function ensureListenQueue(){
  var L=ui.listen;
  if(!L.order||!L.order.length||L._filterBuilt!==L.filter){
    var ids=buildListenQueue(L.filter);
    if(L.shuffle)ids=shuffle(ids);
    L.order=ids;L.idx=0;L._filterBuilt=L.filter;
  }
}

async function lisSpeakCurrent(){
  ensureListenQueue();
  if(!ui.listen.playing)return;
  if(!ui.listen.order||!ui.listen.order.length)return;
  var token=nextListenToken();
  var id=ui.listen.order[ui.listen.idx];
  var w=byId(id);if(!w)return;
  var mode=ui.listen.mode||"ru-ja";
  var rate=ui.listen.rate||0.9;
  var jaRate=ui.listen.jaRate||1.0;
  var wordGap=ui.listen.wordGapMs==null?1500:ui.listen.wordGapMs;
  var partGap=ui.listen.partGapMs==null?700:ui.listen.partGapMs;
  try{window.speechSynthesis.cancel();}catch(_){}
  function stillPlaying(){return ui.listen&&ui.listen.playing&&ui.listen.token===token;}
  async function sayRu(){if(!stillPlaying())return;await speakUtterance(w.accent||w.word,"ru-RU",rate,RU_VOICE);}
  async function sayJa(){if(!stillPlaying())return;await speakUtterance(w.meaning||"","ja-JP",jaRate,JA_VOICE);}
  if(mode==="ru-only"){await sayRu();}
  else if(mode==="ru-ja"){await sayRu();if(stillPlaying())await waitMs(partGap);await sayJa();}
  else if(mode==="ja-ru"){await sayJa();if(stillPlaying())await waitMs(partGap);await sayRu();}
  else if(mode==="ru-ja-ru"){await sayRu();if(stillPlaying())await waitMs(partGap);await sayJa();if(stillPlaying())await waitMs(partGap);await sayRu();}
  if(!stillPlaying())return;
  await waitMs(wordGap);
  if(!stillPlaying())return;
  appHist.totals.listenReps=(appHist.totals.listenReps||0)+1;
  var d=dayRec();d.listeningCount=(d.listeningCount||0)+1;d.studiedWords=(d.studiedWords||0)+1;d.listenSeconds=(d.listenSeconds||0)+Math.max(3,Math.round((wordGap+partGap)/1000));
  /* PHASE20: 順路「リスニング」ステージの進捗と経験値 */
  if(!d.journey)d.journey={};d.journey.listening=(d.journey.listening||0)+1;
  if(!appHist.totals)appHist.totals={};appHist.totals.xp=(appHist.totals.xp||0)+4;d.xp=(d.xp||0)+4;
  addStudySeconds(d,Math.max(3,Math.round((wordGap+partGap)/1000)));
  saveAll();
  if(!stillPlaying())return;
  if(ui.listen.repeat){saveUI();render();lisSpeakCurrent();return;}
  if(ui.listen.idx<ui.listen.order.length-1){ui.listen.idx++;saveUI();render();lisSpeakCurrent();}
  else{ui.listen.playing=false;saveUI();render();}
}

function p33RunQA(){
  var out=[];
  function push(tag,sev,w,detail){out.push({tag:tag,sev:sev,id:w.id,word:w.word,detail:detail});}
  var byWord={};
  VOCAB.forEach(function(w){(byWord[w.word]=byWord[w.word]||[]).push(w);});
  Object.keys(byWord).forEach(function(k){var g=byWord[k];if(g.length>1)push("同一wordの重複","info",g[0],g.length+"件: "+g.map(function(x){return x.id;}).join(", "));});
  VOCAB.forEach(function(w){
    var nw=w.word.split(/[\s-]+/).length;
    if(/[a-z]/i.test(w.word))push("見出し語にラテン文字","error",w,w.word);
    if(!w.simpleExp)push("解説が未作成","info",w,"");
    if(!w.exRu)push("例文が未作成","info",w,"");
  });
  return out;
}
function p33QASummary(){
  var r=p33RunQA(), by={};
  r.forEach(function(x){by[x.tag]=by[x.tag]||{n:0,sev:x.sev};by[x.tag].n++;});
  return {total:r.length,byTag:by,rows:r};
}

function csvCell(v){
  if(v==null)v="";
  if(Array.isArray(v))v=v.map(function(x){return (x&&x.surface)?(x.surface+"="+(x.meaning||"")):JSON.stringify(x);}).join(" / ");
  if(typeof v==="object")v=JSON.stringify(v);
  v=String(v).replace(/\r?\n/g," ");
  if(/[",\n]/.test(v))v='"'+v.replace(/"/g,'""')+'"';
  return v;
}
function toCSV(headers,rows){
  var lines=[headers.join(",")];
  rows.forEach(function(r){lines.push(headers.map(function(h){return csvCell(r[h]);}).join(","));});
  return lines.join("\r\n");
}

function isBlank(v){return v==null||String(v).trim()==="";}
function materialDiagnostics(){
  var vIds={},vDup=[],vEmptyId=0;
  VOCAB.forEach(function(w){if(isBlank(w.id))vEmptyId++;else{if(vIds[w.id])vDup.push(w.id);vIds[w.id]=(vIds[w.id]||0)+1;}});
  var cIds={},cDup=[],cEmptyId=0;
  COMPOSE.forEach(function(c){if(isBlank(c.id))cEmptyId++;else{if(cIds[c.id])cDup.push(c.id);cIds[c.id]=(cIds[c.id]||0)+1;}});
  var blankFields={word:0,accent:0,kana:0,meaning:0,simpleExp:0,detailExp:0};
  VOCAB.forEach(function(w){["word","accent","kana","meaning","simpleExp","detailExp"].forEach(function(f){if(isBlank(w[f]))blankFields[f]++;});});
  var cBlank={ja:0,ru:0,accent:0,kana:0,gEasy:0,gDetail:0,breakdown:0};
  COMPOSE.forEach(function(c){
    ["ja","ru","accent","kana","gEasy","gDetail"].forEach(function(f){if(isBlank(c[f]))cBlank[f]++;});
    if(!c.breakdown||!c.breakdown.length)cBlank.breakdown++;
  });
  var longKana=VOCAB.filter(function(w){return w.kana&&w.kana.length>30;}).length;
  var longExp=VOCAB.filter(function(w){return w.detailExp&&w.detailExp.length>300;}).length;
  var undefCandidates=0,nullCandidates=0;
  VOCAB.forEach(function(w){Object.keys(w).forEach(function(k){if(w[k]===undefined)undefCandidates++;if(w[k]===null)nullCandidates++;});});
  var au=audioCoverageStats();
  var mappedButMissing=0;
  Object.keys(audioMap.vocab||{}).forEach(function(id){if(!VOCAB.some(function(w){return w.id===id;}))mappedButMissing++;});
  Object.keys(audioMap.compose||{}).forEach(function(id){if(!COMPOSE.some(function(c){return c.id===id;}))mappedButMissing++;});
  return {
    a1:VOCAB.filter(function(w){return w.level==="A1";}).length,a2:VOCAB.filter(function(w){return w.level==="A2";}).length,vocabTotal:VOCAB.length,
    composeTotal:COMPOSE.length,units:UNITS.length,grammarPoints:GP.length,
    vDup:vDup.length,vEmptyId:vEmptyId,cDup:cDup.length,cEmptyId:cEmptyId,
    blankFields:blankFields,cBlank:cBlank,longKana:longKana,longExp:longExp,
    undefCandidates:undefCandidates,nullCandidates:nullCandidates,
    audioVocabPct:au.vTotal?Math.round(au.vDone/au.vTotal*100):0,audioComposePct:au.cTotal?Math.round(au.cDone/au.cTotal*100):0,
    audioVocabDone:au.vDone,audioVocabTotal:au.vTotal,audioComposeDone:au.cDone,audioComposeTotal:au.cTotal,
    audioMappedButMissing:mappedButMissing
  };
}
function renderDiagnosticsSheet(){
  var d=materialDiagnostics();
  var blankTotal=Object.values(d.blankFields).reduce(function(a,b){return a+b;},0)+Object.values(d.cBlank).reduce(function(a,b){return a+b;},0);
  var h='<div class="stat">'+sb(d.vocabTotal,"単語合計")+sb(d.a1,"A1")+sb(d.a2,"A2")+sb(d.composeTotal,"例文")+sb(d.units,"ユニット数")+sb(d.grammarPoints,"文法ポイント")+'</div>';
  h+='<div class="h2" style="margin-top:14px">ID診断</div><div class="stat">'+sb(d.vDup,"単語 重複ID")+sb(d.vEmptyId,"単語 空ID")+sb(d.cDup,"例文 重複ID")+sb(d.cEmptyId,"例文 空ID")+'</div>';
  h+='<div class="h2" style="margin-top:14px">空欄診断（単語）</div><div class="stat">'+Object.keys(d.blankFields).map(function(k){return sb(d.blankFields[k],k);}).join("")+'</div>';
  h+='<div class="h2" style="margin-top:14px">空欄診断（例文）</div><div class="stat">'+Object.keys(d.cBlank).map(function(k){return sb(d.cBlank[k],k);}).join("")+'</div>';
  h+='<div class="h2" style="margin-top:14px">表示診断</div><div class="stat">'+sb(blankTotal,"空欄注意 合計")+sb(d.longKana,"カタカナ長すぎ")+sb(d.longExp,"説明文長すぎ")+sb(d.undefCandidates,"undefined候補")+sb(d.nullCandidates,"null候補")+'</div>';
  h+='<div class="h2" style="margin-top:14px">音声診断</div><div class="stat">'+sb(d.audioVocabDone+"/"+d.audioVocabTotal,"単語 収録済み")+sb(d.audioComposeDone+"/"+d.audioComposeTotal,"例文 収録済み")+sb(d.audioVocabPct+"%","単語収録率")+sb(d.audioMappedButMissing,"マップ不整合")+'</div>';
  return sheetShell("教材診断",h);
}

/* ===== Phase 6-17: セルフテスト ===== */
function runSelfTest(){
  var results=[];
  function check(name,ok,detail){results.push({name:name,ok:!!ok,detail:detail||""});}
  check("VOCABが存在する",typeof VOCAB!=="undefined"&&Array.isArray(VOCAB));
  check("COMPOSEが存在する",typeof COMPOSE!=="undefined"&&Array.isArray(COMPOSE));
  check("GROUPSが存在する",typeof GROUPS!=="undefined"&&Array.isArray(GROUPS));
  check("VOCABが1300件前後",VOCAB.length>=1200&&VOCAB.length<=1600,"実際:"+VOCAB.length);
  check("COMPOSEが400件前後",COMPOSE.length>=350&&COMPOSE.length<=600,"実際:"+COMPOSE.length);
  check("progressが読み込める",typeof progress==="object"&&progress!==null);
  check("cprogressが読み込める",typeof cprogress==="object"&&cprogress!==null);
  check("appHistが読み込める",typeof appHist==="object"&&appHist!==null);
  check("settingsが読み込める",typeof settings==="object"&&settings!==null);
  check("uiが読み込める",typeof ui==="object"&&ui!==null);
  check("renderHomeが存在する",typeof renderHome==="function");
  check("renderListeningが存在する",typeof renderListening==="function");
  check("renderSettingsが存在する",typeof renderSettings==="function");
  check("svgIconが存在する",typeof svgIcon==="function");
  check("badgeIconが存在する",typeof badgeIcon==="function");
  check("speakUtteranceが存在する",typeof speakUtterance==="function");
  check("export/import関数が存在する",typeof exportData==="function"&&typeof importData==="function");
  var diag=materialDiagnostics();
  check("undefined表示候補がない",diag.undefCandidates===0,diag.undefCandidates+"件");
  try{var testKey="__selftest__"+Date.now();localStorage.setItem(testKey,"1");var okls=localStorage.getItem(testKey)==="1";localStorage.removeItem(testKey);check("localStorage保存ができる",okls);}
  catch(e){check("localStorage保存ができる",false,e.message);}
  return results;
}
function renderSelfTestSheet(){
  var results=ui._selfTestResults||runSelfTest();
  var okCount=results.filter(function(r){return r.ok;}).length;
  var h='<div class="small muted" style="margin-bottom:10px">'+okCount+' / '+results.length+' 件が正常です</div>';
  h+='<div style="display:flex;flex-direction:column;gap:6px">';
  results.forEach(function(r){
    h+='<div style="display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:'+(r.ok?"var(--card)":"var(--mistakeBg)")+'">'+
       '<span style="font-weight:800;color:'+(r.ok?"var(--good)":"var(--danger)")+';flex:0 0 auto">'+(r.ok?"OK":"エラー")+'</span>'+
       '<span class="small" style="flex:1;min-width:0">'+esc(r.name)+(r.detail?' <span class="muted">（'+esc(r.detail)+'）</span>':'')+'</span></div>';
  });
  h+='</div>';
  return sheetShell("セルフテスト結果",h);
}

    var dIn;
    try{dIn=JSON.parse(taIn.value);}catch(e){toast("JSONの形式が正しくありません");return;}
    // 簡易構造チェック：教材データ(data-vocab等)を誤って貼っていないか、学習データらしい形かを確認
    var looksLikeProgress=(dIn.vocabProgress||dIn.progress||dIn.composeProgress||dIn.settings||dIn.learningHistory);
    if(!looksLikeProgress){toast("学習データの形式ではないようです（教材データは対象外です）");return;}
    if(!confirm("現在の学習データを、貼り付けたデータで上書きします。よろしいですか？"))return;
    try{
      if(dIn.vocabProgress)progress=dIn.vocabProgress; else if(dIn.progress)progress=dIn.progress;
      if(dIn.composeProgress)cprogress=dIn.composeProgress;
      if(dIn.settings)settings=Object.assign(settings,dIn.settings);
      if(dIn.streak)appHist.streak=dIn.streak;
      if(dIn.learningHistory)appHist.days=dIn.learningHistory;
      if(dIn.listenSettings)ui.listen=Object.assign(ui.listen,dIn.listenSettings);
      saveAll();applyDisplayPrefs();render();toast("読み込みました");
    }catch(e){toast("復元に失敗しました。既存データは変更していません");}
    return;
  }
  // word
  if(a==="level"){ui.level=V("data-val");saveUI();render();return;}
  if(a==="wscope"){startSession({type:V("data-type"),level:ui.level},{"new":"未学習",review:"復習対象",weak:"苦手",fav:"お気に入り",level:ui.level+"全体"}[V("data-type")]);return;}
  if(a==="pack"){ui.packView=V("data-val");document.getElementById("main").innerHTML=lessonSheetInline(V("data-val"));return;}
  if(a==="backselect"){render();return;}
  if(a==="startpack"){startSession({type:"pack",level:ui.level,pack:V("data-val")},V("data-val"));return;}
  if(a==="startlesson"){startSession({type:"lesson",level:ui.level,pack:V("data-pack"),lesson:+V("data-lesson")},V("data-pack")+" L"+V("data-lesson"));return;}
  if(a==="resume"){ui.wordSub="study";saveUI();render();return;}
  /* PHASE8: 新しいカードの答えを開くたびに文法パネル状態をリセット */
  if(a==="reveal"){ui.session.revealed=true;ui.session.showExtra=false;ui.session.showGrammar=false;ui.session.p8GraderPending=null;touchSession();saveUI();render();try{var rw=byId(ui.session.list[ui.session.pos]);if(rw)speak(rw.accent||rw.word,settings.ruRate||0.9);}catch(_){ }return;}
  /* PHASE17: 答えを見る前の「できない／微妙／できた」も、即座に評価して次の問題へ進む（続ける・保留なし）。
     以前は評価後に画面が固まって二重評価される不具合があったため修正 */
  if(a==="prereveal_grade"){
    var s12=ui.session,id12=s12.list[s12.pos],kind12=V("data-val");
    try{var rw12=byId(id12);if(rw12)speak(rw12.accent||rw12.word,settings.ruRate||0.9);}catch(_){ }
    answer(id12,kind12);requeueInSession(id12,kind12);
    s12.pos++;s12.revealed=false;s12.kanaPeek=false;s12.showExtra=false;s12.showGrammar=false;s12.p8GraderPending=null;
    touchSession();saveUI();
    /* PHASE21: 混在キュー実行中は次の問題へ自動で進む */
    if(ui.mixQueue&&s12.origin==="mix"){ p21Advance(kind12); return; }
    render();
    return;
  }
  if(a==="toggleextra"){if(ui.view==="compose"&&ui.composeSession){ui.composeSession.showExtra=!ui.composeSession.showExtra;}else if(ui.session){ui.session.showExtra=!ui.session.showExtra;touchSession();}saveUI();render();return;}
  /* PHASE8: 単語学習カード専用「詳しい文法・単語変化を見る」の開閉（同一画面内） */
  if(a==="togglegrammar"){if(ui.session){ui.session.showGrammar=!ui.session.showGrammar;touchSession();saveUI();render();}return;}
  if(a==="kanapeek"){ui.session.kanaPeek=true;render();return;}
  if(a==="fav"){var p=P(V("data-val"));p.favorite=!p.favorite;saveAll();render();return;}
  if(a==="searchlevel"){ui.search.level=V("data-val");saveUI();render();return;}
  if(a==="searchstate"){ui.search.state=V("data-val");saveUI();render();return;}
  if(a==="searchsort"){ui.search.sort=V("data-val");saveUI();render();return;}
  if(a==="worddetail"){ui.searchDetailId=V("data-val");ui.sheet="worddetail";saveUI();renderSheetHost();return;}
  if(a==="practiceoneword"){var pw=V("data-val");ui.sheet=null;ui.searchDetailId=null;ui.bnav="wordbook";ui.view="word";ui.learnOpen=true;startSessionFromIds([pw],"1語だけ練習");return;}
  if(a==="endsession"){endSession();return;}
  if(a==="summaryweak"){var sw=ui.session,stw=sw&&sw.stats||initSessionStats();var idsw=uniqueIds((stw.noIds||[]).concat(stw.maybeIds||[]));startSessionFromIds(idsw,"苦手だけもう一度");return;}
  if(a==="summarycontinue"){var sc2=ui.session,scope=sc2&&sc2.scope;if(scope){startSession(Object.assign({},scope,{count:20}),sc2.label||"続けて20問");}else{startSessionFromIds(today20List(20),"続けて20問");}return;}
  /* PHASE19: サマリー画面からの離脱時も、チャレンジモード中なら位置を保存する */
  if(a==="summaryhome"){saveReinforceState();clearTransientUI();ui.session=null;ui.journeyActive=false;ui.bnav="home";saveUI();render();return;}
  if(a==="summarystats"){saveReinforceState();clearTransientUI();ui.session=null;ui.bnav="profile";ui.profileSub="stats";saveUI();render();return;}
  /* PHASE13: 続けるボタンを廃止。評価を記録したら即座に次のカードへ進む */
  if(a==="grade"){
    var s=ui.session,id=s.list[s.pos],kind=V("data-val");
    answer(id,kind);requeueInSession(id,kind);
    s.pos++;s.revealed=false;s.kanaPeek=false;s.showExtra=false;s.showGrammar=false;s.p8GraderPending=null;
    touchSession();saveUI();
    /* PHASE21: 混在キュー実行中は次の問題（単語/例文）へ自動で進む */
    if(ui.mixQueue&&s.origin==="mix"){ p21Advance(kind); return; }
    render();return;
  }
  /* PHASE18: チャレンジモード（強化モード）は評価せず、前へ／次へだけで単語を見て回る。
     「次へ」に進んだ単語だけを本日の実単語カウント（reinforceUniqueWords）に記録する。
     answer()/requeueInSessionは呼ばない＝正誤の評価・SRSへの記録はしない */
  /* PHASE35: 周回完了画面の操作 */
  if(a==="lapnext"){ ui.lapDonePending=false; p35StartLap(true); return; }
  /* PHASE36: スコープの選択・切り替え */
  if(a==="chalscope"){ p36Start(V("data-val")); return; }
  if(a==="chalpick"){ ui.lapDonePending=false; clearTransientUI(); ui.session=null; ui.chalPick=true; saveUI(); render(); return; }
  if(a==="chalback"){ ui.chalPick=false; ui.bnav="home"; ui.learnOpen=false; saveUI(); render(); return; }
  if(a==="lapreview"){ ui.lapDonePending=false; saveUI(); render();
    try{var lw=byId(ui.session.list[ui.session.pos]);if(lw)speak(lw.accent||lw.word,settings.ruRate||0.9);}catch(_){ } return; }
  if(a==="laphome"){
    ui.lapDonePending=false;
    /* 次に開いたとき新しい周から始まるように、完了した周の位置は捨てる */
    var sc36h=p36SessionScope();
    ui.reinforceStates[sc36h]=null;
    if(sc36h==="all")ui.reinforceState=null;
    ui.reinforceLaps[sc36h]=p35Lap(sc36h)+1; ui.reinforceLapsDone[sc36h]=p35LapDone(sc36h)+1;
    if(!appHist.totals)appHist.totals={};
    appHist.totals.reinforceLaps=(appHist.totals.reinforceLaps||0)+1;
    if(!appHist.totals.reinforceLapsBy)appHist.totals.reinforceLapsBy={};
    appHist.totals.reinforceLapsBy[sc36h]=(appHist.totals.reinforceLapsBy[sc36h]||0)+1;
    saveAll();
    clearTransientUI(); ui.session=null; ui.bnav="home"; ui.learnOpen=false; saveUI(); render(); return;
  }
  if(a==="reinforcenav"){
    var s18=ui.session,dir18=V("data-val");
    if(dir18==="next"){
      var id18=s18.list[s18.pos];
      var d18=dayRec();
      if(!d18.reinforceUniqueWords)d18.reinforceUniqueWords={};
      d18.reinforceUniqueWords[id18]=true;
      /* PHASE24: ホームの「今日◯問」に反映するためモード別カウンタも進める */
      p23BumpMode("challenge");
      saveAll();
      /* PHASE35: 最後の1語を「次へ」した時点で1周完了とし、完了画面を出す */
      if(s18.pos>=s18.list.length-1){
        ui.lapDonePending=true; touchSession(); saveUI(); render(); return;
      }
      s18.pos=s18.pos+1;
    }else{
      s18.pos=Math.max(0,s18.pos-1);
    }
    s18.revealed=false;s18.kanaPeek=false;s18.showExtra=false;s18.showGrammar=false;
    /* PHASE19: 想定外の離脱（ブラウザを閉じる等）に備え、進むたびに位置を保存しておく */
    ui.reinforceState={list:s18.list.slice(),pos:s18.pos};
    touchSession();saveUI();render();
    /* PHASE32: チャレンジモードはキルギス語が出た時点で自動読み上げする */
    try{var rw32=byId(s18.list[s18.pos]);if(rw32)speak(rw32.accent||rw32.word,settings.ruRate||0.9);}catch(_){ }
    return;
  }
  // read
  if(a==="readprev"){ui.readIdx=Math.max(0,ui.readIdx-1);saveUI();render();return;}
  if(a==="readnext"){var L=COMPOSE.filter(function(c){return c.unit===UNITS[ui.readUnit];}).length;ui.readIdx=Math.min(L-1,ui.readIdx+1);
    journeyBump("read",1); xpAdd(5); /* PHASE20 */
    saveUI();render();return;}
  // compose
  if(a==="cmode"){startCompose({type:V("data-type")},{"new":"未学習",review:"復習対象",weak:"苦手",random:"ランダム20"}[V("data-type")]);return;}
  if(a==="cunit"){startCompose({type:"unit",unit:+V("data-val")},UNITS[+V("data-val")]);return;}
  if(a==="creveal"){ui.composeSession.revealed=true;ui.composeSession.showExtra=false;ui.composeSession.lastActionAt=now();saveUI();render();try{var rc=COMPOSE.filter(function(c){return c.id===ui.composeSession.list[ui.composeSession.pos];})[0];if(rc)speak(rc.accent||rc.ru,settings.ruRate||0.9);}catch(_){ }return;}
  if(a==="cfav"){var cp=CP(V("data-val"));cp.favorite=!cp.favorite;saveAll();render();return;}
  if(a==="cend"){endCompose();return;}
  /* PHASE24: 瞬間作文でも答えを見る前に評価して即座に次へ進む（音声も再生） */
  if(a==="cprereveal_grade"){
    var cs24=ui.composeSession,cid24=cs24.list[cs24.pos],ck24=V("data-val");
    try{var rc24=CMAP[cid24];if(rc24)speak(rc24.accent||rc24.ru,settings.ruRate||0.9);}catch(_){ }
    composeAnswer(cid24,ck24);
    if(ui.mixQueue){ p21Advance(ck24); return; }
    if(ck24==="no")cs24.list.push(cid24);
    cs24.pos++;cs24.revealed=false;cs24.showExtra=false;cs24.lastActionAt=now();saveUI();render();return;
  }
  if(a==="cgrade"){var cs=ui.composeSession,cid=cs.list[cs.pos],ck=V("data-val");composeAnswer(cid,ck);
    /* PHASE21: 混在キュー中は再出題せず、次の問題へ進む */
    if(ui.mixQueue){ p21Advance(ck); return; }
    if(ck==="no")cs.list.push(cid);cs.pos++;cs.revealed=false;cs.showExtra=false;cs.lastActionAt=now();saveUI();render();return;}
  // aloud
  if(a==="aloudprev"){ui.aloudIdx=Math.max(0,ui.aloudIdx-1);ui.aloudCount=0;ui.aloudShowJa=false;saveUI();render();return;}
  if(a==="aloudnext"){var LA=COMPOSE.filter(function(c){return c.unit===UNITS[ui.aloudUnit];}).length;ui.aloudIdx=Math.min(LA-1,ui.aloudIdx+1);ui.aloudCount=0;ui.aloudShowJa=false;saveUI();render();return;}
  if(a==="aloudja"){ui.aloudShowJa=!ui.aloudShowJa;saveUI();render();return;}
  if(a==="aloudcount"){ui.aloudCount=(ui.aloudCount||0)+1;if(ui.aloudCount>10)ui.aloudCount=10;appHist.totals.aloudReps=(appHist.totals.aloudReps||0)+1;addStudySeconds(dayRec(),6);
    journeyBump("aloud",1); xpAdd(6); /* PHASE20 */
    saveAll();saveUI();render();return;}
  if(a==="aloudreset"){ui.aloudCount=0;saveUI();render();return;}
  // grammar
  /* PHASE46: 文法ノート／A2カバー状況から練習開始 */
  if(a==="p46note"){var pn=P46_NOTES[+V("data-val")];if(pn){ui.p46Open=pn.key;startCompose({type:"ids",ids:p46NoteIds(pn.gps)},"文法ノート："+pn.title);}return;}
  if(a==="p46a2"){var pa=P46_A2[+V("data-val")];if(pa)startCompose({type:"ids",ids:p46NoteIds(pa[2])},"A2："+pa[0]);return;}
  if(a==="aienable"){settings.aiChatEnabled=true;saveAll();render();return;}
  if(a==="aidisable"){settings.aiChatEnabled=false;saveAll();render();return;}
  if(a==="ggroup"){var grp=GROUPS[+V("data-val")];startCompose({type:"ids",ids:(grp.composeIds||[]).slice()},"文法別練習："+grp.title);return;}
  // review
  if(a==="startreviewW"){var list=VOCAB.map(function(w){return w.id;}).filter(isDue);if(list.length)ui.reviewSub="study";startSessionFromIds(list,"単語の復習","review");return;}
  if(a==="endreview"){ui.reviewSub="list";ui.session=null;saveUI();render();return;}
  if(a==="startreviewC"){startCompose({type:"review"},"作文の復習");return;}
  if(a==="algoset"){ui.reviewAlgo[V("data-key")]=V("data-val");saveUI();render();return;}
  if(a==="startalgo"){var aids=buildReviewAlgoQueue();ui.reviewSub=aids.length?"study":ui.reviewSub;startSessionFromIds(aids,"復習アルゴリズム","review");return;}
  // listening
  if(a==="lisfilter"){ui.listen.filter=V("data-val");ui.listen.playing=false;nextListenToken();try{window.speechSynthesis.cancel();}catch(_){}ui.listen._filterBuilt=null;saveUI();render();return;}
  if(a==="lisplay"){
    ensureListenQueue();
    ui.listen.playing=!ui.listen.playing;
    nextListenToken();
    try{window.speechSynthesis.cancel();}catch(_){}
    saveUI();render();
    if(ui.listen.playing)lisSpeakCurrent();
    return;
  }
  if(a==="lisprev"){ensureListenQueue();ui.listen.idx=Math.max(0,ui.listen.idx-1);nextListenToken();try{window.speechSynthesis.cancel();}catch(_){}saveUI();render();if(ui.listen.playing)lisSpeakCurrent();return;}
  if(a==="lisnext"){ensureListenQueue();ui.listen.idx=Math.min(ui.listen.order.length-1,ui.listen.idx+1);nextListenToken();try{window.speechSynthesis.cancel();}catch(_){}saveUI();render();if(ui.listen.playing)lisSpeakCurrent();return;}
  if(a==="lisrepeat1"){
    // 1語リピート：現在の単語だけをもう一度読む（再生中でなくても単発で聞ける）
    ensureListenQueue();nextListenToken();try{window.speechSynthesis.cancel();}catch(_){}
    var wasPlaying=ui.listen.playing;ui.listen.playing=true;saveUI();render();
    lisSpeakCurrent().then(function(){if(!wasPlaying){ui.listen.playing=false;saveUI();render();}});
    return;
  }
  if(a==="lisrepeat"){ui.listen.repeat=!ui.listen.repeat;saveUI();render();return;}
  if(a==="lisrate"){var rr=[0.7,0.8,0.9,1.0];var ci=rr.indexOf(ui.listen.rate);ui.listen.rate=rr[(ci+1+rr.length)%rr.length];saveUI();render();return;}
  if(a==="lismode"){var modes=["ru-only","ru-ja","ja-ru","ru-ja-ru"];var mi=modes.indexOf(ui.listen.mode||"ru-ja");ui.listen.mode=V("data-val")||modes[(mi+1)%modes.length];saveUI();render();return;}
  if(a==="lisgap"){ui.listen.wordGapMs=+V("data-val");saveUI();render();return;}
  if(a==="lisshuffle"){ui.listen.shuffle=!ui.listen.shuffle;ui.listen._filterBuilt=null;saveUI();render();return;}
  if(a==="lisrange"){
    var rg=V("data-val");ui.listen.range=rg;
    if(rg==="10")ui.listen.order=ui.listen.order.slice(0,10);
    else if(rg==="50")ui.listen.order=ui.listen.order.slice(0,50);
    ui.listen.idx=0;nextListenToken();try{window.speechSynthesis.cancel();}catch(_){}ui.listen.playing=false;
    saveUI();render();return;
  }
  if(a==="lisja"){ui.listen.showJa=!ui.listen.showJa;saveUI();render();return;}
  if(a==="lisfav"){var lp=P(V("data-val"));lp.favorite=!lp.favorite;saveAll();render();return;}
  if(a==="lisquickfilter"){var qf=V("data-val");ui.listen.filter=qf;ui.listen._filterBuilt=null;ensureListenQueue();ui.listen.playing=true;nextListenToken();try{window.speechSynthesis.cancel();}catch(_){}saveUI();render();lisSpeakCurrent();return;}
  // 反復スピーキングドリル
  if(a==="drillstart"){var D=ensureDrill();D.running=true;drillCycle();return;}
  if(a==="drillstop"){var D2=ensureDrill();D2.running=false;D2.phase="idle";D2.repDone=0;drillStopTimers();render();return;}
  if(a==="drillnext"){var D3=ensureDrill();drillStopTimers();D3.idx=Math.min(drillList().length-1,D3.idx+1);D3.phase="idle";D3.repDone=0;if(D3.running){drillCycle();}else{render();}return;}
  if(a==="drillprev"){var D4=ensureDrill();drillStopTimers();D4.idx=Math.max(0,D4.idx-1);D4.phase="idle";D4.repDone=0;if(D4.running){drillCycle();}else{render();}return;}
  if(a==="drillreps"){ensureDrill().reps=+V("data-val");render();return;}
  if(a==="drillmode"){var D5=ensureDrill();D5.mode=V("data-val");drillStopTimers();D5.running=false;D5.phase="idle";D5.repDone=0;render();return;}
  if(a==="drillspeed"){ensureDrill().speed=+V("data-val");render();return;}
  // AI会話
  if(a==="aisend"){journeyBump("aichat",1);xpAdd(15);aiSend();return;} /* PHASE20 */
  if(a==="ailevel"){ensureAIChat().level=V("data-val");render();return;}
  /* PHASE10: 要確認データ画面 */
  if(a==="openreviewqueue"){clearTransientUI();ui.bnav="wordbook";ui.learnOpen=true;ui.view="reviewqueue";ui.p10Filter="all";saveUI();render();return;}
  if(a==="p10filter"){ui.p10Filter=V("data-val");render();return;}
});
document.body.addEventListener("change",function(e){
  var t=e.target;if(!t||!t.getAttribute)return;var a=t.getAttribute("data-act");
  if(a==="unitsel"){var key=t.getAttribute("data-key");ui[key]=+t.value;if(key==="readUnit")ui.readIdx=0;if(key==="aloudUnit"){ui.aloudIdx=0;ui.aloudCount=0;}if(key==="drillUnit"&&ui.drill){drillStopTimers();ui.drill.running=false;ui.drill.idx=0;ui.drill.phase="idle";ui.drill.repDone=0;}saveUI();render();return;}
  if(a==="weaktagsel"){ui.weakTag=t.value;saveUI();render();return;}
});
document.body.addEventListener("input",function(e){
  var t=e.target;if(!t||!t.getAttribute)return;var act=t.getAttribute("data-act");
  if(act==="searchbox"){
    ui.search.q=t.value;
    var selStart=t.selectionStart,selEnd=t.selectionEnd;
    saveUI();render();
    var nt=document.getElementById("wordSearchBox");
    if(nt){try{nt.focus();nt.setSelectionRange(selStart,selEnd);}catch(_){}}
  }
});

/* ===== init ===== */
try{ if(!ui.view)ui.view="word"; if(!ui.bnav)ui.bnav="home"; applyDisplayPrefs(); render(); }catch(err){ showFatal((err&&err.stack)||err); }
/*JS_END*/
</script>
</body>
</html>
