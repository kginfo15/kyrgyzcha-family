<!DOCTYPE html>
<!--
  Кыргызча — 日本人初学者向け キルギス語 A1/A2 学習アプリ（v4）
  ============================================================
  - ロシア語版（Русский v1 / PHASE46）の画面・学習機能をそのまま移植し、
    データ（単語1300語・瞬間作文400文）と文法ノート・会話教材をキルギス語用に差し替え。
  - 配色：黒ベース＋国旗の赤（#E5332A）と金（#F2B705）。
  - 例文・解説・文法ノートはすべて新規作成の draft（ネイティブ確認前）。
  - 読み上げ：端末にキルギス語音声があれば使い、無ければロシア語音声で近似（ө→о, ү→у, ң→нг）。
  - 外部通信は AI会話（既定オフ）のみ。学習データは localStorage に保存。
  ============================================================
-->
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F7F9FD">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Кыргызча">
<title>Кыргызча — A1・A2</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%23C8102E'/%3E%3Cpath d='M50 20 C50 30 60 33 60 43 C60 52 53 55 53 61 L47 61 C47 55 40 52 40 43 C40 33 50 30 50 20 Z' fill='%23F2B705'/%3E%3C/svg%3E">
<style>
  /* ===== KG: 黒ベース＋国旗の赤と金の配色（Distinction系の落ち着いたダーク） ===== */
  :root{
    --bg:#000000; --bg2:#000000; --card:#1E1A18; --card2:#2D2724;
    --line:#2D2724; --lineStrong:#3D3531;
    --ink:#FFFFFF; --muted:#98989F; --mutedSoft:#6E6E73;
    --accent:#E5332A; --accentDeep:#B3261E; --accentSoft:rgba(229,51,42,.16);
    --blue:#E5332A; --blueDeep:#B3261E; --sub:#F2B705;
    --good:#30D158; --warn:#FF9F0A; --danger:#FF453A; --star:#F2B705;
    --navy:#E5332A; --teal:#F2B705; --gold:#F2B705; --goldSoft:rgba(255,214,10,.25);
    --red:#FF453A; --redDeep:#D93A30; --yellow:#FF9F0A;
    --paper:var(--bg); --ink2:#FFFFFF;
    --chipBg:#2C2C2E; --chipText:#AEAEB2;
    --easyBg:rgba(48,209,88,.10); --easyBorder:rgba(48,209,88,.24);
    --noteBg:rgba(255,159,10,.10); --noteBorder:rgba(255,159,10,.24);
    --mistakeBg:rgba(255,69,58,.10); --mistakeBorder:rgba(255,69,58,.24);
    --pillBg:#2C2C2E; --track2:#2C2C2E;
    --sky:#1C1C1E;
    --radius:14px; --radiusLg:18px;
    --shadow:none;
    --glow:none;
  }
  /* モード別アクセント（彩度は抑えめに、判別できる程度） */
  body.p23-compose{ --accent:#30D158; --accentDeep:#25A745; --accentSoft:rgba(48,209,88,.14);
    --blue:#30D158; --blueDeep:#25A745; --star:#30D158; }
  body.p21-challenge{ --accent:#BF5AF2; --accentDeep:#9F45CC; --accentSoft:rgba(191,90,242,.14);
    --blue:#BF5AF2; --blueDeep:#9F45CC; --star:#BF5AF2; }
  #root{position:relative;z-index:1}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;overflow-x:hidden;width:100%}
  body{background:var(--bg);color:var(--ink);
    padding-bottom:calc(92px + env(safe-area-inset-bottom));
    font-family:system-ui,-apple-system,"Helvetica Neue","Hiragino Sans","Noto Sans JP",sans-serif;
    -webkit-text-size-adjust:100%;line-height:1.5;min-height:100vh}
  /* PHASE27: ヘッダーを「アイコン+丸ボタン2つ」の量産感あるレイアウトから、余白で見せる静かなマストヘッドへ */
  header.app{background:transparent;color:var(--ink);padding:calc(20px + env(safe-area-inset-top)) 18px 16px;
    border-bottom:1px solid var(--line)}
  header.app .row{display:flex;align-items:flex-end;gap:12px;max-width:600px;margin:0 auto}
  header.app h1{margin:0;font-size:21px;font-weight:800;letter-spacing:-.3px;color:var(--ink)}
  header.app p{margin:2px 0 0;font-size:11px;color:var(--mutedSoft);letter-spacing:.5px;text-transform:uppercase;font-weight:700}
  header.app .hact{margin-left:auto;display:flex;gap:6px}
  header.app .hact button{background:none;border:none;color:var(--muted);
    width:36px;height:36px;border-radius:10px;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center}
  header.app .hact button:active{background:var(--card2)}
  .tagpill{display:inline-block;padding:6px 16px;border-radius:99px;background:var(--card2);border:1px solid var(--line);
    color:var(--muted);font-size:12.5px;font-weight:700;letter-spacing:.2px;max-width:92%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;vertical-align:bottom}
  .statcard{padding:13px 14px;display:flex;align-items:center;justify-content:space-between;gap:8px}
  .achbigrow{display:flex;gap:10px}
  .achbig{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 10px;text-align:center;flex:1}
  .skillrow{display:flex;justify-content:space-between;gap:4px}
  .skillcell{text-align:center;flex:1}
  .extrabtn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:12px;margin-top:10px;
    border-radius:13px;background:var(--card2);border:1px solid var(--lineStrong);color:var(--ink);font-size:14px;font-weight:700;cursor:pointer;touch-action:manipulation}
  /* legacy top tabs kept for internal routing only; hidden from primary UI */
  nav.tabs{display:none}
  main{max-width:600px;margin:0 auto;padding:14px 14px 0;width:100%;box-sizing:border-box}
  main *{min-width:0}
  main svg{min-width:auto;flex-shrink:0}
  .card,.row2,.planrow,.toprow,.minicard,.statcard,.achrow,.hero,.resumecard,.streakcard,.tipcard,.hubcard,.achbig,.skillcell{max-width:100%}
  .btn{appearance:none;border:1.5px solid var(--line);background:var(--card);color:var(--ink);
    padding:12px 14px;border-radius:13px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;min-height:46px}
  .btn:active{transform:translateY(1px)}
  .btn.primary{background:linear-gradient(135deg,var(--blue),var(--blueDeep));border-color:transparent;color:#fff;
    box-shadow:0 8px 20px rgba(11,124,255,.28)}
  .full{width:100%}
  .ghost{background:transparent;color:var(--muted);border-color:transparent}
  .seg{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
  .seg button{flex:1;min-width:60px;padding:9px 6px;border-radius:99px;font-size:13px;font-weight:800;
    cursor:pointer;white-space:nowrap;border:1.5px solid var(--line);background:var(--card);color:var(--muted);min-height:44px;touch-action:manipulation}
  .seg button.on{background:var(--blue);border-color:var(--blue);color:#fff}
  .badge{font-size:11.5px;font-weight:800;color:#fff;padding:2px 9px;border-radius:99px;display:inline-block}
  .bar{height:8px;background:var(--track2);border-radius:99px;overflow:hidden}
  .bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--sub));border-radius:99px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:0 4px 20px rgba(15,23,42,.06)}
  .muted{color:var(--muted)} .small{font-size:12px}
  .h2{font-size:13px;font-weight:800;color:var(--muted);margin:18px 2px 8px;letter-spacing:.3px}
  .row2{display:flex;align-items:center;gap:12px;padding:13px 14px;border:1px solid var(--line);
    border-radius:14px;background:var(--card);margin-bottom:10px;cursor:pointer;touch-action:manipulation;width:100%;text-align:left}
  .row2 *{pointer-events:none}
  .row2.dis{opacity:.4}
  .bdcards{margin-top:8px;display:flex;flex-direction:column;gap:8px}
  .bdc{border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:var(--card2)}
  .bdc .top{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
  .bdc .sf{font-weight:800;color:var(--sub);font-size:15px}
  .bdc .bs{font-size:12px;color:var(--muted)}
  .bdc .mn{font-size:13.5px;margin-top:3px;overflow-wrap:anywhere;word-break:break-word}
  .bdc .wy{font-size:12.5px;color:var(--chipText);margin-top:3px;line-height:1.7;overflow-wrap:anywhere;word-break:break-word}
  .row2 .meta{flex:1;min-width:0}
  .row2 .nm{font-weight:800;font-size:15px}
  .row2 .ct{font-size:12px;color:var(--muted);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .row2 .rt{text-align:right;font-size:12px;color:var(--muted);min-width:62px}
  .row2 .rt b{font-size:16px;color:var(--ink);font-variant-numeric:tabular-nums}
  .pill{display:inline-block;font-size:11px;font-weight:800;padding:1px 8px;border-radius:99px;background:var(--pillBg);color:var(--warn)}
  .study .top{display:flex;align-items:center;gap:8px;margin-bottom:12px}
  .qcard{padding:26px 20px;text-align:center;position:relative}
  .jp{font-size:clamp(18px,5.2vw,23px);font-weight:800;line-height:1.4;overflow-wrap:anywhere;word-break:break-word}
  .ru{font-size:clamp(24px,7vw,30px);font-weight:800;color:var(--ink);line-height:1.35;overflow-wrap:anywhere;word-break:break-word}
  .accent{font-size:clamp(24px,7vw,30px);font-weight:800;color:var(--ink);line-height:1.4;overflow-wrap:anywhere;word-break:break-word}
  .kana{font-size:clamp(15px,4.5vw,18px);color:var(--sub);font-weight:800;margin-top:6px;overflow-wrap:anywhere}
  .accent .big{font-size:34px}
  .kana.dim{opacity:.25}
  .mean{font-size:17px;margin-top:10px;font-weight:600;overflow-wrap:anywhere;word-break:break-word}
  .easy{margin-top:12px;padding:13px 15px;background:var(--easyBg);border:1px solid var(--easyBorder);border-radius:12px;
    font-size:14.5px;line-height:1.75;white-space:pre-line;text-align:left;color:var(--ink)}
  .easy .h{font-size:12.5px;font-weight:800;color:var(--sub);margin-bottom:5px}
  details.more{margin-top:10px;text-align:left;border:1px solid var(--line);border-radius:12px;overflow:hidden}
  details.more>summary{list-style:none;cursor:pointer;padding:11px 14px;font-weight:800;font-size:13.5px;color:var(--sub);background:var(--card2)}
  details.more>summary::-webkit-details-marker{display:none}
  details.more .inner{padding:12px 14px;font-size:13.5px;line-height:1.8}
  .gd{white-space:pre-line;line-height:1.75;overflow-wrap:anywhere;word-break:break-word}
  .bd{width:100%;border-collapse:collapse;margin-top:8px;font-size:12.5px}
  .bd th,.bd td{border:1px solid var(--line);padding:6px 7px;text-align:left;vertical-align:top}
  .bd th{background:var(--chipBg);font-weight:800;color:var(--chipText);white-space:nowrap}
  .bd td.s{font-weight:800;color:var(--sub)}
  .note{margin-top:8px;padding:9px 12px;background:var(--noteBg);border:1px solid var(--noteBorder);border-radius:10px;font-size:12.5px;line-height:1.7;color:var(--ink);overflow-wrap:anywhere;word-break:break-word}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
  .chips span{font-size:12.5px;background:var(--chipBg);border-radius:8px;padding:4px 9px;color:var(--chipText);overflow-wrap:anywhere;word-break:break-word;max-width:100%}
  .kv{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
  .kv span{font-size:12px;background:var(--chipBg);border-radius:8px;padding:3px 9px;color:var(--chipText);overflow-wrap:anywhere;word-break:break-word;max-width:100%}
  .ans3{display:flex;gap:8px;margin-top:14px}
  .ans3 button{flex:1;border:none;color:#fff;border-radius:13px;font-size:14px;font-weight:800;padding:14px 4px;cursor:pointer;min-height:54px}
  .a-no{background:var(--danger)} .a-mb{background:var(--warn)} .a-ok{background:var(--good)}
  .qcard{background:#0F1B2E;border-color:#1e2b40;color:#fff}
  .qcard .accent,.qcard .jp,.qcard .mean,.qcard .ru{color:#fff}
  .qcard .small.muted,.qcard .muted{color:#94A3B8}
  .qcard .roma{color:#94A3B8}
  .qcard .tagpill{background:#1c2942;border-color:#2b3b57;color:#cbd5e1}
  .qcard .star{color:#64748B}
  .qcard .star.on{color:var(--blue)}
  .qcard .extrabtn{background:#16233b;border-color:#26344f;color:#e2e8f0}
  .star{position:absolute;top:12px;right:12px;background:none;border:none;font-size:22px;cursor:pointer;color:var(--mutedSoft)}
  .star.on{color:var(--star)}
  .empty{margin-top:22px;padding:30px 20px;text-align:center;color:var(--muted);border:1px dashed var(--line);
    border-radius:16px;background:var(--card);font-size:14.5px;line-height:1.7;white-space:pre-line}
  .stat{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .stat .b{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
  .stat .n{font-size:23px;font-weight:800;font-variant-numeric:tabular-nums}
  .stat .l{font-size:12px;color:var(--muted)}
  .reviewcat{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:13px;background:var(--card);margin-bottom:8px}
  .reviewcat .n{font-weight:800;font-size:18px;font-variant-numeric:tabular-nums}
  .setrow{margin-bottom:16px}
  .setrow .lab{font-size:13.5px;font-weight:800;margin-bottom:7px}
  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom));
    background:var(--card2);color:var(--ink);border:1px solid var(--lineStrong);padding:10px 16px;border-radius:99px;font-size:13px;z-index:80;opacity:0;transition:opacity .2s;pointer-events:none}
  .toast.show{opacity:1}
  .counter{font-size:40px;font-weight:800;color:var(--sub);font-variant-numeric:tabular-nums}
  .roma{font-size:13px;color:var(--muted);letter-spacing:.4px;margin-top:3px}
  .spkrow{display:flex;gap:10px;justify-content:center;align-items:center;margin-top:12px;flex-wrap:wrap;max-width:100%}
  .spkrow button{border:1.5px solid var(--lineStrong);background:var(--card2);color:var(--ink);border-radius:99px;
    padding:9px 16px;font-size:13.5px;font-weight:800;cursor:pointer;font-family:inherit;touch-action:manipulation}
  .spkrow button.pri{background:linear-gradient(135deg,var(--blue),var(--blueDeep));color:#fff;border-color:transparent}

  /* ===== bottom nav ===== */
  nav.bnav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(0,0,0,.96);
    -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--line);
    box-shadow:0 -6px 20px rgba(15,23,42,.05);padding-bottom:env(safe-area-inset-bottom)}
  nav.bnav .inner{max-width:600px;margin:0 auto;display:flex}
  nav.bnav button{flex:1;background:transparent;border:none;color:var(--mutedSoft);padding:9px 2px 8px;
    min-height:48px;font-size:10.5px;font-weight:700;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;touch-action:manipulation}
  nav.bnav button .ic{width:24px;height:24px;display:flex;align-items:center;justify-content:center}
  nav.bnav button.on{color:var(--blue)}

  /* ===== home dashboard ===== */
  .hero{padding:8px 2px 4px}
  .hero .greet{font-size:19px;font-weight:800}
  .hero .sub{font-size:12.5px;color:var(--muted);margin-top:2px}
  .resumecard{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:16px;margin:12px 0;
    background:var(--sky);border:1px solid #CFE0FB}
  .streakcard{display:flex;align-items:center;gap:13px;padding:15px 16px;border-radius:18px;margin-top:6px;
    background:linear-gradient(135deg,#FFF3E9,#FFFAF5);border:1px solid #FBE0C8}
  .streakcard .fire{width:46px;height:46px;border-radius:50%;background:#FFE7D2;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
  .streakcard .days{font-size:17px;font-weight:800}
  .streakcard .sub{font-size:11.5px;color:var(--muted);margin-top:1px}
  .streakmini{display:flex;flex-direction:column;gap:5px}
  .streakmini a{display:flex;align-items:center;gap:6px;justify-content:flex-end;font-size:12px;font-weight:800;color:var(--muted)}
  .streakmini .lv{width:26px;text-align:center;color:#fff;border-radius:6px;font-size:11px;padding:1px 0}
  .plancard{padding:6px 16px 10px;margin-top:14px}
  .plancard .ttl{font-weight:800;font-size:15px;margin:12px 0 2px}
  .plancard .ttlsub{font-size:11.5px;color:var(--muted);margin-bottom:6px}
  .planrow{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);
    border-top:none;border-left:none;border-right:none;background:none;width:100%;text-align:left;cursor:pointer;touch-action:manipulation;font:inherit;color:inherit}
  .planrow *{pointer-events:none}
  .planrow:last-child{border-bottom:none}
  .planrow .tx{flex:1;min-width:0}
  .planrow .tx b{font-size:14.5px}
  .planrow .tx div{font-size:11.5px;color:var(--muted);margin-top:1px}
  .planrow .n{font-weight:800;font-size:15px;font-variant-numeric:tabular-nums;color:var(--ink)}
  .cta{margin-top:14px;padding:16px;border-radius:16px;text-align:center;font-weight:800;font-size:16px;color:#fff;
    background:linear-gradient(135deg,var(--blue),var(--blueDeep));cursor:pointer;border:none;width:100%;
    display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 10px 24px rgba(11,99,246,.28)}
  .mini5{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
  .minicard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 10px;text-align:center;box-shadow:0 4px 16px rgba(15,23,42,.05)}
  .minicard .n{font-size:19px;font-weight:800;font-variant-numeric:tabular-nums}
  .minicard .n small{font-size:11px;font-weight:700;color:var(--muted)}
  .minicard .l{font-size:11px;color:var(--muted);margin-top:2px}
  .minicard .sub{font-size:10px;color:var(--mutedSoft);margin-top:1px}
  .tipcard{display:flex;gap:11px;padding:14px 16px;border-radius:16px;margin-top:14px;background:var(--sky);border:1px solid #CFE0FB}
  .tipcard .ic{flex:0 0 auto;color:var(--blue)}
  .tipcard b{font-size:13.5px}
  .tipcard p{margin:3px 0 0;font-size:12.5px;color:#334155;line-height:1.7}
  .statgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
  .statgrid .card{padding:13px 14px}
  .statgrid .n{font-size:21px;font-weight:800;font-variant-numeric:tabular-nums}
  .statgrid .l{font-size:11.5px;color:var(--muted);margin-top:2px}
  .achcard{padding:16px;margin-top:12px}
  .achrow{margin-bottom:12px}
  .achrow:last-child{margin-bottom:0}
  .achrow .top2{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
  .achrow .top2 b{font-size:14.5px}
  .achrow .top2 span{font-size:12px;color:var(--muted)}
  .msring{display:flex;align-items:center;gap:16px}
  .msring .num{font-size:30px;font-weight:800;font-variant-numeric:tabular-nums}
  .msring .lab{font-size:12px;color:var(--muted);margin-top:2px}

  /* ===== learn hub ===== */
  .hubgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .hubcard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 14px;
    text-align:left;cursor:pointer;touch-action:manipulation;color:var(--ink)}
  .hubcard *{pointer-events:none}
  .hubcard .ic{font-size:22px}
  .hubcard .nm{font-weight:800;font-size:14.5px;margin-top:8px}
  .hubcard .ct{font-size:11.5px;color:var(--muted);margin-top:2px}
  .subhead{display:flex;align-items:center;gap:10px;margin-bottom:14px}
  .subhead button{background:var(--card);border:1px solid var(--line);color:var(--ink);width:36px;height:36px;
    border-radius:11px;font-size:15px;cursor:pointer}
  .subhead .ttl{font-weight:800;font-size:16px}

  /* ===== filter sheet ===== */
  .sheetwrap{position:fixed;inset:0;z-index:60;background:rgba(15,23,42,.45);display:flex;align-items:flex-end}
  .onboardWrap{position:fixed;inset:0;z-index:95;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px;box-sizing:border-box}
  .onboardCard{max-width:420px;width:100%;margin:0 auto;text-align:center}
  .onboardDots{display:flex;justify-content:center;gap:6px;margin-bottom:24px}
  .onboardDots i{display:block;height:8px;border-radius:99px;background:var(--line)}
  .onboardDots i.on{background:var(--blue)}
  body.fs-large{zoom:1.12}
  body.density-compact .card{padding:10px 12px}
  body.density-compact .plancard{padding:4px 12px 8px}
  body.reduce-motion *{transition:none!important;animation:none!important}
  .sheet{background:var(--card);border-top:1px solid var(--line);border-radius:20px 20px 0 0;
    padding:10px 16px calc(18px + env(safe-area-inset-bottom));max-width:600px;margin:0 auto;width:100%;
    max-height:82vh;overflow-y:auto;box-sizing:border-box}
  .sheetbar{width:40px;height:5px;border-radius:99px;background:var(--line);margin:0 auto 12px}
  .sheethead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
  .sheethead h3{margin:0;font-size:16px;min-width:0;overflow-wrap:anywhere}
  .sheetclose{width:40px;height:40px;min-width:40px;border-radius:50%;background:var(--card2);border:1px solid var(--line);
    color:var(--muted);font-size:16px;cursor:pointer;flex:0 0 auto;display:flex;align-items:center;justify-content:center;touch-action:manipulation}
  .sheet h3{margin:0 0 14px;font-size:16px}
  .sheet .inner{line-height:1.9;font-size:13.5px;color:var(--muted);overflow-wrap:anywhere;word-break:break-word}

  /* ===== weekly chart ===== */
  .wchart{display:flex;align-items:flex-end;gap:8px;height:110px;margin-top:14px;padding:0 2px}
  .wchart .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;touch-action:manipulation}
  .wchart .colbar{width:100%;max-width:28px;background:var(--track2);border-radius:8px 8px 4px 4px;position:relative;height:74px;display:flex;align-items:flex-end;overflow:hidden}
  .wchart .colbar i{display:block;width:100%;background:linear-gradient(180deg,var(--sub),var(--blue));border-radius:8px 8px 4px 4px}
  .wchart .col.today .colbar i{background:linear-gradient(180deg,var(--star),var(--warn))}
  .wchart .lab{font-size:10.5px;color:var(--muted);font-weight:700}
  .toplist{margin-top:8px}
  .toprow{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--card);margin-bottom:8px}
  .toprow .rk{width:22px;height:22px;border-radius:50%;background:var(--chipBg);color:var(--muted);font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
  .toprow .w{flex:1;min-width:0}
  .toprow .w b{font-size:14.5px;overflow-wrap:anywhere;word-break:break-word}
  .toprow .pct{font-size:12.5px;color:var(--danger);font-weight:800}

  /* ===== listening ===== */
  .lisplaylist{padding:16px;margin-bottom:12px}
  .waveform{width:100%;display:flex;align-items:center;gap:3px;height:36px;margin:10px 0;overflow:hidden;max-width:100%}
  .waveform i{display:block;flex:1;min-width:2px;max-width:5px;border-radius:999px;background:linear-gradient(180deg,var(--sub),var(--blue))}
  .lisnow{padding:24px 18px;text-align:center}
  .lisnow .ru2{font-size:26px;font-weight:800;margin-top:6px}
  .lisnow .ja2{font-size:15px;color:var(--muted);margin-top:6px}
  .lisctrl{display:flex;align-items:center;justify-content:center;gap:22px;margin-top:16px}
  .lisctrl button{background:none;border:none;color:var(--ink);
    display:flex;align-items:center;justify-content:center;width:44px;height:44px;cursor:pointer;touch-action:manipulation}
  .lisctrl button.play{width:60px;height:60px}
  .lissub{display:flex;justify-content:center;gap:10px;margin-top:14px;flex-wrap:wrap}
  .filtertabs{display:flex;gap:8px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:2px;margin-bottom:2px}
  .filtertabs::-webkit-scrollbar{display:none}
  .filtertabs button{flex:0 0 auto;white-space:nowrap}
  .lissub button{font-size:12px;padding:7px 12px;min-height:40px;border-radius:99px;border:1.5px solid var(--line);background:var(--card);color:var(--muted);font-weight:800;cursor:pointer}
  .lissub button.on{background:var(--blue);border-color:var(--blue);color:#fff}
  .filtertabs button{font-size:13px;padding:9px 16px;min-height:40px;border-radius:99px;border:1.5px solid var(--line);background:var(--card);color:var(--muted);font-weight:800;cursor:pointer;touch-action:manipulation}
  .filtertabs button.on{background:var(--blue);border-color:var(--blue);color:#fff}

  /* ===== レスポンシブ（Phase 2.5） ===== */
  @media (max-width:390px){
    .mini5{grid-template-columns:repeat(2,1fr)}
    .skillrow{flex-wrap:wrap}
    .skillrow .skillcell{flex:1 1 40%}
    .achbigrow{gap:8px}
    nav.bnav button{font-size:9.8px;padding:8px 1px 7px}
    .cta{font-size:15px;padding:14px}
  }
  @media (max-width:340px){
    .mini5{grid-template-columns:1fr 1fr}
    .statgrid{grid-template-columns:1fr}
    .achbigrow{flex-direction:column}
    .hubgrid{grid-template-columns:1fr}
    .ans3{gap:6px}
    .ans3 button{font-size:12.5px;padding:12px 2px;min-height:48px}
    nav.bnav button{font-size:9px;padding:7px 1px 6px}
    .streakcard{flex-wrap:wrap}
    .streakmini{width:100%;flex-direction:row;justify-content:space-between;margin-top:8px}
  }

  /* ===== Phase 7 デザインリファイン：スマート＆モチベーション ===== */
  .qcard{cursor:pointer;transition:transform .12s ease,box-shadow .2s ease}
  .qcard:active{transform:scale(.985)}
  .qcard .taphint{margin-top:18px;color:var(--mutedSoft);font-size:12px;display:flex;align-items:center;justify-content:center;gap:6px;animation:tapPulse 1.8s ease-in-out infinite}
  @keyframes tapPulse{0%,100%{opacity:.45}50%{opacity:1}}
  .btn.primary{box-shadow:0 8px 22px rgba(11,99,246,.32)}
  .card{box-shadow:0 6px 20px rgba(15,23,42,.08)}
  .hubcard{box-shadow:0 4px 14px rgba(15,23,42,.06);transition:transform .12s ease}
  .hubcard:active{transform:scale(.97)}
  .hero .greet{background:linear-gradient(120deg,var(--ink) 30%,#E5332A 90%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  .drillcard{background:linear-gradient(150deg,#E5332A 0%,#4338CA 65%,#6D28D9 100%);color:#fff;border-radius:20px;padding:26px 20px;text-align:center;box-shadow:0 14px 38px rgba(11,99,246,.35)}
  .drillcard .ja{font-size:22px;font-weight:800;line-height:1.5}
  .drillcard .ru{font-size:24px;font-weight:800;margin-top:14px;line-height:1.45}
  .drillcard .kana{color:rgba(255,255,255,.75);font-size:14px;margin-top:6px}
  .drillcount{display:inline-flex;gap:7px;margin-top:16px}
  .drillcount i{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.3)}
  .drillcount i.on{background:#FFD34D;box-shadow:0 0 10px rgba(255,211,77,.8)}
  .aichat{display:flex;flex-direction:column;gap:10px;margin:12px 0}
  .aimsg{max-width:86%;padding:12px 15px;border-radius:16px;line-height:1.75;font-size:15px;white-space:pre-wrap;word-break:break-word}
  .aimsg.user{align-self:flex-end;background:linear-gradient(135deg,var(--blue),var(--blueDeep));color:#fff;border-bottom-right-radius:6px}
  .aimsg.ai{align-self:flex-start;background:var(--card);border:1px solid var(--line);border-bottom-left-radius:6px;box-shadow:0 4px 12px rgba(15,23,42,.06)}
  .aiinput{display:flex;gap:8px;position:sticky;bottom:calc(70px + env(safe-area-inset-bottom));background:var(--bg);padding:8px 0}
  .aiinput textarea{flex:1;border:1px solid var(--line);border-radius:14px;padding:11px 13px;font-size:15px;resize:none;background:var(--card);color:var(--ink);font-family:inherit;min-height:46px;max-height:120px}
  .aiinput button{width:52px;min-width:52px;border-radius:14px;border:none;background:linear-gradient(135deg,var(--blue),var(--blueDeep));color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 16px rgba(11,99,246,.35)}
  .gramtable{width:100%;border-collapse:collapse;margin-top:8px;font-size:12.5px}
  .gramtable th,.gramtable td{border:1px solid var(--line);padding:6px 8px;text-align:left}
  .gramtable th{background:var(--card2);font-weight:800;white-space:nowrap}

  /* PHASE29: 旧・白背景カード用CSSはダークテーマと矛盾するため削除（配色は :root と PHASE29 ブロックで統一） */
  .p8-grammarbtn{width:100%;margin-top:14px;padding:15px 16px;border-radius:14px;border:none;
    background:linear-gradient(135deg,#E5332A,#E5332A);color:#fff;font-size:15.5px;font-weight:800;
    cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;
    box-shadow:0 8px 20px rgba(11,99,246,.30);touch-action:manipulation}
  .p8-grammarbtn.open{background:#F1F5F9;color:#E5332A;box-shadow:none;border:1.5px solid #C7D2FE}
  .p8-grammarpanel{margin-top:12px;padding:14px 16px;background:var(--card2);border:1px solid var(--line);
    border-radius:14px;text-align:left;color:var(--ink);font-size:13.5px;line-height:1.85}

  /* ===== PHASE8-2: ホーム画面クイック学習チップ（既存buildQueueをそのまま呼ぶだけ・新規重複ロジックなし） ===== */
  .qchipgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
  .qchip{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 8px;
    text-align:center;cursor:pointer;touch-action:manipulation;color:var(--ink);display:flex;flex-direction:column;
    align-items:center;gap:6px;box-shadow:0 4px 12px rgba(15,23,42,.05)}
  .qchip *{pointer-events:none}
  .qchip .qc-ic{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center}
  .qchip .qc-label{font-size:11.5px;font-weight:800;line-height:1.3}
  .qchip .qc-count{font-size:10.5px;color:var(--muted);font-weight:700}
  @media (max-width:340px){.qchipgrid{grid-template-columns:repeat(2,1fr)}}

  /* ===== PHASE10: 要確認バッジ・文法解説パネルの追加スタイル ===== */
  .p10-badge{display:inline-block;margin-top:8px;padding:4px 10px;border-radius:999px;
    background:#FEF3C7;color:#92400E;font-size:11.5px;font-weight:800;border:1px solid #FDE68A}
  .p10-detailexp{color:var(--ink);line-height:1.8;font-size:13.5px}
  .p10-changerule{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);font-size:13px;color:var(--ink)}
  .p10-reviewrow{display:flex;align-items:center;gap:10px;padding:12px 14px;border:1px solid var(--line);
    border-radius:14px;margin-bottom:8px;background:var(--card)}
  .p10-reviewrow .tag{font-size:10.5px;font-weight:800;padding:2px 8px;border-radius:999px;background:#FEF3C7;color:#92400E}
  .p10-reviewrow .tag.quarantine{background:#FEE2E2;color:#991B1B}

  /* ===== PHASE12: 学習カードの操作ボタンを画面下部に固定表示（解説が長くてもスクロール不要） ===== */
  .p12-stickybar{position:fixed;left:0;right:0;bottom:calc(78px + env(safe-area-inset-bottom));
    z-index:25;padding:8px 14px;pointer-events:none}
  .p12-stickybar .inner{max-width:600px;margin:0 auto;display:flex;gap:8px;pointer-events:auto;
    background:rgba(28,28,30,.98);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
    padding:8px;border-radius:16px;box-shadow:0 -4px 20px rgba(15,23,42,.10);border:1px solid var(--line)}
  .p12-stickybar .ans3btn{flex:1;border:none;border-radius:12px;padding:14px 6px;color:#fff;font-weight:800;
    font-size:14px;cursor:pointer;touch-action:manipulation}
  .p12-stickybar .a-no{background:var(--danger)} .p12-stickybar .a-mb{background:var(--warn)}
  .p12-stickybar .a-ok{background:var(--good)}
  .p12-stickybar .a-reveal{background:linear-gradient(135deg,var(--blue),var(--blueDeep));flex:2}
  .study{padding-bottom:96px} /* 固定バーに隠れないよう余白を確保 */

  /* ===== PHASE14: ホーム画面「強化モード／通常モード」選択ボタン ===== */
  .p14-modesel{display:flex;gap:10px;margin:14px 0}
  .p14-modebtn{flex:1;border:none;border-radius:16px;padding:16px 10px;cursor:pointer;touch-action:manipulation;
    display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:800}
  .p14-modebtn .p14-ic{width:40px;height:40px;border-radius:14px;display:flex;align-items:center;justify-content:center;margin-bottom:2px}
  .p14-modebtn.reinforce{background:linear-gradient(135deg,#F97316,#EA580C);color:#fff;box-shadow:0 8px 20px rgba(249,115,22,.30)}
  .p14-modebtn.reinforce .p14-ic{background:rgba(255,255,255,.22)}
  .p14-modebtn.normal{background:var(--card);border:1px solid var(--line);color:var(--ink)}
  .p14-modebtn.normal .p14-ic{background:rgba(11,99,246,.12)}
  .p14-modebtn .p14-sub{font-size:11px;font-weight:600;opacity:.85}

  /* ================= PHASE15: 全面UIリニューアル（Apple HIG / Distinction 2000 志向） ================= */
  /* --- ホーム：CTAひとつだけ。余白を大きく --- */
  .p15-home{padding:8px 2px 0}
  .p15-hometop{display:flex;align-items:center;justify-content:space-between;margin:8px 0 40px}
  .p15-hello{font-size:26px;font-weight:800;color:var(--blue);letter-spacing:.3px}
  .p15-streak{display:flex;align-items:center;gap:6px;color:var(--muted);font-weight:800;font-size:14px}
  .p15-cta{width:100%;border:none;border-radius:26px;padding:40px 28px;cursor:pointer;touch-action:manipulation;
    background:linear-gradient(150deg,#E5332A 0%,#E5332A 55%,#4338CA 100%);color:#fff;text-align:left;
    box-shadow:0 18px 44px rgba(11,99,246,.34);position:relative;display:block;
    transition:transform .12s ease}
  .p15-cta:active{transform:scale(.98)}
  .p15-cta-label{font-size:30px;font-weight:800;line-height:1.25;letter-spacing:.5px}
  .p15-cta-sub{margin-top:10px;font-size:15px;font-weight:600;opacity:.88}
  .p15-cta-go{position:absolute;right:26px;top:50%;transform:translateY(-50%);
    width:58px;height:58px;border-radius:50%;background:rgba(255,255,255,.20);
    display:flex;align-items:center;justify-content:center}
  .p15-todayline{margin-top:32px;text-align:center;color:var(--muted);font-size:14px}
  .p15-todayline b{color:var(--ink);font-size:17px;font-weight:800}

  /* --- プロフィール --- */
  .p15-profilecard{padding:28px 20px;text-align:center}
  .p15-bignum{font-size:52px;font-weight:800;color:var(--blue);line-height:1}
  .p15-bignum span{font-size:22px;margin-left:2px}
  .p15-3col{display:flex;margin-top:22px;padding-top:20px;border-top:1px solid var(--line)}
  .p15-3col>div{flex:1;display:flex;flex-direction:column;gap:3px}
  .p15-3col b{font-size:19px;font-weight:800}
  .p15-3col span{font-size:11.5px;color:var(--muted);font-weight:700}
  .p15-subhead{display:flex;align-items:center;gap:10px;padding:6px 0 14px}
  .p15-back{background:none;border:none;color:var(--blue);font-weight:800;font-size:15px;cursor:pointer;padding:6px 2px}
  .p15-subtitle{font-weight:800;font-size:17px}

  /* --- 学習カード：もっと見る --- */
  .p15-more{width:100%;margin-top:20px;padding:15px;border-radius:14px;cursor:pointer;touch-action:manipulation;
    background:transparent;border:1.5px solid #C7D2FE;color:#E5332A;font-weight:800;font-size:15px}
  .p15-more.open{background:#F1F5F9;border-color:var(--line);color:var(--muted)}
  .p15-morepanel{margin-top:14px;text-align:left;color:var(--ink)}
  .p15-sec{padding:16px 0;border-top:1px solid var(--line);font-size:14px;line-height:1.85;color:var(--ink)}
  .p15-sec:first-child{border-top:none}
  .p15-seclabel{font-size:11.5px;font-weight:800;color:var(--sub);letter-spacing:.6px;margin-bottom:6px}
  .p15-exru{font-size:17px;font-weight:700;color:var(--ink);line-height:1.6}
  /* 学習カード本体の余白を広げる（HIG: 情報密度を下げる） */
  .qcard.p8-wordcard{padding:34px 22px}
  .qcard.p8-wordcard .accent{margin-top:10px}
  .qcard.p8-wordcard .mean{margin-top:14px}

  /* ===== PHASE16: ホーム「チャレンジモード」ボタン ===== */
  .p16-challenge{width:100%;margin-top:14px;padding:16px 16px;border-radius:18px;cursor:pointer;touch-action:manipulation;
    background:var(--card);border:1px solid var(--line);display:flex;align-items:center;gap:14px;
    box-shadow:0 4px 14px rgba(15,23,42,.05)}
  .p16-challenge-ic{width:44px;height:44px;border-radius:14px;background:rgba(249,115,22,.12);
    display:flex;align-items:center;justify-content:center;flex:0 0 auto}
  .p16-challenge-label{font-weight:800;font-size:16px;color:var(--ink)}
  .p16-challenge-sub{font-size:12.5px;color:var(--muted);margin-top:2px;font-weight:600}

  /* ================= PHASE20: 今日の学習（順路）ホーム ================= */
  .p20-home{padding:10px 2px 0}
  .p20-topstats{display:flex;margin-bottom:26px}
  .p20-topstats>div{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px}
  .p20-topstats b{font-size:19px;font-weight:800;color:var(--ink)}
  .p20-topstats span{font-size:11px;color:var(--muted);font-weight:700}

  .p20-ringwrap{position:relative;width:210px;height:210px;margin:0 auto}
  .p20-ring{width:210px;height:210px;display:block}
  .p20-ring circle{transition:stroke-dashoffset .7s cubic-bezier(.22,1,.36,1)}
  .p20-ringinner{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}
  .p20-pct{font-size:46px;font-weight:800;color:var(--ink);line-height:1}
  .p20-pct span{font-size:20px;margin-left:1px;color:var(--muted)}
  .p20-pctlabel{font-size:12.5px;color:var(--muted);font-weight:700;margin-top:4px}

  .p20-start{display:block;width:100%;margin-top:26px;padding:22px 20px;border:none;border-radius:22px;cursor:pointer;
    touch-action:manipulation;background:linear-gradient(150deg,#E5332A,#E5332A 60%,#4338CA);color:#fff;
    box-shadow:0 16px 38px rgba(11,99,246,.32);transition:transform .12s ease}
  .p20-start:active{transform:scale(.98)}
  .p20-start.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line);box-shadow:none}
  .p20-start-main{display:block;font-size:24px;font-weight:800;letter-spacing:1px}
  .p20-start-sub{display:block;font-size:13px;font-weight:600;opacity:.9;margin-top:5px}
  .p20-done{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:24px;
    padding:16px;border-radius:16px;background:rgba(16,185,129,.10);color:#047857;font-weight:800;font-size:15px}

  .p20-steps{margin-top:26px;display:flex;flex-direction:column;gap:2px}
  .p20-step{display:flex;align-items:center;gap:12px;padding:11px 6px;background:none;border:none;
    cursor:pointer;touch-action:manipulation;text-align:left;width:100%;opacity:.5}
  .p20-step.next{opacity:1}
  .p20-step.done{opacity:1}
  .p20-step-dot{width:26px;height:26px;min-width:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-size:12px;font-weight:800;background:#E8EEF9;color:var(--muted)}
  .p20-step.done .p20-step-dot{background:#10B981;color:#fff}
  .p20-step.next .p20-step-dot{background:var(--blue);color:#fff}
  .p20-step-label{font-size:14.5px;font-weight:700;color:var(--ink)}
  .p20-step-sub{font-size:11.5px;color:var(--muted);margin-top:1px}

  .p20-cefr{margin-top:26px;padding-top:20px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
  .p20-cefrrow{display:flex;align-items:center;gap:10px}
  .p20-cefrtag{font-size:11px;font-weight:800;color:#fff;background:var(--blue);border-radius:6px;padding:2px 7px;min-width:24px;text-align:center}
  .p20-cefrbar{flex:1;height:8px;border-radius:99px;background:#E8EEF9;overflow:hidden}
  .p20-cefrbar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#E5332A,#06B6D4);transition:width .6s ease}
  .p20-cefrpct{font-size:12px;font-weight:800;color:var(--muted);min-width:34px;text-align:right}

  /* PHASE20: 順路モード中の進捗バー */
  .p20-jbar{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:12px}
  .p20-jbar-top{display:flex;justify-content:space-between;font-size:12.5px;font-weight:800;color:var(--ink);margin-bottom:7px}
  .p20-jbar-track{height:7px;border-radius:99px;background:#E8EEF9;overflow:hidden}
  .p20-jbar-track i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#E5332A,#06B6D4);transition:width .5s ease}
  .p20-jbar-next{width:100%;margin-top:10px;padding:12px;border:none;border-radius:12px;cursor:pointer;touch-action:manipulation;
    background:linear-gradient(135deg,var(--blue),var(--blueDeep));color:#fff;font-weight:800;font-size:14px}

  /* ================= PHASE21: ホーム / モード切替 / 中間・完了フィードバック ================= */
  .p21-home{padding:12px 2px 0;max-width:600px;margin:0 auto}
  .p21-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:26px}
  .p21-title{font-size:24px;font-weight:800;letter-spacing:.4px;color:var(--ink)}
  .p21-headright{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);font-weight:700}
  .p21-dot{width:3px;height:3px;border-radius:50%;background:var(--mutedSoft)}

  .p21-seg{display:flex;gap:4px;padding:4px;background:var(--card2);border-radius:var(--radius);margin-bottom:18px}
  .p21-segbtn{flex:1;padding:11px 8px;border:none;border-radius:12px;background:transparent;color:var(--muted);
    font-size:14.5px;font-weight:700;cursor:pointer;touch-action:manipulation;min-height:44px}
  .p21-segbtn.on{background:var(--card);color:var(--accent);box-shadow:var(--shadow)}

  .p21-desc{margin:0 2px 22px;font-size:14px;line-height:1.75;color:var(--muted)}

  .p21-start{width:100%;min-height:60px;padding:19px 20px;border:none;border-radius:var(--radiusLg);
    background:var(--accent);color:#fff;font-size:17.5px;font-weight:800;letter-spacing:.4px;
    cursor:pointer;touch-action:manipulation;transition:background .18s ease,transform .1s ease}
  .p21-start:active{transform:scale(.985);background:var(--accentDeep)}

  .p21-prog{margin-top:30px;display:flex;flex-direction:column;gap:14px}
  .p21-progrow{display:flex;align-items:center;gap:12px}
  .p21-proglabel{font-size:13px;font-weight:700;color:var(--ink);min-width:34px}
  .p21-progbar{flex:1;height:6px;border-radius:99px;background:var(--track2);overflow:hidden}
  .p21-progbar i{display:block;height:100%;border-radius:99px;background:var(--accent);transition:width .5s ease}
  .p21-progval{font-size:12px;font-weight:700;color:var(--muted);min-width:44px;text-align:right;font-variant-numeric:tabular-nums}

  /* 5問ごとの中間フィードバック */
  .p21-check{max-width:600px;margin:0 auto;padding:40px 4px}
  .p21-checkcard{background:var(--card);border:1px solid var(--line);border-radius:var(--radiusLg);
    padding:32px 24px;text-align:center;box-shadow:var(--shadow);animation:p21rise .35s cubic-bezier(.22,1,.36,1)}
  @keyframes p21rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .p21-checknum{font-size:40px;font-weight:800;color:var(--accent);line-height:1;font-variant-numeric:tabular-nums}
  .p21-checklabel{font-size:14px;color:var(--muted);margin-top:8px;font-weight:600}
  .p21-checkrows{margin-top:24px;padding-top:20px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:11px}
  .p21-checkrow{display:flex;justify-content:space-between;font-size:13.5px}
  .p21-checkrow span:first-child{color:var(--muted)}
  .p21-checkrow span:last-child{font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums}

  /* 完了画面 */
  .p21-fin{max-width:600px;margin:0 auto;padding:32px 4px}
  .p21-fincard{background:var(--card);border:1px solid var(--line);border-radius:var(--radiusLg);
    padding:34px 24px;box-shadow:var(--shadow);animation:p21rise .4s cubic-bezier(.22,1,.36,1)}
  .p21-fincheck{width:56px;height:56px;border-radius:50%;background:var(--easyBg);border:1px solid var(--easyBorder);
    display:flex;align-items:center;justify-content:center;margin:0 auto 18px;animation:p21pop .45s .1s backwards cubic-bezier(.34,1.56,.64,1)}
  @keyframes p21pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:scale(1)}}
  .p21-fintitle{text-align:center;font-size:19px;font-weight:800;color:var(--ink)}
  .p21-fingrid{margin-top:26px;display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);
    border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
  .p21-fincell{background:var(--card);padding:16px 12px;text-align:center}
  .p21-fincell b{display:block;font-size:21px;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums}
  .p21-fincell span{display:block;font-size:11.5px;color:var(--muted);margin-top:3px;font-weight:600}
  .p21-finnote{margin-top:18px;padding:14px 16px;background:var(--card2);border-radius:var(--radius);
    font-size:13px;color:var(--muted);text-align:center;line-height:1.7}
  .p21-finbtns{margin-top:20px;display:flex;flex-direction:column;gap:10px}
  .p21-finbtn{width:100%;min-height:52px;padding:15px;border-radius:var(--radius);border:none;cursor:pointer;
    touch-action:manipulation;font-size:15.5px;font-weight:800;background:var(--accent);color:#fff}
  .p21-finbtn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}

  /* 文字サイズ拡大時に崩れないよう、固定高さではなく min-height を使用 */
  @media (max-width:360px){
    .p21-title{font-size:21px}
    .p21-start{font-size:16px}
    .p21-fincell b{font-size:19px}
  }

  /* ===== PHASE21: WKWebView / iOS 対応の補強 ===== */
  /* ダブルタップズームとテキスト選択の抑止（学習中の誤操作防止） */
  button{font-family:inherit;-webkit-user-select:none;user-select:none;touch-action:manipulation}
  /* 100vh は iOS でツールバー分ずれるため dvh を優先 */
  @supports (height:100dvh){ body{min-height:100dvh} }
  /* 慣性スクロールと、ホームインジケーター干渉の回避 */
  body{-webkit-overflow-scrolling:touch}
  main{padding-left:max(14px, env(safe-area-inset-left));padding-right:max(14px, env(safe-area-inset-right))}
  /* 文字サイズ拡大（Dynamic Type相当）でボタン内テキストが溢れないように */
  .p21-segbtn,.p21-start,.p21-finbtn{white-space:normal;line-height:1.35}
  /* 動きを減らす設定を尊重 */
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:.01ms !important;transition-duration:.01ms !important}
  }

  /* PHASE22: セグメントが3つになったため狭幅で文字が溢れないよう調整 */
  .p21-segbtn{font-size:13.5px;padding:11px 4px}
  @media (max-width:380px){ .p21-segbtn{font-size:12px;letter-spacing:-.2px} }

  /* ================= PHASE23: モード別カラーのホーム ================= */
  .p23-home{max-width:600px;margin:0 auto;padding:14px 2px 0}
  .p23-head{margin-bottom:22px;padding-top:4px}
  .p23-title{font-size:26px;font-weight:800;letter-spacing:.4px;color:var(--ink)}
  .p23-sub{font-size:14px;color:var(--muted);font-weight:700;font-variant-numeric:tabular-nums}

  .p23-cards{display:flex;flex-direction:column;gap:12px}
  .p23-card{width:100%;min-height:64px;padding:18px 18px;border-radius:var(--radiusLg);cursor:pointer;
    touch-action:manipulation;text-align:left;background:var(--card);border:1.5px solid var(--line);
    transition:border-color .18s ease, background .18s ease, transform .1s ease;position:relative;overflow:hidden}
  .p23-card:active{transform:scale(.99)}
  /* 左端の色帯でモードを識別 */
  .p23-card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--mcolor);
    opacity:.55;transition:opacity .18s ease}
  .p23-card.on{border-color:var(--mcolor);background:var(--mbg)}
  .p23-card.on::before{opacity:1}
  .p23-cardtop{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .p23-cardname{font-size:16.5px;font-weight:800;color:var(--ink);letter-spacing:.2px}
  .p23-cardnote{margin-top:5px;font-size:12.5px;color:var(--muted);font-weight:600}
  .p23-badge{font-size:12.5px;font-weight:800;color:#fff;background:var(--mcolor);
    border-radius:99px;padding:4px 11px;white-space:nowrap;font-variant-numeric:tabular-nums}
  .p23-badge.zero{background:var(--card2);color:var(--mutedSoft)}

  /* PHASE24: クールなパステル系（青紫→ミント→ラベンダー）で統一 */
  .p23-card.m-word{--mcolor:#5B7FBF;--mbg:#EEF3FB;--mtint:#7C9BD4}
  .p23-card.m-compose{--mcolor:#4FA8A0;--mbg:#EDF7F6;--mtint:#6FC3BB}
  .p23-card.m-challenge{--mcolor:#8A7FC4;--mbg:#F2F0FA;--mtint:#A79DD9}

  .p23-start{width:100%;min-height:60px;margin-top:26px;padding:19px 20px;border:none;border-radius:var(--radiusLg);
    background:var(--accent);color:#fff;font-size:17px;font-weight:800;letter-spacing:.3px;
    cursor:pointer;touch-action:manipulation;transition:background .18s ease,transform .1s ease}
  .p23-start:active{transform:scale(.985);background:var(--accentDeep)}

  @media (max-width:360px){ .p23-cardname{font-size:15px} .p23-title{font-size:23px} }

  /* ================= PHASE27: ホームの再設計（番号リスト＋余白で見せる、装飾を削る） ================= */
  .p27-home{max-width:600px;margin:0 auto;padding:28px 4px 0}
  .p27-kicker{font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;
    color:var(--mutedSoft);margin-bottom:22px;font-variant-numeric:tabular-nums}

  .p27-list{display:flex;flex-direction:column}
  .p27-row{display:flex;align-items:center;gap:16px;width:100%;padding:19px 4px;
    background:none;border:none;border-top:1px solid var(--line);cursor:pointer;touch-action:manipulation;
    text-align:left;transition:opacity .15s ease}
  .p27-row:last-child{border-bottom:1px solid var(--line)}
  .p27-row:active{opacity:.6}
  .p27-no{font-size:12px;font-weight:700;color:var(--mutedSoft);font-variant-numeric:tabular-nums;
    letter-spacing:.5px;min-width:20px}
  .p27-name{flex:1;font-size:18px;font-weight:700;letter-spacing:-.2px;color:var(--ink)}
  .p27-count{font-size:14px;font-weight:700;color:var(--mutedSoft);font-variant-numeric:tabular-nums}
  .p27-row.on .p27-no,.p27-row.on .p27-count{color:var(--mcolor)}
  .p27-row.on .p27-name{color:var(--mcolor)}
  .p27-row.m-word{--mcolor:#E5332A}
  .p27-row.m-compose{--mcolor:#30D158}
  .p27-row.m-challenge{--mcolor:#BF5AF2}
  /* PHASE29: 選択中の行は左に発光するインジケータを出す */
  .p27-row{position:relative}
  .p27-row::before{content:"";position:absolute;left:-4px;top:50%;transform:translateY(-50%);
    width:2px;height:0;background:var(--mcolor);border-radius:2px;transition:height .25s ease;}
  .p27-row.on::before{height:26px}
  .p27-row.on .p27-name{}

  /* PHASE29: CTAはアクセント色の発光ボタンへ */
  .p27-start{width:100%;min-height:56px;margin-top:34px;padding:0 22px;border:none;border-radius:14px;
    background:var(--accent);color:#fff;font-size:16px;font-weight:700;letter-spacing:.2px;
    cursor:pointer;touch-action:manipulation;display:flex;align-items:center;justify-content:center;gap:8px;
    transition:transform .1s ease,opacity .15s ease}
  .p27-start:active{transform:scale(.98);opacity:.8}
  .p27-kicker{color:var(--muted)}

  /* ================= PHASE29: 宇宙・デジタル基調の共通調整 ================= */
  /* 学習カードは黒地のガラス質パネルに */
  .qcard.p8-wordcard{background:var(--card) !important;
    border:1px solid var(--line) !important;color:var(--ink) !important;box-shadow:none !important}
  .qcard.p8-wordcard .accent,.qcard.p8-wordcard .jp,.qcard.p8-wordcard .mean,.qcard.p8-wordcard .ru{color:var(--ink) !important}
  .qcard.p8-wordcard .kana{color:var(--accent) !important}
  .qcard.p8-wordcard .small.muted,.qcard.p8-wordcard .muted,.qcard.p8-wordcard .roma{color:var(--muted) !important}
  .qcard.p8-wordcard .taphint{color:var(--mutedSoft) !important}
  .qcard.p8-wordcard .star{color:var(--mutedSoft) !important}
  .qcard.p8-wordcard .star.on{color:var(--accent) !important}
  .qcard.p8-wordcard .easy{background:var(--easyBg) !important;border-color:var(--easyBorder) !important;color:var(--ink) !important}
  .qcard.p8-wordcard .note{background:var(--noteBg) !important;border-color:var(--noteBorder) !important;color:var(--ink) !important}
  .qcard.p8-wordcard .p10-detailexp,.qcard.p8-wordcard .p10-changerule,.qcard.p8-wordcard .p15-sec{color:var(--ink) !important}
  .qcard.p8-wordcard .p15-more{background:transparent !important;border-color:var(--lineStrong) !important;color:var(--accent) !important}
  .qcard.p8-wordcard .p15-more.open{background:var(--card2) !important;color:var(--muted) !important}
  .qcard.p8-wordcard .tagpill{background:var(--chipBg) !important;border-color:var(--line) !important;color:var(--chipText) !important}

  /* 下部固定の評価バーもダーク化 */
  .p12-stickybar .inner{background:rgba(28,28,30,.96) !important;border-color:var(--line) !important;
    box-shadow:0 -6px 26px rgba(0,0,0,.55) !important}
  .p12-stickybar .ans3btn{color:#fff}
  .p12-stickybar .a-no{background:var(--danger)}
  .p12-stickybar .a-mb{background:var(--warn)}
  .p12-stickybar .a-ok{background:var(--good)}
  .p12-stickybar .a-reveal{background:var(--accent);border:none}

  /* ボトムナビ：夜空に浮かぶ操作面に */
  nav.bnav{background:rgba(0,0,0,.90) !important;border-top:1px solid var(--line) !important;
    -webkit-backdrop-filter:saturate(150%) blur(14px);backdrop-filter:saturate(150%) blur(14px)}

  /* ヘッダー：発光するタイトル＋薄い区切り */
  header.app{border-bottom:1px solid var(--line)}
  header.app h1{color:var(--ink)}
  header.app p{color:var(--mutedSoft)}

  /* 進捗バーはネオン化 */
  .bar{background:var(--track2) !important}
  .bar i{background:var(--accent) !important}

  /* 汎用カード類 */
  .card,.hubcard,.minicard,.statcard,.achbig,.p21-checkcard,.p21-fincard,.p10-reviewrow{
    background:var(--card) !important;border-color:var(--line) !important;color:var(--ink)}
  .btn{background:var(--card);border:1px solid var(--line);color:var(--ink)}
  .btn.primary{background:var(--accent);border-color:transparent;color:#fff}
  .btn.ghost{background:transparent;border:1px solid var(--line);color:var(--muted)}
  .seg{background:var(--card2)}
  .seg button{color:var(--muted)}
  .seg button.on{background:var(--card);color:var(--accent);box-shadow:none}
  input,textarea,select{background:var(--card) !important;color:var(--ink) !important;border-color:var(--line) !important}
  ::placeholder{color:var(--mutedSoft)}

  /* 完了・中間画面のアクセント */
  .p21-checknum,.p15-bignum{color:var(--accent)}
  .p21-finbtn{background:var(--accent);color:#fff}
  .p21-finbtn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);box-shadow:none}
  .p21-fincheck{background:var(--easyBg);border-color:var(--easyBorder)}
  .p20-cefrbar,.p21-progbar{background:var(--track2)}
  .p20-cefrbar i,.p21-progbar i{background:var(--accent)}
  .p10-badge{background:var(--noteBg);border-color:var(--noteBorder);color:var(--warn)}

  /* ================= PHASE32: 黒一色に統一（白い面をなくす） ================= */
  html,body{background:#000 !important;color:var(--ink)}
  main,#root,header.app{background:transparent}
  /* オンボーディング */
  .onboardWrap{background:#000 !important}
  .onboardCard,.onbcard{background:var(--card) !important;border:1px solid var(--line) !important;color:var(--ink) !important}
  .onboardWrap .btn{background:var(--card2);border:1px solid var(--line);color:var(--ink)}
  .onboardWrap .btn.primary{background:var(--accent);border-color:transparent;color:#fff}
  /* シート・モーダル */
  .sheetwrap{background:rgba(0,0,0,.72) !important}
  .sheet,.sheetbody,.sheetcard{background:var(--card) !important;color:var(--ink) !important;border-color:var(--line) !important}
  /* 汎用の白面をすべてカード色へ */
  .card,.hubcard,.minicard,.statcard,.achbig,.p21-checkcard,.p21-fincard,.p10-reviewrow,
  .qcard,.drillcard,.aichat,.gramtable,.easy,.note,.more,.more .inner,details.more{
    background:var(--card) !important;border-color:var(--line) !important;color:var(--ink) !important}
  .easy{background:var(--easyBg) !important;border-color:var(--easyBorder) !important}
  .note{background:var(--noteBg) !important;border-color:var(--noteBorder) !important}
  /* 学習カードの文字は必ず白系に */
  .qcard,.qcard *{color:var(--ink)}
  .qcard .kana{color:var(--accent) !important}
  .qcard .muted,.qcard .small.muted,.qcard .roma,.qcard .taphint{color:var(--muted) !important}
  /* 入力・トースト */
  input,textarea,select{background:var(--card2) !important;color:var(--ink) !important;border-color:var(--line) !important}
  .toast{background:var(--card2) !important;color:var(--ink) !important;border:1px solid var(--line)}
  /* 評価バー */
  .p12-stickybar .inner{background:rgba(20,20,22,.96) !important;border-color:var(--line) !important}
  /* 白背景を前提にした古いユーティリティを無効化 */
  .p8-wordcard{background:var(--card) !important}
  .p15-morepanel,.p8-grammarpanel{background:var(--card2) !important;border-color:var(--line) !important;color:var(--ink) !important}

  /* PHASE35: ホームの周回バッジ */
  .p27-lap{margin-left:8px;font-size:11px;font-weight:700;color:var(--mcolor);
    border:1px solid var(--mcolor);border-radius:999px;padding:1px 7px;vertical-align:middle}

  /* PHASE36: チャレンジのスコープ選択 */
  .p36-scopes{display:flex;flex-direction:column;gap:10px;margin:16px 0 4px}
  .p36-scope{display:flex;flex-direction:column;gap:3px;width:100%;text-align:left;
    background:var(--card2);border:1px solid var(--line);border-radius:14px;
    padding:13px 15px;color:var(--ink);cursor:pointer;transition:border-color .15s,background .15s}
  .p36-scope.on{border-color:var(--mcolor);background:color-mix(in srgb,var(--mcolor) 12%,var(--card2))}
  .p36-scope:active{background:color-mix(in srgb,var(--mcolor) 18%,var(--card2))}
  .p36-scopetop{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
  .p36-scopetop b{font-size:16px;font-weight:700;letter-spacing:.02em}
  .p36-scopetop i{font-style:normal;font-size:12px;font-weight:700;color:var(--mcolor)}
  .p36-scopedesc{font-size:12px;color:var(--muted);line-height:1.5}
  .p36-scopestat{font-size:11px;color:var(--mcolor);font-weight:600;letter-spacing:.02em}
</style>
</head>
<body>
<div id="root">
  <header class="app">
    <div class="row">
      <!-- PHASE27: 箱アイコンをやめ、小さな国旗ドットのみに。タイポグラフィで見せるヘッダーへ -->
      <div style="width:26px;height:18px;border-radius:3px;background:#E5332A;flex:0 0 auto;display:flex;align-items:center;justify-content:center"><span style="width:9px;height:9px;border-radius:50%;background:#F2B705;box-shadow:0 0 0 2px rgba(242,183,5,.35)"></span></div>
      <div><h1>Кыргызча</h1><p id="hsub">キルギス語 · A1 / A2</p></div>

<script>
/*JS_START*/
"use strict";

/* ===== Phase 7: 反復スピーキング（カランメソッド式即答トレーニング） ===== */
function ensureDrill(){
  if(ui.drillUnit==null)ui.drillUnit=0;
  if(!ui.drill)ui.drill={idx:0,phase:"idle",reps:3,repDone:0,speed:0.9,auto:true,mode:"ja-ru",running:false};
  return ui.drill;
}
function drillList(){
  ensureDrill();
  return COMPOSE.filter(function(c){return c.unit===UNITS[ui.drillUnit];});
}
function renderDrill(){
  var D=ensureDrill();
  var list=drillList();
  var idx=Math.min(D.idx,Math.max(0,list.length-1));
  var c=list[idx];
  var h='<div class="hero"><div class="greet">反復スピーキング</div><div class="sub">日本語を聞いたら、考える前に声に出す。'+D.reps+'回連続で反復します</div></div>';
  h+=unitSelect("drillUnit");
  if(!c){return h+'<div class="empty">この単元に文がありません。</div>';}
  h+='<div class="drillcard">';
  h+='<div class="small" style="opacity:.8;letter-spacing:.5px">'+esc(c.grammarPoint||"")+' ・ '+(idx+1)+' / '+list.length+'</div>';
  h+='<div class="ja" style="margin-top:12px">'+esc(c.ja)+'</div>';
  if(D.phase==="answer"||D.phase==="done"){
    h+='<div class="ru">'+esc(c.accent||c.ru)+'</div>';
    h+='<div class="kana">[ '+esc(c.kana)+' ]</div>';
  }else{
    h+='<div class="ru" style="opacity:.35">…すぐ声に出す！…</div>';
  }
  h+='<div class="drillcount">'+Array.from({length:D.reps}).map(function(_,i){return '<i class="'+(i<D.repDone?"on":"")+'"></i>';}).join("")+'</div>';
  h+='</div>';
  h+='<div style="display:flex;gap:10px;margin-top:14px">';
  h+='<button type="button" class="btn full" data-act="drillprev" style="flex:1">‹ 前</button>';
  h+='<button type="button" class="btn full primary" data-act="'+(D.running?"drillstop":"drillstart")+'" style="flex:2">'+(D.running?"停止":"スタート")+'</button>';
  h+='<button type="button" class="btn full" data-act="drillnext" style="flex:1">次 ›</button>';
  h+='</div>';
  h+='<div class="h2">反復回数</div><div class="seg">'+[2,3,5].map(function(n){return '<button type="button" data-act="drillreps" data-val="'+n+'" class="'+(D.reps===n?"on":"")+'">'+n+'回</button>';}).join("")+'</div>';
  h+='<div class="h2">出題方向</div><div class="seg">'+[["ja-ru","日本語 → キルギス語"],["ru-ja","キルギス語 → 日本語"]].map(function(o){return '<button type="button" data-act="drillmode" data-val="'+o[0]+'" class="'+(D.mode===o[0]?"on":"")+'">'+o[1]+'</button>';}).join("")+'</div>';
  h+='<div class="h2">音声速度</div><div class="seg">'+[[0.7,"0.7x"],[0.9,"0.9x"],[1.0,"1.0x"]].map(function(o){return '<button type="button" data-act="drillspeed" data-val="'+o[0]+'" class="'+(D.speed===o[0]?"on":"")+'">'+o[1]+'</button>';}).join("")+'</div>';
  h+='<div class="note" style="margin-top:6px">流れ：日本語音声 → 短いポーズ（自分で即答）→ キルギス語のお手本 → 声に出して真似る ×'+D.reps+'回 → 自動で次の文へ。英会話のカランメソッドと同じ「考える隙を与えない」反復で、口が勝手に動くようになります。</div>';
  return h;
}
var _drillTimer=null;
function drillStopTimers(){if(_drillTimer){clearTimeout(_drillTimer);_drillTimer=null;}try{window.speechSynthesis.cancel();}catch(_){}}
function drillCycle(){
  var D=ensureDrill();if(!D.running)return;
  var list=drillList();if(!list.length){D.running=false;render();return;}
  if(D.idx>=list.length){D.idx=0;}
  var c=list[D.idx];
  var promptText=D.mode==="ru-ja"?(c.accent||c.ru):c.ja;
  var promptLang=D.mode==="ru-ja"?"ru":"ja";
  var answerText=D.mode==="ru-ja"?c.ja:(c.accent||c.ru);
  var answerLang=D.mode==="ru-ja"?"ja":"ru";
  D.phase="prompt";D.repDone=0;render();
  speakUtterance(promptText,promptLang==="ru"?"ru-RU":"ja-JP",promptLang==="ru"?D.speed:1.0).then(function(){
    if(!D.running)return;
    _drillTimer=setTimeout(function(){ // 即答ポーズ
      if(!D.running)return;
      D.phase="answer";render();
      var rep=0;
      function oneRep(){
        if(!D.running)return;
        speakUtterance(answerText,answerLang==="ru"?"ru-RU":"ja-JP",answerLang==="ru"?D.speed:1.0).then(function(){
          if(!D.running)return;
          rep++;D.repDone=rep;render();
          if(rep<D.reps){_drillTimer=setTimeout(oneRep,1400);} // 真似る時間
          else{
            D.phase="done";render();
            _drillTimer=setTimeout(function(){if(!D.running)return;D.idx++;drillCycle();},1600);
          }
        });
      }
      oneRep();
    },1800);
  });
}

/* ===== Phase 7: AI会話練習（Claude API・要インターネット） ===== */
function ensureAIChat(){
  if(!ui.aichat)ui.aichat={msgs:[],busy:false,level:"A1"};
  return ui.aichat;
}
function renderAIChat(){

/* ===== Phase 7: 文法詳細ジェネレーター（なぜその形になるかを説明） ===== */
function grammarDetail(w){
  var word=(w.word||"").toLowerCase(), cat=w.category||"", pos=w.pos||"", h="";
  function sec(title,body){return '<div style="margin-top:10px"><b class="small" style="color:var(--sub)">'+title+'</b><div class="small" style="margin-top:3px;line-height:1.9;color:var(--ink)">'+body+'</div></div>';}
  function tbl(rows){return '<table class="gramtable"><tr><th>格</th><th>形</th><th>使いどころ</th></tr>'+rows.map(function(r){return '<tr><td>'+r[0]+'</td><td>'+r[1]+'</td><td>'+r[2]+'</td></tr>';}).join("")+'</table>';}

  /* --- 前置詞句（в/на/из/с/у/к + 名詞） --- */
  if(/^в\s/.test(word)||/^на\s/.test(word)){
    var isPlace=/е$/.test(word.split(" ").pop());
    if(isPlace){
      h+=sec("なぜこの形？","前置詞 <b>в／на</b> が「〜で（場所）」の意味のとき、後ろの名詞は<b>前置格</b>になります。前置格の目印は語尾の <b>-е</b>（一部 -и）です。<br>例：школа → в шко́л<b>е</b>（学校で）");
      h+=sec("移動との違い","同じ в／на でも「〜へ（移動）」なら<b>対格</b>（女性名詞は -у）。в шко́л<b>у</b>＝学校へ。場所か移動かで語尾が変わるのがキルギス語の核心ルールです。");
    }else{
      h+=sec("なぜこの形？","前置詞 <b>в／на</b> が「〜へ（移動方向）」の意味のとき、後ろの名詞は<b>対格</b>になります。女性名詞（-а で終わる語）は語尾が <b>-у</b> に変化します。<br>例：школа → в шко́л<b>у</b>（学校へ）。男性・中性の無生物名詞は形が変わりません。");
    }
  }else if(/^из\s/.test(word)||/^с\s/.test(word)){
    h+=sec("なぜこの形？","前置詞 <b>из／с</b>「〜から」の後ろは<b>生格</b>です。生格の目印：女性 -а→<b>-ы/-и</b>、男性 →<b>-а</b>。<br>例：школа → из шко́л<b>ы</b>（学校から）／работа → с рабо́т<b>ы</b>（職場から）<br>建物・囲まれた場所は из、行事・開けた場所・на とペアの場所は с を使います。");
  }else if(/^у\s/.test(word)){
    h+=sec("なぜこの形？","前置詞 <b>у</b>「〜のところに／〜が持っている」の後ろは<b>生格</b>です。<br>例：я → у <b>меня́</b>（私のところに）、врач → у врач<b>а́</b>（医者のところで）<br>「У меня есть …」＝「私には…がある」はキルギス語の最重要構文のひとつです。");
  }else if(/^к\s/.test(word)){
    h+=sec("なぜこの形？","前置詞 <b>к</b>「〜のところへ（人へ向かう）」の後ろは<b>与格</b>です。男性名詞は語尾 <b>-у</b>。<br>例：врач → к врач<b>у́</b>（医者のところへ）<br>場所へは в/на＋対格、<b>人へは к＋与格</b>と使い分けます。");
  }

  /* --- 形容詞チャンク --- */
  if(cat.indexOf("形容詞")>=0){
    h+=sec("なぜこの形？","キルギス語の形容詞は、修飾する名詞の<b>性・数・格</b>に一致して語尾が変わります。この教材では覚えやすさを優先して<b>男性形（-ый/-ой/-ий）で統一</b>しています。実際の会話では：<br>・女性名詞（-а）→ 形容詞は <b>-ая</b>：но́в<b>ая</b> шко́ла<br>・中性名詞（-о）→ <b>-ое</b>：но́в<b>ое</b> молоко́<br>・男性名詞 → <b>-ый</b>：но́в<b>ый</b> дом");
    h+=sec("語尾のパターン","硬変化 но́вый（-ый/-ая/-ое）、アクセント語尾型 большо́й（-ой/-ая/-ое）、軟変化 ма́ленький や хоро́ший（-ий/-ая/-ее ※正書法規則）の3タイプがあります。");
  }

  /* --- 数量チャンク --- */
  if(cat.indexOf("数量")>=0){
    h+=sec("なぜこの形？","数詞の後ろの名詞は数によって形が変わります（この教材は覚えやすさのため主格で統一）。実際のルール：<br>・<b>1</b>（оди́н/одна́/одно́）→ 主格単数：оди́н дом<br>・<b>2〜4</b> → <b>生格単数</b>：два до́м<b>а</b>、три шко́л<b>ы</b><br>・<b>5以上</b> → <b>生格複数</b>：пять домо́в<br>買い物や時間表現で必ず使うので、まず 1／2-4／5+ の3パターンで覚えましょう。");
  }

  /* --- 動詞（一人称現在） --- */
  if(/я\s+\S+ю$|я\s+\S+у$|у́?сь$|юсь$/.test(word)&&(cat.indexOf("動詞")>=0||cat.indexOf("チャンク")>=0)){
    h+=sec("なぜこの形？","「я（私は）」に合わせた<b>一人称単数・現在形</b>です。キルギス語の動詞は主語ごとに語尾が6通り変化します。<br>第1変化（-ать型）：я чита́<b>ю</b>, ты чита́ешь, он чита́ет…<br>第2変化（-ить型）：я говор<b>ю́</b>, ты говори́шь, он говори́т…<br>-сь が付く動詞（учу́сь など）は再帰動詞で「自分が〜する」ニュアンスです。");
  }

  /* --- 動詞の原形 --- */
  if(pos==="verb"&&/ть$|ти$|чь$/.test(word)){
    h+=sec("なぜこの形？","<b>不定形（原形）</b>です。語尾は -ть／-ти／-чь。хочу́（〜したい）、мо́жно（〜してよい）、ну́жно（〜する必要がある）の後ろにそのまま置けます。<br>例：Мо́жно подписа́ть? ＝ 署名してもいいですか？<br>完了体（一回の完結した動作）と不完了体（進行・習慣）のペアがあり、この語は主に<b>完了体</b>として依頼・完結の場面で使われます。");
  }

  /* --- 副詞チャンク --- */
  if(cat.indexOf("副詞")>=0){
    h+=sec("なぜこの形？","<b>副詞は変化しません</b>。文頭・動詞前どちらにも置け、語順は比較的自由です。<br>о́чень（とても）／немно́го（少し）／ка́ждый день（毎日）／сейча́с（今）／пото́м（後で）／здесь（ここで）<br>まず副詞＋動詞のセットで口に出す練習をすると、文がすぐ長くできます。");
  }

  /* --- 発音の変化（アクセントとの関係） --- */
  var pr=[];
  if(/о/.test(word)) pr.push("アクセントのない <b>о</b> は「ア」に近い音（アーカニエ）：молоко́ →「マラコー」");
  if(/[ея]/.test(word)) pr.push("アクセントのない <b>е/я</b> は「イ」に近い曖昧な音になります");
  if(/[бвгдзж]$/.test(word.replace(/ь$/,""))) pr.push("語末の有声子音は無声化：хлеб →「フリェープ」（бがпに）");
  if(pr.length) h+=sec("発音が表記とズレる理由",pr.join("<br>"));

  if(!h) h=sec("この語について","この語は文中での役割（主語・目的語・前置詞の後ろ など）によって語尾が変化します。まずはこの形とアクセント位置をセットで覚え、例文の中で形の変化を確認していきましょう。");
  return '<div style="border-top:1px dashed var(--line);margin-top:12px;padding-top:4px"><b class="small" style="color:var(--blue)">文法・変化の解説</b>'+h+'</div>';
}

/* PHASE28: ファイル軽量化。定型のpron文と空フィールドをデータから外し、実行時に復元する */
var PRON_TABLE=[""];
var VD=[];

/* PHASE40: 解説文は繰り返し表現を辞書化して保存されている（VD が辞書）。
   私用領域の1文字が定型句1つに対応する。参照される前にここで元の文へ展開する。 */
function _vdExpand(s){
  if(typeof s!=="string")return s;
  if(typeof VD==="undefined"||!VD||!VD.length)return s;
  for(var pass=0;pass<12;pass++){
    var hit=false,out="";
    for(var i=0;i<s.length;i++){
      var cc=s.charCodeAt(i);
      if(cc>=0xE000&&cc<=0xF8FF){ out+=VD[cc-0xE000]; hit=true; }
      else out+=s.charAt(i);
    }
    s=out;
    if(!hit)break;
  }
  return s;
}
var VT={"d":[],"c":[]};

/* VT.d / VT.c を参照前に展開する */
["d","c"].forEach(function(k){ if(VT[k]) VT[k]=VT[k].map(_vdExpand); });
var VT_MAP={d:"detailExp",c:"changeRule",pt:"packTitle",ct:"category",pk:"pack",rs:"reviewStatus",ds:"dataStatus",ps:"pos",lv:"level"};
VOCAB.forEach(function(w){
  for(var sk in VT_MAP){ if(w[sk]!=null){ w[VT_MAP[sk]]=VT[sk][w[sk]]; delete w[sk]; } }
  if(w.pr!=null){w.pron=PRON_TABLE[w.pr];delete w.pr;}
  if(w.pron==null)w.pron="";
  if(w.exRu==null)w.exRu="";if(w.exJa==null)w.exJa="";if(w.audio==null)w.audio="";
  if(w.detailExp==null)w.detailExp="";if(w.changeRule==null)w.changeRule="";if(w.simpleExp==null)w.simpleExp="";

/* ===== PHASE46: A2 不足分の補強データ（瞬間作文 7ユニット・基礎語）を実行時に追加 =====
   - 造格／生格／動詞の体／比較・好み／複文／再帰動詞・否定／日付・序数 の7ユニット（各15文）
   - TБУ(A2)で必須なのに単語リストに無かった基礎語（язы́к, страна́, кото́рый, са́мый, стать …）
   - すべて新規作成の draft。ネイティブ確認前の扱いは既存データと同じ。 */
var P46_COMPOSE=[];
var P46_VOCAB=[];
(function(){
  var haveC={}; COMPOSE.forEach(function(c){haveC[c.id]=1;});
  P46_COMPOSE.forEach(function(c){ if(!haveC[c.id]) COMPOSE.push(c); });
  var haveV={}; VOCAB.forEach(function(w){haveV[w.id]=1;});
  P46_VOCAB.forEach(function(w){ if(!haveV[w.id]) VOCAB.push(w); });
  /* 文法別練習：空だった2グループを実データで埋め、未登録の文法ポイントをグループとして追加 */
  function idsWhere(f){return COMPOSE.filter(f).map(function(c){return c.id;});}
  GROUPS.forEach(function(g){
    if(g.id==="accusative_direction"&&!(g.composeIds||[]).length){
      g.composeIds=idsWhere(function(c){return /(^|\s)(в|во|на)\s/i.test(c.ru)&&(c.grammarPoint==="対格"||c.grammarPoint==="移動動詞・方向");});
    }
    if(g.id==="prepositional_location"&&!(g.composeIds||[]).length){
      g.composeIds=idsWhere(function(c){return c.grammarPoint==="場所 в/на + 前置格"||c.grammarPoint==="前置格";});
    }
    g.count=(g.composeIds||[]).length;
  });
  var P46_GROUP_DEF=[
    ["instrumental","造格 с＋造格・〜として","造格"],
    ["genitive","生格 〜の・нет・数量","生格"],
    ["aspect","動詞の体 完了体／不完了体","動詞の体"],
    ["comparison","比較・好み нравиться／лучше／самый","比較・好み"],
    ["complex","複文 что／который／чтобы／если","複文・接続詞"],
    ["reflexive_neg","再帰動詞・否定・должен・свой","再帰動詞・否定"],
    ["dates","日付・序数・時刻","日付・序数"],
    ["present","現在形の動詞","現在形"],
    ["future","未来・予定","未来・予定"]
  ];
  var haveG={}; GROUPS.forEach(function(g){haveG[g.id]=1;});
  P46_GROUP_DEF.forEach(function(d){
    if(haveG[d[0]])return;
    var ids=idsWhere(function(c){return c.grammarPoint===d[2];});
    if(ids.length)GROUPS.push({id:d[0],title:d[1],count:ids.length,composeIds:ids});
  });
})();

/* ===== progress access ===== */
function P(id){if(!progress[id])progress[id]={status:"new",correctCount:0,wrongCount:0,uncertainCount:0,lastReviewed:null,nextReview:null,intervalDays:0,intervalStep:0,masteryLevel:0,favorite:false,correctDays:[]};return progress[id];}
function CP(id){if(!cprogress[id])cprogress[id]={status:"new",correctCount:0,wrongCount:0,uncertainCount:0,lastReviewed:null,nextReview:null,favorite:false,correctDays:[]};return cprogress[id];}
function hasP(id){return !!progress[id];}
function saveAll(){lset(K.prog,progress);lset(K.cprog,cprogress);lset(K.set,settings);lset(K.hist,appHist);lset(K.sess,ui);}
function saveUI(){lset(K.sess,ui);}
function dayRec(k){k=k||todayKey();if(!appHist.days[k])appHist.days[k]={learned:0,reviewed:0,newIntro:0,studySeconds:0,studiedWords:0,newWords:0,reviewedWords:0,listeningCount:0,composeCount:0,weakStudied:0,listenSeconds:0,reinforceCount:0,uniqueWords:{}};
  var d=appHist.days[k];
  if(d.studySeconds==null)d.studySeconds=0;
  if(d.studiedWords==null)d.studiedWords=0;
  if(d.newWords==null)d.newWords=0;
  if(d.reviewedWords==null)d.reviewedWords=d.reviewed||0;
  if(d.listeningCount==null)d.listeningCount=0;
  if(d.composeCount==null)d.composeCount=0;
  if(d.weakStudied==null)d.weakStudied=0;
  if(d.listenSeconds==null)d.listenSeconds=0;
  /* PHASE12: 強化モードで学んだ単語数（評価の良し悪しに関わらずカウント） */
  if(d.reinforceCount==null)d.reinforceCount=0;
  /* PHASE16: 同じ単語を何度答えても1語としてカウントするための実単語セット */
  if(d.uniqueWords==null)d.uniqueWords={};
  if(d.reinforceUniqueWords==null)d.reinforceUniqueWords={};
  return d;}
function todayReinforceUniqueCount(){return Object.keys(dayRec().reinforceUniqueWords||{}).length;}
/* PHASE16: 「今日学習した実単語数」＝わからない/微妙で同じ単語を複数回答えても重複カウントしない */
function todayUniqueWordCount(){return Object.keys(dayRec().uniqueWords||{}).length;}
function addStudySeconds(d,sec){d.studySeconds=(d.studySeconds||0)+Math.max(0,Math.min(60,sec));}
function bumpStreak(){var t=todayKey();if(appHist.streak.last===t)return;var y=new Date();y.setDate(y.getDate()-1);appHist.streak.count=(appHist.streak.last===todayKey(y))?appHist.streak.count+1:1;appHist.streak.last=t;}

/* ===== SRS (vocab) ===== */
function schedule(p,step){p.intervalStep=step;p.masteryLevel=step;if(step<=0){p.intervalDays=0;p.nextReview=now()+600000;}else{var d=LADDER_DAYS[Math.min(step-1,LADDER_DAYS.length-1)];p.intervalDays=d;p.nextReview=now()+d*86400000;}}
function answer(id,kind){var p=P(id),wasNew=(p.status==="new"),wasDue=isDue(id),wasWeak=isWeak60(id),t=todayKey();bumpStreak();
  var d=dayRec();
  if(wasNew){d.newIntro++;d.learned++;d.newWords++;}
  d.studiedWords++; addStudySeconds(d,8);
  /* PHASE16: 実単語ベースの集計に同じidを記録（同一単語の再挑戦は増えない） */
  if(!d.uniqueWords)d.uniqueWords={};
  var p20wasCounted=!!d.uniqueWords[id];
  d.uniqueWords[id]=true;
  /* PHASE20: 順路「単語」ステージの進捗と経験値。同じ単語の再挑戦では二重加算しない */
  if(!p20wasCounted){
    if(!d.journey)d.journey={};
    d.journey.word=(d.journey.word||0)+1;
    if(!appHist.totals)appHist.totals={};
    appHist.totals.xp=(appHist.totals.xp||0)+(kind==="ok"?12:kind==="maybe"?8:5);
    d.xp=(d.xp||0)+(kind==="ok"?12:kind==="maybe"?8:5);
  }
  if(wasWeak)d.weakStudied=(d.weakStudied||0)+1;
  p.lastReviewed=now();
  if(kind==="no"){p.wrongCount++;p.status="learning";schedule(p,0);}
  else if(kind==="maybe"){p.uncertainCount++;if(p.status==="new")p.status="learning";var maybeDays=Math.min(3,1+(p.masteryLevel||p.intervalStep||0));p.nextReview=now()+maybeDays*86400000;p.intervalDays=maybeDays;}
  else{p.correctCount++;if(p.correctDays.indexOf(t)<0)p.correctDays.push(t);schedule(p,(p.intervalStep||0)+1);p.status=(p.correctDays.length>=3)?"mastered":"reviewing";}
  if(!wasNew)d.reviewed++;
  if(wasDue)d.reviewedWords++;
  /* PHASE12/16: 強化モードは評価結果（できた/微妙/できない）に関わらず「学んだ語」としてカウントするが、
     同じ単語を何度答えても1語として数える（実単語数ベース） */
  if(ui.session && ui.session.origin==="reinforce"){
    d.reinforceCount=(d.reinforceCount||0)+1;
    if(!d.reinforceUniqueWords)d.reinforceUniqueWords={};
    d.reinforceUniqueWords[id]=true;
  }
  if(ui.session){
    var st=ui.session.stats||(ui.session.stats=initSessionStats());
    if(!st.okIds)st.okIds=[]; /* PHASE9: 旧セッションとの後方互換 */
    if(kind==="ok"){st.ok++;if(st.okIds.indexOf(id)<0)st.okIds.push(id);}
    else if(kind==="maybe"){st.maybe++;if(st.maybeIds.indexOf(id)<0)st.maybeIds.push(id);}
    else{st.no++;if(st.noIds.indexOf(id)<0)st.noIds.push(id);}
    if(wasNew)st.newWords++;
    if(wasDue)st.reviewedWords++;
  }
  saveAll();}
/* SRS (compose) */
function composeAnswer(id,kind){var p=CP(id),wasNew=(p.status==="new"),wasDue=cIsDue(id),t=todayKey();bumpStreak();
  var d=dayRec();
  if(wasNew)d.learned++;
  d.composeCount++; addStudySeconds(d,8);
  /* PHASE20: 順路「瞬間作文」ステージの進捗と経験値 */
  if(!d.journey)d.journey={};
  d.journey.compose=(d.journey.compose||0)+1;
  if(!appHist.totals)appHist.totals={};
  appHist.totals.xp=(appHist.totals.xp||0)+10; d.xp=(d.xp||0)+10;
  p.lastReviewed=now();
  if(kind==="no"){p.wrongCount++;p.status="learning";p.nextReview=now()+600000;}
  else if(kind==="maybe"){p.uncertainCount++;if(p.status==="new")p.status="learning";p.nextReview=now()+86400000;}
  else{p.correctCount++;if(p.correctDays.indexOf(t)<0)p.correctDays.push(t);if(p.correctDays.length>=3){p.status="mastered";p.nextReview=now()+7*86400000;}else{p.status="reviewing";p.nextReview=now()+3*86400000;}}
  if(!wasNew)d.reviewed++;
  if(wasDue)d.reviewedWords++;
  saveAll();}

/* ===== speech (端末内蔵TTS・外部通信なし) ===== */
var RU_VOICE=null,JA_VOICE=null,KY_VOICE=null;
/* キルギス語の音声が端末に無い場合は、キルギス語音声で近い音に置き換えて読む（ө→о, ү→у, ң→нг） */
function kyForTTS(t){t=String(t||"");if(KY_VOICE)return t;return t.replace(/ө/g,"о").replace(/Ө/g,"О").replace(/ү/g,"у").replace(/Ү/g,"У").replace(/ң/g,"нг").replace(/Ң/g,"Нг");}
function kyLang(){return KY_VOICE?(KY_VOICE.lang||"ky-KG"):"ru-RU";}
function pickVoice(){
  try{
    var vs=window.speechSynthesis.getVoices();
    RU_VOICE=null;JA_VOICE=null;KY_VOICE=null;
    for(var i=0;i<vs.length;i++){
      var lang=(vs[i].lang||"").toLowerCase();
      if(lang.indexOf("ky")===0)KY_VOICE=vs[i];
      if(!RU_VOICE&&lang.indexOf("ru")===0)RU_VOICE=vs[i];
      if(!JA_VOICE&&lang.indexOf("ja")===0)JA_VOICE=vs[i];
    }
  }catch(_){}
}
if(window.speechSynthesis){pickVoice();try{window.speechSynthesis.onvoiceschanged=pickVoice;}catch(_){}}
/* ===== Phase 6-9: ネイティブ音声対応の土台（音声ファイルは今回追加しない） ===== */
var audioMap={vocab:{},compose:{}};
function hasNativeAudio(type,id){try{return !!(audioMap[type]&&audioMap[type][id]);}catch(_){return false;}}
function nativeAudioSrc(type,id){try{return (audioMap[type]&&audioMap[type][id])||null;}catch(_){return null;}}
function playNativeAudio(type,id){
  return new Promise(function(resolve){
    var src=nativeAudioSrc(type,id);
    if(!src){resolve(false);return;}
    try{
      var audio=new Audio(src);
      var done=false;
      audio.onended=function(){if(done)return;done=true;resolve(true);};
      audio.onerror=function(){if(done)return;done=true;resolve(false);};
      var p=audio.play();
      if(p&&p.catch)p.catch(function(){if(!done){done=true;resolve(false);}});
    }catch(e){resolve(false);}
  });
}
/* type:"vocab"|"compose", item:教材オブジェクト(word/compose)。ネイティブ音声があれば再生、なければ端末読み上げにフォールバック */
function playAudioOrTTS(type,item,fallbackText,lang,rate){
  var id=item&&item.id;
  if(id&&hasNativeAudio(type,id)){
    playNativeAudio(type,id).then(function(ok){if(!ok)speak(fallbackText,rate);});
    return;
  }
  if(lang==="ru-RU"||!lang)speak(fallbackText,rate);
  else speakUtterance(fallbackText,lang,rate||1.0,JA_VOICE);
}
function audioCoverageStats(){
  var vTotal=VOCAB.length,vDone=0,cTotal=COMPOSE.length,cDone=0;
  VOCAB.forEach(function(w){if(hasNativeAudio("vocab",w.id))vDone++;});
  COMPOSE.forEach(function(c){if(hasNativeAudio("compose",c.id))cDone++;});
  return {vTotal:vTotal,vDone:vDone,cTotal:cTotal,cDone:cDone};
}
function speak(text,rate){
  if(!window.speechSynthesis||!window.SpeechSynthesisUtterance){toast("この端末では読み上げを使えません");return;}
  try{
    var clean=kyForTTS(String(text||"").replace(/\u0301/g,""));
    var u=new SpeechSynthesisUtterance(clean);
    u.lang=kyLang(); u.rate=rate||0.9; if(KY_VOICE)u.voice=KY_VOICE; else if(RU_VOICE)u.voice=RU_VOICE;
    window.speechSynthesis.cancel(); window.speechSynthesis.speak(u);
  }catch(e){toast("読み上げに失敗しました");}
}
/* ===== リスニング専用：非同期読み上げ（Phase 5-1） ===== */
function speakUtterance(text,lang,rate,voice){
  return new Promise(function(resolve){
    if(!window.speechSynthesis||!window.SpeechSynthesisUtterance){resolve();return;}
    var clean=String(text||"").replace(/\u0301/g,"").trim();
    if(String(lang||"").indexOf("ru")===0){clean=kyForTTS(clean);if(KY_VOICE){lang=kyLang();voice=KY_VOICE;}}
    if(!clean){resolve();return;}
    try{
      var u=new SpeechSynthesisUtterance(clean);
      u.lang=lang; u.rate=rate||0.9; if(voice)u.voice=voice;
      var done=false;
      var fallback=setTimeout(function(){if(done)return;done=true;resolve();},Math.max(2500,clean.length*180));
      u.onend=function(){if(done)return;done=true;clearTimeout(fallback);resolve();};
      u.onerror=function(){if(done)return;done=true;clearTimeout(fallback);resolve();};
      window.speechSynthesis.speak(u);
    }catch(e){resolve();}
  });
}
function waitMs(ms){return new Promise(function(resolve){setTimeout(resolve,ms||0);});}

/* ===== queue helpers ===== */
function isDue(id){var p=progress[id];return p&&p.nextReview&&p.nextReview<=now();}

function isForgetting(id){var p=progress[id];if(!p||p.status==="new"||p.status==="mastered"||!p.nextReview)return false;if(p.nextReview<=now())return false;return p.nextReview<=now()+24*3600*1000;}

function isWeak60(id){var p=progress[id];if(!p||p.status==="new")return false;var t=p.correctCount+p.wrongCount;return t>0&&(p.correctCount/t)<0.6;}
function cIsDue(id){var p=cprogress[id];return p&&p.nextReview&&p.nextReview<=now();}
function cIsWeak(id){var p=cprogress[id];if(!p)return false;var t=p.correctCount+p.wrongCount;return p.wrongCount>=2||(t>=3&&p.correctCount/t<0.5);}

var STAGE_LABEL=["新規","学習中","安定","強固","長期","マスター"];
function memoryStage(id){
  var p=progress[id];
  if(!p||p.status==="new")return 0;
  if(p.status==="learning")return 1;
  if(p.status==="reviewing"){var lvl=p.masteryLevel||p.intervalStep||0;return lvl<=2?2:3;}
  if(p.status==="mastered")return (p.correctDays&&p.correctDays.length>=5)?5:4;
  return 0;

function stageCounts(){

function nextReviewTime(){
  var future=idsAllLevels().map(function(id){return progress[id]&&progress[id].nextReview;}).filter(function(t){return t&&t>now();});
  return future.length?new Date(Math.min.apply(null,future)):null;
}
function fmtNextReview(d){
  if(!d)return "予定なし";
  var today=new Date(),tmr=new Date();tmr.setDate(today.getDate()+1);
  var sameDay=d.toDateString()===today.toDateString();
  var isTomorrow=d.toDateString()===tmr.toDateString();
  var hm=String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");
  if(sameDay)return "今日 "+hm;
  if(isTomorrow)return "明日 "+hm;
  return (d.getMonth()+1)+"/"+d.getDate()+" "+hm;
}
function buildReviewAlgoQueue(){
  var f=ui.reviewAlgo;
  var ids=idsAllLevels().filter(function(id){
    var p=progress[id];if(!p||p.status==="new")return false;
    var st=memoryStage(id);
    if(f.stage==="low"&&st>2)return false;
    if(f.stage==="high"&&st<3)return false;
    var t=p.correctCount+p.wrongCount+p.uncertainCount,acc=t?p.correctCount/t:0;
    if(f.acc==="low"&&!(acc<0.6))return false;
    if(f.acc==="mid"&&!(acc>=0.6&&acc<0.9))return false;
    if(f.acc==="high"&&!(acc>=0.9))return false;
    if(f.recency!=="all"){
      var days=f.recency==="1"?1:(f.recency==="3"?3:7);
      if(!p.lastReviewed||(now()-p.lastReviewed)>days*86400000)return false;
