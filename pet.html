<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>なかよし ペット</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=Zen+Maru+Gothic:wght@700;900&display=swap">
<style>
:root{
  --bg:#EAF3FF; --wall:#FFE9F1; --wall-dot:#FFD6E4; --floor:#F6D7A7; --floor-line:#E9C38A;
  --ink:#43365A; --ink-soft:#8A7DA0; --panel:#FFFFFF; --edge:#E6DDF2;
  --pink:#FF7EA8; --pink-deep:#E25A88; --sun:#FFC93C; --mint:#4CC9A0; --sky:#5AB4E8; --lilac:#A88BEB;
  --display:"Mochiy Pop One","Hiragino Maru Gothic ProN","Zen Maru Gothic",system-ui,sans-serif;
  --body:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-weight:700;overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation;word-break:keep-all;overflow-wrap:anywhere}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--pink);outline-offset:2px}
.app{height:100%;height:100dvh;display:flex;flex-direction:column;max-width:760px;margin:0 auto;gap:8px;
  padding:max(8px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(8px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left))}

/* top */
.top{display:flex;align-items:center;gap:8px}
.iconbtn{width:44px;height:44px;flex:none;border-radius:50%;background:var(--panel);font-size:22px;box-shadow:0 3px 0 var(--edge)}
.plate{flex:1;min-width:0;background:var(--panel);border-radius:999px;padding:5px 12px 6px 6px;box-shadow:0 3px 0 var(--edge);display:flex;align-items:center;gap:8px}
.lv{font-family:var(--display);background:var(--sun);border-radius:999px;padding:3px 10px;font-size:14px;white-space:nowrap}
.pname{font-family:var(--display);font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:none;max-width:45%}
@media (max-width:480px){.stage-tag{display:none}}
.xpbar{flex:1;min-width:40px;height:12px;background:#F1ECF8;border-radius:99px;overflow:hidden}
.xpbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--pink),#FFB2CB);border-radius:99px;transition:width .4s}
.stage-tag{font-size:12px;color:var(--ink-soft);white-space:nowrap}

.gauges{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.g{background:var(--panel);border-radius:14px;padding:4px 8px 6px;box-shadow:0 3px 0 var(--edge);min-width:0}
.g .lab{display:flex;align-items:center;gap:3px;font-size:11px;color:var(--ink-soft);white-space:nowrap}
.g .lab b{font-size:16px}
.g .bar{height:9px;border-radius:99px;background:#F1ECF8;overflow:hidden;margin-top:2px}
.g .bar i{display:block;height:100%;width:50%;border-radius:99px;transition:width .6s,background .6s}
.g.low{animation:wob .8s infinite}
@keyframes wob{0%,100%{transform:rotate(0)}25%{transform:rotate(-2deg)}75%{transform:rotate(2deg)}}

/* room */
.room{position:relative;flex:1;min-height:250px;border-radius:26px;overflow:hidden;
  background:radial-gradient(circle at 12px 12px,var(--wall-dot) 3px,transparent 3.5px) 0 0/30px 30px,var(--wall);box-shadow:inset 0 0 0 4px #fff}
.floor{position:absolute;left:0;right:0;bottom:0;height:28%;background:repeating-linear-gradient(90deg,var(--floor) 0 56px,var(--floor-line) 56px 59px);border-top:6px solid #DDAF73}
.win{position:absolute;left:6%;top:7%;width:24%;max-width:130px;aspect-ratio:1/.85;border:7px solid #fff;border-radius:14px;background:linear-gradient(#9ED8FF,#D8F1FF);overflow:hidden;transition:background 1s}
.win:after{content:"☁️";position:absolute;left:12%;top:18%;font-size:24px}
.toilet{position:absolute;right:4%;bottom:12%;font-size:min(16vw,70px);line-height:1;z-index:1;cursor:pointer}
.toilet.flush{animation:shake .5s 2}
.pet{position:absolute;left:50%;bottom:9%;width:min(62%,300px);aspect-ratio:1;transform:translateX(-50%);z-index:3;cursor:pointer;transform-origin:50% 100%}
.pet .inner{width:100%;height:100%;transform-origin:50% 95%;animation:idle 2.2s ease-in-out infinite}
.pet svg{width:100%;height:100%;display:block;overflow:visible}
.pet.hop .inner{animation:hop .55s ease-out}
.pet.eat .inner{animation:munch .3s ease-in-out 3}
.pet.wiggle .inner{animation:wig .5s ease-in-out 2}
.pet.strain .inner{animation:strain .25s ease-in-out 6}
.pet.spin .inner{animation:spin 1s ease-in-out}
@keyframes idle{0%,100%{transform:scale(1,1)}50%{transform:scale(1.03,.97)}}
@keyframes hop{0%{transform:translateY(0) scale(1.1,.9)}40%{transform:translateY(-32%) scale(.95,1.05)}100%{transform:translateY(0)}}
@keyframes munch{0%,100%{transform:scale(1)}50%{transform:scale(1.08,.92)}}
@keyframes wig{0%,100%{transform:rotate(0)}25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}
@keyframes strain{0%,100%{transform:scale(1,1)}50%{transform:scale(1.06,.9)}}
@keyframes spin{to{transform:rotateY(720deg)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.want{position:absolute;z-index:4;left:calc(50% + min(18%,90px));bottom:calc(9% + min(52%,250px));background:#fff;border-radius:18px;padding:4px 10px;font-size:28px;box-shadow:0 3px 0 var(--edge);display:none;animation:bob 1.2s ease-in-out infinite}
.want.show{display:block}
.want:after{content:"";position:absolute;left:10px;bottom:-8px;border:8px solid transparent;border-top-color:#fff;border-bottom:0}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.poop{position:absolute;z-index:2;font-size:min(10vw,44px);line-height:1;cursor:pointer;transition:transform .9s cubic-bezier(.6,-.2,.7,1),left .9s cubic-bezier(.6,-.2,.7,1),bottom .9s,opacity .9s;animation:pop .35s ease-out}
.poop.gold{filter:sepia(1) saturate(4) hue-rotate(5deg) brightness(1.2) drop-shadow(0 0 6px #FFD43B)}
.poop.big{font-size:min(15vw,64px)}
.poop .fly{position:absolute;font-size:14px;left:60%;top:-30%;animation:flyc 1.4s linear infinite}
@keyframes flyc{0%{transform:translate(0,0)}25%{transform:translate(8px,-6px)}50%{transform:translate(0,-12px)}75%{transform:translate(-8px,-6px)}100%{transform:translate(0,0)}}
@keyframes pop{0%{transform:scale(0)}70%{transform:scale(1.25)}100%{transform:scale(1)}}
.water{position:absolute;left:0;right:0;bottom:0;height:30%;z-index:5;pointer-events:none;transform:translateX(110%);
  background:linear-gradient(180deg,rgba(120,200,255,.0),rgba(90,180,240,.75) 30%,rgba(60,150,230,.85));border-radius:60% 0 0 0}
.water.go{animation:wave 1.6s ease-in-out}
@keyframes wave{0%{transform:translateX(110%)}45%{transform:translateX(0)}100%{transform:translateX(-110%)}}
.fx{position:absolute;z-index:6;pointer-events:none;font-size:28px;animation:rise 1.1s ease-out forwards}
@keyframes rise{0%{opacity:1;transform:translate(-50%,0) scale(.6)}100%{opacity:0;transform:translate(-50%,-90px) scale(1.3)}}
.food{position:absolute;z-index:6;font-size:44px;pointer-events:none;transition:transform .6s cubic-bezier(.4,-.3,.6,1),opacity .2s}
.night{position:absolute;inset:0;z-index:7;background:radial-gradient(circle at 80% 20%,#3A3F7A,#171A3A);opacity:0;pointer-events:none;transition:opacity .8s}
.night.on{opacity:.82;pointer-events:auto}
.night:before{content:"🌙 ✨      ⭐        ✨";position:absolute;top:12%;left:10%;font-size:22px;white-space:pre}
.zzz{position:absolute;z-index:8;font-size:32px;color:#fff;pointer-events:none;animation:rise 1.6s ease-out forwards;font-family:var(--display)}
.tub{position:absolute;left:50%;bottom:4%;width:min(80%,380px);height:30%;transform:translateX(-50%);z-index:4;display:none;pointer-events:none}
.tub.on{display:block}
.tub:before{content:"";position:absolute;inset:18% 0 0 0;background:linear-gradient(#fff,#E4EEF7);border-radius:20px 20px 46% 46%;box-shadow:inset 0 -8px 0 #CBDCEC,0 6px 0 rgba(0,0,0,.08)}
.tub:after{content:"";position:absolute;left:4%;right:4%;top:10%;height:22%;background:rgba(150,210,255,.85);border-radius:50%}
.bubble{position:absolute;z-index:5;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,rgba(255,255,255,.75) 40%,rgba(190,225,255,.6));pointer-events:none;animation:bub 2.4s ease-out forwards}
@keyframes bub{0%{transform:scale(0)}15%{transform:scale(1)}80%{opacity:1}100%{transform:translateY(-50px) scale(1.1);opacity:0}}
.ball{position:absolute;z-index:6;font-size:min(13vw,52px);line-height:1;cursor:pointer;transition:left .7s ease-out,bottom .7s cubic-bezier(.3,1.6,.6,1)}
.modebar{position:absolute;z-index:9;left:50%;top:10px;transform:translateX(-50%);display:none}
.modebar.on{display:block}
.meter{width:min(70vw,300px);height:16px;background:#fff;border-radius:99px;overflow:hidden;box-shadow:0 2px 0 var(--edge)}
.meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--sky),var(--mint));transition:width .2s}
.say{position:absolute;z-index:8;left:50%;top:10px;transform:translateX(-50%);background:#fff;border-radius:18px;padding:8px 14px;font-family:var(--display);font-size:clamp(15px,4.2vw,20px);box-shadow:0 3px 0 var(--edge);white-space:nowrap;max-width:94%;overflow:hidden;text-overflow:ellipsis;opacity:0;transition:opacity .25s}
.say.on{opacity:1}

/* actions */
.acts{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.act{background:var(--panel);border-radius:18px;padding:6px 2px 5px;box-shadow:0 4px 0 var(--edge);display:flex;flex-direction:column;align-items:center;font-size:12px;gap:1px;min-width:0}
.act b{font-size:30px;line-height:36px}
.act:active{transform:translateY(3px);box-shadow:0 1px 0 var(--edge)}
.act.hint{background:#FFF4CC;animation:hopb .8s ease-in-out infinite}
@keyframes hopb{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.foods{position:absolute;z-index:9;left:8px;right:8px;bottom:8px;background:#fff;border-radius:22px;padding:10px;box-shadow:0 5px 0 var(--edge);display:none;grid-template-columns:repeat(4,1fr);gap:8px}
.foods.on{display:grid}
.foods button{font-size:38px;background:#FFF6EA;border-radius:16px;padding:4px 0;display:flex;flex-direction:column;align-items:center;font-size:12px}
.foods button b{font-size:36px;line-height:42px}

/* overlays */
.ov{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;padding:14px;background:rgba(67,54,90,.38)}
.ov.show{display:flex}
.card{background:var(--panel);border-radius:28px;padding:18px 16px;max-width:520px;width:100%;text-align:center;box-shadow:0 8px 0 var(--edge);max-height:94dvh;overflow:auto}
.card h1{font-family:var(--display);font-size:30px;margin:4px 0 6px;color:var(--pink)}
.card h2{font-family:var(--display);font-size:22px;margin:4px 0 8px}
.card p{margin:6px 0 10px;font-size:15px;color:var(--ink-soft);line-height:1.6}
.btns{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.bigbtn{background:var(--sun);font-family:var(--display);font-size:19px;padding:12px 18px;border-radius:999px;box-shadow:0 5px 0 #D9A21F}
.bigbtn:active{transform:translateY(3px);box-shadow:0 2px 0 #D9A21F}
.bigbtn.pink{background:var(--pink);color:#fff;box-shadow:0 5px 0 var(--pink-deep)}
.bigbtn.mint{background:var(--mint);color:#fff;box-shadow:0 5px 0 #2F9E79}
.bigbtn.small{font-size:15px;padding:9px 14px}
.bigbtn:disabled{opacity:.4}
.title-pets{display:flex;justify-content:center;gap:2px;margin:4px 0}
.title-pets div{width:74px;height:74px;animation:idle 2s ease-in-out infinite}
.title-pets div:nth-child(2){animation-delay:-.6s}.title-pets div:nth-child(3){animation-delay:-1.2s}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:8px;margin:8px 0}
.sp{background:#F8F4FF;border-radius:18px;padding:6px 2px 8px;font-size:12px;box-shadow:0 3px 0 var(--edge);position:relative}
.sp .im{width:70px;height:70px;margin:0 auto}
.sp.sel{background:#FFE6EF;box-shadow:0 3px 0 var(--pink-deep),0 0 0 3px var(--pink) inset}
.sp .badge{position:absolute;right:4px;top:4px;font-size:11px;background:var(--sun);border-radius:99px;padding:0 6px}
.preview{width:150px;height:150px;margin:0 auto}
.swatches{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:8px 0}
.sw{width:42px;height:42px;border-radius:50%;box-shadow:0 3px 0 rgba(0,0,0,.12),inset 0 0 0 3px rgba(255,255,255,.7)}
.sw.sel{outline:4px solid var(--ink);outline-offset:2px}
.nameRow{display:flex;gap:8px;justify-content:center;align-items:center;margin:8px 0}
.nameRow input{font:inherit;font-family:var(--display);font-size:20px;width:min(60vw,220px);padding:8px 12px;border-radius:14px;border:3px solid var(--edge);text-align:center;color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.chips button{background:#F8F4FF;border-radius:99px;padding:5px 10px;font-size:14px;box-shadow:0 2px 0 var(--edge)}
.zrow{display:flex;align-items:center;gap:6px;background:#F8F4FF;border-radius:16px;padding:6px 8px;margin:6px 0;text-align:left}
.zrow .nm{width:72px;flex:none;font-size:12px}
.zrow .cells{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;flex:1}
.zcell{aspect-ratio:1;border-radius:12px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;color:#D8CFE6;position:relative}
.zcell svg{width:100%;height:100%}
.zcell.got{background:#FFF6D6}
.evo{position:fixed;inset:0;z-index:30;display:none;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle,#FFF8D6,#FFC6DD);text-align:center;padding:16px}
.evo.show{display:flex}
.evo .im{width:min(70vw,300px);height:min(70vw,300px)}
.evo .im.flash{animation:flash 1.6s ease-in-out}
@keyframes flash{0%{filter:brightness(1)}30%{filter:brightness(4) saturate(0)}60%{filter:brightness(4) saturate(0);transform:scale(1.2) rotate(360deg)}100%{filter:brightness(1)}}
.evo h1{font-family:var(--display);font-size:28px;color:var(--pink);margin:6px 0}
.evo p{font-size:16px;margin:4px 0 14px}
.rays{position:absolute;inset:-50%;background:repeating-conic-gradient(rgba(255,255,255,.55) 0 10deg,transparent 10deg 20deg);animation:rot 12s linear infinite;z-index:-1}
@keyframes rot{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="top">
    <button class="iconbtn" id="homeBtn" aria-label="はじめに もどる">🏠</button>
    <div class="plate"><span class="lv" id="lv">Lv1</span><span class="pname" id="pname"></span><div class="xpbar"><i id="xp"></i></div><span class="stage-tag" id="stageTag"></span></div>
    <button class="iconbtn" id="zukanBtn" aria-label="ずかん">📖</button>
    <button class="iconbtn" id="voiceBtn" aria-label="こえ">🔊</button>
  </div>
  <div class="gauges" id="gauges"></div>
  <div class="room" id="room">
    <div class="win" id="win"></div>
    <div class="floor"></div>
    <div class="toilet" id="toilet">🚽</div>
    <div class="tub" id="tub"></div>
    <div class="pet" id="pet"><div class="inner" id="petInner"></div></div>
    <div class="want" id="want"></div>
    <div class="water" id="water"></div>
    <div class="night" id="night"></div>
    <div class="say" id="say"></div>
    <div class="modebar" id="modebar"><div class="meter"><i id="modeMeter"></i></div></div>
    <div class="foods" id="foods"></div>
  </div>
  <div class="acts" id="acts"></div>
</div>

<div class="ov show" id="titleOv"><div class="card" id="titleCard"></div></div>
<div class="ov" id="pickOv"><div class="card" id="pickCard"></div></div>
<div class="ov" id="zukanOv"><div class="card" id="zukanCard"></div></div>
<div class="ov" id="doneOv"><div class="card" id="doneCard"></div></div>
<div class="evo" id="evo"><div class="rays"></div><div class="im" id="evoIm"></div><h1 id="evoT"></h1><p id="evoP"></p><button class="bigbtn pink" id="evoBtn" style="display:none">やったー！</button></div>

<script>
"use strict";
const $=id=>document.getElementById(id);
const rnd=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function store(k,v){try{if(v===undefined)return JSON.parse(localStorage.getItem(k));localStorage.setItem(k,JSON.stringify(v))}catch(e){return null}}

/* ================= sound & voice ================= */
let AC=null;
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==="suspended")AC.resume();return AC}
function tone(f,d=.12,type="sine",v=.18,slide=0,delay=0){const a=ac();if(!a)return;const t0=a.currentTime+delay,o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f,t0);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(40,f*slide),t0+d);g.gain.setValueAtTime(v,t0);g.gain.exponentialRampToValueAtTime(.001,t0+d);o.connect(g);g.connect(a.destination);o.start(t0);o.stop(t0+d)}
function noise(d=.15,v=.15,f1=1200,f2=0){const a=ac();if(!a)return;const n=a.sampleRate*d,b=a.createBuffer(1,n,a.sampleRate),c=b.getChannelData(0);
  for(let i=0;i<n;i++)c[i]=(Math.random()*2-1)*Math.min(1,(n-i)/(n*.4));const s=a.createBufferSource();s.buffer=b;const f=a.createBiquadFilter();f.type="lowpass";f.frequency.setValueAtTime(f1,a.currentTime);
  if(f2)f.frequency.exponentialRampToValueAtTime(f2,a.currentTime+d);const g=a.createGain();g.gain.value=v;s.connect(f);f.connect(g);g.connect(a.destination);s.start()}
const SFX={
  pop(){tone(rnd(520,760),.12,"sine",.2,1.8)},
  munch(){tone(220,.08,"square",.06);tone(180,.08,"square",.06,0,.15);tone(240,.08,"square",.06,0,.3)},
  plop(){tone(300,.2,"sine",.25,.45)},
  pfu(){noise(.35,.25,500,150);tone(120,.3,"sawtooth",.05,.6)},
  flush(){noise(1.6,.32,3000,300);tone(400,.5,"sine",.06,.3,.9)},
  splash(){noise(.15,.15,2500)},
  heart(){tone(880,.1,"sine",.12);tone(1175,.15,"sine",.12,0,.09)},
  boing(){tone(260,.3,"sine",.2,2.6)},
  level(){[523,659,784,1047].forEach((f,i)=>tone(f,.2,"triangle",.15,0,i*.1))},
  evo(){[392,523,659,784,1047,1319].forEach((f,i)=>tone(f,.3,"triangle",.14,0,i*.13))},
  crack(){noise(.08,.3,4000)},
  nope(){tone(240,.15,"square",.05)},
  snore(){tone(140,.6,"sine",.08,.7)},
};
let voiceOn=store("pet_voice");if(voiceOn===null)voiceOn=true;
let jaVoice=null;function loadVoice(){try{jaVoice=speechSynthesis.getVoices().find(v=>/ja/i.test(v.lang))||null}catch(e){}}
try{speechSynthesis.onvoiceschanged=loadVoice;loadVoice()}catch(e){}
function speak(t){if(!voiceOn||!window.speechSynthesis)return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="ja-JP";if(jaVoice)u.voice=jaVoice;u.rate=1;u.pitch=1.35;speechSynthesis.speak(u)}catch(e){}}
let sayT=0;
function say(t,voice=true){const e=$("say");e.textContent=t;e.classList.add("on");clearTimeout(sayT);sayT=setTimeout(()=>e.classList.remove("on"),2600);if(voice)speak(t)}

/* ================= species ================= */
const SPECIES=[
  {id:"maru",name:"まるっち",c:"#FFB3C7",feats:["tuft"]},
  {id:"usa",name:"うさぎ",c:"#FFFFFF",body:"egg",ears:"bunny",tail:"puff"},
  {id:"neko",name:"ねこ",c:"#F7B267",ears:"cat",tail:"cat",feats:["whisk"]},
  {id:"inu",name:"いぬ",c:"#E8C39E",ears:"dog",tail:"puff",feats:["snout"]},
  {id:"kuma",name:"くま",c:"#B98560",ears:"bear",feats:["snout"]},
  {id:"panda",name:"パンダ",c:"#FFFFFF",ears:"bear",earDark:true,feats:["patch"]},
  {id:"pen",name:"ペンギン",c:"#5B7DB1",body:"egg",feats:["beak","belly","flipper"]},
  {id:"hiyo",name:"ひよこ",c:"#FFE066",feats:["beak","tuft","flipper"]},
  {id:"kaeru",name:"かえる",c:"#8BD17C",body:"wide",ears:"frog",feats:["belly"]},
  {id:"kitsune",name:"きつね",c:"#F4A259",ears:"fox",tail:"fox",feats:["belly"]},

  renderHeader();save()}

  const ties=vals.map((v,j)=>v===mx?j:-1).filter(j=>j>=0);return ids[ties.length>1?pick(ties):i]}

    P.g.fun=clamp(P.g.fun+8,0,100);P.g.energy=clamp(P.g.energy-4,0,100);P.cnt.play+=.6;gain(4);renderHeader();
    ballEl.style.left=rnd(5,75)+"%";ballEl.style.bottom=rnd(5,14)+"%";delete ballEl.dataset.fly;if(catches>=5)setTimeout(()=>endPlay(),500)},750)}
function endPlay(silent){if(!playing)return;playing=false;if(ballEl)ballEl.remove();ballEl=null;$("modebar").classList.remove("on");if(silent)return;
  if(catches>=3){say("たのしかった〜！");setMood("happy",1200);gain(6)}renderHeader();updateWant();save()}

/* sleep */
let sleeping=false;
$("a_sleep").onclick=()=>{if(!needPet())return;closeModes();sleeping=true;$("night").classList.add("on");$("win").style.background="linear-gradient(#20265A,#3A3F7A)";renderPet();say("おやすみ〜");SFX.snore();
  let k=0;const iv=setInterval(()=>{const c=petCenter();const z=document.createElement("div");z.className="zzz";z.textContent="Z";z.style.left=(c.x+c.w*.2+k*8)+"px";z.style.top=(c.top+10)+"px";$("room").appendChild(z);setTimeout(()=>z.remove(),1600);if(k%2)SFX.snore();k++},700);
  setTimeout(()=>{clearInterval(iv);sleeping=false;$("night").classList.remove("on");$("win").style.background="";P.g.energy=100;P.cnt.sleep+=1.2;setMood("happy",1200);anim("hop",550);say("おはよう！ げんき いっぱい！");gain(10);renderHeader();updateWant();save()},5200)};
$("night").onclick=()=>say("しーっ… ねてるよ",false);

/* pat */
let patT=0;
function pat(){if(!needPet())return;const now=Date.now();const c=petCenter();fx(pick(["💗","💕","💖"]),c.x+rnd(-40,40),c.top+rnd(0,40));SFX.heart();setMood("love",1000);anim("wiggle",900);
  if(now-patT>1500){patT=now;P.g.fun=clamp(P.g.fun+5,0,100);P.cnt.pet+=1;gain(4);if(Math.random()<.4)say(pick(["えへへ","うれしい！","くすぐったい〜","だいすき！"]));renderHeader();updateWant();save()}}
$("a_pat").onclick=pat;

/* pet / room pointer */
let drag=null;
$("pet").addEventListener("pointerdown",e=>{ac();if(!P)return;
  if(P.stage===0){P.hatch++;SFX.crack();anim("wiggle",900);const c=petCenter();fx("💗",c.x+rnd(-30,30),c.top+30);renderPet();renderHeader();
    if(P.hatch===1)say("あたたかく なってきた！");if(P.hatch===5)say("うごいてる！ もうすこし！");if(P.hatch>=8){P.hatch=8;evolve(1)}save();return}
  if(bathing){drag=true;return}pat()});
$("room").addEventListener("pointermove",e=>{if(!bathing)return;if(e.pointerType==="mouse"&&!e.buttons)return;const rr=$("room").getBoundingClientRect(),x=e.clientX-rr.left,y=e.clientY-rr.top,c=petCenter();if(Math.abs(x-c.x)<c.w*.45&&y>c.top)scrub(x,y)});
$("room").addEventListener("pointerdown",e=>{if(e.target.closest(".foods"))return;if(bathing){const rr=$("room").getBoundingClientRect();scrub(e.clientX-rr.left,e.clientY-rr.top)}});
$("room").style.touchAction="none";

/* tick */
setInterval(()=>{if(!P||P.stage===0||busy||sleeping||document.hidden)return;
  P.g.food=clamp(P.g.food-1.2,0,100);P.g.fun=clamp(P.g.fun-.9,0,100);P.g.energy=clamp(P.g.energy-.6,0,100);if(P.poops.length)P.g.clean=clamp(P.g.clean-.4*P.poops.length,0,100);else P.g.clean=clamp(P.g.clean-.3,0,100);
  // sometimes poops on its own
  if(Math.random()<.025&&P.poops.length<6)doPoop(1);
  renderHeader();updateWant();if(Math.random()<.2){renderPet();renderPoops()}save()},3000);

/* ================= screens ================= */
function showTitle(){busy=false;closeModes();$("titleOv").classList.add("show");const has=store("pet_cur");const n=Object.keys(zukan).length;
  const ps=[["uni","#FFFFFF","love"],["maru","#FFB3C7","king"],["dora","#7ED6A7","genki"]];
  $("titleCard").innerHTML=`<div class="title-pets">${ps.map(([s,c,v])=>`<div>${petSVG({sp:s,color:c,stage:3,variant:v,mood:"happy"})}</div>`).join("")}</div>
   <h1>なかよし ペット</h1><p>たまごから そだてて、おとなに しんか させよう！<br>${SPECIES.length}しゅるい × ${VARIANTS.length}つの すがた</p>
   <div class="btns">${has&&!has.done?`<button class="bigbtn pink" id="tCont">▶ つづきから（${has.name}）</button>`:""}
   <button class="bigbtn ${has&&!has.done?"":"pink"}" id="tNew">🥚 あたらしい たまご</button>
   <button class="bigbtn small" id="tZ">📖 ずかん（${n} / ${SPECIES.length*VARIANTS.length}）</button></div>`;
  if($("tCont"))$("tCont").onclick=()=>{ac();SFX.pop();P=has;$("titleOv").classList.remove("show");enterRoom()};
  $("tNew").onclick=()=>{ac();SFX.pop();if(has&&!has.done&&!confirm(`${has.name}と おわかれして あたらしい たまごに する？`))return;$("titleOv").classList.remove("show");openPick()};
  $("tZ").onclick=()=>{SFX.pop();openZukan()}}
let pk={sp:"maru",color:null,name:""};
function openPick(){pk={sp:pk.sp||"maru",color:null,name:""};pickStep1()}
function pickStep1(){$("pickCard").innerHTML=`<h2>どの こを そだてる？</h2><div class="grid">${SPECIES.map(s=>{const got=VARIANTS.filter(v=>zukan[zkey(s.id,v.id)]).length;
    return `<button class="sp ${pk.sp===s.id?"sel":""}" data-s="${s.id}">${got?`<span class="badge">${got}/6</span>`:""}<div class="im">${petSVG({sp:s.id,color:s.c,stage:2,mood:"normal"})}</div>${s.name}</button>`}).join("")}</div>
    <div class="btns"><button class="bigbtn pink" id="p1n">つぎへ ▶</button><button class="bigbtn small" id="p1b">もどる</button></div>`;
  $("pickOv").classList.add("show");speak("どの こを そだてる？");
  document.querySelectorAll("#pickCard .sp").forEach(b=>b.onclick=()=>{pk.sp=b.dataset.s;SFX.pop();speak(SPI[pk.sp].name);document.querySelectorAll("#pickCard .sp").forEach(x=>x.classList.toggle("sel",x===b))});
  $("p1n").onclick=()=>{SFX.pop();pk.color=SPI[pk.sp].c;pickStep2()};$("p1b").onclick=()=>{$("pickOv").classList.remove("show");showTitle()}}
function pickStep2(){const s=SPI[pk.sp];const cols=[s.c,...COLORS.filter(c=>c.toLowerCase()!==s.c.toLowerCase())];
  if(!pk.name)pk.name=pick(NAMES);
  $("pickCard").innerHTML=`<h2>いろと なまえを きめよう</h2><div class="preview" id="pv"></div>
   <div class="swatches">${cols.map(c=>`<button class="sw ${c===pk.color?"sel":""}" style="background:${c}" data-c="${c}" aria-label="いろ"></button>`).join("")}</div>
   <div class="nameRow"><input id="nm" maxlength="8" value="${pk.name}" aria-label="なまえ"><button class="iconbtn" id="dice" aria-label="なまえを きめる">🎲</button></div>
   <div class="chips">${NAMES.slice(0,8).map(n=>`<button data-n="${n}">${n}</button>`).join("")}</div>
   <div class="btns"><button class="bigbtn pink" id="p2n">🥚 たまごから そだてる！</button><button class="bigbtn small" id="p2b">もどる</button></div>`;
  const pv=()=>{$("pv").innerHTML=petSVG({sp:pk.sp,color:pk.color,stage:2,mood:"happy"})};pv();speak("いろと なまえを きめよう");
  document.querySelectorAll("#pickCard .sw").forEach(b=>b.onclick=()=>{pk.color=b.dataset.c;SFX.pop();document.querySelectorAll("#pickCard .sw").forEach(x=>x.classList.toggle("sel",x===b));pv()});
  const setN=n=>{pk.name=n;$("nm").value=n;SFX.pop();speak(n)};
  $("dice").onclick=()=>setN(pick(NAMES));document.querySelectorAll("#pickCard .chips button").forEach(b=>b.onclick=()=>setN(b.dataset.n));
  $("nm").oninput=()=>pk.name=$("nm").value;
  $("p2b").onclick=()=>{SFX.pop();pickStep1()};
  $("p2n").onclick=()=>{const n=($("nm").value||"").trim()||pick(NAMES);P=newPet(pk.sp,pk.color,n);save();$("pickOv").classList.remove("show");SFX.pop();enterRoom();say(`${n}の たまご！ タップして あたためよう！`)}}
function enterRoom(){busy=false;closeModes();renderPet();renderPoops();renderHeader();updateWant();
  if(P.stage===0)setTimeout(()=>say("たまごを タップして あたためよう！"),300);else if(P.done)say(`${P.name}、おかえり！`)}
function openZukan(){const n=Object.keys(zukan).length,tot=SPECIES.length*VARIANTS.length;
  $("zukanCard").innerHTML=`<h2>📖 ずかん　${n} / ${tot}</h2><p style="margin:0 0 4px">おとなに なると しんかの すがたが ふえるよ<br>${VARIANTS.map(v=>`${v.em}${v.name}＝${v.how}`).join("　")}</p>
   ${SPECIES.map(s=>`<div class="zrow"><div class="nm">${s.name}</div><div class="cells">${VARIANTS.map(v=>{const z=zukan[zkey(s.id,v.id)];
      return z?`<div class="zcell got" title="${z.name}">${petSVG({sp:s.id,color:z.color,stage:3,variant:v.id,mood:"happy"})}</div>`:`<div class="zcell">？</div>`}).join("")}</div></div>`).join("")}
   <div class="btns"><button class="bigbtn small" id="zc">とじる</button></div>`;
  $("zukanOv").classList.add("show");$("zc").onclick=()=>$("zukanOv").classList.remove("show")}

$("homeBtn").onclick=()=>{SFX.pop();save();showTitle()};
$("zukanBtn").onclick=()=>{SFX.pop();openZukan()};
function setVoiceBtn(){$("voiceBtn").textContent=voiceOn?"🔊":"🔇"}
$("voiceBtn").onclick=()=>{voiceOn=!voiceOn;store("pet_voice",voiceOn);setVoiceBtn();try{if(!voiceOn)speechSynthesis.cancel()}catch(e){}};
const st=document.createElement("style");st.textContent="@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}";document.head.appendChild(st);
setVoiceBtn();P=store("pet_cur");if(P){renderPet();renderPoops();renderHeader()}showTitle();
</script>
</body>
</html>
