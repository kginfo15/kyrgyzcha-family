<!DOCTYPE html>
<!--
  Жесты — ロシア語手話（РЖЯ）入門 学習アプリ（試作 v0.1）
  ============================================================
  方針メモ:
  - キルギス語アプリ（index.html）とは別アプリ。仕組み（カード・3段階評価・
    間隔反復・進捗・バックアップ）だけを流用し、保存キーも別（signApp_v1_*）。
  - 手話の動き自体は「既存の動画」で確認する設計。動画はダウンロードせず、
    YouTube 公式埋め込み（youtube-nocookie）と外部リンクのみで表示する。
  - 動きの文章解説は「出典のあるもの」だけを掲載。AIが推測で書いた解説は載せない。
    出典のないカードは、学習者が動画を見て自分でメモを書く。
  - 動画リンクは検索で見つけたもので、中身（どの秒に出るか・正確さ）は未確認。
  - 自分で撮った動画は端末内（IndexedDB）にだけ保存。外部送信しない。
  - キルギス語訳は参考。キルギスのろう者に確認できたカードは「確認済み」にする。
  ============================================================
-->

var APP_VERSION="0.1";
var LADDER_DAYS=[1,3,7,14,30,60];
var memStore={};
function lget(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch(e){return (k in memStore)?memStore[k]:d;}}
function lset(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){memStore[k]=v;}}

var settings=Object.assign({dailyNew:10,direction:"ja2sign",autoVideo:true,showKana:true},lget(K.set,{}));

function saveAll(){lset(K.prog,progress);lset(K.notes,notes);lset(K.set,settings);lset(K.hist,hist);lset(K.sess,ui);}
function saveUI(){lset(K.sess,ui);}

function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function now(){return Date.now();}
function todayKey(d){d=d||new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function N(id){if(!notes[id])notes[id]={memo:"",verified:false,hasVideo:false};return notes[id];}

/* ===== 進捗・SRS（index.html と同じ仕組み） ===== */
function P(id){
  if(!progress[id])progress[id]={status:"new",correctCount:0,wrongCount:0,uncertainCount:0,lastReviewed:null,
    nextReview:null,intervalDays:0,intervalStep:0,favorite:false,correctDays:[]};
  return progress[id];
}
function hasProg(id){return !!progress[id]&&progress[id].status!=="new";}
function dayRec(k){k=k||todayKey();if(!hist.days[k])hist.days[k]={learned:0,reviewed:0,newIntro:0};return hist.days[k];}
function bumpStreak(){var t=todayKey();if(hist.streak.last===t)return;var y=new Date();y.setDate(y.getDate()-1);
  hist.streak.count=(hist.streak.last===todayKey(y))?hist.streak.count+1:1;hist.streak.last=t;}
function schedule(p,step){p.intervalStep=step;
  if(step<=0){p.intervalDays=0;p.nextReview=now()+10*60*1000;}
  else{var d=LADDER_DAYS[Math.min(step-1,LADDER_DAYS.length-1)];p.intervalDays=d;p.nextReview=now()+d*86400000;}}
function answer(id,kind){
  var p=P(id),wasNew=(p.status==="new"),t=todayKey();bumpStreak();
  if(wasNew){dayRec().newIntro++;dayRec().learned++;}else dayRec().reviewed++;
  p.lastReviewed=now();
  if(kind==="no"){p.wrongCount++;p.status="learning";schedule(p,0);}
  else if(kind==="maybe"){p.uncertainCount++;if(p.status==="new")p.status="learning";p.nextReview=now()+86400000;p.intervalDays=1;}
  else{p.correctCount++;if(p.correctDays.indexOf(t)<0)p.correctDays.push(t);schedule(p,(p.intervalStep||0)+1);
    p.status=(p.correctDays.length>=3)?"mastered":"reviewing";}
  saveAll();
}
function isDue(id){var p=progress[id];return p&&p.nextReview&&p.nextReview<=now();}
function isWeak(id){var p=progress[id];if(!p)return false;var tot=p.correctCount+p.wrongCount;return p.wrongCount>=2||(tot>=3&&p.correctCount/tot<0.5);}
function dailyRemaining(){var r=settings.dailyNew-(dayRec().newIntro||0);return r>0?r:0;}

function buildQueue(scope){
  var ids;
  if(scope.type==="cat") ids=CARDS.filter(function(c){return c.cat===scope.cat;}).map(function(c){return c.id;});
  else if(scope.type==="new"){ids=CARDS.filter(function(c){return !hasProg(c.id);}).map(function(c){return c.id;}).slice(0,dailyRemaining());}
  else if(scope.type==="review") ids=CARDS.map(function(c){return c.id;}).filter(isDue)
    .sort(function(a,b){return progress[a].nextReview-progress[b].nextReview;});
  else if(scope.type==="weak") ids=CARDS.map(function(c){return c.id;}).filter(isWeak);
  else if(scope.type==="fav") ids=CARDS.map(function(c){return c.id;}).filter(function(id){return progress[id]&&progress[id].favorite;});
  else if(scope.type==="one") ids=[scope.id];
  else ids=[];
  return ids;
}
function startSession(scope,label){
  var list=buildQueue(scope);
  if(!list.length){toast(scope.type==="new"?"今日の新しいカードは上限に達しました":"対象のカードがありません");return;}
  ui.session={list:list,pos:0,revealed:false,label:label||"",back:ui.view};
  saveUI();render();window.scrollTo(0,0);
}
function endSession(){ui.session=null;saveUI();render();}

/* ===== 自分の動画（IndexedDB・端末内のみ） ===== */
var dbP=null, urlCache={};
function db(){
  if(!dbP)dbP=new Promise(function(res,rej){
    try{var r=indexedDB.open("signApp_videos",1);
      r.onupgradeneeded=function(){r.result.createObjectStore("v");};
      r.onsuccess=function(){res(r.result);}; r.onerror=function(){rej(r.error);};
    }catch(e){rej(e);}
  });
  return dbP;
}
function vidOp(mode,fn){return db().then(function(d){return new Promise(function(res,rej){
  var tx=d.transaction("v",mode),st=tx.objectStore("v"),q=fn(st);
  tx.oncomplete=function(){res(q&&q.result);}; tx.onerror=function(){rej(tx.error);};
});});}
function vidPut(id,blob){return vidOp("readwrite",function(s){return s.put(blob,id);});}
function vidGet(id){return vidOp("readonly",function(s){return s.get(id);});}
function vidDel(id){return vidOp("readwrite",function(s){return s.delete(id);});}
function fillOwnVideos(root){
  (root||document).querySelectorAll("video[data-own]").forEach(function(v){
    var id=v.getAttribute("data-own");
    if(urlCache[id]){v.src=urlCache[id];return;}
    vidGet(id).then(function(b){if(b){urlCache[id]=URL.createObjectURL(b);v.src=urlCache[id];}})
      .catch(function(){});
  });
}
function recordVideo(id){
  var inp=document.createElement("input");inp.type="file";inp.accept="video/*";
  inp.onchange=function(){var f=inp.files&&inp.files[0];if(!f)return;
    if(f.size>80*1024*1024&&!confirm("動画が大きめです（"+Math.round(f.size/1048576)+"MB）。保存しますか？"))return;
    vidPut(id,f).then(function(){
      if(urlCache[id]){URL.revokeObjectURL(urlCache[id]);delete urlCache[id];}
      N(id).hasVideo=true;saveAll();toast("動画を保存しました");refresh();
    }).catch(function(){toast("保存できませんでした（容量不足の可能性）");});
  };
  inp.click();
}
function deleteVideo(id){
  if(!confirm("このカードの自分の動画を削除しますか？"))return;
  vidDel(id).then(function(){if(urlCache[id]){URL.revokeObjectURL(urlCache[id]);delete urlCache[id];}
    N(id).hasVideo=false;saveAll();toast("削除しました");refresh();});
}

  var mastered=all.filter(function(id){return progress[id]&&progress[id].status==="mastered";});
  var h='<button class="btn full" data-act="startreview" style="background:var(--teal);color:#fff;border-color:var(--teal);margin-bottom:14px">今日の復習を開始（'+due.length+'枚）</button>';
  function row(l,n,t){return '<div class="reviewcat" '+(n&&t?'data-act="reviewscope" data-type="'+t+'"':'')+'><b>'+l+'</b><div class="n">'+n+'</div></div>';}
  h+=row("今日復習するカード",due.length,"review")+row("苦手なカード",weak.length,"weak")+row("お気に入り",fav.length,"fav")+row("定着済み",mastered.length,"");
  if(!due.length) h+='<div class="empty">今日の復習はありません。\n学習タブで新しいカードに進もう。</div>';
  return h;
}

function renderList(){
  var cur=ui.listCat||"all";
  var h='<div class="seg">'+[["all","すべて"]].concat(CATS.map(function(c){return [c.id,c.name];})).map(function(o){
    return '<button class="'+(cur===o[0]?"on":"")+'" data-act="listcat" data-val="'+o[0]+'">'+esc(o[1])+'</button>';}).join("")+'</div>';
  CATS.forEach(function(cat){
    if(cur!=="all"&&cur!==cat.id)return;
    h+='<div class="h2">'+cat.icon+' '+esc(cat.name)+'</div>';
    CARDS.filter(function(c){return c.cat===cat.id;}).forEach(function(c){
      h+='<div class="lrow" data-act="opencard" data-val="'+c.id+'"><div class="m"><div class="a">'+esc(c.ja)+'</div><div class="b">'+esc(c.ru)+'</div></div>'+
         '<div class="st">'+(cardHasVideo(c)?'<span class="tag yt">動画</span>':'')+(c.desc?'<span class="tag ok">解説</span>':'')+statusTags(c)+'</div></div>';
    });
  });
  return h;
}

function renderProgress(){
  var all=CARDS.length;
  var learned=CARDS.filter(function(c){return hasProg(c.id);}).length;
  var mastered=CARDS.filter(function(c){var p=progress[c.id];return p&&p.status==="mastered";}).length;
  var verified=CARDS.filter(function(c){return N(c.id).verified;}).length;
  var own=CARDS.filter(function(c){return N(c.id).hasVideo;}).length;
  var memo=CARDS.filter(function(c){return !!N(c.id).memo;}).length;
  var t=dayRec();
  var h='';
  CATS.forEach(function(cat){
    var ids=CARDS.filter(function(c){return c.cat===cat.id;});
    var l=ids.filter(function(c){return hasProg(c.id);}).length;
    var m=ids.filter(function(c){var p=progress[c.id];return p&&p.status==="mastered";}).length;
    h+='<div class="card" style="padding:13px 14px;margin-bottom:9px"><div style="display:flex;justify-content:space-between"><b>'+cat.icon+' '+esc(cat.name)+'</b>'+
       '<span class="small muted">学習 '+l+' / '+ids.length+'（定着 '+m+'）</span></div>'+
       '<div class="bar" style="margin-top:8px"><i style="width:'+Math.round(l/ids.length*100)+'%;background:'+cat.color+'"></i></div>'+
       '<div class="bar" style="margin-top:5px"><i style="width:'+Math.round(m/ids.length*100)+'%;background:var(--good)"></i></div></div>';
  });
  h+='<div class="small muted" style="margin:-2px 2px 10px">上=学習済み / 下（緑）=定着</div>';
  function sb(n,l){return '<div class="b"><div class="n">'+n+'</div><div class="l">'+l+'</div></div>';}
  h+='<div class="stat">'+sb(learned+"/"+all,"学習済み")+sb(mastered,"定着")+sb(verified,"ろう者に確認済み")+sb(own,"自分の動画")+
     sb(memo,"メモあり")+sb(hist.streak.count||0,"連続日数")+sb(t.learned||0,"今日の新規")+sb(t.reviewed||0,"今日の復習")+'</div>';
  h+='<div class="notice" style="margin-top:14px">目安：挨拶は3〜5時間、自己紹介（指文字を含む）は合計10〜20時間。読み取りは実際の会話で伸びるので、ろう者と話す機会もつくろう。</div>';
  h+='<button class="btn full ghost" data-act="settings" style="margin:4px 0 8px">設定・バックアップ・このアプリについて</button>';
  return h;
}

/* ===== シート ===== */
function openSheet(inner,cardId){document.getElementById("modal").innerHTML='<div class="ovl" data-act="ovl"><div class="sheet"'+(cardId?' data-card="'+cardId+'"':'')+'>'+inner+'</div></div>';
  fillOwnVideos(document.getElementById("modal"));}
function closeSheet(){document.getElementById("modal").innerHTML="";}
function toast(msg){var t=document.getElementById("toast");t.textContent=msg;t.className="toast show";setTimeout(function(){t.className="toast";},1700);}

function cardSheet(id){
  var c=CMAP[id],n=N(id),cat=CATMAP[c.cat];
  var sh=document.querySelector(".sheet"),keepScroll=sh?sh.scrollTop:0;
  var h='<div class="small" style="font-weight:800;color:'+cat.color+'">'+cat.icon+' '+esc(cat.name)+'</div>';
  h+='<h3 style="margin-bottom:4px">'+esc(c.ja)+'</h3>'+wordBlock(c,true);
  h+=videoBlock(c,{noAuto:!settings.autoVideo})+descBlock(c);
  if(c.note) h+='<div class="note">'+esc(c.note)+'</div>';
  h+='<div class="setrow" style="margin-top:16px"><div class="lab">自分の動画（端末内にだけ保存）</div>'+
     '<div style="display:flex;gap:8px"><button class="btn sm" style="flex:1" data-act="rec" data-val="'+id+'">'+(n.hasVideo?"撮り直す／差し替え":"録画する／動画を選ぶ")+'</button>'+
     (n.hasVideo?'<button class="btn sm" style="color:var(--red);border-color:#f0c2c2" data-act="delvid" data-val="'+id+'">削除</button>':'')+'</div>'+
     '<div class="small muted" style="margin-top:5px">キルギスのろう者にやってもらった動画や、自分の練習動画を保存できます。</div></div>';
  h+='<div class="setrow"><div class="lab">メモ（動きの説明・キルギスでの違い・見つけた動画URLなど）</div>'+
     '<textarea class="memo" data-memo="'+id+'" placeholder="例）右手を…。キルギスでは○○さんは少し違う形を使っていた。">'+esc(n.memo)+'</textarea></div>';
  h+='<div class="setrow"><div class="lab">確認状態</div><div class="seg">'+
     '<button class="'+(!n.verified?"on":"")+'" data-act="verify" data-id="'+id+'" data-val="0">未確認</button>'+
     '<button class="'+(n.verified?"on":"")+'" data-act="verify" data-id="'+id+'" data-val="1">ろう者に確認済み</button></div></div>';
  h+='<div style="display:flex;gap:8px"><button class="btn pri" style="flex:1" data-act="studyone" data-val="'+id+'">このカードを練習</button>'+
     '<button class="btn" style="flex:1;background:var(--ink);color:#fff;border-color:var(--ink)" data-act="closesheet">閉じる</button></div>';
  openSheet(h,id);
  var ns=document.querySelector(".sheet"); if(ns&&keepScroll) ns.scrollTop=keepScroll;
}

function settingsSheet(){
  function seg(act,opts,cur){return '<div class="seg">'+opts.map(function(o){
    return '<button class="'+(String(cur)===String(o[0])?"on":"")+'" data-act="'+act+'" data-val="'+o[0]+'">'+o[1]+'</button>';}).join("")+'</div>';}
  var h='<h3>設定</h3>';
  h+='<div class="setrow"><div class="lab">出題方向</div>'+seg("dir",[["ja2sign","日本語→手話"],["sign2ja","手話→意味"],["random","ミックス"]],settings.direction)+
     '<div class="small muted" style="margin-top:-6px">「手話→意味」は動画を見て意味を当てる読み取り練習（動画のないカードは日本語から出題）。</div></div>';
  h+='<div class="setrow"><div class="lab">1日の新しいカード数</div>'+seg("daily",[[5,"5"],[10,"10"],[15,"15"],[20,"20"]],settings.dailyNew)+'</div>';
  h+='<div class="setrow"><div class="lab">YouTube動画を自動で表示</div>'+seg("auto",[["true","ON"],["false","OFF（タップで表示）"]],settings.autoVideo)+
     '<div class="small muted" style="margin-top:-6px">OFFにすると、タップするまで YouTube に接続しません（通信量の節約にも）。</div></div>';
  h+='<div class="setrow"><div class="lab">ロシア語の読み（カタカナ）</div>'+seg("kana",[["true","表示"],["false","非表示"]],settings.showKana)+'</div>';
  h+='<div class="setrow"><div class="lab">データ管理</div>'+
     '<button class="btn full" data-act="export" style="margin-bottom:8px">進捗とメモを書き出す（バックアップ）</button>'+
     '<button class="btn full" data-act="import" style="margin-bottom:8px">バックアップを読み込む</button>'+
     '<button class="btn full" data-act="reset" style="color:var(--red);border-color:#f0c2c2">学習進捗を初期化（メモと動画は残す）</button>'+
     '<div class="small muted" style="margin-top:6px">※ 自分の動画はバックアップに含まれません（端末内にのみ保存）。</div></div>';
  h+='<button class="btn full" data-act="about" style="margin-bottom:8px">このアプリについて（方針・注意）</button>';
  h+='<div class="small muted">v'+APP_VERSION+'（試作）/ '+CARDS.length+'枚</div>';
  h+='<button class="btn full" data-act="closesheet" style="margin-top:14px;background:var(--ink);color:#fff;border-color:var(--ink)">閉じる</button>';
  openSheet(h);
}
function aboutSheet(){
  var h='<h3>このアプリについて</h3><div class="small" style="line-height:1.9">'+
    '<p><b>ロシア語手話（РЖЯ）</b>の入門用です。キルギスのろう者の多くはロシア語手話を使っていますが、キルギス独自の単語や地域差もあると言われています。</p>'+
    '<ul style="padding-left:18px;margin:6px 0">'+
    '<li><b>動画が正解</b>：手話の動きは既存の動画（YouTube埋め込み・外部リンク）で確認します。動画はこのアプリに含まれていません。</li>'+
    '<li><b>文章の解説は出典のあるものだけ</b>：推測で書いた解説は載せていません。</li>'+
    '<li><b>動画は検索で見つけたもの</b>で、中身や正確さは未確認です。おかしいと思ったら別の動画で確かめてください。</li>'+
    '<li><b>確認済み</b>：キルギスのろう者に見てもらえたカードは「確認済み」にし、違いはメモ・録画しておきましょう。</li>'+
    '<li>ロシア語手話はロシア語を手で表したものではなく、<b>独自の文法を持つ言語</b>です。表情（特に疑問文の眉）や、手話と一緒に口でロシア語の単語の形を作ることも大切です。</li>'+
    '<li>自分の動画・メモ・進捗は端末内にだけ保存されます。YouTube の動画を表示する時だけ YouTube に接続します。</li>'+
    '</ul>'+
    '<p class="muted">主な参考：ВОГ「Давайте знакомиться!」、Spreadthesign、signflow.ru、Город жестов。</p></div>'+
    '<button class="btn full" data-act="closesheet" style="margin-top:8px;background:var(--ink);color:#fff;border-color:var(--ink)">閉じる</button>';
  openSheet(h);
}

/* ===== バックアップ ===== */
function exportData(){
  var data={app:"sign",appVersion:APP_VERSION,exportedAt:new Date().toISOString(),settings:settings,progress:progress,notes:notes,hist:hist};
  var blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
  var url=URL.createObjectURL(blob),a=document.createElement("a");
  a.href=url;a.download="zhesty_backup_"+todayKey()+".json";document.body.appendChild(a);a.click();
  setTimeout(function(){URL.revokeObjectURL(url);a.remove();},100);toast("書き出しました");
}
function importData(){
  var inp=document.createElement("input");inp.type="file";inp.accept="application/json,.json";
  inp.onchange=function(){var f=inp.files[0];if(!f)return;var r=new FileReader();
    r.onload=function(){try{var d=JSON.parse(r.result);if(d.app!=="sign")throw 0;
      progress=d.progress||{};hist=d.hist||hist;if(d.settings)settings=Object.assign(settings,d.settings);
      if(d.notes){Object.keys(d.notes).forEach(function(id){var keep=N(id).hasVideo;notes[id]=d.notes[id];notes[id].hasVideo=keep;});}
      saveAll();closeSheet();render();toast("復元しました");
    }catch(e){toast("このアプリのバックアップではないようです");}};
    r.readAsText(f);};
  inp.click();
}
function resetData(){
  if(!confirm("学習進捗を初期化します（メモ・確認状態・自分の動画は残ります）。よろしいですか？"))return;
  progress={};hist={streak:{count:0,last:null},days:{}};ui.session=null;saveAll();closeSheet();render();toast("初期化しました");
}

/* ===== イベント ===== */
document.body.addEventListener("click",function(e){
  var t=e.target.closest("[data-act]");if(!t)return;
  var a=t.getAttribute("data-act"),V=function(n){return t.getAttribute(n);};
  if(a==="tab"){ui.view=V("data-val");ui.session=null;saveUI();render();return;}
  if(a==="settings"){settingsSheet();return;}
  if(a==="about"){aboutSheet();return;}
  if(a==="closesheet"){closeSheet();render();return;}
  if(a==="ovl"){if(e.target.classList.contains("ovl")){closeSheet();render();}return;}

  if(a==="dir"){settings.direction=V("data-val");saveAll();settingsSheet();return;}
  if(a==="daily"){settings.dailyNew=+V("data-val");saveAll();settingsSheet();return;}
  if(a==="auto"){settings.autoVideo=(V("data-val")==="true");saveAll();settingsSheet();return;}
  if(a==="kana"){settings.showKana=(V("data-val")==="true");saveAll();settingsSheet();return;}
  if(a==="export"){exportData();return;}
  if(a==="import"){importData();return;}
  if(a==="reset"){resetData();return;}

  if(a==="startnew"){startSession({type:"new"},"新しいカード");return;}
  if(a==="startreview"){startSession({type:"review"},"今日の復習");return;}
  if(a==="startcat"){startSession({type:"cat",cat:V("data-val")},CATMAP[V("data-val")].name);return;}
  if(a==="reviewscope"){var ty=V("data-type");startSession({type:ty},{review:"今日の復習",weak:"苦手",fav:"お気に入り"}[ty]);return;}
  if(a==="studyone"){closeSheet();startSession({type:"one",id:V("data-val")},CMAP[V("data-val")].ja);return;}
  if(a==="endsession"){endSession();return;}
  if(a==="reveal"){ui.session.revealed=true;saveUI();render();return;}
  if(a==="fav"){var p=P(V("data-val"));p.favorite=!p.favorite;saveAll();render();return;}
  if(a==="grade"){var s=ui.session,id=s.list[s.pos],k=V("data-val");answer(id,k);
    if(k==="no"&&s.list.length<200)s.list.push(id);
    s.pos++;s.revealed=false;saveUI();render();window.scrollTo(0,0);return;}

  if(a==="listcat"){ui.listCat=V("data-val");saveUI();render();return;}
  if(a==="opencard"){cardSheet(V("data-val"));return;}
  if(a==="verify"){N(V("data-id")).verified=(V("data-val")==="1");saveAll();cardSheet(V("data-id"));return;}
  if(a==="rec"){recordVideo(V("data-val"));return;}
  if(a==="delvid"){deleteVideo(V("data-val"));return;}
  if(a==="loadyt"){var wrap=document.createElement("div");
    wrap.innerHTML=ytEmbed({id:V("data-id"),start:+V("data-start")},true);t.replaceWith(wrap.firstChild);return;}
});
document.body.addEventListener("input",function(e){
  var id=e.target.getAttribute&&e.target.getAttribute("data-memo");
  if(id){N(id).memo=e.target.value;lset(K.notes,notes);}
});

/* ===== 起動 ===== */
if(ui.session&&!(ui.session.list||[]).every(function(id){return CMAP[id];}))ui.session=null;
render();
</script>
</body>
</html>
