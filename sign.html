<!DOCTYPE html>
<!--
  ロシア語手話（РЖЯ）レッスン帳（v2.0・3人で使う復習アプリ）
  ============================================================
  方針メモ:
  - キルギス語アプリ（index.html）とは別アプリ。仕組み（カード・3段階評価・
    間隔反復・進捗・バックアップ）だけを流用し、保存キーも別（signApp_v1_*）。
  - 手話の動き自体は「既存の動画」で確認する設計。動画はダウンロードせず、
    YouTube 公式埋め込み（youtube-nocookie）と外部リンクのみで表示する。
  - 動きの文章解説は「出典のあるもの」だけを掲載。AIが推測で書いた解説は載せない。
    出典のないカードは、学習者が動画を見て自分でメモを書く。
  - 動画リンクは検索で見つけたもので、中身（どの秒に出るか・正確さ）は未確認。
  - 自分で撮った動画は端末内（IndexedDB）にだけ保存。外部送信しない。
  - キルギス語訳は参考。キルギスのろう者に確認できたカードは「確認済み」にする。
  ============================================================
-->
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="theme-color" content="#3B5BDB">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ロシア語手話">
<title>ロシア語手話 — レッスン帳</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%233B5BDB'/%3E%3Cpath d='M38 72V40a5 5 0 0 1 10 0v-8a5 5 0 0 1 10 0v6a5 5 0 0 1 10 0v24c0 8-6 14-14 14h-4c-6 0-9-3-12-8L30 56a5 5 0 0 1 8-6z' fill='%23fff'/%3E%3C/svg%3E">
<style>
  :root{
    --accent:#3B5BDB; --accentDeep:#2B44A8; --gold:#F2B705; --goldSoft:#F7D26B;
    --ink:#1E2230; --paper:#F6F7FB; --card:#FFFFFF; --teal:#168F8B;
    --muted:#737A8C; --line:#DDE1EC; --good:#2F9E44; --warn:#E8590C; --yellow:#E6A700; --red:#C92A2A;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0}
  body{background:var(--paper);color:var(--ink);padding-bottom:calc(20px + env(safe-area-inset-bottom));
    font-family:system-ui,-apple-system,"Helvetica Neue","Hiragino Sans","Noto Sans JP",sans-serif;
    -webkit-text-size-adjust:100%;line-height:1.5}
  header.app{background:linear-gradient(135deg,var(--accent),var(--accentDeep));color:#fff;
    padding:calc(14px + env(safe-area-inset-top)) 16px 12px}
  header.app .row{display:flex;align-items:center;gap:12px;max-width:600px;margin:0 auto}
  header.app h1{margin:0;font-size:22px;font-weight:800;letter-spacing:.5px}
  header.app p{margin:1px 0 0;font-size:11.5px;opacity:.9}
  .gear{margin-left:auto;background:rgba(255,255,255,.16);border:none;color:#fff;padding:8px 13px;
    border-radius:10px;font-size:13px;font-weight:800;cursor:pointer}
  nav.tabs{position:sticky;top:0;z-index:20;background:var(--paper);border-bottom:1px solid var(--line)}
  nav.tabs .inner{max-width:600px;margin:0 auto;display:flex}
  nav.tabs button{flex:1;padding:14px 2px;background:transparent;border:none;border-bottom:3px solid transparent;
    cursor:pointer;color:var(--muted);min-height:50px;font-size:15px;font-weight:800;font-family:inherit}
  nav.tabs button.on{color:var(--ink);border-bottom-color:var(--accent)}
  main{max-width:600px;margin:0 auto;padding:16px 14px 0}
  .btn{appearance:none;border:1.5px solid var(--line);background:#fff;color:var(--ink);text-decoration:none;display:inline-block;text-align:center;
    padding:12px 14px;border-radius:13px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;min-height:46px}
  .btn:active{transform:translateY(1px)}
  .btn.sm{padding:7px 12px;min-height:0;font-size:13px;border-radius:10px}
  .btn.pri{background:var(--accent);color:#fff;border-color:var(--accent)}
  .full{width:100%}
  .ghost{background:transparent;color:var(--muted)}
  .seg{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
  .seg button{flex:1;min-width:62px;padding:9px 6px;border-radius:99px;font-size:13.5px;font-weight:800;font-family:inherit;
    cursor:pointer;white-space:nowrap;border:1.5px solid var(--line);background:#fff;color:var(--muted);min-height:42px}
  .seg button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
  .bar>i{display:block;height:100%;background:var(--accent);border-radius:99px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:0 6px 22px rgba(30,34,48,.06)}
  .muted{color:var(--muted)} .small{font-size:12px}
  .h2{font-size:13px;font-weight:800;color:var(--muted);margin:18px 2px 8px}
  .catrow{display:flex;align-items:center;gap:12px;padding:13px 14px;border:1px solid var(--line);
    border-radius:14px;background:#fff;margin-bottom:10px;cursor:pointer}
  .catrow .ic{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;flex:none}
  .catrow .meta{flex:1;min-width:0}
  .catrow .nm{font-weight:800;font-size:15px}
  .catrow .ct{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .catrow .rt{text-align:right;font-size:12px;color:var(--muted);min-width:56px}
  .catrow .rt b{font-size:16px;color:var(--ink);font-variant-numeric:tabular-nums}
  .notice{background:#EEF2FF;border:1px solid #C9D3F7;border-radius:14px;padding:12px 14px;font-size:13px;line-height:1.7;margin-bottom:14px}
  .warnbox{background:#FFF4E6;border:1px solid #FFD8A8;border-radius:12px;padding:10px 12px;font-size:12.5px;line-height:1.7}
  /* study */
  .study .top{display:flex;align-items:center;gap:8px;margin-bottom:12px}
  .qcard{padding:22px 18px;text-align:center;position:relative}
  .jp{font-size:26px;font-weight:800;line-height:1.4}
  .ru{font-size:30px;font-weight:800;color:var(--accentDeep);line-height:1.35;word-break:break-word}
  .ru.sm{font-size:19px}
  .kana{font-size:15px;color:var(--teal);font-weight:800;margin-top:4px}
  .ky{font-size:13px;color:var(--muted);margin-top:6px}
  .ky b{color:#B3261E}
  .note{margin-top:12px;padding:11px 14px;background:#FFF7E8;border:1px solid var(--goldSoft);border-radius:12px;font-size:13.5px;line-height:1.7;text-align:left}
  .desc{margin-top:12px;padding:12px 14px;background:#F0FAF7;border:1px solid #BFE5DC;border-radius:12px;text-align:left}
  .desc .h{font-size:12.5px;font-weight:800;color:var(--teal);margin-bottom:4px}
  .desc .b{font-size:14px;line-height:1.75;white-space:pre-line}
  .desc .src{font-size:11.5px;color:var(--muted);margin-top:6px}
  .desc .src a{color:var(--teal)}
  .stbtn{display:block;text-decoration:none;background:var(--accent);color:#fff;border-radius:14px;padding:12px 14px;margin-bottom:10px;text-align:left}
  .stbtn .big{display:block;font-size:16px;font-weight:800}
  .stbtn .sm{display:block;font-size:12px;opacity:.9;margin-top:2px}
  details.longv{margin-top:6px;border:1px solid var(--line);border-radius:12px;background:#fff;overflow:hidden}
  details.longv>summary{cursor:pointer;padding:10px 12px;font-size:12.5px;font-weight:800;color:var(--muted)}
  details.longv .inner{padding:4px 12px 10px}
  .fig{margin-top:12px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 8px 6px;text-align:center}
  .fig svg{width:100%;max-width:340px;height:auto;display:block;margin:0 auto}
  .fig .cap{font-size:11.5px;color:var(--muted);margin-top:4px;line-height:1.5;text-align:left}
  .desc.single{background:#FFF9DB;border-color:#FFE066}
  .desc.single .h{color:#E67700}
  .desc.none{background:#F6F7FB;border-color:var(--line)}
  .desc.none .h{color:var(--muted)}
  .vids{margin-top:12px;text-align:left}
  .vid{margin-bottom:10px}
  .vid .lab{font-size:12px;font-weight:800;color:var(--muted);margin-bottom:4px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  .frame{position:relative;width:100%;padding-top:56.25%;background:#111;border-radius:12px;overflow:hidden}
  .frame iframe,.frame video{position:absolute;inset:0;width:100%;height:100%;border:0;background:#111}
  .vidph{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:18px 10px;background:#1E2230;color:#fff;
    border:none;border-radius:12px;font-size:14px;font-weight:800;cursor:pointer;font-family:inherit}
  .links{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
  .links a{font-size:12.5px;font-weight:800;color:var(--accentDeep);background:#EEF2FF;border:1px solid #C9D3F7;border-radius:99px;
    padding:6px 12px;text-decoration:none}
  .tag{font-size:10.5px;font-weight:800;padding:1px 7px;border-radius:99px;display:inline-block}
  .tag.unv{background:#F1F3F5;color:#868E96}
  .tag.ok{background:#EBFBEE;color:var(--good)}
  .tag.own{background:#FFF0F6;color:#C2255C}
  .tag.yt{background:#FFF5F5;color:#E03131}
  .ans3{display:flex;gap:8px;margin-top:14px}
  .ans3 button{flex:1;border:none;color:#fff;border-radius:13px;font-size:14px;font-weight:800;padding:14px 4px;
    cursor:pointer;min-height:54px;font-family:inherit}
  .a-no{background:var(--warn)} .a-mb{background:var(--yellow)} .a-ok{background:var(--good)}
  .star{position:absolute;top:12px;right:12px;background:none;border:none;font-size:22px;cursor:pointer;color:#C8CEDB}
  .star.on{color:var(--gold)}
  .cattag{position:absolute;top:15px;left:14px;font-size:11.5px;font-weight:800;color:#fff;padding:2px 9px;border-radius:99px}
  .empty{margin-top:22px;padding:30px 20px;text-align:center;color:var(--muted);border:1px dashed var(--line);
    border-radius:16px;background:#fff;font-size:14.5px;line-height:1.7;white-space:pre-line}
  /* list */
  .lrow{display:flex;align-items:center;gap:10px;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:#fff;margin-bottom:7px;cursor:pointer}
  .lrow .m{flex:1;min-width:0}
  .lrow .a{font-weight:800;font-size:14.5px}
  .lrow .b{font-size:12.5px;color:var(--accentDeep);font-weight:700}
  .lrow .st{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end;max-width:45%}
  /* progress */
  .stat{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .stat .b{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px}
  .stat .n{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums}
  .stat .l{font-size:12px;color:var(--muted)}
  .reviewcat{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border:1px solid var(--line);
    border-radius:13px;background:#fff;margin-bottom:8px}
  .reviewcat[data-act]{cursor:pointer}
  .reviewcat .n{font-weight:800;font-size:18px;font-variant-numeric:tabular-nums}
  /* sheet */
  .ovl{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:50;display:flex;align-items:flex-end;justify-content:center}
  .sheet{background:var(--paper);width:100%;max-width:600px;border-radius:20px 20px 0 0;max-height:90vh;overflow:auto;
    padding:18px 16px calc(24px + env(safe-area-inset-bottom))}
  .sheet h3{margin:2px 0 14px;font-size:18px}
  .setrow{margin-bottom:16px}
  .setrow .lab{font-size:13.5px;font-weight:800;margin-bottom:7px}
  textarea.memo{width:100%;min-height:96px;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;font-size:14.5px;
    font-family:inherit;line-height:1.6;resize:vertical;background:#fff;color:var(--ink)}
  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom));
    background:#1E2230;color:#fff;padding:10px 16px;border-radius:99px;font-size:13px;z-index:80;opacity:0;
    transition:opacity .2s;pointer-events:none}
  .toast.show{opacity:1}
  .hero{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
  .hero>div{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 4px;text-align:center}
  .hero b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
  .hero span{font-size:10.5px;color:var(--muted)}
  .btn.big{font-size:17px;padding:16px 14px;border-radius:16px}
  .btn[disabled]{opacity:.45}
  .addbtn{margin-top:8px;border-color:var(--accent);color:var(--accentDeep)}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .tile{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px;cursor:pointer}
  .tile .ic{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:19px}
  .tile .nm{font-weight:800;font-size:15px;margin-top:8px}
  .tile .ct{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tile .ct2{font-size:11.5px;color:var(--muted);margin:6px 0 5px}
  .tile .ct2 b{color:var(--ink);font-size:13px}
  .chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px;-webkit-overflow-scrolling:touch}
  .chips.wrap{flex-wrap:wrap;overflow:visible}
  .chips button{flex:none;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:8px 12px;font-family:inherit;cursor:pointer;text-align:left;color:var(--ink)}
  .chips button b{display:block;font-size:13.5px}
  .chips button span{font-size:12px;color:var(--accentDeep);font-weight:700}
  .chips.cat button{border-radius:99px;font-size:13px;font-weight:800;color:var(--muted);white-space:nowrap}
  .chips.cat button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .search{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;font-size:15px;font-family:inherit;background:#fff;color:var(--ink);margin-bottom:10px;-webkit-appearance:none;appearance:none}
  .subh{display:flex;align-items:center;justify-content:space-between;margin:12px 2px 6px;font-size:12.5px;font-weight:800;color:var(--ink)}
  .subh button{border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:4px 11px;font-size:12px;font-weight:800;color:var(--accentDeep);font-family:inherit;cursor:pointer}
  .animbox{background:#F8F9FC;border:1px solid var(--line);border-radius:12px;overflow:hidden;text-align:center}
  .animbox canvas{display:block;margin:0 auto;max-width:100%}
  .animbar{display:flex;align-items:center;gap:6px;padding:6px 8px;border-top:1px solid var(--line);background:#fff}
  .animbar .lg{flex:1;text-align:left;font-size:11px;color:var(--muted)}
  .animbar .lg i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:3px;vertical-align:-1px}
  .animbar button{border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:4px 10px;font-size:12px;font-weight:800;font-family:inherit;color:var(--ink);cursor:pointer}
  .recbox{margin-top:12px;background:#EEF2FF;border:1px solid #C9D3F7;border-radius:14px;padding:12px}
  .recbox .lab{font-size:13px;font-weight:800;margin-bottom:8px}
  .rng{width:100%;margin:2px 0 8px}
  .chk{display:flex;gap:8px;align-items:flex-start;font-size:13.5px;margin-top:4px}
  .chk input{width:18px;height:18px;margin-top:2px}
  /* ===== v2 デザイン ===== */
  :root{--accent:#5B5BF0;--accentDeep:#3F3FD1;--ink:#12142B;--paper:#F3F4FA;--line:#E4E6F1;--muted:#6B7088;--teal:#0E9F8E;--gold:#F5B700;--good:#12A150;--warn:#F2711C}
  body{padding-bottom:calc(86px + env(safe-area-inset-bottom));letter-spacing:.01em}
  header.app{background:radial-gradient(130% 160% at 0% 0%,#34379A 0%,#1A1C45 45%,#12142B 100%);padding-bottom:14px}
  header.app h1{font-size:21px;letter-spacing:.3px}
  header.app p{opacity:.7}
  .gear{background:rgba(255,255,255,.12);border-radius:12px;font-weight:700}
  nav.tabs{position:fixed;top:auto;bottom:0;left:0;right:0;z-index:30;background:rgba(255,255,255,.94);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
    border-top:1px solid var(--line);border-bottom:none;padding-bottom:env(safe-area-inset-bottom)}
  nav.tabs button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10.5px;font-weight:700;padding:9px 2px 7px;border-bottom:none;min-height:56px;color:#9498AE}
  nav.tabs button svg{width:23px;height:23px}
  nav.tabs button.on{color:var(--accent);border-bottom-color:transparent}
  main{padding-top:14px}
  .btn{border-radius:14px;border-color:var(--line);font-weight:700}
  .btn.pri{background:linear-gradient(135deg,#5B5BF0,#8B5CF6);border-color:transparent;color:#fff;box-shadow:0 8px 20px rgba(91,91,240,.28)}
  .btn.dark{background:var(--ink);color:#fff;border-color:var(--ink)}
  .btn.rec{background:var(--ink);color:#fff;border-color:var(--ink);box-shadow:0 10px 24px rgba(18,20,43,.25)}
  .hero{background:linear-gradient(135deg,#5B5BF0 0%,#8B5CF6 100%);border-radius:20px;padding:14px 6px;gap:0;color:#fff;box-shadow:0 12px 28px rgba(91,91,240,.3)}
  .hero>div{background:none;border:none;border-radius:0;padding:2px 4px;border-right:1px solid rgba(255,255,255,.18)}
  .hero>div:last-child{border-right:none}
  .hero b{font-size:24px;font-weight:800}
  .hero span{color:rgba(255,255,255,.82);font-size:10.5px}
  .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:8px}
  .row3 .btn{padding:11px 4px;font-size:14px;min-height:44px;border-color:transparent;box-shadow:0 1px 2px rgba(18,20,43,.05),0 6px 18px rgba(18,20,43,.05)}
  .h2{font-size:12.5px;letter-spacing:.06em;color:#8A8FA8;margin:22px 2px 9px}
  .card,.tile,.lrow,.lesson,.stat .b,.reviewcat{border-color:transparent;box-shadow:0 1px 2px rgba(18,20,43,.05),0 6px 18px rgba(18,20,43,.05)}
  .tile{border-radius:18px;padding:13px}
  .tile .ic{font-size:14px;font-weight:800;letter-spacing:0}
  .lesson{background:#fff;border-radius:18px;padding:12px 12px 6px;margin-bottom:10px}
  .lesson .lh{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px}
  .lesson .lh b{font-size:14.5px}
  .lesson .lh span{font-size:12px;color:var(--muted);margin-left:8px}
  .lesson .la button,.subh button{border:none;background:#EEF0FF;color:var(--accentDeep);border-radius:99px;padding:6px 12px;font-size:12px;font-weight:800;font-family:inherit;cursor:pointer;margin-left:4px}
  .lesson .chips{margin-bottom:4px}
  .chips button{border:none;background:#F3F4FA;border-radius:12px}

  .lrow{border-radius:14px;padding:12px 13px}

  .lrow .a .en,.en{font-size:12px;color:var(--muted);font-weight:600}

  .qcard .en,.sheet .en{font-size:14px;margin-top:3px}

  .ru{color:var(--accentDeep)} .lrow .b{color:var(--accentDeep)}

  .spk:active{background:#DADDFB}
  .seg button{border-color:var(--line)}
  .search{border-color:var(--line);border-radius:14px}
  .search:focus,textarea.memo:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(91,91,240,.15)}
  .notice{background:#EEF0FF;border-color:transparent;border-radius:16px}
  .recbox{background:#EEF0FF;border-color:transparent;border-radius:16px}
  .sheet{border-radius:24px 24px 0 0}

function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function now(){return Date.now();}
function todayKey(d){d=d||new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}

/* ===== 進捗・SRS（index.html と同じ仕組み） ===== */
function P(id){
  if(!progress[id])progress[id]={status:"new",correctCount:0,wrongCount:0,uncertainCount:0,lastReviewed:null,
    nextReview:null,intervalDays:0,intervalStep:0,favorite:false,correctDays:[]};
  return progress[id];
}
function hasProg(id){return !!progress[id]&&progress[id].status!=="new";}
function dayRec(k){k=k||todayKey();if(!hist.days[k])hist.days[k]={learned:0,reviewed:0,newIntro:0};return hist.days[k];}
function bumpStreak(){var t=todayKey();if(hist.streak.last===t)return;var y=new Date();y.setDate(y.getDate()-1);
  hist.streak.count=(hist.streak.last===todayKey(y))?hist.streak.count+1:1;hist.streak.last=t;}
function schedule(p,step){p.intervalStep=step;
  if(step<=0){p.intervalDays=0;p.nextReview=now()+10*60*1000;}
  else{var d=LADDER_DAYS[Math.min(step-1,LADDER_DAYS.length-1)];p.intervalDays=d;p.nextReview=now()+d*86400000;}}
function answer(id,kind){
  var p=P(id),wasNew=(p.status==="new"),t=todayKey();bumpStreak();
  if(wasNew){dayRec().newIntro++;dayRec().learned++;}else dayRec().reviewed++;
  p.lastReviewed=now();
  if(kind==="no"){p.wrongCount++;p.status="learning";schedule(p,0);}
  else if(kind==="maybe"){p.uncertainCount++;if(p.status==="new")p.status="learning";p.nextReview=now()+86400000;p.intervalDays=1;}
  else{p.correctCount++;if(p.correctDays.indexOf(t)<0)p.correctDays.push(t);schedule(p,(p.intervalStep||0)+1);
    p.status=(p.correctDays.length>=3)?"mastered":"reviewing";}
  saveAll();
}
function isDue(id){var p=progress[id];return p&&p.nextReview&&p.nextReview<=now();}
function isWeak(id){var p=progress[id];if(!p)return false;var tot=p.correctCount+p.wrongCount;return p.wrongCount>=2||(tot>=3&&p.correctCount/tot<0.5);}
function dailyRemaining(){var r=settings.dailyNew-(dayRec().newIntro||0);return r>0?r:0;}

function hasOwn(c){var n=notes[c.id];return !!(n&&(n.hasAnim||n.hasVideo));}
function isReady(c){return cardHasAnyVideo(c)||!!c.desc;}
function newCandidates(){
  var cs=CARDS.filter(function(c){return !hasProg(c.id);});
  if(settings.newScope!=="all")cs=cs.filter(isReady);
  var own=cs.filter(hasOwn),rest=cs.filter(function(c){return !hasOwn(c);});
  own.sort(function(a,b){return ((notes[a.id]||{}).addedAt||0)-((notes[b.id]||{}).addedAt||0);});
  return own.concat(rest).map(function(c){return c.id;});
}
function dueIds(){return CARDS.map(function(c){return c.id;}).filter(isDue).sort(function(a,b){return progress[a].nextReview-progress[b].nextReview;});}
function buildQueue(scope){
  var ids;
  if(scope.type==="today") ids=dueIds().concat(newCandidates().slice(0,dailyRemaining()));
  else if(scope.type==="new") ids=newCandidates().slice(0,dailyRemaining());
  else if(scope.type==="review") ids=dueIds();
  else if(scope.type==="weak") ids=CARDS.map(function(c){return c.id;}).filter(isWeak);
  else if(scope.type==="fav") ids=CARDS.map(function(c){return c.id;}).filter(function(id){return progress[id]&&progress[id].favorite;});
  else if(scope.type==="own") ids=CARDS.filter(hasOwn).map(function(c){return c.id;});
  else if(scope.type==="ids") ids=(scope.ids||[]).filter(function(id){return CMAP[id];});
  else if(scope.type==="one") ids=[scope.id];
  else ids=[];
  return ids;
}
function startSession(scope,label){
  var list=buildQueue(scope);
  if(!list.length){toast(scope.type==="new"?"今日の新しいカードは上限に達しました":"対象のカードがありません");return;}
  ui.session={list:list,pos:0,revealed:false,label:label||"",back:ui.view};
  saveUI();render();window.scrollTo(0,0);
}
function endSession(){ui.session=null;saveUI();render();}

var dbP=null, urlCache={};
function db(){
  if(!dbP)dbP=new Promise(function(res,rej){
    try{var r=indexedDB.open("signApp_videos",1);
      r.onupgradeneeded=function(){r.result.createObjectStore("v");};
      r.onsuccess=function(){res(r.result);}; r.onerror=function(){rej(r.error);};
    }catch(e){rej(e);}
  });
  return dbP;
}
function vidOp(mode,fn){return db().then(function(d){return new Promise(function(res,rej){
  var tx=d.transaction("v",mode),st=tx.objectStore("v"),q=fn(st);
  tx.oncomplete=function(){res(q&&q.result);}; tx.onerror=function(){rej(tx.error);};
});});}
function vidPut(id,blob){return vidOp("readwrite",function(s){return s.put(blob,id);});}
function vidGet(id){return vidOp("readonly",function(s){return s.get(id);});}
function vidDel(id){return vidOp("readwrite",function(s){return s.delete(id);});}
function fillOwnVideos(root){
  (root||document).querySelectorAll("video[data-own]").forEach(function(v){
    var id=v.getAttribute("data-own");
    if(urlCache[id]){v.src=urlCache[id];return;}
    vidGet(id).then(function(b){if(b){blobCache[id]=b;urlCache[id]=URL.createObjectURL(b);v.src=urlCache[id];}})
      .catch(function(){});
  });
}
function recordVideo(id){
  var inp=document.createElement("input");inp.type="file";inp.accept="video/*";
  inp.onchange=function(){var f=inp.files&&inp.files[0];if(!f)return;
    if(f.size>80*1024*1024&&!confirm("動画が大きめです（"+Math.round(f.size/1048576)+"MB）。保存しますか？"))return;
    vidPut(id,f).then(function(){
      if(urlCache[id]){URL.revokeObjectURL(urlCache[id]);delete urlCache[id];}
      N(id).hasVideo=true;N(id).addedAt=now();markLearned(id);delete blobCache[id];saveAll();toast("動画を保存しました");refresh();
    }).catch(function(){toast("保存できませんでした（容量不足の可能性）");});
  };
  inp.click();
}
function deleteVideo(id){
  if(!confirm("このカードの自分の動画を削除しますか？"))return;
  vidDel(id).then(function(){if(urlCache[id]){URL.revokeObjectURL(urlCache[id]);delete urlCache[id];}
    N(id).hasVideo=false;saveAll();toast("削除しました");refresh();});
}

  openSheet('<h3>アニメを作成中…</h3><div class="small muted" id="ajmsg" style="margin-bottom:8px">準備中です。初回は手の認識データ（約15MB）を読み込むので、少し時間がかかります。</div>'+
    '<div class="bar"><i id="ajbar" style="width:0%"></i></div><div class="animbox" style="margin-top:10px"><canvas id="ajcv"></canvas></div>'+
    '<button class="btn full" data-act="animcancel" style="margin-top:12px">キャンセル</button>');
  var g=null;
  extractAnim(file,function(r,a,f){
    var bar=document.getElementById("ajbar"),msg=document.getElementById("ajmsg"),cv=document.getElementById("ajcv");
    if(bar)bar.style.width=Math.round(r*100)+"%";
    if(msg)msg.textContent="動きを読み取っています… "+Math.round(r*100)+"%";
    if(cv){if(!g)g=sizeAnimCanvas(cv,a.ar);drawAnimFrame(g.ctx,g.W,g.H,f,!!settings.animMirror);}
  },tok).then(function(a){
    if(tok.cancel)return;
    previewAnim=a;animJob.anim=a;animPreviewSheet(id);
  }).catch(function(e){
    if(tok.cancel)return;
    animFailSheet(id,e);
  });
}
function animPreviewSheet(id){
  var a=previewAnim,c=CMAP[id],n=a.frames.length,pct=Math.round(a.handFrames/a.total*100);
  var h='<h3>アニメを確認</h3><div class="small muted" style="margin-bottom:8px">'+esc(c.ja)+'（'+esc(c.ru)+'）</div>'+animBox("__preview");
  h+='<div class="small" style="margin-top:8px">手を読み取れたコマ：<b>'+a.handFrames+' / '+a.total+'</b>（'+pct+'%）</div>';
  if(pct<50)h+='<div class="warnbox" style="margin-top:8px">手があまり読み取れていません。<b>明るい場所で、上半身と両手が画面に入るように</b>撮り直すと良くなります。手が顔や体に重なる動き・速い動きは苦手です。</div>';
  h+='<div class="setrow" style="margin-top:14px"><div class="lab">使う範囲（前後のいらない部分を切る）</div>'+
     '<div class="small muted">はじめ</div><input type="range" class="rng" data-trim="s" min="0" max="'+(n-1)+'" value="'+a.trim[0]+'">'+
     '<div class="small muted">おわり</div><input type="range" class="rng" data-trim="e" min="0" max="'+(n-1)+'" value="'+a.trim[1]+'"></div>';
  h+='<label class="chk"><input type="checkbox" id="keepvid"> 元の動画も端末に残す（表情や口の形を見返したい時）</label>';
  h+='<div class="small muted" style="margin:8px 0 12px">アニメには手・腕・顔の位置だけが入ります。<b>表情や口の動きは入りません。</b></div>';
  h+='<button class="btn pri full" data-act="animsave">このアニメを保存</button>'+
     '<div style="display:flex;gap:8px;margin-top:8px"><button class="btn" style="flex:1" data-act="animretry">別の動画でやり直す</button>'+
     '<button class="btn ghost" style="flex:1" data-act="animcancel">やめる</button></div>';
  openSheet(h);
  var cv=document.querySelector('canvas[data-anim="__preview"]');if(cv)cv._range=a.trim.slice();
}
function animFailSheet(id,e){
  var msg=String((e&&e.message)||e||"");
  var net=/import|fetch|load|network|Failed|module/i.test(msg)&&!/動画/.test(msg);
  openSheet('<h3>アニメを作れませんでした</h3><div class="warnbox">'+
    (net?'手の認識プログラムを読み込めませんでした。<b>ネットにつながっているか</b>確認して、もう一度試してください。':'動画の読み取りに失敗しました。別の動画や、短め（3〜10秒）の動画で試してください。')+
    '<div class="small muted" style="margin-top:6px">詳細：'+esc(msg.slice(0,160))+'</div></div>'+
    '<button class="btn pri full" data-act="animagain" style="margin-top:12px">もう一度試す</button>'+
    '<button class="btn full" data-act="animasvideo" style="margin-top:8px">アニメにせず、動画のまま保存する</button>'+
    '<button class="btn ghost full" data-act="animcancel" style="margin-top:8px">やめる</button>');
}
function saveOwnVideo(id,file){
  return vidPut(id,file).then(function(){
    if(urlCache[id]){URL.revokeObjectURL(urlCache[id]);delete urlCache[id];}
    var n=N(id);n.hasVideo=true;n.addedAt=now();markLearned(id);delete blobCache[id];saveAll();
  });
}
function animSave(){
  var j=animJob;if(!j||!j.anim)return;
  var cv=document.querySelector('canvas[data-anim="__preview"]'),rg=(cv&&cv._range)||j.anim.trim;
  var a={v:1,fps:j.anim.fps,ar:r3(j.anim.ar),frames:j.anim.frames.slice(rg[0],rg[1]+1),savedAt:now()};
  var keep=document.getElementById("keepvid"),keepV=keep&&keep.checked;
  vidPut("anim:"+j.id,a).then(function(){
    animCache[j.id]=a;var n=N(j.id);n.hasAnim=true;n.addedAt=now();markLearned(j.id);saveAll();
    return keepV?saveOwnVideo(j.id,j.file):null;
  }).then(function(){
    var id=j.id;animJob=null;previewAnim=null;toast("アニメを保存しました");render();cardSheet(id);
  }).catch(function(){toast("保存できませんでした（容量不足の可能性）");});
}
function deleteAnim(id){
  if(!confirm("このカードの自分のアニメを削除しますか？"))return;
  vidDel("anim:"+id).then(function(){delete animCache[id];N(id).hasAnim=false;saveAll();toast("削除しました");refresh();});
}

function statusTags(c){
  var n=notes[c.id]||{},p=progress[c.id],t="";
  if(n.hasAnim)t+='<span class="tag own">アニメ</span>';
  if(n.hasVideo)t+='<span class="tag own">動画</span>';
  if(n.verified)t+='<span class="tag ok">確認済み</span>';
  if(p&&p.status==="mastered")t+='<span class="tag ok">定着</span>';
  return t;
}

/* ===== 画面 ===== */
function render(){
  ["learn","review","list","progress"].forEach(function(v){var el=document.getElementById("tab-"+v);if(el)el.className=(ui.view===v&&!ui.session?"on":"");});
  var m=document.getElementById("main"),h;
  if(ui.session)h=renderStudy();
  else if(ui.view==="review")h=renderReview();
  else if(ui.view==="list")h=renderList();
  else if(ui.view==="progress")h=renderProgress();
  else h=renderLearn();
  m.innerHTML=h;fillOwnVideos(m);
}
function refresh(){render();var sh=document.querySelector(".sheet");if(sh&&sh.getAttribute("data-card")&&CMAP[sh.getAttribute("data-card")])cardSheet(sh.getAttribute("data-card"));}
function catCards(id){return CARDS.filter(function(c){return c.cat===id;});}

function chipBtn(c){return '<button data-act="opencard" data-val="'+c.id+'"><b>'+esc(c.ja)+'</b><span>'+esc(c.ru)+'</span></button>';}
function renderLearn(){
  var due=dueIds().length,ownC=CARDS.filter(hasOwn).length,ld=lessonDates();
  function hs(n,l){return '<div><b>'+n+'</b><span>'+l+'</span></div>';}
  var h='<div class="hero">'+hs(ownC,"収録した手話")+hs(ld.length,"レッスン日数")+hs(due,"今日の復習")+hs(hist.streak.count||0,"連続日数")+'</div>';
  h+='<button class="btn full big rec" data-act="addlesson">＋ 習った手話を記録する</button>';
  var un=unsavedCount();
  if(un)h+='<button class="bkbar" data-act="backupsheet"><b>バックアップしていない収録が '+un+'件</b><span>タップして保存する ›</span></button>';
  h+='<div class="row3"><button class="btn" data-act="starttoday">今日の練習</button><button class="btn" data-act="gosearch">検索</button><button class="btn" data-act="sharesheet">共有</button></div>';
  h+='<div class="h2">レッスンの記録</div>';
  if(!ld.length){
    h+='<div class="notice">まだ記録がありません。レッスンで習った手話を<b>動画に撮る</b>（または先生の動画を選ぶ）と、習った日ごとにここに並びます。'+
       '動画は手と体の動きだけの<b>線のアニメ</b>にして保存でき、ほかの人にも送れます。</div>';
  }
  ld.slice(0,5).forEach(function(g){
    h+='<div class="lesson"><div class="lh"><div><b>'+fmtDate(g.date)+'</b><span>'+g.cards.length+'件</span></div>'+
       '<div class="la"><button data-act="startdate" data-val="'+g.date+'">復習</button><button data-act="sharedate" data-val="'+g.date+'">共有</button></div></div>'+
       '<div class="chips">'+g.cards.map(chipBtn).join("")+'</div></div>';
  });
  if(ld.length>5)h+='<button class="btn full sm" data-act="godates" style="margin-bottom:6px">すべての記録を見る（'+ld.length+'日分）</button>';
  h+='<div class="h2">カテゴリから探す</div><div class="grid">';
  CATS.forEach(function(cat){
    var cs=catCards(cat.id),o=cs.filter(hasOwn).length;
    h+='<div class="tile" data-act="opencat" data-val="'+cat.id+'"><div class="ic" style="background:'+cat.color+'1F;color:'+cat.color+'">'+esc(cat.g)+'</div>'+
       '<div class="nm">'+esc(cat.name)+'</div><div class="ct">'+esc(cat.sub)+'</div>'+
       '<div class="ct2">収録 <b>'+o+'</b> / '+cs.length+'</div>'+
       '<div class="bar"><i style="width:'+(cs.length?Math.round(o/cs.length*100):0)+'%;background:'+cat.color+'"></i></div></div>';
  });
  return h+'</div>';
}

function renderStudy(){
  var s=ui.session;
  if(s.pos>=s.list.length){
    return '<div class="empty">おつかれさま！\n'+esc(s.label)+' / '+s.list.length+'枚\n\n実際に手を動かして練習できましたか？\n'+
      '<button class="btn full" data-act="endsession" style="margin-top:14px">戻る</button></div>';
  }
  var id=s.list[s.pos],c=CMAP[id],p=P(id),cat=CATMAP[c.cat]||CATS[0];
  var dir=settings.direction;
  if(dir==="random")dir=["ja2sign","ru2sign","sign2ja"][s.pos%3];
  if(dir==="sign2ja"&&!cardHasVideo(c))dir="ja2sign";
  var h='<div class="study"><div class="top"><button class="btn ghost sm" data-act="endsession">‹ 戻る</button>'+
    '<div class="bar" style="flex:1"><i style="width:'+Math.round(s.pos/s.list.length*100)+'%"></i></div>'+
    '<span class="small muted">'+(s.pos+1)+'/'+s.list.length+'</span></div>';
  h+='<div class="card qcard"><span class="cattag" style="background:'+cat.color+'">'+esc(cat.name)+'</span>'+
     '<button class="star '+(p.favorite?"on":"")+'" data-act="fav" data-val="'+id+'">'+(p.favorite?"★":"☆")+'</button><div style="height:26px"></div>';
  if(!s.revealed){
    if(dir==="ja2sign"){
      h+='<div class="jp" style="margin-top:6px">'+esc(c.ja)+'</div>'+(c.en?'<div class="en">'+esc(c.en)+'</div>':'')+'<div style="margin-top:8px"><div class="ru sm">'+esc(c.ru)+spkBtn(c)+'</div>'+
         (settings.showKana&&c.kana?'<div class="kana">'+esc(c.kana)+'</div>':'')+'</div>'+
         '<div class="small muted" style="margin-top:14px">手話でやってみよう（実際に手を動かす）</div>';
    }else if(dir==="ru2sign"){
      h+='<div class="ru" style="margin-top:6px">'+esc(c.ru)+spkBtn(c)+'</div>'+
         '<div class="small muted" style="margin-top:14px">ロシア語の意味を思い出して、手話でやってみよう</div>';
    }else{
      h+='<div class="small muted" style="margin-top:4px">この手話の意味は？（読み取り練習）</div>'+videoBlock(c,{prompt:true});
    }
    h+='</div><button class="btn full" data-act="reveal" style="margin-top:14px;background:var(--gold);border-color:var(--gold);color:var(--ink)">答えを見る</button>';
  }else{
    h+='<div class="jp" style="font-size:20px;margin-top:4px">'+esc(c.ja)+'</div><div style="margin-top:6px">'+wordBlock(c,true)+'</div>';
    var kids=childrenOf(id);if(kids.length)h+='<div style="margin-top:10px;text-align:left"><div class="small muted" style="font-weight:800;margin-bottom:4px">例文</div>'+kids.map(cardRow).join("")+'</div>';
    if(dir==="sign2ja")h+=(hasOwn(c)?"":descBlock(c,true));
    else h+=ownBlock(c)+videoBox(c)+(hasOwn(c)?"":descBlock(c,true))+videoBlock(c,{skipOwn:true});
    h+=memoPreview(c);
    if(c.note)h+='<div class="note">'+esc(c.note)+'</div>';
    h+='<div style="display:flex;gap:8px;margin-top:12px"><button class="btn sm" style="flex:1" data-act="opencard" data-val="'+id+'">'+(hasOwn(c)?"メモ・収録を編集":"＋ 動画を入れる・メモ")+'</button></div></div>';
    h+='<div class="ans3"><button class="a-no" data-act="grade" data-val="no">できない</button>'+
       '<button class="a-mb" data-act="grade" data-val="maybe">迷った</button>'+
       '<button class="a-ok" data-act="grade" data-val="ok">できた</button></div>';
  }
  return h+'</div>';
}

function renderReview(){
  var all=CARDS.map(function(c){return c.id;});
  var due=dueIds(),weak=all.filter(isWeak),own=CARDS.filter(hasOwn);
  var fav=all.filter(function(id){return progress[id]&&progress[id].favorite;});
  var mastered=all.filter(function(id){return progress[id]&&progress[id].status==="mastered";});
  var h='<button class="btn full" data-act="startscope" data-type="review" style="background:var(--teal);color:#fff;border-color:var(--teal);margin-bottom:14px">今日の復習を開始（'+due.length+'枚）</button>';
  function row(l,n,t){return '<div class="reviewcat" '+(n&&t?'data-act="startscope" data-type="'+t+'"':'')+'><b>'+l+'</b><div class="n">'+n+'</div></div>';}
  h+=row("今日復習するカード",due.length,"review")+row("収録済みのカードを全部",own.length,"own")+row("苦手なカード",weak.length,"weak")+row("お気に入り",fav.length,"fav")+row("定着済み",mastered.length,"");
  if(!due.length)h+='<div class="empty">今日の復習はありません。\nホームから新しいカードに進もう。</div>';
  return h;
}

function listCards(){
  var cat=ui.listCat||"all",f=ui.listFilter||"all",q=(ui.q||"").trim().toLowerCase();
  return CARDS.filter(function(c){
    if(cat!=="all"&&c.cat!==cat)return false;
    if(f==="own"&&!hasOwn(c))return false;
    if(f==="none"&&hasOwn(c))return false;
    if(q&&(c.ja+" "+c.ru+" "+(c.en||"")+" "+(c.kana||"")+" "+(c.ky||"")+" "+((notes[c.id]||{}).memo||"")).toLowerCase().indexOf(q)<0)return false;
    return true;
  });
}
function cardRow(c){
  return '<div class="lrow'+(c.parent?" ex":"")+'" data-act="opencard" data-val="'+c.id+'"><div class="m"><div class="a">'+esc(c.ja)+(c.en?' <span class="en">'+esc(c.en)+'</span>':'')+'</div><div class="b">'+esc(c.ru)+'</div></div>'+
     '<div class="st">'+(c.parent?'<span class="tag unv">例文</span>':'')+statusTags(c)+(!hasOwn(c)&&cardHasAnyVideo(c)?'<span class="tag yt">見本あり</span>':'')+'</div></div>';
}
function listBody(){
  var cs=listCards(),byDate=(ui.listSort==="date");
  if(byDate)cs=cs.filter(function(c){return learnedOf(c);});
  var h='<div style="display:flex;gap:8px;margin-bottom:10px">'+
    '<button class="btn pri sm" style="flex:1" data-act="startlist"'+(cs.length?'':' disabled')+'>表示中の '+cs.length+'件を練習</button>'+
    '<button class="btn sm" data-act="addlesson">＋ 記録する</button></div>';
  if(!cs.length)return h+'<div class="empty">'+(byDate?"習った日が入っているカードがまだありません。\n動画を入れると、その日の日付で記録されます。":"当てはまるカードがありません。")+'</div>';
  if(byDate){
    var m={};cs.forEach(function(c){var d=learnedOf(c);(m[d]=m[d]||[]).push(c);});
    Object.keys(m).sort().reverse().forEach(function(d){
      h+='<div class="subh"><span>'+fmtDate(d)+'　'+m[d].length+'件</span><span><button data-act="startdate" data-val="'+d+'">復習</button> <button data-act="sharedate" data-val="'+d+'">共有</button></span></div>'+m[d].map(cardRow).join("");
    });
    return h;
  }
  var lastCat=null,lastSub=null;
  cs.forEach(function(c){
    if(c.cat!==lastCat){var cat=CATMAP[c.cat]||CATS[0];h+='<div class="h2">'+esc(cat.name)+'</div>';lastCat=c.cat;lastSub=null;}
    if((c.sub||"")!==(lastSub||"")&&c.sub){
      h+='<div class="subh"><span>'+esc(c.sub)+'</span><button data-act="startsub" data-cat="'+c.cat+'" data-sub="'+esc(c.sub)+'">ここを練習</button></div>';
    }
    lastSub=c.sub||"";
    h+=cardRow(c);
  });
  return h;
}
function renderList(){
  var cur=ui.listCat||"all",f=ui.listFilter||"all",so=ui.listSort||"std";
  var h='<input class="search" id="q" type="search" placeholder="検索（日本語・ロシア語・英語・メモ）" value="'+esc(ui.q||"")+'">';
  h+='<div class="chips cat">'+[{id:"all",name:"すべて"}].concat(CATS).map(function(c){
    return '<button class="'+(cur===c.id?"on":"")+'" data-act="listcat" data-val="'+c.id+'">'+esc(c.name)+'</button>';}).join("")+'</div>';
  h+='<div class="seg">'+[["std","カテゴリ順"],["date","習った日順"]].map(function(o){
    return '<button class="'+(so===o[0]?"on":"")+'" data-act="listsort" data-val="'+o[0]+'">'+o[1]+'</button>';}).join("")+'</div>';
  h+='<div class="seg">'+[["all","すべて"],["own","収録済み"],["none","未収録"]].map(function(o){
    return '<button class="'+(f===o[0]?"on":"")+'" data-act="listfilter" data-val="'+o[0]+'">'+o[1]+'</button>';}).join("")+'</div>';
  return h+'<div id="listbody">'+listBody()+'</div>';
}

function renderProgress(){
  var all=CARDS.length,learned=CARDS.filter(function(c){return hasProg(c.id);}).length;
  var mastered=CARDS.filter(function(c){var p=progress[c.id];return p&&p.status==="mastered";}).length;
  var anim=CARDS.filter(function(c){return (notes[c.id]||{}).hasAnim;}).length,vid=CARDS.filter(function(c){return (notes[c.id]||{}).hasVideo;}).length;
  var verified=CARDS.filter(function(c){return (notes[c.id]||{}).verified;}).length,t=dayRec();
  function sb(n,l){return '<div class="b"><div class="n">'+n+'</div><div class="l">'+l+'</div></div>';}
  var h='<div class="stat">'+sb(CARDS.filter(hasOwn).length+"/"+all,"収録済み")+sb(learned,"練習したカード")+sb(mastered,"定着")+sb(hist.streak.count||0,"連続日数")+
     sb(anim,"自分のアニメ")+sb(vid,"自分の動画")+sb(t.learned||0,"今日の新規")+sb(t.reviewed||0,"今日の復習")+'</div>';
  h+='<div class="h2">カテゴリ別</div>';
  CATS.forEach(function(cat){
    var cs=catCards(cat.id);if(!cs.length)return;
    var o=cs.filter(hasOwn).length,l=cs.filter(function(c){return hasProg(c.id);}).length,m=cs.filter(function(c){var p=progress[c.id];return p&&p.status==="mastered";}).length;
    h+='<div class="card" style="padding:13px 14px;margin-bottom:9px"><div style="display:flex;justify-content:space-between"><b>'+cat.icon+' '+esc(cat.name)+'</b>'+
       '<span class="small muted">収録 '+o+'・練習 '+l+'・定着 '+m+' / '+cs.length+'</span></div>'+
       '<div class="bar" style="margin-top:8px"><i style="width:'+Math.round(o/cs.length*100)+'%;background:'+cat.color+'"></i></div>'+
       '<div class="bar" style="margin-top:5px"><i style="width:'+Math.round(m/cs.length*100)+'%;background:var(--good)"></i></div></div>';
  });
  h+='<div class="small muted" style="margin:-2px 2px 10px">上=収録済み / 下（緑）=定着。ろう者に確認済み：'+verified+'枚</div>';
  h+='<button class="btn full ghost" data-act="settings" style="margin:4px 0 8px">設定・バックアップ・このアプリについて</button>';
  return h;
}

/* ===== シート ===== */
function openSheet(inner,cardId){document.getElementById("modal").innerHTML='<div class="ovl" data-act="ovl"><div class="sheet"'+(cardId?' data-card="'+cardId+'"':'')+'>'+inner+'</div></div>';
  fillOwnVideos(document.getElementById("modal"));}
function closeSheet(){if(animJob){animJob.tok.cancel=true;animJob=null;previewAnim=null;}document.getElementById("modal").innerHTML="";}
function toast(msg){var t=document.getElementById("toast");t.textContent=msg;t.className="toast show";setTimeout(function(){t.className="toast";},1700);}

function cardSheet(id){
  var c=CMAP[id],n=N(id),cat=CATMAP[c.cat]||CATS[0];
  var sh=document.querySelector(".sheet"),keep=(sh&&sh.getAttribute("data-card")===id)?sh.scrollTop:0;
  var h='<div class="small" style="font-weight:800;color:'+cat.color+'">'+esc(cat.name)+(c.sub?' › '+esc(c.sub):'')+(c.parent?' › 例文':'')+'</div>';
  h+='<h3 style="margin-bottom:4px">'+esc(c.ja)+'</h3>'+wordBlock(c,true);

function makePack(scope){

    var defs={},items=[];

function mergePack(d){
  var addC=0,addA=0,skip=0;
  (d.cards||[]).forEach(function(c){if(c&&c.id&&!CMAP[c.id]&&(!c.parent||CMAP[c.parent]||(d.cards||[]).some(function(x){return x.id===c.parent;}))){addCustom(c);addC++;}});
  var jobs=[];
  (d.items||[]).forEach(function(it){
    if(!it||!CMAP[it.id]||!it.anim||!it.anim.frames){return;}
    var n=N(it.id),mine=animCache[it.id];
    jobs.push(animGet(it.id).catch(function(){return null;}).then(function(cur){
      if(cur&&(cur.savedAt||0)>=(it.anim.savedAt||0)){skip++;return;}
      animCache[it.id]=it.anim;n.hasAnim=true;n.addedAt=n.addedAt||now();
      if(!n.learnedAt&&it.learnedAt)n.learnedAt=it.learnedAt;
      if(it.by||d.by)n.by=it.by||d.by;
      addA++;return vidPut("anim:"+it.id,it.anim);
    }));
  });
  Promise.all(jobs).catch(function(){}).then(function(){
    saveAll();closeSheet();render();
    openSheet('<h3>読み込みました</h3><div class="notice">'+(d.by?esc(d.by)+' さんの共有ファイル<br>':'')+'アニメ：<b>'+addA+'件</b> を追加'+(skip?'（'+skip+'件はすでに入っているのでそのまま）':'')+
      (addC?'<br>新しいカード：<b>'+addC+'件</b>':'')+'</div><button class="btn dark full" data-act="closesheet">閉じる</button>');
  });
}

/* ===== バックアップ（アニメ・動画・メモ・記録をすべて1つの zip に） =====
   サーバーは使わない。zip を「ファイル」アプリや iCloud Drive、チャットなど、ブラウザの外に置くことで守る。

var CRC_T=null;
function crc32(u8){
  if(!CRC_T){CRC_T=new Uint32Array(256);for(var n=0;n<256;n++){var c=n;for(var k=0;k<8;k++)c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1);CRC_T[n]=c>>>0;}}
  var crc=0xFFFFFFFF;for(var i=0;i<u8.length;i++)crc=CRC_T[(crc^u8[i])&255]^(crc>>>8);
  return (crc^0xFFFFFFFF)>>>0;
}
function zipBuild(entries){ // entries:[{name,blob,crc,size}]
  var enc=new TextEncoder(),parts=[],cd=[],off=0;
  entries.forEach(function(e){
    var nm=enc.encode(e.name),lh=new DataView(new ArrayBuffer(30));
    lh.setUint32(0,0x04034b50,true);lh.setUint16(4,20,true);lh.setUint16(6,0x0800,true);lh.setUint16(8,0,true);lh.setUint16(10,0,true);lh.setUint16(12,33,true);
    lh.setUint32(14,e.crc,true);lh.setUint32(18,e.size,true);lh.setUint32(22,e.size,true);lh.setUint16(26,nm.length,true);lh.setUint16(28,0,true);
    parts.push(lh.buffer,nm,e.blob);
    var ch=new DataView(new ArrayBuffer(46));
    ch.setUint32(0,0x02014b50,true);ch.setUint16(4,20,true);ch.setUint16(6,20,true);ch.setUint16(8,0x0800,true);ch.setUint16(10,0,true);ch.setUint16(12,0,true);ch.setUint16(14,33,true);
    ch.setUint32(16,e.crc,true);ch.setUint32(20,e.size,true);ch.setUint32(24,e.size,true);ch.setUint16(28,nm.length,true);ch.setUint32(42,off,true);
    cd.push(ch.buffer,nm);
    off+=30+nm.length+e.size;
  });
  var cdSize=0;cd.forEach(function(x){cdSize+=x.byteLength;});
  var eo=new DataView(new ArrayBuffer(22));
  eo.setUint32(0,0x06054b50,true);eo.setUint16(8,entries.length,true);eo.setUint16(10,entries.length,true);eo.setUint32(12,cdSize,true);eo.setUint32(16,off,true);
  return parts.concat(cd,[eo.buffer]);
}
async function zipRead(file){
  var tail=new DataView(await file.slice(Math.max(0,file.size-22)).arrayBuffer());
  if(tail.byteLength<22||tail.getUint32(0,true)!==0x06054b50)throw new Error("zip");
  var n=tail.getUint16(10,true),cdSize=tail.getUint32(12,true),cdOff=tail.getUint32(16,true);
  var buf=await file.slice(cdOff,cdOff+cdSize).arrayBuffer(),cd=new DataView(buf),p=0,out={},dec=new TextDecoder();
  for(var i=0;i<n;i++){
    var nl=cd.getUint16(p+28,true),ex=cd.getUint16(p+30,true),cm=cd.getUint16(p+32,true);
    out[dec.decode(new Uint8Array(buf,p+46,nl))]={size:cd.getUint32(p+24,true),off:cd.getUint32(p+42,true)};
    p+=46+nl+ex+cm;
  }
  return {get:async function(name,type){
    var e=out[name];if(!e)return null;
    var lh=new DataView(await file.slice(e.off,e.off+30).arrayBuffer()),st=e.off+30+lh.getUint16(26,true)+lh.getUint16(28,true);
    return new Blob([await file.slice(st,st+e.size).arrayBuffer()],{type:type||""});
  }};
}
var backupReady=null;
function fmtSize(b){return b>1048576?(Math.round(b/104857.6)/10)+" MB":Math.max(1,Math.round(b/1024))+" KB";}
async function buildBackup(){
  openSheet('<h3>バックアップを作成中…</h3><div class="small muted" id="bkmsg">準備しています</div><div class="bar" style="margin-top:8px"><i id="bkbar" style="width:0%"></i></div>');
  try{
    var startedAt=now(),aIds=Object.keys(notes).filter(function(id){return notes[id].hasAnim;}),vIds=Object.keys(notes).filter(function(id){return notes[id].hasVideo;});
    var anims={},entries=[],videos=[],i,total=aIds.length+vIds.length||1,done=0;
    function prog(t){done++;var b=document.getElementById("bkbar"),m=document.getElementById("bkmsg");if(b)b.style.width=Math.round(done/total*100)+"%";if(m)m.textContent=t;}
    for(i=0;i<aIds.length;i++){var a=await animGet(aIds[i]).catch(function(){return null;});if(a)anims[aIds[i]]=a;prog("アニメをまとめています");}
    for(i=0;i<vIds.length;i++){
      var b=await vidGet(vIds[i]).catch(function(){return null;});
      if(b&&b.size){
        var ext=/quicktime/.test(b.type)?"mov":/webm/.test(b.type)?"webm":"mp4",name="videos/"+vIds[i]+"."+ext;
        entries.push({name:name,blob:b,size:b.size,crc:crc32(new Uint8Array(await b.arrayBuffer()))});
        videos.push({id:vIds[i],name:name,type:b.type||"video/mp4"});
      }
      prog("動画をまとめています（"+(i+1)+" / "+vIds.length+"）");
    }
    var data={app:"sign",appVersion:APP_VERSION,exportedAt:new Date().toISOString(),settings:settings,progress:progress,notes:notes,history:hist,custom:custom,anims:anims,videos:videos};
    var jb=new TextEncoder().encode(JSON.stringify(data));
    entries.unshift({name:"data.json",blob:new Blob([jb]),size:jb.length,crc:crc32(jb)});
    var file=new File(zipBuild(entries),"shuwa_backup_"+todayKey()+".zip",{type:"application/zip"});
    backupReady={file:file,at:startedAt};
    var canShare=false;try{canShare=!!(navigator.canShare&&navigator.canShare({files:[file]}));}catch(e){}
    openSheet('<h3>バックアップができました</h3><div class="notice">アニメ <b>'+Object.keys(anims).length+'件</b>・動画 <b>'+videos.length+'本</b>・メモと記録すべて（'+fmtSize(file.size)+'）<br>'+
      'このファイルを<b>ブラウザの外</b>に置けば、アプリのデータが消えても元に戻せます。</div>'+
      (canShare?'<button class="btn pri full" data-act="bksend">保存先を選ぶ（「ファイル」に保存・iCloud・自分に送る）</button>':'')+
      '<button class="btn full" style="margin-top:8px" data-act="bksave">この端末にダウンロードする</button>'+
      '<div class="small muted" style="margin-top:8px">おすすめ：「"ファイル"に保存」→ iCloud Drive。スマホをなくしても残ります。自分あてにメールやチャットで送るのも有効です。</div>'+
      '<button class="btn ghost full" style="margin-top:8px" data-act="backupsheet">戻る</button>');
  }catch(e){
    openSheet('<h3>バックアップを作れませんでした</h3><div class="warnbox">'+esc(String((e&&e.message)||e).slice(0,160))+'</div><button class="btn dark full" style="margin-top:12px" data-act="closesheet">閉じる</button>');
  }
}

     '<br>前回のバックアップ：'+(meta.lastBackupAt?fmtDate(todayKey(new Date(meta.lastBackupAt))):'まだ一度もしていません')+'</div>';

     '<b>2. 動画は「カメラ」アプリで撮ってから選ぶ。</b>元の動画が写真アプリ（と iCloud 写真）にも残ります。<br>'+
     '<b>3. 3人で共有ファイルを送り合う。</b>ほかの人のスマホにもアニメの写しが残ります。</div></div>';
  h+='<div class="small muted" style="margin-bottom:12px">データが消えるのは、ブラウザの履歴とデータを消した時、ホーム画面のアイコンを消した時、スマホの故障・機種変更の時などです。'+
     'また、Safari で開いた時とホーム画面のアイコンから開いた時は、<b>別々の保存場所</b>になります。どちらか一方に決めて使ってください。</div>';

  openSheet(h);

    var t=[];

      var per=navigator.storage&&navigator.storage.persisted?await navigator.storage.persisted():null;
      if(per===false&&navigator.storage.persist)per=await navigator.storage.persist();
      t.push(per===true?'保護：<b>オン</b>（ブラウザが自動で消さない設定になっています）':per===false?'保護：<b>オフ</b>（長く使わないと、ブラウザが自動で消すことがあります。ホーム画面に追加して使うと守られやすくなります）':'保護：この端末では確認できません');
      if(navigator.storage&&navigator.storage.estimate){var es=await navigator.storage.estimate();if(es&&es.usage!=null)t.push('使っている容量：'+fmtSize(es.usage)+(es.quota?' / 使える上限 約'+fmtSize(es.quota):''));}
    }catch(e){t.push('保存状態は確認できませんでした');}

function applyBackupData(d){
  progress=d.progress||{};hist=d.history||hist;if(d.settings)settings=Object.assign(settings,d.settings);
  if(Array.isArray(d.custom))d.custom.forEach(function(c){if(c&&c.id&&!CMAP[c.id])addCustom(c);});
  var anims=d.anims||{},vset={};(d.videos||[]).forEach(function(v){vset[v.id]=1;});
  if(d.notes){Object.keys(d.notes).forEach(function(id){var keepV=(notes[id]||{}).hasVideo,keepA=(notes[id]||{}).hasAnim;
    notes[id]=d.notes[id];notes[id].hasVideo=!!keepV;notes[id].hasAnim=!!(anims[id]||keepA);});}
  return Promise.all(Object.keys(anims).map(function(id){animCache[id]=anims[id];return vidPut("anim:"+id,anims[id]);})).catch(function(){});
}
async function restoreFile(f){
  var head=new Uint8Array(await f.slice(0,4).arrayBuffer());
  if(head[0]===0x50&&head[1]===0x4B){ // zip（完全バックアップ）
    var z,d;
    try{z=await zipRead(f);d=JSON.parse(await (await z.get("data.json")).text());if(d.app!=="sign")throw 0;}catch(e){toast("このアプリのバックアップではないようです");return;}
    openSheet('<h3>元に戻しています…</h3><div class="small muted" id="bkmsg">読み込み中</div>');
    await applyBackupData(d);
    var nv=0;
    for(var i=0;i<(d.videos||[]).length;i++){
      var v=d.videos[i],b=await z.get(v.name,v.type).catch(function(){return null;});
      if(b&&b.size&&CMAP[v.id]){await vidPut(v.id,b);if(urlCache[v.id]){URL.revokeObjectURL(urlCache[v.id]);delete urlCache[v.id];}delete blobCache[v.id];N(v.id).hasVideo=true;nv++;}
      var m=document.getElementById("bkmsg");if(m)m.textContent="動画を戻しています（"+(i+1)+" / "+d.videos.length+"）";
    }
    meta.lastBackupAt=now();lset(K.meta,meta);
    saveAll();closeSheet();render();
    openSheet('<h3>元に戻しました</h3><div class="notice">アニメ <b>'+Object.keys(d.anims||{}).length+'件</b>・動画 <b>'+nv+'本</b>・メモと記録を戻しました。</div><button class="btn dark full" data-act="closesheet">閉じる</button>');
    return;
  }
  var d2;try{d2=JSON.parse(await f.text());if(d2.app!=="sign"&&d2.app!=="sign-pack")throw 0;}catch(e){toast("このアプリのファイルではないようです");return;}
  if(d2.app==="sign-pack"){mergePack(d2);return;}
  await applyBackupData(d2);saveAll();closeSheet();render();toast("復元しました");
}
